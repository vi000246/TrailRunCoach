<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="activity.title">活動列表</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #fff; --text: #1d232b; --muted: #6a7482; --line: #e1e5ea;
  --accent: #2563eb; --soft: #e8efff; --ok: #15803d; --warn: #b45309; --err: #b91c1c;
  --baiyue: #b45309; --mid: #0f766e; --low: #64748b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --panel: #171b21; --text: #e6e9ee; --muted: #97a1ae; --line: #2a313a;
    --accent: #60a5fa; --soft: #1c2a40; --ok: #4ade80; --warn: #fbbf24; --err: #f87171;
    --baiyue: #f59e0b; --mid: #2dd4bf; --low: #94a3b8;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --panel: #171b21; --text: #e6e9ee; --muted: #97a1ae; --line: #2a313a;
  --accent: #60a5fa; --soft: #1c2a40; --ok: #4ade80; --warn: #fbbf24; --err: #f87171;
  --baiyue: #f59e0b; --mid: #2dd4bf; --low: #94a3b8;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.55 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: var(--text); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; }
button { padding: 3px 10px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger { color: var(--err); border-color: var(--err); }
button:disabled { opacity: .45; cursor: default; }
input, select { padding: 4px 7px; }
textarea { padding: 5px 7px; width: 100%; resize: vertical; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.meta { color: var(--muted); font-size: 12.5px; }

main { max-width: 1400px; margin: 0 auto; padding: 12px 16px 24px; }
.head { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; margin-bottom: 10px; }
h1 { font-size: 17px; margin: 0; }
h2 { font-size: 15px; margin: 0; }

/* filters: one wrapping row */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.filters .q { flex: 1 1 220px; min-width: 0; }
.filters .range { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); }
.filters .range input { width: 9.6em; }
.filters label.ck { display: inline-flex; gap: 5px; align-items: center; font-size: 13px; white-space: nowrap; }
.filters .reset { margin-left: auto; color: var(--muted); }
@media (max-width: 699px) { .filters .range { flex: 1 1 100%; } .filters .range input { flex: 1; width: auto; min-width: 0; }
  .filters select { flex: 1 1 30%; min-width: 0; } .filters .reset { margin-left: 0; } }

/* table */
.tablewrap { margin-top: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
th { font-weight: 600; color: var(--muted); font-size: 12px; background: var(--panel); position: sticky; top: 0; }
th button.sort { border: 0; background: none; padding: 0; color: inherit; font: inherit; display: inline-flex; gap: 3px; align-items: center; }
th button.sort::after { content: "↕"; opacity: .35; font-size: 11px; }
th[aria-sort="ascending"] button.sort, th[aria-sort="descending"] button.sort { color: var(--accent); }
th[aria-sort="ascending"] button.sort::after { content: "↑"; opacity: 1; }
th[aria-sort="descending"] button.sort::after { content: "↓"; opacity: 1; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
th.num button.sort { flex-direction: row-reverse; }
tbody tr:hover td { background: color-mix(in srgb, var(--accent) 4%, transparent); }
tbody tr.on td { background: var(--soft); }
td.c-date small { color: var(--muted); margin-left: 4px; }
td.c-name { white-space: normal; min-width: 12em; max-width: 26em; }
td.c-name .nm { overflow-wrap: anywhere; }
tr.excl td.c-name .nm { text-decoration: line-through; color: var(--muted); }
td.c-name .sub { display: none; color: var(--muted); font-size: 12px; }
td.c-act { text-align: right; }
td.c-act .acts { display: inline-flex; gap: 4px; align-items: center; }
.edit { padding: 2px 10px; font-weight: 600; color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.edit:hover { background: var(--soft); }
/* 這是比賽 (SP-71): the user's own race mark, one tap from the list */
.race { padding: 2px 8px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.race[aria-pressed="true"] { color: #fff; background: var(--accent); border-color: var(--accent); font-weight: 600; }
.race:disabled { opacity: .55; }
.iconlink { display: inline-grid; place-items: center; width: 28px; height: 26px; border-radius: 6px; color: var(--muted);
  border: 1px solid transparent; }
.iconlink:hover { color: var(--accent); border-color: var(--line); }
.iconlink svg { width: 17px; height: 17px; }
.iconlink.off { visibility: hidden; }
.badge { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 9px; border: 1px solid var(--line);
  color: var(--muted); white-space: nowrap; line-height: 1.6; }
.badge.fill { border-style: dashed; }
.badge.pn { color: #fff; background: var(--err); border-color: var(--err); }
.badge.so { color: var(--warn); border-color: var(--warn); }
.badge.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); }
.badge.ex { color: var(--err); border-color: var(--err); }
.badge.man { background: var(--accent); border-color: var(--accent); color: #fff; }
.badge.rc { color: var(--accent); border-color: var(--accent); font-weight: 600; }
.empty { color: var(--muted); padding: 28px 6px; text-align: center; }
.loading { color: var(--muted); padding: 14px 8px; }
/* phone: date, name (with a one-line summary), distance, actions */
@media (max-width: 699px) {
  main { padding: 10px 10px 20px; }
  .c-climb, .c-hr, .c-pw, .c-tss, .c-rpe, .c-src, .c-pain, .c-type, .c-dur { display: none; }
  td.c-name { min-width: 0; max-width: none; }
  td.c-name .sub { display: block; }
  th, td { padding: 6px 6px; }
  td.c-date small { display: block; margin: 0; }
  td.c-date .yr { display: block; color: var(--muted); font-size: 11px; }
}
.pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; padding: 8px 2px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.pager .cnt { margin-right: auto; }

/* single-activity editor */
dialog#ed { border: 1px solid var(--line); border-radius: 12px; padding: 0; width: min(680px, calc(100vw - 24px));
  max-height: calc(100vh - 40px); background: var(--panel); color: var(--text); box-shadow: 0 16px 48px rgba(0,0,0,.28); }
dialog#ed::backdrop { background: rgba(10,14,20,.45); }
@media (max-width: 699px) { dialog#ed { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; margin: 0; border-radius: 0; border: 0; } }
.edhead { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 10px 14px; display: flex; gap: 8px; align-items: flex-start; }
.edhead .ttl { flex: 1; min-width: 0; }
.edhead h2 { overflow-wrap: anywhere; }
.edhead .x { border: 0; background: none; font-size: 20px; line-height: 1; padding: 2px 6px; color: var(--muted); }
.edbody { padding: 4px 14px 14px; }
.fld { display: grid; grid-template-columns: 5.5em minmax(0, 1fr); gap: 4px 10px; align-items: start; padding: 8px 0; border-top: 1px solid var(--line); }
.fld:first-child { border-top: 0; }
.fld > .lab { color: var(--muted); font-size: 13px; padding-top: 4px; }
.fld .ctl { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
.fld .ctl input[type=text] { flex: 1 1 220px; min-width: 0; }
.fld .why { grid-column: 2; font-size: 12px; color: var(--muted); }
@media (max-width: 480px) { .fld { grid-template-columns: 1fr; } .fld .why { grid-column: 1; } }
.chip { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; padding: 0 8px; border-radius: 10px;
  background: color-mix(in srgb, var(--accent) 10%, var(--panel)); white-space: nowrap; }
.chip button { border: 0; background: none; padding: 0 0 0 2px; line-height: 1; color: var(--muted); }
.msg { font-size: 12px; color: var(--muted); min-height: 1.3em; padding-top: 6px; }
.msg.err { color: var(--err); }
.msg.ok { color: var(--ok); }
.qtip { display: inline-grid; place-items: center; width: 17px; height: 17px; padding: 0; margin: 0 0 0 5px;
  border-radius: 50%; border: 1px solid var(--line); background: none; color: var(--muted); font: 600 11px/1 system-ui, sans-serif;
  cursor: help; vertical-align: 1px; }
.qtip-pop { position: fixed; z-index: 1000; max-width: min(360px, calc(100vw - 24px)); white-space: pre-line;
  background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  font: 400 12px/1.55 system-ui, sans-serif; box-shadow: 0 6px 18px rgba(0,0,0,.18); pointer-events: none; }
.edlinks { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; padding-top: 8px; }
.edlinks a { color: var(--accent); }

/* tabs: 活動 | 成就 (the old 成就 page, merged 2026-10-02) */
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.tabs button { border: 0; border-radius: 0; padding: 4px 14px; color: var(--muted); background: none; }
.tabs button + button { border-left: 1px solid var(--line); }
.tabs button[aria-selected="true"] { background: var(--soft); color: var(--accent); font-weight: 600; }
body.tab-ach [data-acts-only], body.tab-acts [data-ach-only] { display: none !important; }
.badge.cls-baiyue, .cls.cls-baiyue { color: var(--baiyue); border-color: color-mix(in srgb, var(--baiyue) 55%, var(--line)); }
.badge.cls-mid, .cls.cls-mid { color: var(--mid); border-color: color-mix(in srgb, var(--mid) 55%, var(--line)); }
.cls.cls-low { color: var(--low); }
.cls { display: inline-block; font-size: 11.5px; padding: 0 7px; border-radius: 9px; border: 1px solid var(--line); line-height: 1.6; }
.badge.pk { color: var(--baiyue); border-color: color-mix(in srgb, var(--baiyue) 55%, var(--line)); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 8px; margin-top: 10px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
.kpi .k { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .v { font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.3; }
.kpi .v small { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 2px; }
details.peaks { margin-top: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
details.peaks summary { cursor: pointer; font-size: 13px; color: var(--muted); }
details.peaks .pk { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 0 2px; }
details.peaks .pk span { font-size: 12.5px; padding: 0 8px; border-radius: 10px; color: var(--baiyue);
  background: color-mix(in srgb, var(--baiyue) 13%, transparent); white-space: nowrap; }
.achbar { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-top: 8px; }
.achbar .cnt { margin-left: auto; color: var(--muted); font-size: 13px; }
.cchip { padding: 1px 10px; border-radius: 12px; font-size: 12.5px; color: var(--muted); }
.cchip[aria-pressed="true"] { background: var(--soft); border-color: var(--accent); color: var(--accent); }
#a-tbody .nm[contenteditable] { cursor: text; border-bottom: 1px dashed transparent; }
#a-tbody .nm[contenteditable]:hover { border-bottom-color: var(--muted); }
#a-tbody .pkl { display: block; color: var(--baiyue); font-size: 12px; white-space: normal; }
#a-tbody .kd { display: block; color: var(--muted); font-size: 12px; }
#a-tbody .rep { border: 0; background: none; padding: 0 2px; font-size: 11px; color: var(--accent); }
#a-tbody .tg { border: 0; background: none; padding: 0 4px 0 0; color: var(--muted); width: 1.3em; }
#a-tbody tr.hid td { opacity: .45; }
#a-tbody tr.day td { background: var(--bg); color: var(--muted); font-size: 12px; }
#a-tbody input.sh { width: 4.6em; padding: 1px 4px; text-align: right; }
#a-tbody .x { border: 0; background: none; padding: 0 4px; color: var(--muted); }
#a-tbody .clsm { display: none; }
@media (max-width: 699px) {
  .c-mv, .c-vam, .c-sh, .c-top, .c-cls { display: none; }
  #a-tbody .clsm { display: inline-block; margin-left: 4px; }
  .achbar .cnt { margin-left: 0; flex: 1 1 100%; }
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .kpi { padding: 5px 8px; }
  .kpi .v { font-size: 16px; }
}
dialog#exp { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text);
  width: min(680px, calc(100vw - 24px)); }
dialog#exp::backdrop { background: rgba(10,14,20,.45); }
dialog#exp textarea { height: 300px; font: 12.5px/1.5 ui-monospace, Consolas, monospace; background: var(--bg); }
dialog#exp .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
dialog#exp .row .sp { flex: 1; }
</style>
</head>
<body class="tab-acts">
<script src="/api/v1/static/shell.js" data-page="activity"></script>
<main>
  <div class="head">
    <h1><span data-i18n="activity.title">活動列表</span><button type="button" class="qtip" aria-label="?"
      data-i18n-attr="data-tip:activity.help.page" data-tip="">?</button></h1>
    <div class="tabs" role="tablist" data-i18n-attr="aria-label:activity.tab.label" aria-label="">
      <button type="button" role="tab" id="tab-acts" data-tab="acts" aria-selected="true" aria-controls="acts-view" data-i18n="activity.tab.acts">活動</button>
      <button type="button" role="tab" id="tab-ach" data-tab="ach" aria-selected="false" aria-controls="ach" data-i18n="activity.tab.ach">成就</button>
    </div>

  </div>
  <div class="filters" role="search">
    <input type="search" id="f-q" class="q" data-i18n-attr="placeholder:activity.f.q;aria-label:activity.f.q_label" placeholder="" aria-label="">
    <span class="range"><input type="date" id="f-from" data-i18n-attr="aria-label:activity.f.from" aria-label="">–<input type="date" id="f-to" data-i18n-attr="aria-label:activity.f.to" aria-label=""></span>
    <select id="f-type" data-acts-only data-i18n-attr="aria-label:activity.f.type" aria-label=""></select>
    <select id="f-src" data-acts-only data-i18n-attr="aria-label:activity.f.src" aria-label=""></select>
    <label class="ck" data-pain-only data-acts-only hidden><input type="checkbox" id="f-pain"><span data-i18n="activity.f.pain">只看有疼痛</span></label>
    <label class="ck" data-acts-only><input type="checkbox" id="f-race"><span data-i18n="activity.f.race">只看比賽</span></label><button type="button" class="qtip" data-acts-only aria-label="?" data-i18n-attr="data-tip:activity.help.race" data-tip="" style="margin-left:-4px">?</button>
    <label class="ck" data-acts-only><input type="checkbox" id="f-ach"><span data-i18n="activity.f.ach">有成就</span></label><button type="button" class="qtip" aria-label="?"
      data-acts-only data-i18n-attr="data-tip:activity.help.f_ach" data-tip="" style="margin-left:-4px">?</button>
    <button type="button" class="reset" id="f-reset" data-i18n="activity.f.reset">清除篩選</button>
  </div>
  <div id="acts-view" role="tabpanel" aria-labelledby="tab-acts" data-acts-only>
    <div class="tablewrap">
      <table id="tbl">
        <thead><tr id="thead"></tr></thead>
        <tbody id="tbody"><tr><td class="loading" colspan="13" data-i18n="activity.loading">讀取中…</td></tr></tbody>
      </table>
    </div>

  </div>
  <section id="ach" role="tabpanel" aria-labelledby="tab-ach" data-ach-only>

    <details class="peaks" id="a-peaks" open hidden><summary></summary><div class="pk"></div></details>
    <div class="achbar">
      <select id="a-kind" data-i18n-attr="aria-label:activity.ach.kind" aria-label=""></select>
      <span id="a-cls"></span>
      <label class="ck"><input type="checkbox" id="a-hidden"><span data-i18n="activity.ach.show_hidden">含隱藏</span></label>
      <button type="button" class="primary" id="a-copy" data-i18n="activity.ach.copy">複製給登山團</button>
      <button type="button" class="qtip" aria-label="?" data-i18n-attr="data-tip:activity.ach.help" data-tip="">?</button>
      <span class="cnt" id="a-cnt"></span>
    </div>
    <div class="tablewrap">
      <table id="a-tbl">
        <thead><tr id="a-thead"></tr></thead>
        <tbody id="a-tbody"><tr><td class="loading" colspan="11" data-i18n="activity.loading">讀取中…</td></tr></tbody>
      </table>
    </div>
  </section>
</main>
<dialog id="exp" aria-labelledby="exp-title">
  <div class="row"><b id="exp-title" data-i18n="activity.ach.copy">複製給登山團</b><span class="sp"></span>
    <select id="exp-limit" data-i18n-attr="aria-label:activity.ach.top" aria-label=""></select></div>
  <div class="meta" id="exp-msg"></div>
  <textarea id="exp-text" data-i18n-attr="aria-label:activity.ach.copy" aria-label=""></textarea>
  <div class="row"><span class="sp"></span><button type="button" id="exp-recopy" data-i18n="activity.ach.recopy">再複製一次</button>
    <button type="button" id="exp-close" data-i18n="activity.close">關閉</button></div>
</dialog>

<script>
const API = "/api/v1/wko5";
const T = (k, p) => (window.I18N ? I18N.t("activity." + k, p) : k);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hms = (s) => { if (s == null) return "—"; s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}` : `${m}:${String(s % 60).padStart(2, "0")}`; };
const num = (v, d = 0) => (v == null || Number.isNaN(+v) ? "—" : (+v).toFixed(d));
const SPORTS = ["running", "trail running", "indoor running", "treadmill running", "hiking", "mountaineering", "walking", "cycling", "swimming", "strength", "strength training", "generic"];
const sportName = (a) => { const k = a.sport_type || a.sport || ""; return SPORTS.includes(k) ? T("sport." + k) : k; };
const SRC_SHORT = { coros: "COROS", tp: "TP", wko5: "WKO5" };
const PREF = "activitylist.filters", PER = 50;
// usePower: settings 「使用功率」 (off = no 平均功率 column, no 功率來源 row)
// pain: the 傷病紀錄 meta (null in the demo mode: no 疼痛 column / filter / row)
// ach: the 成就 records (GET /api/v1/achievements, loaded once; null until then) — the 成就 tab and
// the per-activity badges / 「有成就」 filter all read this one copy
const S = { acts: [], stats: {}, auto: null, types: {}, efforts: {}, poleTags: {}, usePower: true, pain: null,
  sort: { k: "date", dir: -1 }, page: 0, sel: null, detail: null, merge: null, originLabels: {},
  tab: "acts", ach: null, achErr: null, achMin: new Map(), actMin: new Map(),
  asort: { k: "date", dir: -1 }, aopen: new Set(), acls: new Set(["baiyue", "mid", "low"]) };
let TW = true;                 // 地區 (engine/region.py): 百岳 (peaks, the 百岳 count) only in Taiwan
const ACH = "/api/v1/achievements";
const CLS_IDS = ["baiyue", "mid", "low"];
// an activity <-> its 成就 record: the same local start minute, else the nearest within ±3 min
// (activity_key.MATCH_TOL_MIN — the record may come from another data source's file)
const minOf = (k) => { const m = /^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)/.exec(k || "");
  return m ? Date.UTC(+m[1], m[2] - 1, +m[3], +m[4], +m[5]) / 60000 : null; };
function nearest(map, key) {
  const m = minOf(key);
  if (m == null) return null;
  for (const d of [0, -1, 1, -2, 2, -3, 3]) { const x = map.get(m + d); if (x) return x; }
  return null;
}
const achOf = (a) => nearest(S.achMin, a.key);

function painState(a) {
  const ps = S.detail && S.detail.workout === a.index ? S.detail.pain_state : null;
  return { pain: a.pain ?? null, pain_area: a.pain_area ?? null, injury: ps?.injury || null, reentry: ps?.reentry || null };
}
function patchLocal(a, r) {
  // r: the single-activity JSON (PATCH /workouts/{i}/activity)
  if ("activity_type_overridden" in r) a.user_type = r.activity_type_overridden ? r.activity_type : null;
  if ("effort_overridden" in r) a.user_effort = r.effort_overridden ? r.effort : null;
  for (const k of ["note", "name", "tags"]) if (k in r) a[k] = r[k];
  if (r.pain_state) { a.pain = r.pain_state.pain; a.pain_area = r.pain_state.pain_area; a.injury_id = r.pain_state.injury?.id ?? null; }
}
// every edit is a mark in the app's own data (activity_tags, keyed by start time; the pack in
// racepower_hike_meta.json) — the FIT / TP / WKO5 files are never written
async function saveFields(a, patch) {
  setMsg(T("saving"));
  try {
    if (a.index != null) {
      const r = await send(`${API}/workouts/${a.index}/activity`, "PATCH", patch);
      patchLocal(a, r);
      if (S.sel === a.key) S.detail = r;
    } else {
      // an excluded file has no dataset index: edited by key
      await send(`${API}/activities`, "PATCH", { items: [{ key: a.key, file: a.file }], ...patch });
      if ("activity_type" in patch) a.user_type = patch.activity_type;
      if ("effort" in patch) a.user_effort = patch.effort;
      for (const k of ["note", "name", "tags"]) if (k in patch) a[k] = k === "name" ? (patch.name || "").trim() || null : patch[k];
      if ("poles" in patch) a.tags = withPoles(a.tags, patch.poles);
      if ("pain" in patch) { a.pain = patch.pain; if (!(patch.pain >= 1)) a.pain_area = null; }
      if ("pain_area" in patch) a.pain_area = patch.pain_area;
    }
    if ("tags" in patch) fillFilterOptions();
    render(); renderEditor(); setMsg(T("saved"), "ok");
  } catch (e) { setMsg(T("save_failed", { err: e.message }), "err"); }
}
// exclusion / terrain rebuild the dataset: indices shift, so reload and reopen by key
async function rebuildAndReopen(key) {
  setMsg(T("rebuilding"));
  await loadList();
  S.auto = null; loadAuto(); loadStats();
  await openEditor(key);
  setMsg(T("saved"), "ok");
}
function wireEditor(a) {
  const ed = $("ed");
  const pc = ed.querySelector("#pain-ctl");
  if (pc) PainPicker.wire(pc, painState(a), S.pain, async (patch) => {
    await saveFields(a, patch);
    if (patch.pain_area && !S.pain.areas.some((x) => x.key === patch.pain_area || x.label === patch.pain_area)) {
      S.pain = (await PainPicker.meta(true)) || S.pain; render(); renderEditor();   // a new body area joins the picker
    }
  });
  ed.querySelectorAll("select[data-f]").forEach((el) => el.addEventListener("change", () => saveFields(a, { [el.dataset.f]: el.value || null })));
  ed.querySelectorAll("button[data-poles]").forEach((b) => b.addEventListener("click", () => {
    if (polesOf(a) !== b.dataset.poles) saveFields(a, { poles: b.dataset.poles || null });
  }));
  const nm = ed.querySelector("input[data-name]");
  nm.addEventListener("change", () => saveFields(a, { name: nm.value.trim() || null }));
  ed.querySelector("button[data-name-clear]")?.addEventListener("click", () => saveFields(a, { name: null }));
  const note = ed.querySelector("textarea[data-note]");
  note.addEventListener("change", () => saveFields(a, { note: note.value }));
  const pack = ed.querySelector("input[data-pack]");
  pack?.addEventListener("change", () => {
    const v = pack.value.trim();
    if (v !== "" && !(+v >= 0 && +v <= 40)) { setMsg(T("pack_range"), "err"); return; }
    saveFields(a, { pack_kg: v === "" ? null : +v });
  });
  const tin = ed.querySelector("input[data-tag-in]");
  const addTag = () => {
    const v = tin.value.trim();
    if (!v) return;
    if (v.length > 30) { setMsg(T("tag_long"), "err"); return; }
    const pole = Object.keys(S.poleTags).find((k) => S.poleTags[k] === v);
    if (pole) { tin.value = ""; if (polesOf(a) !== pole) saveFields(a, { poles: pole }); return; }   // typed 有杖 / 沒杖 → the 登山杖 choice
    if ((a.tags || []).some((t) => t.toLowerCase() === v.toLowerCase())) { tin.value = ""; return; }
    saveFields(a, { tags: [...(a.tags || []), v] });
  };
  tin.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); addTag(); } });
  ed.querySelectorAll("button[data-tag-rm]").forEach((b) => b.addEventListener("click", () =>
    saveFields(a, { tags: (a.tags || []).filter((t) => t !== b.dataset.tagRm) })));
  ed.querySelector("select[data-terrain]")?.addEventListener("change", async (ev) => {
    setMsg(T("saving"));
    try {
      await send(`/api/v1/workouts/${a.terrain.workout_file_id}/classification`, "PATCH", { trail_classification: ev.target.value });
      await rebuildAndReopen(a.key);
    } catch (e) { setMsg(T("save_failed", { err: e.message }), "err"); }
  });
  ed.querySelectorAll("button[data-ex]").forEach((b) => b.addEventListener("click", async () => {
    const v = b.dataset.ex === "auto" ? null : b.dataset.ex;
    if (v === "exclude" && !confirm(T("ex.confirm"))) return;
    setMsg(T("saving"));
    try {
      await send(`${API}/exclusions`, "PUT", { key: a.key, file: a.file, exclusion: v });
      await rebuildAndReopen(a.key);
    } catch (e) { setMsg(T("save_failed", { err: e.message }), "err"); }
  }));
}

// k: the column; get: its sort value (no get = not sortable); srv: the export's sort key
const ACOLS = [
  { k: "date", cl: "c-date", get: (r) => r.start, srv: "date" },
  { k: "name", cl: "c-name" },
  { k: "cls", cl: "c-cls" },

function achFiltered() {
  if (!S.ach) return [];
  const from = $("f-from").value, to = $("f-to").value, kind = $("a-kind").value, hid = $("a-hidden").checked,
    q = $("f-q").value.trim().toLowerCase();
  return S.ach.filter((r) => {
    const d = r.start.slice(0, 10);
    if ((from && d < from) || (to && d > to)) return false;
    if (kind && r.kind_id !== kind) return false;
    if (!S.acls.has(r.class_id)) return false;
    if (r.hidden && !hid) return false;
    if (q) {
      const hay = [r.name, r.auto_name, r.route_name, r.note, d, ...peaksOf(r).map((p) => p.name)].join(" ").toLowerCase();
      if (!q.split(/\s+/).every((w) => hay.includes(w))) return false;
    }
    return true;
  });
}
function achSorted(rows) {
  const c = ACOLS.find((x) => x.k === S.asort.k && x.get) || ACOLS[0], dir = S.asort.dir;
  return rows.map((r) => [r, c.get(r)]).sort(([a, x], [b, y]) => {
    const nx = x == null || x === "", ny = y == null || y === "";
    if (nx || ny) return nx === ny ? (a.start < b.start ? 1 : -1) : nx ? 1 : -1;
    return (x < y ? -1 : x > y ? 1 : 0) * dir || (a.start < b.start ? 1 : -1);
  }).map(([r]) => r);
}

function renderKpis(rows) {

    for (const p of peaksOf(r)) {
      const x = peaks.get(p.name) || { name: p.name, el: p.elevation_m, first: r.start.slice(0, 10), times: 0 };
      x.times += 1; if (r.start.slice(0, 10) < x.first) x.first = r.start.slice(0, 10);
      peaks.set(p.name, x);
    }
  }
  const sum = (f) => rows.reduce((s, r) => s + (r[f] || 0), 0), mx = (f) => rows.reduce((m, r) => Math.max(m, r[f] || 0), 0);

  try { S.ach = (await (p || j(`${ACH}?include_hidden=true`))).rows || []; S.achErr = null; }
  catch (e) { S.ach = null; S.achErr = e.message; }
  S.achMin = new Map();
  for (const r of S.ach || []) { const m = minOf(r.key); if (m != null && !S.achMin.has(m)) S.achMin.set(m, r); }
  refresh();
}
$("a-thead").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-asort]");
  if (!b) return;
  const c = ACOLS.find((x) => x.k === b.dataset.asort);
  S.asort = S.asort.k === c.k ? { k: c.k, dir: -S.asort.dir } : { k: c.k, dir: c.asc ? 1 : -1 };
  savePrefs(); renderAch();
});
$("a-cls").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-cls]");
  if (!b) return;
  S.acls.has(b.dataset.cls) ? S.acls.delete(b.dataset.cls) : S.acls.add(b.dataset.cls);
  savePrefs(); renderAchBar(); renderAch();
});
for (const id of ["a-kind", "a-hidden"]) $(id).addEventListener("change", () => { savePrefs(); renderAch(); });
$("a-tbody").addEventListener("click", async (e) => {
  const tr = e.target.closest("tr[data-id]"), r = tr && achById(tr.dataset.id);
  if (!r) return;
  if (e.target.closest("[data-tg]")) { S.aopen.has(r.id) ? S.aopen.delete(r.id) : S.aopen.add(r.id); renderAch(); }
  if (e.target.closest("[data-hide]")) {
    try { await annotate(r.id, { hidden: !r.hidden }); r.hidden = !r.hidden; refresh(); } catch (err) { alert(T("save_failed", { err: err.message })); }
  }
  const rep = e.target.closest("button[data-route]");
  if (rep) {
    const name = prompt(T("ach.route_prompt"), r.route_name || "");
    if (name == null) return;
    try { await send(`${ACH}/routes/${encodeURIComponent(rep.dataset.route)}`, "PUT", { name }); await loadAch(); }
    catch (err) { alert(T("save_failed", { err: err.message })); }
  }
});
$("a-tbody").addEventListener("keydown", (e) => {
  if (e.target.classList.contains("nm") && e.key === "Enter" && !e.isComposing) { e.preventDefault(); e.target.blur(); }
});
$("a-tbody").addEventListener("focusout", async (e) => {
  const tr = e.target.closest("tr[data-id]"), r = tr && achById(tr.dataset.id);
  if (!r || !e.target.classList.contains("nm")) return;
  const v = e.target.textContent.trim();
  if (v === r.name) return;
  try {
    await annotate(r.id, { name: v });       // "" = back to the route / automatic name
    r.name = v || r.route_name || r.auto_name;
    if (!v) e.target.textContent = r.name;
  } catch (err) { e.target.textContent = r.name; alert(T("save_failed", { err: err.message })); }
});
$("a-tbody").addEventListener("change", async (e) => {
  const tr = e.target.closest("tr[data-id]"), r = tr && achById(tr.dataset.id);
  if (!r || !e.target.classList.contains("sh")) return;
  const v = e.target.value.trim() === "" ? null : +e.target.value;
  if (v != null && !(v > 0)) return;
  try {
    await annotate(r.id, { shang_he_min: v });
    r.shang_he_min = v;
    r.shang_he_ratio = v && r.moving_s ? Math.round(r.moving_s / 60 / v * 100) / 100 : null;
    renderAch();
  } catch (err) { alert(T("save_failed", { err: err.message })); }
});
// 複製給登山團: the server's plain text (GET /achievements/export) of what the tab shows
function exportParams() {
  const p = new URLSearchParams();
  if (S.acls.size < CLS_IDS.length) p.set("mclass", [...S.acls].join(","));
  const kind = $("a-kind").value, q = $("f-q").value.trim(), from = $("f-from").value, to = $("f-to").value;
  if (kind) p.set("kind", kind);
  if (q) p.set("q", q);
  if (from) p.set("date_from", from);
  if (to) p.set("date_to", to);
  p.set("sort", (ACOLS.find((c) => c.k === S.asort.k) || {}).srv || "climbing");
  p.set("limit", $("exp-limit").value || "10");
  return p;
}
async function loadExport() {
  $("exp-msg").textContent = T("loading");
  try {
    const r = await fetch(`${ACH}/export?${exportParams()}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    $("exp-text").value = await r.text();
    try { await navigator.clipboard.writeText($("exp-text").value); $("exp-msg").textContent = T("ach.copied"); }
    catch { $("exp-msg").textContent = T("ach.copy_manual"); }
  } catch (e) { $("exp-msg").textContent = T("load_failed", { err: e.message }); }
}
$("exp-limit").innerHTML = [10, 20, 50, 1000].map((n) => `<option value="${n}">${esc(n === 1000 ? T("ach.top_all") : T("ach.top_n", { n }))}</option>`).join("");
$("a-copy").addEventListener("click", () => { if (!$("exp").open) $("exp").showModal(); loadExport(); });
$("exp-limit").addEventListener("change", loadExport);
$("exp-recopy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText($("exp-text").value); $("exp-msg").textContent = T("ach.copied"); } catch { $("exp-text").select(); }
});
$("exp-close").addEventListener("click", () => $("exp").close());
$("exp").addEventListener("click", (e) => { if (e.target === $("exp")) $("exp").close(); });

// ---- tabs: 活動 | 成就 (#achievements; the old /api/v1/achievements/page redirects there) ----
function setTab(t) {
  S.tab = t === "ach" ? "ach" : "acts";
  document.body.classList.toggle("tab-ach", S.tab === "ach");
  document.body.classList.toggle("tab-acts", S.tab !== "ach");
  document.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === S.tab)));
  const h = S.tab === "ach" ? "#achievements" : "";
  if (location.hash !== h) { try { history.replaceState(null, "", location.pathname + location.search + h); } catch {} }
  renderAch();
}
document.querySelector(".tabs").addEventListener("click", (e) => { const b = e.target.closest("[data-tab]"); if (b) setTab(b.dataset.tab); });
document.querySelector(".tabs").addEventListener("keydown", (e) => {
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  setTab(S.tab === "ach" ? "acts" : "ach"); document.querySelector(`[data-tab="${S.tab}"]`).focus();
});
addEventListener("hashchange", () => setTab(location.hash === "#achievements" ? "ach" : "acts"));

// ---- start ------------------------------------------------------------------
(async () => {
  const want = new URLSearchParams(location.search).get("key");
  const achP = j(`${ACH}?include_hidden=true`);     // started now, read once (the tab, badges and filter share it)
  achP.catch(() => {});
  setTab(location.hash === "#achievements" ? "ach" : "acts");
  restorePrefs();
  const [usePower, pain, region] = await Promise.all([
    j("/api/v1/sync/settings").then((x) => x.use_power !== false).catch(() => true),
    PainPicker.meta(),                       // null in the demo mode: no pain column, filter or row
    j("/api/v1/region").then((x) => x.region !== "intl").catch(() => true),
  ]);
  S.usePower = usePower; S.pain = pain; TW = region;
  document.querySelectorAll("[data-pain-only]").forEach((el) => { el.hidden = !S.pain; });
  renderAchBar(); renderAch();
  try { await loadList(); } catch (e) {
    $("tbody").innerHTML = `<tr><td class="empty" colspan="13">${esc(T("load_failed", { err: e.message }))}</td></tr>`; return;
  }
  restorePrefs(); render();
  loadAch(achP);
  if (want && actOf(want)) {
    // a link from 圖表分析 (編輯活動): show its page of the table, then open it
    if (!filtered().some((a) => a.key === want)) { for (const k of FIDS) $(k).value = ""; $("f-pain").checked = false; }
    const i = sorted(filtered()).findIndex((a) => a.key === want);
    S.page = Math.max(0, Math.floor(i / PER)); render();
    openEditor(want);
  }
  loadStats(); loadAuto();
})();
</script>
