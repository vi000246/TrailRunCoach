<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="activity.title">活動列表</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #fff; --text: #1d232b; --muted: #6a7482; --line: #e1e5ea;
  --accent: #2563eb; --soft: #e8efff; --ok: #15803d; --warn: #b45309; --err: #b91c1c;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --panel: #171b21; --text: #e6e9ee; --muted: #97a1ae; --line: #2a313a;
    --accent: #60a5fa; --soft: #1c2a40; --ok: #4ade80; --warn: #fbbf24; --err: #f87171;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --panel: #171b21; --text: #e6e9ee; --muted: #97a1ae; --line: #2a313a;
  --accent: #60a5fa; --soft: #1c2a40; --ok: #4ade80; --warn: #fbbf24; --err: #f87171;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.55 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: var(--text); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; }
button { padding: 3px 10px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger { color: var(--err); border-color: var(--err); }
button:disabled { opacity: .45; cursor: default; }
input, select { padding: 4px 7px; }
textarea { padding: 5px 7px; width: 100%; resize: vertical; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.meta { color: var(--muted); font-size: 12.5px; }

main { max-width: 1400px; margin: 0 auto; padding: 12px 16px 24px; }
.head { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; margin-bottom: 10px; }
h1 { font-size: 17px; margin: 0; }
h2 { font-size: 15px; margin: 0; }

/* filters: one wrapping row */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.filters .q { flex: 1 1 220px; min-width: 0; }
.filters .range { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); }
.filters .range input { width: 9.6em; }
.filters label.ck { display: inline-flex; gap: 5px; align-items: center; font-size: 13px; white-space: nowrap; }
.filters .reset { margin-left: auto; color: var(--muted); }
@media (max-width: 699px) { .filters .range { flex: 1 1 100%; } .filters .range input { flex: 1; width: auto; min-width: 0; }
  .filters select { flex: 1 1 30%; min-width: 0; } .filters .reset { margin-left: 0; } }

/* table */
.tablewrap { margin-top: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
th { font-weight: 600; color: var(--muted); font-size: 12px; background: var(--panel); position: sticky; top: 0; }
th button.sort { border: 0; background: none; padding: 0; color: inherit; font: inherit; display: inline-flex; gap: 3px; align-items: center; }
th button.sort::after { content: "↕"; opacity: .35; font-size: 11px; }
th[aria-sort="ascending"] button.sort, th[aria-sort="descending"] button.sort { color: var(--accent); }
th[aria-sort="ascending"] button.sort::after { content: "↑"; opacity: 1; }
th[aria-sort="descending"] button.sort::after { content: "↓"; opacity: 1; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
th.num button.sort { flex-direction: row-reverse; }
tbody tr:hover td { background: color-mix(in srgb, var(--accent) 4%, transparent); }
tbody tr.on td { background: var(--soft); }
td.c-date small { color: var(--muted); margin-left: 4px; }
td.c-name { white-space: normal; min-width: 12em; max-width: 26em; }
td.c-name .nm { overflow-wrap: anywhere; }
tr.excl td.c-name .nm { text-decoration: line-through; color: var(--muted); }
td.c-name .sub { display: none; color: var(--muted); font-size: 12px; }
td.c-act { text-align: right; }
td.c-act .acts { display: inline-flex; gap: 4px; align-items: center; }
.edit { padding: 2px 10px; font-weight: 600; color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.edit:hover { background: var(--soft); }
.iconlink { display: inline-grid; place-items: center; width: 28px; height: 26px; border-radius: 6px; color: var(--muted);
  border: 1px solid transparent; }
.iconlink:hover { color: var(--accent); border-color: var(--line); }
.iconlink svg { width: 17px; height: 17px; }
.iconlink.off { visibility: hidden; }
.badge { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 9px; border: 1px solid var(--line);
  color: var(--muted); white-space: nowrap; line-height: 1.6; }
.badge.fill { border-style: dashed; }
.badge.pn { color: #fff; background: var(--err); border-color: var(--err); }
.badge.so { color: var(--warn); border-color: var(--warn); }
.badge.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); }
.badge.ex { color: var(--err); border-color: var(--err); }
.badge.man { background: var(--accent); border-color: var(--accent); color: #fff; }
.empty { color: var(--muted); padding: 28px 6px; text-align: center; }
.loading { color: var(--muted); padding: 14px 8px; }
/* phone: date, name (with a one-line summary), distance, actions */
@media (max-width: 699px) {
  main { padding: 10px 10px 20px; }
  .c-climb, .c-hr, .c-pw, .c-tss, .c-rpe, .c-src, .c-pain, .c-type, .c-dur { display: none; }
  td.c-name { min-width: 0; max-width: none; }
  td.c-name .sub { display: block; }
  th, td { padding: 6px 6px; }
  td.c-date small { display: block; margin: 0; }
  td.c-date .yr { display: block; color: var(--muted); font-size: 11px; }
}
.pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; padding: 8px 2px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.pager .cnt { margin-right: auto; }

/* single-activity editor */
dialog#ed { border: 1px solid var(--line); border-radius: 12px; padding: 0; width: min(680px, calc(100vw - 24px));
  max-height: calc(100vh - 40px); background: var(--panel); color: var(--text); box-shadow: 0 16px 48px rgba(0,0,0,.28); }
dialog#ed::backdrop { background: rgba(10,14,20,.45); }
@media (max-width: 699px) { dialog#ed { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; margin: 0; border-radius: 0; border: 0; } }
.edhead { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 10px 14px; display: flex; gap: 8px; align-items: flex-start; }
.edhead .ttl { flex: 1; min-width: 0; }
.edhead h2 { overflow-wrap: anywhere; }
.edhead .x { border: 0; background: none; font-size: 20px; line-height: 1; padding: 2px 6px; color: var(--muted); }
.edbody { padding: 4px 14px 14px; }
.fld { display: grid; grid-template-columns: 5.5em minmax(0, 1fr); gap: 4px 10px; align-items: start; padding: 8px 0; border-top: 1px solid var(--line); }
.fld:first-child { border-top: 0; }
.fld > .lab { color: var(--muted); font-size: 13px; padding-top: 4px; }
.fld .ctl { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
.fld .ctl input[type=text] { flex: 1 1 220px; min-width: 0; }
.fld .why { grid-column: 2; font-size: 12px; color: var(--muted); }
@media (max-width: 480px) { .fld { grid-template-columns: 1fr; } .fld .why { grid-column: 1; } }
.chip { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; padding: 0 8px; border-radius: 10px;
  background: color-mix(in srgb, var(--accent) 10%, var(--panel)); white-space: nowrap; }
.chip button { border: 0; background: none; padding: 0 0 0 2px; line-height: 1; color: var(--muted); }
.msg { font-size: 12px; color: var(--muted); min-height: 1.3em; padding-top: 6px; }
.msg.err { color: var(--err); }
.msg.ok { color: var(--ok); }
.qtip { display: inline-grid; place-items: center; width: 17px; height: 17px; padding: 0; margin: 0 0 0 5px;
  border-radius: 50%; border: 1px solid var(--line); background: none; color: var(--muted); font: 600 11px/1 system-ui, sans-serif;
  cursor: help; vertical-align: 1px; }
.qtip-pop { position: fixed; z-index: 1000; max-width: min(360px, calc(100vw - 24px)); white-space: pre-line;
  background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  font: 400 12px/1.55 system-ui, sans-serif; box-shadow: 0 6px 18px rgba(0,0,0,.18); pointer-events: none; }
.edlinks { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; padding-top: 8px; }
.edlinks a { color: var(--accent); }
</style>
</head>
<body>
<script src="/api/v1/static/shell.js" data-page="activity"></script>
<main>
  <div class="head">
    <h1><span data-i18n="activity.title">活動列表</span><button type="button" class="qtip" aria-label="?"
      data-i18n-attr="data-tip:activity.help.page" data-tip="">?</button></h1>
    <span class="meta" id="hdr"></span>
  </div>
  <div class="filters" role="search">
    <input type="search" id="f-q" class="q" data-i18n-attr="placeholder:activity.f.q;aria-label:activity.f.q_label" placeholder="" aria-label="">
    <span class="range"><input type="date" id="f-from" data-i18n-attr="aria-label:activity.f.from" aria-label="">–<input type="date" id="f-to" data-i18n-attr="aria-label:activity.f.to" aria-label=""></span>
    <select id="f-type" data-i18n-attr="aria-label:activity.f.type" aria-label=""></select>
    <select id="f-src" data-i18n-attr="aria-label:activity.f.src" aria-label=""></select>
    <label class="ck" data-pain-only hidden><input type="checkbox" id="f-pain"><span data-i18n="activity.f.pain">只看有疼痛</span></label>
    <button type="button" class="reset" id="f-reset" data-i18n="activity.f.reset">清除篩選</button>
  </div>
  <div class="tablewrap">
    <table id="tbl">
      <thead><tr id="thead"></tr></thead>
      <tbody id="tbody"><tr><td class="loading" colspan="13" data-i18n="activity.loading">讀取中…</td></tr></tbody>
    </table>
  </div>
  <div class="pager" id="pager"></div>
</main>
<dialog id="ed" aria-labelledby="ed-title"></dialog>
<datalist id="tag-list"></datalist>
<script src="/api/v1/static/painpicker.js"></script>
<script>
const API = "/api/v1/wko5";
const T = (k, p) => (window.I18N ? I18N.t("activity." + k, p) : k);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hms = (s) => { if (s == null) return "—"; s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}` : `${m}:${String(s % 60).padStart(2, "0")}`; };
const num = (v, d = 0) => (v == null || Number.isNaN(+v) ? "—" : (+v).toFixed(d));
const SPORTS = ["running", "trail running", "indoor running", "treadmill running", "hiking", "mountaineering", "walking", "cycling", "swimming", "strength", "strength training", "generic"];
const sportName = (a) => { const k = a.sport_type || a.sport || ""; return SPORTS.includes(k) ? T("sport." + k) : k; };
const SRC_SHORT = { coros: "COROS", tp: "TP", wko5: "WKO5" };
const PREF = "activitylist.filters", PER = 50;
// usePower: settings 「使用功率」 (off = no 平均功率 column, no 功率來源 row)
// pain: the 傷病紀錄 meta (null in the demo mode: no 疼痛 column / filter / row)
const S = { acts: [], stats: {}, auto: null, types: {}, efforts: {}, usePower: true, pain: null,
  sort: { k: "date", dir: -1 }, page: 0, sel: null, detail: null, merge: null, originLabels: {} };

async function j(url, opt) {
  const r = await fetch(url, opt);
  let body = null;
  try { body = await r.json(); } catch {}
  if (!r.ok) throw new Error((body && (body.detail || body.error)) || `HTTP ${r.status}`);
  return body;
}
const send = (url, method, data) => j(url, { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
const title = (a) => a.name || a.title_original || a.label;
const autoOf = (a) => (S.auto ? S.auto[a.key] || null : null);
const actOf = (k) => S.acts.find((a) => a.key === k);
const viewerHref = (a) => a.index == null ? null
  : `/api/v1/wko5/viewer?${new URLSearchParams({ workout: a.index, label: `${a.start.slice(0, 10)} ${title(a)}` })}`;

// ---- columns ----------------------------------------------------------------
const COLS = [
  { k: "date", cls: "c-date", get: (a) => a.start },
  { k: "name", cls: "c-name", get: (a) => title(a).toLowerCase(), asc: true },
  { k: "type", cls: "c-type", get: (a) => sportName(a), asc: true },
  { k: "dur", cls: "c-dur num", get: (a) => a.duration },
  { k: "dist", cls: "c-dist num", get: (a) => a.distance },
  { k: "climb", cls: "c-climb num", get: (a) => a.climbing },
  { k: "hr", cls: "c-hr num", get: (a) => S.stats[a.key]?.avg_hr },
  { k: "pw", cls: "c-pw num", get: (a) => S.stats[a.key]?.avg_power, power: true },
  { k: "tss", cls: "c-tss num", get: (a) => a.tss },
  { k: "rpe", cls: "c-rpe num", get: (a) => a.rpe },
  { k: "src", cls: "c-src", get: (a) => a.origin || "", asc: true },
  { k: "pain", cls: "c-pain", get: (a) => a.pain, pain: true },
];
const cols = () => COLS.filter((c) => (!c.power || S.usePower) && (!c.pain || S.pain));

function renderHead() {
  $("thead").innerHTML = cols().map((c) => {
    const s = S.sort.k === c.k ? (S.sort.dir > 0 ? "ascending" : "descending") : "none";
    return `<th class="${c.cls}" aria-sort="${s}" scope="col"><button type="button" class="sort" data-sort="${c.k}">${esc(T("col." + c.k))}</button></th>`;
  }).join("") + `<th class="c-act" scope="col"><span class="sr" hidden>${esc(T("col.actions"))}</span></th>`;
}
$("thead").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-sort]");
  if (!b) return;
  const c = COLS.find((x) => x.k === b.dataset.sort);
  S.sort = S.sort.k === c.k ? { k: c.k, dir: -S.sort.dir } : { k: c.k, dir: c.asc ? 1 : -1 };
  S.page = 0; savePrefs(); render();
});

// ---- filters ----------------------------------------------------------------
const FIDS = ["f-q", "f-from", "f-to", "f-type", "f-src"];
function loadPrefs() { try { return JSON.parse(localStorage.getItem(PREF) || "{}"); } catch { return {}; } }
function savePrefs() {
  const p = { sort: S.sort, pain: $("f-pain").checked };
  for (const k of FIDS) p[k] = $(k).value;
  try { localStorage.setItem(PREF, JSON.stringify(p)); } catch {}
}
function restorePrefs() {
  const p = loadPrefs();
  for (const k of FIDS) if (p[k] && $(k)) { $(k).value = p[k]; if ($(k).value !== p[k]) $(k).value = ""; }
  $("f-pain").checked = !!p.pain;
  if (p.sort && COLS.some((c) => c.k === p.sort.k)) S.sort = { k: p.sort.k, dir: p.sort.dir > 0 ? 1 : -1 };
}
function fillFilterOptions() {
  const sports = [...new Set(S.acts.map((a) => a.sport_type || a.sport).filter(Boolean))]
    .sort((x, y) => (SPORTS.indexOf(x) + 1 || 99) - (SPORTS.indexOf(y) + 1 || 99));
  const keep = (id, html) => { const v = $(id).value; $(id).innerHTML = html; $(id).value = v; if ($(id).value !== v) $(id).value = ""; };
  keep("f-type", `<option value="">${esc(T("f.type_all"))}</option>` +
    sports.map((s) => `<option value="${esc(s)}">${esc(sportName({ sport_type: s }))}</option>`).join(""));
  const srcs = [...new Set(S.acts.map((a) => a.origin).filter(Boolean))];
  keep("f-src", `<option value="">${esc(T("f.src_all"))}</option>` +
    srcs.map((s) => `<option value="${esc(s)}">${esc(SRC_SHORT[s] || s)}</option>`).join(""));
  $("f-src").hidden = srcs.length < 2;
  const tags = [...new Set(S.acts.flatMap((a) => a.tags || []))].sort();
  $("tag-list").innerHTML = tags.map((t) => `<option value="${esc(t)}">`).join("");
}
function filtered() {
  const from = $("f-from").value, to = $("f-to").value, ty = $("f-type").value, src = $("f-src").value,
    pain = S.pain && $("f-pain").checked, q = $("f-q").value.trim().toLowerCase();
  return S.acts.filter((a) => {
    const d = a.start.slice(0, 10);
    if (from && d < from) return false;
    if (to && d > to) return false;
    if (ty && (a.sport_type || a.sport) !== ty) return false;
    if (src && a.origin !== src) return false;
    if (pain && !(a.pain >= 1)) return false;
    if (q) {
      const hay = [title(a), a.title_original, a.note, ...(a.tags || []), d, sportName(a)].join(" ").toLowerCase();
      if (!q.split(/\s+/).every((w) => hay.includes(w))) return false;
    }
    return true;
  });
}
function sorted(rows) {
  const c = COLS.find((x) => x.k === S.sort.k) || COLS[0], dir = S.sort.dir;
  return rows.map((a) => [a, c.get(a)]).sort(([a, x], [b, y]) => {
    const nx = x == null || x === "", ny = y == null || y === "";
    if (nx || ny) return nx === ny ? (a.start < b.start ? 1 : -1) : nx ? 1 : -1;     // blanks last, either way
    return (x < y ? -1 : x > y ? 1 : 0) * dir || (a.start < b.start ? 1 : -1);
  }).map(([a]) => a);
}
for (const id of ["f-from", "f-to", "f-type", "f-src", "f-pain"]) $(id).addEventListener("change", () => { S.page = 0; savePrefs(); render(); });
let qTimer = null;
$("f-q").addEventListener("input", () => { clearTimeout(qTimer); qTimer = setTimeout(() => { S.page = 0; savePrefs(); render(); }, 120); });
$("f-reset").addEventListener("click", () => {
  for (const k of FIDS) $(k).value = "";
  $("f-pain").checked = false; S.page = 0; savePrefs(); render();
});

// ---- table ------------------------------------------------------------------
const CHART_ICON = `<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16h16"/><path d="m7.5 14.5 3.5-4 3 2.5 5-6"/></svg>`;
function srcBadge(a) {
  if (!a.origin) return "";
  const fill = S.merge && S.merge.primary && ({ coros: "coros", trainingpeaks: "tp" })[S.merge.primary] !== a.origin && a.origin !== "wko5";
  const tip = T("src_tip", { src: S.originLabels[a.origin] || a.origin }) + (fill ? T("src_fill") : "");
  return `<span class="badge${fill ? " fill" : ""}" title="${esc(tip)}">${esc(SRC_SHORT[a.origin] || a.origin)}</span>`;
}
function painBadge(a) {
  if (!S.pain || a.pain == null) return "";
  const area = a.pain_area ? (S.pain.areas || []).find((x) => x.key === a.pain_area)?.label || "" : "";
  const cls = a.pain >= 2 ? "pn" : a.pain === 1 ? "so" : "ok";
  return `<span class="badge ${cls}" title="${esc(T("col.pain"))}">${esc(T("pain." + a.pain))}${area ? "・" + esc(area) : ""}</span>`;
}
function cell(c, a) {
  const st = S.stats[a.key] || {};
  switch (c.k) {
    case "date": return `<span class="yr">${esc(a.start.slice(0, 5))}</span>${esc(a.start.slice(5, 10))}<small>${esc(a.start.slice(11, 16))}</small>`;
    case "name": {
      const sub = [sportName(a), hms(a.duration), a.climbing != null ? `↑${Math.round(a.climbing)} m` : ""].filter(Boolean).join(" · ");
      return `<span class="nm">${esc(title(a))}</span>${a.excluded ? ` <span class="badge ex">${esc(T("excluded"))}</span>` : ""}` +
        `<span class="sub">${esc(sub)} ${painBadge(a)}</span>`;
    }
    case "type": return esc(sportName(a));
    case "dur": return hms(a.duration);
    case "dist": return num(a.distance, 1);
    case "climb": return a.climbing != null ? Math.round(a.climbing) : "—";
    case "hr": return S.statsReady ? num(st.avg_hr) : "…";
    case "pw": return S.statsReady ? num(st.avg_power) : "…";
    case "tss": return num(a.tss);
    case "rpe": return a.rpe != null ? `${+a.rpe}` : "—";
    case "src": return srcBadge(a);
    case "pain": return painBadge(a);
  }
  return "";
}
function render() {
  renderHead();
  const rows = sorted(filtered()), n = rows.length, pages = Math.max(1, Math.ceil(n / PER));
  S.page = Math.min(S.page, pages - 1);
  const cs = cols();
  if (!n) {
    $("tbody").innerHTML = `<tr><td class="empty" colspan="${cs.length + 1}">${esc(T("empty"))}</td></tr>`;
  } else {
    $("tbody").innerHTML = rows.slice(S.page * PER, S.page * PER + PER).map((a) => {
      const href = viewerHref(a);
      return `<tr data-k="${esc(a.key)}" class="${a.excluded ? "excl" : ""} ${a.key === S.sel ? "on" : ""}">` +
        cs.map((c) => `<td class="${c.cls}">${cell(c, a)}</td>`).join("") +
        `<td class="c-act"><span class="acts"><button type="button" class="edit" data-edit="${esc(a.key)}" aria-label="${esc(T("edit_label", { name: title(a) }))}">${esc(T("edit"))}</button>` +
        `<a class="iconlink${href ? "" : " off"}" ${href ? `href="${esc(href)}"` : 'aria-hidden="true" tabindex="-1"'} title="${esc(T("open_chart"))}" aria-label="${esc(T("open_chart"))}">${CHART_ICON}</a></span></td></tr>`;
    }).join("");
  }
  $("pager").innerHTML = `<span class="cnt">${esc(T("count", { n, total: S.acts.length }))}</span>` + (pages > 1
    ? `<button type="button" data-pg="-1" ${S.page ? "" : "disabled"} aria-label="${esc(T("prev"))}">‹</button>` +
      `<span>${esc(T("page", { p: S.page + 1, n: pages }))}</span>` +
      `<button type="button" data-pg="1" ${S.page < pages - 1 ? "" : "disabled"} aria-label="${esc(T("next"))}">›</button>` : "");
}
$("pager").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-pg]");
  if (!b) return;
  S.page += +b.dataset.pg; render();
  $("tbl").scrollIntoView({ block: "start" });
});
$("tbody").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-edit]");
  if (b) openEditor(b.dataset.edit);
});

async function loadList() {
  const r = await j(`${API}/activities`);
  S.acts = r.activities; S.types = r.types; S.efforts = r.efforts;
  S.merge = r.merge || null; S.originLabels = r.origin_labels || {};
  const src = { synced: T("source.synced"), wko5: "WKO5", coros: "COROS", tp: "TrainingPeaks" }[r.source] || r.source;
  const prim = S.merge && S.merge.primary ? T("source.primary", { src: ({ coros: "COROS", trainingpeaks: "TrainingPeaks" })[S.merge.primary] || S.merge.primary }) : "";
  $("hdr").textContent = T("source.line", { src: src + prim, n: S.acts.length });
  fillFilterOptions();
  render();
}
async function loadStats() {
  try { S.stats = await j(`${API}/activities/stats`); } catch { S.stats = {}; }
  S.statsReady = true; render();
}
async function loadAuto() {
  try { S.auto = await j(`${API}/activities/auto`); } catch { S.auto = {}; }
  if (S.sel && $("ed").open) renderEditor();
}

// ---- 「?」 help: hover shows it, a tap / click pins it (touch has no hover) -----------
const qt = (tip) => `<button type="button" class="qtip" aria-label="?" data-tip="${esc(tip)}">?</button>`;
const QTIP = { el: null, pinned: null };
function qtipShow(btn) {
  qtipHide();
  const d = document.createElement("div");
  d.className = "qtip-pop"; d.textContent = btn.dataset.tip;
  (btn.closest("dialog[open]") || document.body).appendChild(d);
  const r = btn.getBoundingClientRect(), w = d.offsetWidth, h = d.offsetHeight;
  d.style.left = `${Math.max(12, Math.min(r.left - 8, innerWidth - w - 12))}px`;
  d.style.top = `${r.bottom + 6 + h > innerHeight - 8 ? Math.max(8, r.top - h - 6) : r.bottom + 6}px`;
  QTIP.el = d;
}
function qtipHide() { QTIP.el?.remove(); QTIP.el = null; }
document.addEventListener("mouseover", (e) => { const b = e.target.closest?.(".qtip"); if (b && !QTIP.pinned) qtipShow(b); });
document.addEventListener("mouseout", (e) => { if (e.target.closest?.(".qtip") && !QTIP.pinned) qtipHide(); });
document.addEventListener("click", (e) => {
  const b = e.target.closest(".qtip");
  if (b && QTIP.pinned !== b) { QTIP.pinned = b; qtipShow(b); e.stopPropagation(); e.preventDefault(); return; }
  QTIP.pinned = null; qtipHide();
}, true);
addEventListener("scroll", () => { if (!QTIP.pinned) qtipHide(); else qtipShow(QTIP.pinned); }, { passive: true, capture: true });

// ---- the single-activity editor (a dialog) ---------------------------------------
const badge = (manual, why) => manual ? `<span class="badge man" title="${esc(T("manual_tip"))}">${esc(T("manual"))}</span>`
  : `<span class="badge" title="${esc(why || T("auto_tip"))}">${esc(T("auto"))}</span>`;
function setMsg(t, cls) { const m = $("msg"); if (m) { m.textContent = t; m.className = "msg " + (cls || ""); } }

async function openEditor(key) {
  if (!actOf(key)) return;
  S.sel = key; S.detail = null;
  document.querySelectorAll("#tbody tr").forEach((r) => r.classList.toggle("on", r.dataset.k === key));
  try { history.replaceState(null, "", `${location.pathname}?key=${encodeURIComponent(key)}`); } catch {}
  renderEditor();
  if (!$("ed").open) $("ed").showModal();
  const a = actOf(key);
  if (a && a.index != null) {
    try {
      const d = await j(`${API}/workouts/${a.index}/activity`);
      if (S.sel === key) { S.detail = d; renderEditor(); }
    } catch (e) { if (S.sel === key) setMsg(T("load_failed", { err: e.message }), "err"); }
  }
}
$("ed").addEventListener("close", () => {
  S.sel = null; qtipHide(); QTIP.pinned = null;
  document.querySelectorAll("#tbody tr.on").forEach((r) => r.classList.remove("on"));
  try { history.replaceState(null, "", location.pathname); } catch {}
});
$("ed").addEventListener("click", (e) => {
  if (e.target === $("ed") || e.target.closest("[data-close]")) $("ed").close();   // the backdrop or ×
});

function renderEditor() {
  const a = actOf(S.sel);
  if (!a) return;
  const d = S.detail, au = autoOf(a);
  const tAuto = d ? d.activity_type_auto : au?.activity_type, tWhy = d ? d.activity_type_reason : au?.activity_type_reason;
  const eAuto = d ? d.effort_auto : au?.effort, eWhy = d ? d.effort_reason : au?.effort_reason;
  const pending = !(S.auto || d);
  const sel = (f, opts, cur, autoV) => `<select data-f="${f}" aria-label="${esc(T("f_" + f))}">` +
    `<option value="" ${cur ? "" : "selected"}>${esc(T("auto_opt", { v: autoV ? opts[autoV] : pending ? T("computing") : "—" }))}</option>` +
    Object.entries(opts).map(([k, v]) => `<option value="${k}" ${cur === k ? "selected" : ""}>${esc(v)}</option>`).join("") + `</select>`;
  const rc = d?.recorded || (a.rpe != null || a.feel != null ? { rpe: a.rpe, feel: a.feel } : null);
  const recTxt = rc && (rc.rpe != null || rc.feel != null)
    ? T("recorded", { v: [rc.rpe != null ? `RPE ${rc.rpe}` : "", rc.feel_label ? T("feel", { v: rc.feel_label }) : ""].filter(Boolean).join("、") }) : "";
  const tr = a.terrain || {};
  const terrainCtl = tr.editable
    ? `<select data-terrain="1" aria-label="${esc(T("f_terrain"))}"><option value="auto" ${tr.overridden ? "" : "selected"}>${esc(T("auto_opt", { v: tr.overridden ? T("terrain.rule") : T("terrain." + (tr.value === "trail" ? "trail" : "road")) }))}</option>
        <option value="road" ${tr.overridden && tr.value === "road" ? "selected" : ""}>${esc(T("terrain.road"))}</option>
        <option value="trail" ${tr.overridden && tr.value === "trail" ? "selected" : ""}>${esc(T("terrain.trail"))}</option></select>${badge(tr.overridden)}`
    : `<span>${esc(T("terrain." + (tr.value === "trail" ? "trail" : "road")))}</span><span class="meta">（${esc(tr.why || T("terrain.locked"))}）</span>`;
  const x = a.excluded, ov = a.user_exclusion, flagged = d?.exclusion_state?.flagged;
  const exBtn = (v, t, cls = "") => `<button type="button" data-ex="${v}" class="${cls}">${esc(t)}</button>`;
  const exCtl = x
    ? `<span class="badge ex">${esc(T("excluded"))}</span><span>${esc(x.reason || x.label || "")}</span>` +
      (x.auto ? exBtn("keep", T("ex.keep")) : exBtn("auto", T("ex.unmanual")))
    : ov === "keep"
      ? `<span>${esc(T("ex.kept"))}${flagged ? esc(T("ex.flagged", { v: flagged })) : ""}</span>${exBtn("auto", T("ex.back_auto"))}`
      : `<span>${esc(T("ex.none"))}</span>${exBtn("exclude", T("ex.exclude"), "danger")}`;
  const p = d?.power, pk = d?.pack;
  const href = viewerHref(a);
  $("ed").innerHTML = `
    <div class="edhead"><div class="ttl"><h2 id="ed-title">${esc(title(a))} ${srcBadge(a)}</h2>
      <div class="meta">${esc(a.start.slice(0, 16).replace("T", " "))} · ${esc(sportName(a))} · ${hms(a.duration)} · ${a.distance != null ? num(a.distance, 2) + " km" : "—"}${a.climbing != null ? ` · ↑${Math.round(a.climbing)} m` : ""}${qt(T("help.editor"))}</div></div>
      <button type="button" class="x" data-close autofocus aria-label="${esc(T("close"))}">×</button></div>
    <div class="edbody">
    <div class="fld"><span class="lab">${esc(T("f_name"))}${qt(T("help.name"))}</span>
      <div class="ctl"><input type="text" data-name maxlength="200" value="${esc(a.name || "")}" placeholder="${esc(a.title_original || a.label)}" aria-label="${esc(T("f_name"))}">
        ${a.name ? `<button type="button" data-name-clear>${esc(T("name_reset"))}</button>` : ""}${badge(!!a.name, T("name_orig_tip"))}</div>
      ${a.name ? `<div class="why">${esc(T("name_orig", { v: a.title_original || a.label }))}</div>` : ""}</div>
    <div class="fld"><span class="lab">${esc(T("f_activity_type"))}</span>
      <div class="ctl">${sel("activity_type", S.types, a.user_type, tAuto)}${badge(!!a.user_type, tWhy)}</div>
      <div class="why">${a.user_type ? esc(T("auto_was", { v: S.types[tAuto] || "—", why: tWhy || "" })) : esc(tWhy || (pending ? T("computing") : ""))}</div></div>
    <div class="fld"><span class="lab">${esc(T("f_effort"))}${qt(T("help.effort"))}</span>
      <div class="ctl">${sel("effort", S.efforts, a.user_effort, eAuto)}${badge(!!a.user_effort, eWhy)}</div>
      <div class="why">${a.user_effort ? esc(T("auto_was", { v: S.efforts[eAuto] || "—", why: eWhy || "" })) : esc(eWhy || (pending ? T("computing") : ""))}${recTxt ? `<br>${esc(recTxt)}` : ""}</div></div>
    ${S.pain ? `<div class="fld"><span class="lab">${esc(T("col.pain"))}${qt(T("help.pain"))}</span><div class="ctl" id="pain-ctl">${PainPicker.html(painState(a), S.pain, { qtip: qt })}</div></div>` : ""}
    ${a.index != null ? `<div class="fld"><span class="lab">${esc(T("f_pack"))}${qt(T("help.pack"))}</span>
      <div class="ctl">${!d ? esc(T("loading")) : `<input type="number" data-pack min="0" max="40" step="0.5" inputmode="decimal" style="width:6em" value="${pk?.pack_kg ?? ""}" placeholder="—" aria-label="${esc(T("f_pack"))}"> kg`}</div></div>` : ""}
    <div class="fld"><span class="lab">${esc(T("f_tags"))}${qt(T("help.tags"))}</span>
      <div class="ctl">${(a.tags || []).map((t) => `<span class="chip">${esc(t)}<button type="button" data-tag-rm="${esc(t)}" aria-label="${esc(T("tag_rm", { v: t }))}">×</button></span>`).join("")}
        <input type="text" data-tag-in list="tag-list" placeholder="${esc(T("tag_add_ph"))}" style="width:10em;flex:0 1 10em" aria-label="${esc(T("tag_add"))}"></div></div>
    <div class="fld"><span class="lab">${esc(T("f_note"))}</span>
      <div class="ctl" style="display:block"><textarea data-note rows="3" aria-label="${esc(T("f_note"))}">${esc(a.note || "")}</textarea></div></div>
    <div class="fld"><span class="lab">${esc(T("f_terrain"))}${qt(T("help.terrain"))}</span><div class="ctl">${terrainCtl}</div></div>
    <div class="fld"><span class="lab">${esc(T("f_exclude"))}${qt(T("help.exclude"))}</span><div class="ctl">${exCtl}</div></div>
    ${!S.usePower ? "" : `<div class="fld"><span class="lab">${esc(T("f_power"))}${qt(T("help.power"))}</span><div class="ctl">${a.index == null ? "—" : !d ? esc(T("loading"))
      : p && p.source && p.source !== "none" ? esc(p.label || p.source) + (p.used || /未採用|not used/i.test(p.label || "") ? "" : esc(T("power_unused"))) : esc(T("power_none"))}</div></div>`}
    ${href ? `<div class="edlinks"><a href="${esc(href)}">${esc(T("open_chart"))} →</a></div>` : ""}
    <div class="msg" id="msg" role="status"></div></div>`;
  if ($("ed").open && !$("ed").contains(document.activeElement)) $("ed").querySelector("[data-close]").focus();   // keep focus in the dialog
  wireEditor(a);
}

function painState(a) {
  const ps = S.detail && S.detail.workout === a.index ? S.detail.pain_state : null;
  return { pain: a.pain ?? null, pain_area: a.pain_area ?? null, injury: ps?.injury || null, reentry: ps?.reentry || null };
}
function patchLocal(a, r) {
  // r: the single-activity JSON (PATCH /workouts/{i}/activity)
  if ("activity_type_overridden" in r) a.user_type = r.activity_type_overridden ? r.activity_type : null;
  if ("effort_overridden" in r) a.user_effort = r.effort_overridden ? r.effort : null;
  for (const k of ["note", "name", "tags"]) if (k in r) a[k] = r[k];
  if (r.pain_state) { a.pain = r.pain_state.pain; a.pain_area = r.pain_state.pain_area; a.injury_id = r.pain_state.injury?.id ?? null; }
}
// every edit is a mark in the app's own data (activity_tags, keyed by start time; the pack in
// racepower_hike_meta.json) — the FIT / TP / WKO5 files are never written
async function saveFields(a, patch) {
  setMsg(T("saving"));
  try {
    if (a.index != null) {
      const r = await send(`${API}/workouts/${a.index}/activity`, "PATCH", patch);
      patchLocal(a, r);
      if (S.sel === a.key) S.detail = r;
    } else {
      // an excluded file has no dataset index: edited by key
      await send(`${API}/activities`, "PATCH", { items: [{ key: a.key, file: a.file }], ...patch });
      if ("activity_type" in patch) a.user_type = patch.activity_type;
      if ("effort" in patch) a.user_effort = patch.effort;
      for (const k of ["note", "name", "tags"]) if (k in patch) a[k] = k === "name" ? (patch.name || "").trim() || null : patch[k];
      if ("pain" in patch) { a.pain = patch.pain; if (!(patch.pain >= 1)) a.pain_area = null; }
      if ("pain_area" in patch) a.pain_area = patch.pain_area;
    }
    if ("tags" in patch) fillFilterOptions();
    render(); renderEditor(); setMsg(T("saved"), "ok");
  } catch (e) { setMsg(T("save_failed", { err: e.message }), "err"); }
}
// exclusion / terrain rebuild the dataset: indices shift, so reload and reopen by key
async function rebuildAndReopen(key) {
  setMsg(T("rebuilding"));
  await loadList();
  S.auto = null; loadAuto(); loadStats();
  await openEditor(key);
  setMsg(T("saved"), "ok");
}
function wireEditor(a) {
  const ed = $("ed");
  const pc = ed.querySelector("#pain-ctl");
  if (pc) PainPicker.wire(pc, painState(a), S.pain, async (patch) => {
    await saveFields(a, patch);
    if (patch.pain_area && !S.pain.areas.some((x) => x.key === patch.pain_area || x.label === patch.pain_area)) {
      S.pain = (await PainPicker.meta(true)) || S.pain; render(); renderEditor();   // a new body area joins the picker
    }
  });
  ed.querySelectorAll("select[data-f]").forEach((el) => el.addEventListener("change", () => saveFields(a, { [el.dataset.f]: el.value || null })));
  const nm = ed.querySelector("input[data-name]");
  nm.addEventListener("change", () => saveFields(a, { name: nm.value.trim() || null }));
  ed.querySelector("button[data-name-clear]")?.addEventListener("click", () => saveFields(a, { name: null }));
  const note = ed.querySelector("textarea[data-note]");
  note.addEventListener("change", () => saveFields(a, { note: note.value }));
  const pack = ed.querySelector("input[data-pack]");
  pack?.addEventListener("change", () => {
    const v = pack.value.trim();
    if (v !== "" && !(+v >= 0 && +v <= 40)) { setMsg(T("pack_range"), "err"); return; }
    saveFields(a, { pack_kg: v === "" ? null : +v });
  });
  const tin = ed.querySelector("input[data-tag-in]");
  const addTag = () => {
    const v = tin.value.trim();
    if (!v) return;
    if (v.length > 30) { setMsg(T("tag_long"), "err"); return; }
    if ((a.tags || []).some((t) => t.toLowerCase() === v.toLowerCase())) { tin.value = ""; return; }
    saveFields(a, { tags: [...(a.tags || []), v] });
  };
  tin.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); addTag(); } });
  ed.querySelectorAll("button[data-tag-rm]").forEach((b) => b.addEventListener("click", () =>
    saveFields(a, { tags: (a.tags || []).filter((t) => t !== b.dataset.tagRm) })));
  ed.querySelector("select[data-terrain]")?.addEventListener("change", async (ev) => {
    setMsg(T("saving"));
    try {
      await send(`/api/v1/workouts/${a.terrain.workout_file_id}/classification`, "PATCH", { trail_classification: ev.target.value });
      await rebuildAndReopen(a.key);
    } catch (e) { setMsg(T("save_failed", { err: e.message }), "err"); }
  });
  ed.querySelectorAll("button[data-ex]").forEach((b) => b.addEventListener("click", async () => {
    const v = b.dataset.ex === "auto" ? null : b.dataset.ex;
    if (v === "exclude" && !confirm(T("ex.confirm"))) return;
    setMsg(T("saving"));
    try {
      await send(`${API}/exclusions`, "PUT", { key: a.key, file: a.file, exclusion: v });
      await rebuildAndReopen(a.key);
    } catch (e) { setMsg(T("save_failed", { err: e.message }), "err"); }
  }));
}

// ---- start ------------------------------------------------------------------
(async () => {
  const want = new URLSearchParams(location.search).get("key");
  restorePrefs();
  S.usePower = await j("/api/v1/sync/settings").then((x) => x.use_power !== false).catch(() => true);
  S.pain = await PainPicker.meta();          // null in the demo mode: no pain column, filter or row
  document.querySelectorAll("[data-pain-only]").forEach((el) => { el.hidden = !S.pain; });
  try { await loadList(); } catch (e) {
    $("tbody").innerHTML = `<tr><td class="empty" colspan="13">${esc(T("load_failed", { err: e.message }))}</td></tr>`; return;
  }
  restorePrefs(); render();
  if (want && actOf(want)) {
    // a link from 圖表分析 (編輯活動): show its page of the table, then open it
    if (!filtered().some((a) => a.key === want)) { for (const k of FIDS) $(k).value = ""; $("f-pain").checked = false; }
    const i = sorted(filtered()).findIndex((a) => a.key === want);
    S.page = Math.max(0, Math.floor(i / PER)); render();
    openEditor(want);
  }
  loadStats(); loadAuto();
})();
</script>
</body>
