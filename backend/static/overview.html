<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="overview.page_title">訓練總覽</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<script src="/api/v1/static/dashicons.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: #f4f5f7; --panel: #fcfcfb; --text: #0b0b0b; --muted: #52514e; --faint: #8a8984; --line: #e3e3df;
  --accent: #2a78d6; --soft: #e8efff;
  --good: #1a7f37; --watch: #b45309; --bad: #c62828; --info: #52514e;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7;
  --lo: #1baf7a; --mid: #eda100; --hi: #e34948; --bar: #b9b8b1;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111110; --panel: #1a1a19; --text: #ffffff; --muted: #c3c2b7; --faint: #8f8e86; --line: #2e2e2b;
    --accent: #3987e5; --soft: #1c2a40;
    --good: #4ade80; --watch: #fbbf24; --bad: #f87171; --info: #c3c2b7;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9;
    --lo: #199e70; --mid: #c98500; --hi: #e66767; --bar: #5a5954;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111110; --panel: #1a1a19; --text: #ffffff; --muted: #c3c2b7; --faint: #8f8e86; --line: #2e2e2b;
  --accent: #3987e5; --soft: #1c2a40;
  --good: #4ade80; --watch: #fbbf24; --bad: #f87171; --info: #c3c2b7;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9;
  --lo: #199e70; --mid: #c98500; --hi: #e66767; --bar: #5a5954;
  --shadow: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif; }
.di { width: 1em; height: 1em; flex: none; vertical-align: -.14em; }
header { background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line); padding: 7px 16px;
  display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; position: sticky; top: var(--shell-top, 0); z-index: 10; }
header h1 { font-size: 16px; margin: 0 4px 0 0; }
.jump { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.jump a { color: var(--muted); text-decoration: none; font-size: 13px; padding: 3px 11px; border-radius: 14px; white-space: nowrap; }
.jump a:hover { background: var(--soft); color: var(--text); }
.jump a.on { background: var(--text); color: var(--bg); }
[data-sec] { scroll-margin-top: calc(var(--shell-top, 0px) + 56px); }
.meta { color: var(--muted); font-size: 12.5px; }
.faint { color: var(--faint); }
.num { font-variant-numeric: tabular-nums; }
main { max-width: 1280px; margin: 0 auto; padding: 14px 16px 40px; display: grid; gap: 14px; }
section, .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; box-shadow: var(--shadow); }
h2 { font-size: 14.5px; margin: 0 0 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
h2 .meta { font-weight: 400; }
h2 .di { font-size: 16px; color: var(--muted); }
.to-sched { margin-left: auto; font-size: 12.5px; font-weight: 600; color: var(--accent); text-decoration: none; white-space: nowrap; }
.to-sched:hover { text-decoration: underline; }
@media (max-width: 699px) { header { padding: 7px 10px; } header h1 { display: none; } #asof { display: none; }
  main { padding: 10px 10px 84px; gap: 10px; } section, .panel { padding: 12px; } }

/* ? help: hover shows, click / tap pins (touch has no hover); one fixed popup on <body> */
.q { display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; border: 1px solid var(--line);
  background: transparent; color: var(--muted); font: 600 11px/1 system-ui, sans-serif; cursor: help; padding: 0; flex: none; vertical-align: 1px; }
.q:hover, .q:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
.qpop { position: fixed; z-index: 100; max-width: min(340px, calc(100vw - 24px)); white-space: pre-line; background: var(--panel);
  color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px; font-size: 12.5px; line-height: 1.55;
  box-shadow: 0 8px 24px rgba(0,0,0,.2); pointer-events: none; }
.term { border-bottom: 1px dotted currentColor; cursor: help; }

/* status words: colour + icon + text, never colour alone */
.st { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.st.good { color: var(--good); } .st.watch { color: var(--watch); } .st.bad { color: var(--bad); } .st.info, .st.na { color: var(--muted); }

/* ---- KPI row ---- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 980px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 420px) { .kpis { gap: 8px; } }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 10px; box-shadow: var(--shadow);
  display: grid; grid-template-rows: auto 1fr auto; gap: 2px; min-width: 0; position: relative; }
.kpi .k { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.kpi .k .q { margin-left: auto; }
.kpi .row { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; min-width: 0; }
.kpi .v { font-size: 32px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kpi .v small { font-size: 15px; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 2px; }
.kpi .sub { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; min-width: 0; }
.kpi .sub > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.kpi svg.spark { width: 46%; max-width: 140px; height: 34px; flex: none; overflow: visible; }
.kpi .ring { width: 46px; height: 46px; flex: none; }
.kpi .bars { display: grid; gap: 4px; flex: 1; max-width: 150px; }
.kpi .bars .b { display: grid; grid-template-columns: 30px 1fr; gap: 6px; align-items: center; font-size: 11px; color: var(--muted); }
.track { height: 7px; background: color-mix(in srgb, var(--line) 80%, transparent); border-radius: 4px; overflow: hidden; position: relative; }
.track i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 4px; }
@media (max-width: 420px) { .kpi { padding: 10px 11px 9px; } .kpi .v { font-size: 26px; } .kpi svg.spark { width: 40%; } }
.strip { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; border: 1px solid var(--line); background: var(--panel);
  border-radius: 14px; padding: 3px 10px; color: var(--muted); white-space: nowrap; }
.chip b { color: var(--text); }
.counts { display: inline-flex; gap: 10px; }

/* ---- this week: 7 day cards ---- */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.dc { border: 1px solid var(--line); border-radius: 10px; padding: 8px 8px 9px; min-height: 128px; display: flex; flex-direction: column; gap: 6px; min-width: 0;
  background: color-mix(in srgb, var(--bg) 40%, var(--panel)); }
.dc .dh { display: flex; align-items: baseline; justify-content: space-between; gap: 4px; font-size: 12px; color: var(--muted); }
.dc .dh b { font-size: 13px; color: var(--text); }
.dc.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--panel)); }
.dc.today .dh b { color: var(--accent); }
.dc .now { font-size: 10.5px; font-weight: 700; color: #fff; background: var(--accent); border-radius: 8px; padding: 0 6px; }
.dc.past:not(.today) { opacity: .92; }
.sx { --c: var(--faint); display: grid; grid-template-columns: 26px 1fr; gap: 1px 7px; align-items: center; text-align: left; width: 100%;
  border: 0; border-left: 3px solid var(--c); background: color-mix(in srgb, var(--c) 9%, transparent); border-radius: 6px;
  padding: 5px 6px 5px 5px; font: inherit; color: var(--text); cursor: default; min-width: 0; }
.sx .ic { grid-row: 1 / span 2; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; background: var(--c); color: #fff; font-size: 15px; position: relative; }
.sx .tl { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.sx .mn { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.sx .ok { position: absolute; right: -5px; bottom: -5px; width: 15px; height: 15px; border-radius: 50%; background: var(--good); color: #fff;
  display: grid; place-items: center; font-size: 10px; border: 2px solid var(--panel); }
.sx.cp-yellow .ok { background: var(--watch); } .sx.cp-red .ok { background: var(--bad); }
.sx.missed { opacity: .55; } .sx.missed .tl { text-decoration: line-through; }
.sx.extra { --c: var(--bar); }
.sx .offp { color: var(--watch); font-weight: 800; }
.sx[data-go] { cursor: pointer; }
.ty-easy { --c: var(--s3); } .ty-long, .ty-hike { --c: var(--s1); } .ty-z3 { --c: var(--s4); } .ty-z5 { --c: var(--s2); }
.ty-test { --c: var(--s5); } .ty-b2b { --c: var(--s7); } .ty-loaded { --c: var(--s6); } .ty-strength, .ty-heat, .ty-notice { --c: var(--faint); }
.ty-race { --c: var(--text); }
.rest { margin-top: auto; margin-bottom: auto; display: flex; align-items: center; justify-content: center; gap: 5px; color: var(--faint); font-size: 12px; }
.badges { display: flex; gap: 4px; flex-wrap: wrap; }
.mini { font-size: 10.5px; border: 1px solid currentColor; border-radius: 8px; padding: 0 5px; color: var(--muted); white-space: nowrap; }
.mini.pushed, .mini.updated { color: var(--good); } .mini.outdated { color: var(--watch); } .mini.failed { color: var(--bad); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); margin: 8px 0 0; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
@media (max-width: 899px) {
  .week { grid-template-columns: 1fr; gap: 6px; }
  .dc { min-height: 0; display: grid; grid-template-columns: 52px 1fr; gap: 6px; padding: 6px 8px; align-items: center; }
  .dc .dh { flex-direction: column; align-items: flex-start; gap: 0; }
  .dc .sxs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 5px; }
  .rest { justify-content: flex-start; }
}
.sxs { display: grid; gap: 5px; }

/* expanders */
details.more { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 6px; }
details.more > summary { cursor: pointer; font-size: 12.5px; color: var(--muted); list-style: none; display: inline-flex; align-items: center; gap: 4px; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: "▸"; font-size: 10px; }
details.more[open] > summary::before { content: "▾"; }
details.more .body { font-size: 12.5px; color: var(--muted); display: grid; gap: 6px; margin-top: 6px; }
details.more ul { margin: 0; padding-left: 18px; }

/* ---- status cards row ---- */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; align-items: start; }
.alerts { display: grid; gap: 6px; }
details.al { border: 1px solid var(--line); border-radius: 9px; padding: 0; border-left: 4px solid var(--lc, var(--line)); }
details.al.good { --lc: var(--good); } details.al.watch { --lc: var(--watch); } details.al.bad { --lc: var(--bad); } details.al.info, details.al.na { --lc: var(--line); }
details.al > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 18px minmax(0, auto) minmax(0, 1fr) 12px; gap: 7px; align-items: center;
  padding: 7px 10px; font-size: 13px; }
details.al > summary::-webkit-details-marker { display: none; }
details.al > summary .di { font-size: 17px; color: var(--lc); }
details.al > summary b { white-space: nowrap; }
details.al > summary .s { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; }
details.al > summary::after { content: "▸"; font-size: 10px; color: var(--faint); }
details.al[open] > summary::after { content: "▾"; }
details.al .body { padding: 0 10px 9px 35px; font-size: 12.5px; color: var(--muted); }
.btn { font: inherit; font-size: 12.5px; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 3px 10px; cursor: pointer; border-radius: 6px; }
.btn:hover { border-color: var(--accent); }
.err { color: var(--bad); }
.loading { color: var(--muted); padding: 18px 0; text-align: center; }

/* 5 區 tracker */
.z5st { display: inline-flex; align-items: center; gap: 5px; font-weight: 650; font-size: 13px; border-radius: 14px; padding: 1px 10px 1px 8px; border: 1px solid currentColor; }
.z5st.confirmed, .z5st.open { color: var(--good); } .z5st.paused { color: var(--watch); } .z5st.reentry { color: var(--bad); } .z5st.unconfirmed { color: var(--muted); }
.z5need { margin: 0 0 10px; font-size: 13px; font-weight: 600; display: flex; gap: 6px; align-items: flex-start; }
.z5need .di { color: var(--accent); margin-top: 3px; }
ol.steps { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; position: relative; }
ol.steps > li { display: grid; justify-items: center; text-align: center; gap: 5px; position: relative; padding: 0 4px; min-width: 0; }
ol.steps > li::before { content: ""; position: absolute; top: 14px; left: -50%; right: 50%; height: 2px; background: var(--line); z-index: 0; }
ol.steps > li:first-child::before { display: none; }
ol.steps > li.ok::before, ol.steps > li.ok + li::before { background: color-mix(in srgb, var(--good) 60%, var(--line)); }
ol.steps .n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px;
  border: 2px solid var(--line); background: var(--panel); color: var(--muted); position: relative; z-index: 1; }
ol.steps li.ok .n { border-color: var(--good); background: var(--good); color: #fff; }
ol.steps li.cur .n { border-color: var(--accent); color: var(--accent); }
ol.steps .lb { font-size: 12.5px; font-weight: 600; }
ol.steps .sb { font-size: 11.5px; color: var(--muted); display: flex; gap: 4px; align-items: center; justify-content: center; flex-wrap: wrap; }
.tests { display: inline-flex; gap: 3px; }
.pmb { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; padding: 0 2px 0 6px; border-radius: 10px;
  border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pmb .q { width: 14px; height: 14px; font-size: 9.5px; border: 0; }
.tests.pre { align-items: center; margin-right: 6px; font-size: 11px; color: var(--muted); }
.tests span { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 5px; font-size: 11px; font-weight: 700; border: 1px solid var(--line); color: var(--faint); cursor: help; }
.tests span.y { background: var(--good); border-color: var(--good); color: #fff; } .tests span.n { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--accent); }
.dots i.on { background: var(--accent); }

/* compact stat blocks (B2B / 負重) */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 8px; }
.stat { border: 1px solid var(--line); border-radius: 9px; padding: 6px 9px; min-width: 0; }
.stat .k { font-size: 11.5px; color: var(--muted); display: flex; gap: 4px; align-items: center; white-space: nowrap; overflow: hidden; }
.stat .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .v small { font-size: 12px; color: var(--muted); font-weight: 600; }
.now-l { display: flex; gap: 6px; align-items: center; font-size: 13px; margin: 0 0 8px; min-width: 0; }
.now-l .di { color: var(--accent); font-size: 16px; }
.now-l span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.rows { display: grid; gap: 4px; margin-top: 8px; }
details.rw { border-top: 1px solid var(--line); }
details.rw > summary { list-style: none; cursor: pointer; display: flex; gap: 8px; align-items: center; padding: 5px 0; font-size: 12.5px; flex-wrap: wrap; }
details.rw > summary::-webkit-details-marker { display: none; }
details.rw .body { font-size: 12px; color: var(--muted); padding: 0 0 6px; }
.grid2 { display: grid; grid-template-columns: auto auto auto; gap: 1px 10px; font-size: 12px; color: var(--muted); margin-top: 3px; }

/* ---- 紀錄 ---- */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.seg { display: inline-flex; }
.seg button { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 3px 10px; cursor: pointer; margin-left: -1px; }
.seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
.seg button:last-child { border-radius: 0 6px 6px 0; }
.seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.plot { width: 100%; height: 280px; }
.plot.small { height: 120px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; margin: 10px 0; }
.tile { border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; min-width: 0; }
.tile .k { font-size: 12px; color: var(--muted); display: flex; gap: 5px; align-items: center; }
.tile .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tile .s { font-size: 11.5px; color: var(--muted); }
.up { color: var(--good); } .down { color: var(--bad); }
.split { display: flex; height: 16px; border-radius: 5px; overflow: hidden; gap: 2px; margin: 6px 0 4px; background: var(--panel); }
.split i { display: block; height: 100%; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }
.keys { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; margin: 8px 0; }
.keys div { font-size: 13px; }

/* ---- 指標 ---- */
.ind { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.ic { border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px 8px; border-top: 3px solid var(--lc, var(--line)); display: grid; gap: 2px; min-width: 0; align-content: start; }
.ic.good { --lc: var(--good); } .ic.watch { --lc: var(--watch); } .ic.bad { --lc: var(--bad); }
.ic .top { display: flex; justify-content: space-between; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
.ic .top > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ic .vr { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
.ic .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ic svg.spark { width: 45%; height: 26px; flex: none; }
.ic .vd { font-size: 12px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ic details.more { margin-top: 4px; padding-top: 4px; }
.heatbars { display: flex; align-items: flex-end; gap: 1px; height: 20px; margin: 4px 0; }
.heatbars i { flex: 1; min-width: 1px; background: var(--hi, #e34948); opacity: .6; border-radius: 1px 1px 0 0; }
.act { margin-top: 4px; font-size: 12px; }
</style>
</head>
<body>
<script src="/api/v1/static/shell.js" data-page="home"></script>
<header>
  <h1 data-i18n="overview.h1">總覽</h1>
  <nav class="jump" id="jump" aria-label="本頁段落" data-i18n-attr="aria-label:overview.jump.label">
    <a href="#s-status" data-i18n="overview.jump.status">狀況</a><a href="#s-week" data-i18n="overview.jump.week">本週</a><a href="#s-todo" data-i18n="overview.jump.todo">待辦</a><a href="#s-log" data-i18n="overview.jump.log">紀錄</a><a href="#s-ind" data-i18n="overview.jump.ind">指標</a>
  </nav>
  <span class="spacer" style="flex:1"></span>
  <span class="meta" id="asof"></span>
</header>
<main>
  <div id="autoplan" data-limit="3"></div>
  <script src="/api/v1/static/autoplan.js" defer></script>

  <!-- KPI row: CTL, TSB, this week's volume, countdown to the next A race -->
  <div data-sec id="s-status" style="display:grid;gap:10px">
    <div class="kpis" id="kpis"><div class="kpi"><div class="loading" data-i18n="overview.loading.status">計算訓練狀況中…</div></div></div>
    <div class="strip" id="strip"></div>
  </div>

  <section data-sec id="s-week" aria-labelledby="wk-h">
    <h2 id="wk-h"><span id="wk-ic"></span><span data-i18n="overview.week.h">本週</span> <span class="meta num" id="wk-sub"></span><span id="wk-cp"></span>
      <a class="to-sched" href="/api/v1/overview/plan/schedule/page" data-i18n="overview.week.edit">課表編輯 →</a></h2>
    <div class="week" id="wk-days"><div class="loading" data-i18n="overview.loading.week">排本週課表中…</div></div>
    <div class="legend" id="wk-legend"></div>
    <div id="week"></div>
  </section>

  <div class="cards" data-sec id="s-todo">
    <section aria-labelledby="todo-h">
      <h2 id="todo-h"><span data-i18n="overview.todo.h">待辦與警示</span> <span class="meta" id="todo-sub"></span></h2>
      <div class="alerts" id="actions"><div class="loading">…</div></div>
      <!-- due CP / AeT tests, B2B weekends, zone retests: the shared floating box (static/suggestions.js) -->
    </section>
    <!-- Zone 5 opening process (quality_gate.z5_card); the season history is the 基礎期 chart -->
    <section id="z5card" aria-labelledby="z5-h">
      <h2 id="z5-h"><span data-i18n="overview.z5.h">5 區間歇</span> <span id="z5-st"></span><a class="to-sched" id="z5-hist" href="/api/v1/wko5/viewer" data-i18n="overview.z5.history">歷程 →</a></h2>
      <div id="z5"><div class="loading">…</div></div>
    </section>
    <!-- 連續兩天長天 (engine/b2b.py card): only before a multi-day / ≥ 6 h A event, or once B2B weekends exist -->
    <section id="b2bcard" aria-labelledby="b2b-h" hidden>
      <h2 id="b2b-h"><span data-i18n="overview.b2b.h">B2B 連續長天</span> <span class="meta" id="b2b-sub"></span><span id="b2b-q"></span></h2>
      <div id="b2b"><div class="loading">…</div></div>
    </section>
  </div>

  <section data-sec id="s-log">
    <h2><span data-i18n="overview.log.h">做了什麼</span> <span class="meta" id="per-sub"></span></h2>
    <div class="toolbar">
      <div class="seg" id="unit"><button data-u="week" data-i18n="overview.log.unit.week">週</button><button data-u="month" data-i18n="overview.log.unit.month">月</button><button data-u="year" data-i18n="overview.log.unit.year">年</button></div>
      <button class="btn" id="prev" aria-label="上一期" data-i18n-attr="aria-label:overview.log.prev">◀</button>
      <b id="per-label" class="num"></b>
      <button class="btn" id="next" aria-label="下一期" data-i18n-attr="aria-label:overview.log.next">▶</button>
      <button class="btn" id="now" data-i18n="overview.log.now">回到現在</button>
      <button type="button" class="q" aria-label="說明" data-tip="點長條切換期間；上圖是移動時間（依類別堆疊），下圖是爬升。" data-i18n-attr="aria-label:overview.help;data-tip:overview.log.tip">?</button>
    </div>
    <div class="legend" id="cat-legend" style="margin:0 0 4px"></div>
    <div class="plot" id="trend"></div>
    <div class="meta" style="margin:4px 0 0" data-i18n="overview.log.climb_axis">爬升（m）</div>
    <div class="plot small" id="trend-climb"></div>
    <div id="period"><div class="loading">…</div></div>
  </section>

  <section data-sec id="s-ind">
    <h2><span data-i18n="overview.ind.h">指標</span> <span class="meta" id="ind-sub"></span></h2>
    <div class="ind" id="ind"><div class="loading">…</div></div>
  </section>
</main>
<script>
const API = "/api/v1/overview";
let USE_POWER = true;                       // settings 「使用功率」 (charts.power.enabled), read at start
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const I = (n, c) => window.DI ? DI(n, c) : "";
const tr = (k, p) => t("overview." + k, p);     // this page's catalog (static/i18n/<locale>/overview.json)
// ? help button: the text lives in data-tip (plain text, newlines kept)
const q = (s, label = tr("help")) => s ? `<button type="button" class="q" aria-label="${esc(label)}" data-tip="${esc(s)}">?</button>` : "";
// glossary: terms in engine text get a hover (tap on touch) explanation; the term is
// matched as the engine writes it in the page's language (AeT / CP 測試 = CP test / 間歇門檻 = interval gate)
const GLOSS = Object.fromEntries(["aet", "cp_test", "i_gate"].map((k) => [tr(`gloss.${k}.term`).toLowerCase(), tr(`gloss.${k}.tip`)]));
const GLOSS_RE = new RegExp(Object.keys(GLOSS).map((k) => k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|"), "gi");
const gl = (s) => esc(s).replace(GLOSS_RE, (m) => `<span class="term" tabindex="0" data-tip="${esc(GLOSS[m.toLowerCase()])}">${m}</span>`);
// an error response's text: a UserError's translated {"detail": {"message"}}, a plain detail string, else status + body
async function errText(r) {
  const txt = await r.text();
  try {
    const d = JSON.parse(txt).detail;
    if (d && typeof d === "object" && d.message) return d.message;
    if (typeof d === "string") return d;
  } catch {}
  return `${r.status} ${txt.slice(0, 200)}`;
}
async function j(url) { const r = await fetch(url); if (!r.ok) throw new Error(await errText(r)); return r.json(); }
const ls = { get(k, d) { try { const v = localStorage.getItem("overview." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("overview." + k, JSON.stringify(v)); } catch {} } };

// ---- formatting (units: h:mm, km 1 dec, m 0 dec, TSS 0 dec) ----
const hm = (s) => { if (s == null) return "–"; const m = Math.round(s / 60); return `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")}`; };
const hrs = (h) => h == null ? "–" : (h >= 10 ? h.toFixed(0) : h.toFixed(1)) + " h";
const hrN = (h) => h == null ? "–" : (h >= 10 ? h.toFixed(0) : h.toFixed(1));
const km = (v) => v == null ? "–" : (v >= 100 ? I18N.fmt.num(v, 0) : v.toFixed(1)) + " km";
const m0 = (v) => v == null ? "–" : I18N.fmt.num(v, 0) + " m";
const n0 = (v) => v == null ? "–" : I18N.fmt.num(v, 0);
const sgn = (v, f = n0) => v == null ? "–" : (v > 0 ? "+" : v < 0 ? "−" : "±") + f(Math.abs(v));
const pct = (v) => v == null ? "–" : Math.round(v * 100) + "%";
const md = (iso) => I18N.fmt.date(iso, "md");
const wd = (iso) => I18N.fmt.weekday(iso, "short");      // 週四 / Thu
const mins = (n) => tr("unit.min", { n });               // 40 分 / 40 min
const CAT_VAR = { road: "--s1", trail: "--s2", hike: "--s3", bike: "--s4", strength: "--s5", walk: "--s6", other: "--s7" };
const catColor = (k) => css(CAT_VAR[k] || "--s7");
const LEVEL = Object.fromEntries(["good", "watch", "bad", "info", "na"].map((k) => [k, tr("level." + k)]));
const stw = (lvl, word) => `<span class="st ${esc(lvl)}">${I(lvl)}${esc(word ?? LEVEL[lvl] ?? "")}</span>`;

const charts = {};
function chart(id) { if (!charts[id]) { charts[id] = echarts.init($(id)); new ResizeObserver(() => charts[id].resize()).observe($(id)); } return charts[id]; }
const axisStyle = () => ({ axisLabel: { color: css("--muted"), fontSize: 11 }, axisLine: { lineStyle: { color: css("--line") } },
  splitLine: { lineStyle: { color: css("--line") } }, axisTick: { show: false } });

let STATUS = null, PLAN = null, SP = null;

// sparkline: thin line, last point marked; hover shows the last value (native title)
function spark(pts, level, last) {
  const P = (pts || []).filter((p) => p[1] != null);
  if (P.length < 3) return "";
  const xs = P.map((p) => new Date(p[0]).getTime()), ys = P.map((p) => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const X = (x) => x1 === x0 ? 0 : (x - x0) / (x1 - x0) * 196 + 2, Y = (y) => y1 === y0 ? 17 : 31 - (y - y0) / (y1 - y0) * 28;
  const col = level === "bad" ? "var(--bad)" : level === "watch" ? "var(--watch)" : level === "good" ? "var(--good)" : "var(--accent)";
  const lx = X(xs[xs.length - 1]), ly = Y(ys[ys.length - 1]);
  const zero = y0 < 0 && y1 > 0 ? `<line x1="0" x2="200" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" stroke="var(--line)" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>` : "";
  return `<svg class="spark" viewBox="0 0 200 34" preserveAspectRatio="none" role="img" aria-label="${esc(tr("spark.label"))}">
    <title>${esc(tr("spark.title", { d0: P[0][0], v0: Math.round(ys[0]), d1: P[P.length - 1][0], v1: Math.round(ys[ys.length - 1]) }))}</title>${zero}
    <polyline fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"
      points="${P.map((p, i) => `${X(xs[i]).toFixed(1)},${Y(ys[i]).toFixed(1)}`).join(" ")}"/>
    <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="3.2" fill="${col}" stroke="var(--panel)" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}
// progress ring (done ÷ target)
function ring(f, col = "var(--accent)") {
  const r = 19, c = 2 * Math.PI * r, v = Math.max(0, Math.min(1, f || 0));
  return `<svg class="ring" viewBox="0 0 46 46" role="img" aria-label="${esc(tr("ring.label", { pct: Math.round((f || 0) * 100) }))}">
    <circle cx="23" cy="23" r="${r}" fill="none" stroke="var(--line)" stroke-width="5"/>
    <circle cx="23" cy="23" r="${r}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round"
      stroke-dasharray="${(c * v).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 23 23)"/>
    <text x="23" y="27" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--text)">${Math.round((f || 0) * 100)}%</text></svg>`;
}
const bar = (label, done, tgt, fmt) => `<div class="b"><span>${label}</span>
  <div class="track" role="img" aria-label="${label} ${fmt(done)} / ${fmt(tgt)}" title="${label} ${fmt(done)} / ${fmt(tgt)}"><i style="width:${Math.min(100, tgt > 0 ? done / tgt * 100 : 0).toFixed(1)}%"></i></div></div>`;

// ---------------- KPI tiles ----------------
const ind = (id) => (STATUS?.indicators || []).find((x) => x.id === id);
const srcTip = (s) => s ? tr("source", { src: s }) : "";
const tipOf = (i) => i ? [i.verdict, i.why, i.action ? "→ " + i.action : "", srcTip(i.source)].filter(Boolean).join("\n") : "";
const hoursNote = (tph) => tr("week.hours_note", { tph: n0(tph) });
function renderKpis() {
  if (!STATUS) return;
  const F = ind("fitness"), T = ind("form"), ph = ind("phase"), g = STATUS.goals;
  const out = [];
  const ramp = F?.extra?.ramp_week;
  out.push(`<div class="kpi"><div class="k">${I("fitness")}${esc(tr("kpi.fitness"))}${q(tipOf(F))}</div>
    <div class="row"><div class="v">${esc(F?.text ?? "–")}</div>${spark(F?.spark, F?.level)}</div>
    <div class="sub"><span class="num">${ramp == null ? "" : esc(tr("kpi.ramp", { ramp: sgn(ramp, (v) => v.toFixed(1)) }))}</span>${F ? stw(F.level, kpiWord(F)) : ""}</div></div>`);
  // a word of the verdict, else the Form zone's name (TrainingPeaks' names in English, status extra.zone)
  const zone = T?.extra?.zone;
  out.push(`<div class="kpi"><div class="k">${I("form")}${esc(tr("kpi.form"))}${q(tipOf(T))}</div>
    <div class="row"><div class="v">${esc(T?.text ?? "–")}</div>${spark(T?.spark, T?.level)}</div>
    <div class="sub"><span class="num">${T?.why ? esc(T.why.replace(/^TSB [^（(]*/, "").replace(/[（）()]/g, "")) : ""}</span>${T ? stw(T.level, kpiWord(T, zone && tr("zone." + zone))) : ""}</div></div>`);
  // this week: from the stored plan once loaded (the user's edits), else the generated targets
  const S = SP?.summary, D = PLAN?.done;
  const th = S?.hours ?? PLAN?.target?.hours, tt = S?.tss ?? PLAN?.target?.tss;
  if (PLAN) {
    const f = th > 0 ? D.hours / th : 0;
    const wtip = [...(PLAN.why || []), hoursNote(PLAN.target.tss_per_hour)].join("\n");
    out.push(`<div class="kpi"><div class="k">${I("volume")}${esc(tr("kpi.volume"))}${q(wtip)}</div>
      <div class="row"><div class="v">${hrN(D.hours)}<small>/ ${hrs(th)}</small></div>${ring(f, f >= 1 ? "var(--good)" : "var(--accent)")}</div>
      <div class="sub"><span class="num">TSS ${n0(D.tss)} / ${n0(tt)}</span>${stw(f >= 1 ? "good" : "info", tr(f >= 1 ? "kpi.vol_done" : f >= 0.5 ? "kpi.vol_half" : "kpi.vol_going"))}</div></div>`);
  } else out.push(`<div class="kpi"><div class="k">${I("volume")}${esc(tr("kpi.volume"))}</div><div class="loading">…</div></div>`);
  const name = ph?.extra?.next_a;
  out.push(`<div class="kpi"><div class="k">${I("flag")}${esc(tr("kpi.next_a"))}${q(ph ? [ph.text, ph.verdict, ph.why].filter(Boolean).join("\n") : "")}</div>
    ${g.next_a ? `<div class="row"><div class="v">${g.days_to_next_a}<small>${esc(tr("unit.days_small", { n: g.days_to_next_a }))}</small></div></div>
      <div class="sub"><span>${esc(name || "")}</span>${STATUS.phase ? stw("info", STATUS.phase.label).replace(I("info"), I("flag")) : ""}</div>`
      : `<div class="row"><div class="v">–</div></div><div class="sub"><a href="/api/v1/plan/page">${esc(tr("kpi.add_event"))}</a></div>`}</div>`);
  $("kpis").innerHTML = out.join("");
}
// one word for a KPI tile: the verdict before its first punctuation when short, else the level word
// (zh: ≤ 6 characters; en: ≤ 3 words)
function kpiWord(i, fallback) {
  const short = (x) => I18N.locale === "zh-TW" ? x.length <= 6 : x.length <= 24 && x.split(/\s+/).length <= 3;
  const v = String(i.verdict || "").split(/[，、：（()）；,;:]|\s[–—-]\s/).map((x) => x.trim()).find((x) => x && !/\d/.test(x) && short(x));
  return v || fallback || LEVEL[i.level];
}

// ---------------- status: strip, to-do, indicators ----------------
async function loadStatus() {
  const s = STATUS = await j(`${API}/status`);
  $("asof").textContent = tr("asof", { day: s.today });
  const p = s.phase, c = s.counts;
  $("strip").innerHTML = `<span class="chip">${I("flag")}<b>${esc(p ? p.label : tr("no_phase"))}</b>${p ? `<span class="faint num">${md(p.start)}–${md(p.end)}</span>` : ""}${p ? q(tr("phase_goal", { goal: p.goal })) : ""}</span>
    <span class="chip counts" title="${esc(s.headline)}"><span class="st bad">${I("bad")}${c.bad}</span><span class="st watch">${I("watch")}${c.watch}</span><span class="st good">${I("good")}${c.good}</span>${q(s.headline)}</span>`;
  renderKpis();
  // to-do: icon + short title; the detail opens on click
  const lvl = (a) => (ind((a.because || [])[0]) || {}).level || "info";
  $("todo-sub").textContent = s.actions.length ? tr("n_items", { n: s.actions.length }) : "";
  $("actions").innerHTML = s.actions.length ? s.actions.map((a) => {
    const [t, rest] = headRest(a.title);
    const l = lvl(a);
    return `<details class="al ${l}"><summary>${I(l)}<b>${gl(t)}</b><span class="s">${gl(rest)}</span></summary>
      <div class="body">${gl(a.detail)}${a.source ? ` ${q(srcTip(a.source))}` : ""}</div></details>`;
  }).join("") : `<p class="meta">${I("good")} ${esc(tr("todo.none"))}</p>`;
  const order = { bad: 0, watch: 1, good: 2, info: 3, na: 4 };
  const inds = [...s.indicators].sort((a, b) => order[a.level] - order[b.level]);
  $("ind-sub").textContent = tr("ind.sub", { n: inds.length });
  $("ind").innerHTML = inds.map((i) => {
    const more = [i.why ? `<div>${gl(i.why)}</div>` : "", driftTier(i), i.action ? `<div class="act">→ ${gl(i.action)}</div>` : "", heatExtra(i),
      i.source ? `<div class="faint">${esc(srcTip(i.source))}</div>` : ""].filter(Boolean).join("");
    return `<div class="ic ${i.level}">
      <div class="top"><span>${gl(i.title)}</span>${stw(i.level)}</div>
      <div class="vr"><div class="v">${esc(i.text)}</div>${spark(i.spark, i.level)}</div>
      ${i.verdict ? `<div class="vd" title="${esc(i.verdict)}">${gl(i.verdict)}</div>` : ""}
      ${applyCpBtn(i)}${aetApply(i)}
      ${more ? `<details class="more"><summary>${esc(tr("more"))}</summary><div class="body">${more}</div></details>` : ""}</div>`;
  }).join("");
}
// an engine line 「標題：說明」 / "Title: detail" -> [title, detail] (the first full-width colon, else ": ")
function headRest(s) {
  s = String(s ?? "");
  let i = s.indexOf("："), n = 1;
  if (i < 0) { i = s.indexOf(": "); n = 2; }
  return i < 0 ? [s, ""] : [s.slice(0, i), s.slice(i + n)];
}

// 熱適應 card (status.i_heat, engine/heat.py): daily heat dose bars under the S line,
// race-day S, and the HRC observation (does the HR cost of heat fall as S rises?)
function heatExtra(i) {
  if (i.id !== "heat" || !i.extra) return "";
  const x = i.extra, doses = x.doses || [];
  const bars = doses.length ? `<div class="heatbars" title="${esc(tr("heat.bars"))}">${doses.slice(-60).map(([d, v]) =>
    `<i style="height:${Math.max(2, v * 18)}px" title="${esc(d)} ${Math.round(v * 100)}%"></i>`).join("")}</div>` : "";
  const r = x.s_race ? `<div>${esc(tr("heat.race", { event: x.s_race.event, date: x.s_race.date, s: Math.round(x.s_race.center * 100),
    lo: Math.round(x.s_race.low * 100), hi: Math.round(x.s_race.high * 100) }))}</div>` : "";
  const h = x.hrc && x.hrc.recent != null ? `<div>${esc(tr("heat.hrc", { recent: x.hrc.recent.toFixed(1), before: x.hrc.before != null ? x.hrc.before.toFixed(1) : "–" }))}${x.hrc.disagrees ? ` · <b>${esc(tr("heat.disagrees"))}</b>` : ""}</div>` : "";
  return `${bars}${r}${h}<div><span class="st watch">${esc(tr("estimate"))}</span> a = ${x.a}（${(x.a_range || []).join("–")}）</div>`;
}

// 心率飄移 card (status.i_drift): runs on the 參考 tier are counted for display — say so, why on hover
function driftTier(i) {
  const x = i.id === "drift" && i.extra;
  if (!x || !x.ref) return "";
  return `<div><span class="st watch">${esc(tr("level.info"))}</span> ${esc(tr("drift.ref", { n: x.ref, label: x.ref_label || "" }))}${x.test ? esc(tr("drift.strict", { n: x.test })) : ""} ${q(x.ref_tip)}</div>`;
}

// 測試 card: 「套用這次的 AeT」 when the latest AeT drift test is in UA's 3.5–5 % band
// (status.i_testing extra.aet_test.apply, engine/aet_test.py) -> POST apply-estimate on the test day
function aetApply(i) {
  const at = i.id === "testing" && i.extra && i.extra.aet_test;
  if (!at || !at.apply) return "";
  return `<div class="act"><button type="button" class="btn" data-aet-apply>${esc(tr("aet.apply", { hr: at.apply.aethr }))}</button>
    <span class="meta" data-apply-msg>${esc(at.date)} ${at.drift != null ? (at.drift * 100).toFixed(1) + "%" : ""}</span>${q(at.basis)}</div>`;
}
document.addEventListener("click", async (ev) => {
  const b = ev.target.closest("[data-aet-apply]");
  if (!b || !STATUS) return;
  const at = ((STATUS.indicators.find((x) => x.id === "testing") || {}).extra || {}).aet_test;
  if (!at || !at.apply) return;
  const a = at.apply, msg = b.parentElement.querySelector("[data-apply-msg]");
  if (!confirm(tr("aet.confirm", { date: a.date, hr: a.aethr }))) return;
  b.disabled = true;
  try {
    const r = await fetch("/api/v1/plan/thresholds/apply-estimate", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(a) });
    if (!r.ok) throw new Error(await errText(r));
    b.remove();
    msg.textContent = tr("aet.applied", { date: a.date, hr: a.aethr });
  } catch (e) { b.disabled = false; msg.textContent = tr("apply_failed", { msg: e.message }); }
});

const TYPES = {
  easy: tr("type.easy"), z3: tr("type.z3"), z5: tr("type.z5"), long: tr("type.long"), hike: tr("type.hike"), b2b: "B2B",
  loaded: tr("type.loaded"), test: tr("type.test"), strength: tr("type.strength"), race: tr("type.race"), heat: tr("type.heat"),
  notice: tr("type.notice"), rest: tr("type.rest") };
function stype(s) {
  const k = s.kind, t = s.title || "";
  if (k === "test") return "test";
  if (k === "quality") return /^z5/i.test(s.rung_key || "") || /VO2max|5 區|Z5/i.test(t) ? "z5" : "z3";
  if (k === "race") return "race";
  if (k === "strength") return /ME|肌耐力|muscular endurance/i.test(t) ? "loaded" : "strength";
  if (/^B2B/.test(t) || /^long[23]$/.test(s.gen_key || "")) return "b2b";
  if (/背\s*[\d.]+\s*kg|背包|[\d.]+\s*kg pack|backpack/i.test(t) || /^(carry|me)$/.test(s.gen_key || "")) return "loaded";
  if (k === "long" || k === "mountain") return "long";
  if (k === "hike") return "hike";
  if (k === "heat_passive" || (s.heat && k !== "easy")) return "heat";
  if (k === "notice") return "notice";
  return "easy";
}

const N = { week: 16, month: 12, year: 6 };
async function loadPeriod() {
  document.querySelectorAll("#unit button").forEach((b) => b.classList.toggle("on", b.dataset.u === PS.unit));
  const qs = `unit=${PS.unit}&n=${N[PS.unit]}${PS.anchor ? "&anchor=" + PS.anchor : ""}`;
  $("period").innerHTML = `<div class="loading">計算中…</div>`;
  const R = PS.data = await j(`${API}/summary?${qs}`);
  const B = R.buckets, C = R.current;
  $("per-label").textContent = C.label;
  const cats = Object.keys(R.categories).filter((k) => B.some((b) => b.by_category[k]));
  $("cat-legend").innerHTML = cats.map((k) => `<span><i style="background:${catColor(k)}"></i>${esc(R.categories[k].label)}</span>`).join("");
  const sel = B.findIndex((b) => b.start === C.start);
  const cur = sel < 0 ? B.length - 1 : sel;
  const hourSeries = cats.map((k) => ({
    name: R.categories[k].label, type: "bar", stack: "h", barMaxWidth: 26,
    data: B.map((b, i) => ({ value: (b.by_category[k]?.moving_s || 0) / 3600, itemStyle: { opacity: i === cur ? 1 : 0.5 } })),
    itemStyle: { color: catColor(k), borderColor: css("--panel"), borderWidth: 1 },
  }));
  const tip = { trigger: "axis", axisPointer: { type: "shadow" }, backgroundColor: css("--panel"), borderColor: css("--line"), textStyle: { color: css("--text"), fontSize: 12 } };
  chart("trend").setOption({
    animation: false, grid: { left: 40, right: 10, top: 10, bottom: 22 },
    tooltip: { ...tip, formatter: (ps) => { const b = B[ps[0].dataIndex];
      return `<b>${b.label}</b>　${hrs(b.moving_s / 3600)} · ${b.sessions} 次<br>` +
        ps.filter((p) => p.value > 0).map((p) => `${p.marker}${p.seriesName} ${hrs(p.value)}`).join("<br>"); } },
    xAxis: { type: "category", data: B.map((b) => b.label), ...axisStyle(), splitLine: { show: false } },
    yAxis: { type: "value", ...axisStyle(), axisLabel: { color: css("--muted"), fontSize: 11, formatter: (v) => v + " h" } },
    series: hourSeries,
  }, true);
  chart("trend-climb").setOption({
    animation: false, grid: { left: 40, right: 10, top: 6, bottom: 20 },
    tooltip: { ...tip, formatter: (ps) => `<b>${B[ps[0].dataIndex].label}</b><br>爬升 ${m0(ps[0].value)}` },
    xAxis: { type: "category", data: B.map((b) => b.label), ...axisStyle(), splitLine: { show: false } },
    yAxis: { type: "value", min: 0, splitNumber: 2, ...axisStyle(), axisLabel: { color: css("--muted"), fontSize: 11, formatter: (v) => Math.round(v) } },
    series: [{ type: "bar", barMaxWidth: 26, data: B.map((b, i) => ({ value: b.climbing_m, itemStyle: { opacity: i === cur ? 1 : 0.5 } })),
      itemStyle: { color: css("--s3"), borderRadius: [3, 3, 0, 0] } }],
  }, true);
  for (const id of ["trend", "trend-climb"]) {
    chart(id).off("click");
    chart(id).on("click", (e) => { PS.anchor = B[e.dataIndex].start; loadPeriod(); });
  }
  renderPeriod(R);
}
function delta(cur, ref, fmt) {
  if (ref == null) return "";
  const d = cur - ref;
  if (Math.abs(d) < 1e-9) return `<span class="faint">持平</span>`;
  return `<span class="${d > 0 ? "up" : "down"}">${d > 0 ? "▲" : "▼"} ${sgn(d, fmt).slice(1)}</span>`;
}
function renderPeriod(R) {
  const C = R.current, P = C.vs_prev, T = C.typical, unitWord = { week: "週", month: "月", year: "年" }[R.unit];
  $("per-sub").textContent = `${C.start} ～ ${C.end}${C.elapsed_share != null ? `（進行中 ${pct(C.elapsed_share)}）` : ""}`;
  const tile = (icon, k, v, key, fmt) => `<div class="tile" title="${esc(T ? `平常 ${fmt(T[key])}` : "")}"><div class="k">${I(icon)}${k}</div><div class="v">${v}</div>
    <div class="s">${P ? `比上${unitWord} ${delta(C[key], C[key] - P[key], fmt)}` : ""}</div></div>`;
  const I_ = C.intensity;
  const cats = Object.entries(C.by_category).sort((a, b) => b[1].moving_s - a[1].moving_s);
  const k = (r, label, val) => r ? `<div><span class="meta">${label}</span><br><b>${esc(r.date)}</b> ${esc(r.category_label)} · ${val}</div>` : "";
  $("period").innerHTML = `
    <div class="tiles">
      ${tile("time", "移動時間", hrs(C.moving_s / 3600), "moving_s", (v) => hrs(v / 3600))}
      ${tile("list", "次數", C.sessions, "sessions", (v) => Math.round(v * 10) / 10 + " 次")}
      ${tile("distance", "距離", km(C.distance_km), "distance_km", km)}
      ${tile("gain", "爬升", m0(C.climbing_m), "climbing_m", m0)}
      ${tile("tss", "TSS", n0(C.tss), "tss", n0)}
      <div class="tile"><div class="k">${I("climb")}努力距離 EP ${q("km + 爬升/100（跑步、登山）")}</div><div class="v">${km(C.ep_km)}</div></div>
      <div class="tile"><div class="k">${I("check")}有練的天數</div><div class="v">${C.days}</div><div class="s">下降 ${m0(C.descending_m)}</div></div>
    </div>
    ${I_.total > 0 ? `<div><b style="font-size:13px">強度分配</b> <span class="meta">目標 低 ≥ 75–80%</span>
      ${q("耐力活動的移動時間，依心率：低 < AeT、中 AeT–LTHR、高 ≥ LTHR（目標：低 ≥ 75–80%，Seiler）")}
      <div class="split" role="img" aria-label="低 ${pct(I_.low / I_.total)}，中 ${pct(I_.mid / I_.total)}，高 ${pct(I_.high / I_.total)}">
        <i style="width:${I_.low / I_.total * 100}%;background:var(--lo)"></i><i style="width:${I_.mid / I_.total * 100}%;background:var(--mid)"></i><i style="width:${I_.high / I_.total * 100}%;background:var(--hi)"></i></div>
      <div class="legend" style="margin:0"><span><i style="background:var(--lo)"></i>低 ${pct(I_.low / I_.total)} · ${hm(I_.low)}</span>
        <span><i style="background:var(--mid)"></i>中 ${pct(I_.mid / I_.total)} · ${hm(I_.mid)}</span>
        <span><i style="background:var(--hi)"></i>高 ${pct(I_.high / I_.total)} · ${hm(I_.high)}</span></div></div>` : ""}
    <details class="more"><summary>詳細數字</summary><div class="body" style="color:var(--text)">
    ${T ? `<div class="meta">平常（典型的一${unitWord}）：${hrs(T.moving_s / 3600)} · ${km(T.distance_km)} · ${m0(T.climbing_m)} · TSS ${n0(T.tss)}</div>` : ""}
    <div class="keys">
      ${k(C.longest, "最長一次", hm(C.longest?.moving_s))}
      ${k(C.biggest_climb, "爬最多", m0(C.biggest_climb?.climbing_m))}
      ${k(C.hardest, "負荷最大", "TSS " + n0(C.hardest?.tss))}
    </div>
    ${cats.length ? `<div class="tablewrap"><table><thead><tr><th>類別</th><th class="n">次數</th><th class="n">移動時間</th><th class="n">距離</th><th class="n">爬升</th><th class="n">TSS</th></tr></thead>
      <tbody>${cats.map(([key, v]) => `<tr><td><span class="dot" style="background:${catColor(key)}"></span>${esc(R.categories[key].label)}</td>
        <td class="n">${v.sessions}</td><td class="n">${hm(v.moving_s)}</td><td class="n">${km(v.distance_km)}</td><td class="n">${m0(v.climbing_m)}</td><td class="n">${n0(v.tss)}</td></tr>`).join("")}</tbody></table></div>`
      : `<p class="meta">這段期間沒有活動。</p>`}
    ${C.activities.length ? `<div class="tablewrap"><table><thead><tr><th>日期</th><th>類別</th><th>類型</th><th class="n">移動時間</th><th class="n">距離</th><th class="n">爬升</th><th class="n">TSS</th></tr></thead>
      <tbody>${C.activities.map((a) => `<tr><td>${esc(a.start.slice(0, 16).replace("T", " "))}</td><td><span class="dot" style="background:${catColor(a.category)}"></span>${esc(a.category_label)}</td>
        <td class="meta">${esc(a.sport_type)}</td><td class="n">${hm(a.moving_s)}</td><td class="n">${a.distance_km ? km(a.distance_km) : "–"}</td>
        <td class="n">${a.climbing_m ? m0(a.climbing_m) : "–"}</td><td class="n">${n0(a.tss)}</td></tr>`).join("")}</tbody></table></div>` : ""}
    </div></details>`;
}
function shift(dir) {
  const cur = new Date((PS.data?.current.start || STATUS.today) + "T00:00:00");
  if (PS.unit === "week") cur.setDate(cur.getDate() + 7 * dir);
  else if (PS.unit === "month") cur.setMonth(cur.getMonth() + dir);
  else cur.setFullYear(cur.getFullYear() + dir);
  PS.anchor = `${cur.getFullYear()}-${String(cur.getMonth() + 1).padStart(2, "0")}-${String(cur.getDate()).padStart(2, "0")}`;
  loadPeriod();
}

// ---------------- stored, editable plan (edit / push live on the 課表 page) ----------------
const PAPI = `${API}/plan`;
const isoOf = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const addDays = (iso, n) => { const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() + n); return isoOf(d); };
async function sj(method, url, body) {
  const r = await fetch(url, { method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  const b = await r.json().catch(() => ({}));
  if (r.status === 401) throw new Error(tr("coros_login"));
  if (!r.ok) throw new Error(typeof b.detail === "string" ? b.detail : b.detail?.message || `${r.status} ${JSON.stringify(b.detail || b).slice(0, 200)}`);
  return b;
}
async function loadPlan() {
  // the 課表 calendar endpoint for this week: sessions + TSS estimates + compliance
  SP = await sj("GET", `${PAPI}/calendar?start=${PLAN.week.start}&end=${PLAN.week.end}`);
  renderPlan();
}

// ---------------- wiring ----------------
document.querySelectorAll("#unit button").forEach((b) => b.onclick = () => { PS.unit = b.dataset.u; PS.anchor = null; ls.set("unit", PS.unit); loadPeriod(); });
$("prev").onclick = () => shift(-1);
$("next").onclick = () => shift(1);
$("now").onclick = () => { PS.anchor = null; loadPeriod(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { loadPeriod(); });
// ? / glossary / session tips: hover shows a popup, click / tap pins it; Esc or a click elsewhere closes it
const QT = { el: null, pinned: null };
function qShow(t) {
  qHide();
  const d = document.createElement("div");
  d.className = "qpop"; d.setAttribute("role", "tooltip");
  d.textContent = t.dataset.tip;
  document.body.appendChild(d);
  const r = t.getBoundingClientRect(), w = d.offsetWidth, h = d.offsetHeight;
  d.style.left = `${Math.max(12, Math.min(r.left - 8, innerWidth - w - 12))}px`;
  d.style.top = `${r.bottom + 6 + h > innerHeight - 8 ? Math.max(8, r.top - h - 6) : r.bottom + 6}px`;
  QT.el = d;
}
function qHide() { QT.el?.remove(); QT.el = null; }
const TIPSEL = ".q, .term, [data-tip]";
document.addEventListener("mouseover", (e) => { const t = e.target.closest?.(TIPSEL); if (t && !QT.pinned && t.dataset.tip) qShow(t); });
document.addEventListener("mouseout", (e) => { if (e.target.closest?.(TIPSEL) && !QT.pinned) qHide(); });
document.addEventListener("focusin", (e) => { const t = e.target.closest?.(TIPSEL); if (t && t.dataset.tip && !QT.pinned) qShow(t); });
document.addEventListener("focusout", () => { if (!QT.pinned) qHide(); });
document.addEventListener("click", (e) => {
  const t = e.target.closest(TIPSEL);
  if (t && t.dataset.tip && !e.target.closest("summary") && QT.pinned !== t) { QT.pinned = t; qShow(t); e.preventDefault(); return; }
  if (t && QT.pinned === t) { QT.pinned = null; qHide(); return; }
  QT.pinned = null; qHide();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { QT.pinned = null; qHide(); } });
addEventListener("scroll", () => { if (QT.pinned) qShow(QT.pinned); else qHide(); }, { passive: true, capture: true });
// in-page nav: highlight the section being read
(() => {
  const links = [...document.querySelectorAll("#jump a")];
  const secs = links.map((a) => document.querySelector(a.getAttribute("href")));
  const mark = () => {
    const top = (parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--shell-top")) || 0) + 70;
    let k = 0;
    secs.forEach((s, i) => { if (s && s.getBoundingClientRect().top <= top) k = i; });
    if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4) k = secs.length - 1;
    links.forEach((a, i) => a.classList.toggle("on", i === k));
  };
  addEventListener("scroll", mark, { passive: true });
  addEventListener("resize", mark);
  mark();
})();
