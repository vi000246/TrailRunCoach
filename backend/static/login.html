<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title data-i18n="login.title">登入 · TrailRunCoach</title>
<style>
/* 登入與註冊 (SP-58): /login and /signup render this page; no shell (its pages need a session) */
:root {
  color-scheme: light;
  --bg: #f4f5f7; --panel: #fcfcfb; --text: #0b0b0b; --muted: #52514e; --line: #e3e3df;
  --accent: #2a78d6; --soft: #e8efff; --warn-bg: #fff4e0; --warn: #8a4b00; --err-bg: #fdecec; --err: #a11d1d;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111110; --panel: #1a1a19; --text: #ffffff; --muted: #c3c2b7; --line: #2e2e2b;
    --accent: #3987e5; --soft: #1c2a40; --warn-bg: #3a2a0c; --warn: #fbbf24; --err-bg: #3b1515; --err: #fca5a5;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111110; --panel: #1a1a19; --text: #ffffff; --muted: #c3c2b7; --line: #2e2e2b;
  --accent: #3987e5; --soft: #1c2a40; --warn-bg: #3a2a0c; --warn: #fbbf24; --err-bg: #3b1515; --err: #fca5a5;
  --shadow: none;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
  font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif; }
main { max-width: 460px; margin: 0 auto; padding: max(32px, 8vh) 16px 48px; }
.brand { display: flex; align-items: center; gap: 9px; margin-bottom: 18px; font-weight: 700; letter-spacing: .02em; }
.brand i { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; }
.brand svg { width: 19px; height: 19px; color: #fff; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 22px 20px; }
h1 { margin: 0 0 6px; font-size: 21px; line-height: 1.3; }
p { margin: 0 0 14px; color: var(--muted); }
.msg { margin: 0 0 14px; padding: 9px 12px; border-radius: 9px; font-size: 14px; }
.msg.err { background: var(--err-bg); color: var(--err); }
.msg.info { background: var(--soft); color: var(--text); }
.msg[hidden] { display: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 44px; padding: 9px 18px;
  border-radius: 10px; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); color: var(--text); }
.btn:hover { border-color: var(--accent); }
.btn:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.wide { width: 100%; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn svg { width: 20px; height: 20px; flex: none; }
.note { margin: 14px 0 0; font-size: 12.5px; }
.draft { margin: 0 0 12px; padding: 8px 11px; border-radius: 9px; background: var(--warn-bg); color: var(--warn); font-size: 13px; }
.draft[hidden] { display: none; }
.docs { display: grid; gap: 8px; margin: 0 0 14px; }
details { border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
summary { cursor: pointer; padding: 10px 12px; font-weight: 600; min-height: 44px; display: flex; align-items: center; }
.doc { padding: 0 12px 12px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13.5px; line-height: 1.65;
  color: var(--muted); max-height: 46vh; overflow: auto; }
.check { display: flex; gap: 10px; align-items: flex-start; margin: 0 0 16px; font-size: 14px; cursor: pointer; }
.check input { width: 20px; height: 20px; margin: 2px 0 0; flex: none; accent-color: var(--accent); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.actions .btn.primary { flex: 1 1 200px; }
.err-line { margin: 12px 0 0; color: var(--err); font-size: 13.5px; }
.err-line[hidden] { display: none; }
footer { display: flex; justify-content: flex-end; margin-top: 14px; }
.lang { font: inherit; font-size: 12.5px; padding: 4px 10px; border-radius: 7px; cursor: pointer;
  border: 1px solid var(--line); background: none; color: var(--muted); }
.lang:hover { color: var(--accent); border-color: var(--accent); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="brand"><i><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><path d="M7.5 13h2M11 13h2M14.5 13h2M7.5 16.5h2M11 16.5h2"/></svg></i><span>TrailRunCoach</span></div>

  <section class="card" id="lg-signin">
    <h1 data-i18n="login.h1">登入</h1>
    <p data-i18n="login.lead">越野跑、百岳、路跑的訓練教練。用 Google 帳號登入；第一次登入會先請你看過條款。</p>
    <div class="msg" id="lg-msg" role="status" hidden></div>
    <a class="btn wide" id="lg-google" href="/api/v1/account/login">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.6 12.3c0-.8-.1-1.5-.2-2.3H12v4.3h5.9a5 5 0 0 1-2.2 3.3v2.8h3.6c2.1-1.9 3.3-4.8 3.3-8.1z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.6-2.8c-1 .7-2.2 1.1-3.7 1.1-2.9 0-5.3-1.9-6.2-4.5H2.1v2.9A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.8 14.1a6.6 6.6 0 0 1 0-4.2V7H2.1a11 11 0 0 0 0 9.9l3.7-2.8z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.2-3.2A11 11 0 0 0 2.1 7l3.7 2.9C6.7 7.3 9.1 5.4 12 5.4z"/></svg>
      <span data-i18n="login.google">用 Google 帳號登入</span>
    </a>
    <p class="note" data-i18n="login.note">我們只讀取你的 Google 帳號識別碼、名稱與 email，不會讀取其他 Google 資料。</p>
  </section>

  <section class="card" id="lg-signup" hidden>
    <h1 id="lg-su-h" data-i18n="login.signup.h">建立帳號</h1>
    <p id="lg-su-who"></p>
    <div class="draft" id="lg-draft" role="note" data-i18n="login.draft" hidden>以下文件還是草稿；正式版本定稿後，會請你重新閱讀並同意。</div>
    <div class="docs" id="lg-docs"></div>
    <label class="check"><input type="checkbox" id="lg-agree"><span data-i18n="login.agree">我已閱讀並同意服務條款、隱私權政策（含去識別化後的跨使用者分析）、健康風險聲明與第三方串接免責。</span></label>
    <div class="actions">
      <button type="button" class="btn primary" id="lg-accept" disabled data-i18n="login.signup.accept">同意並建立帳號</button>
      <a class="btn" href="/login" id="lg-cancel" data-i18n="login.cancel">取消</a>
    </div>
    <p class="err-line" id="lg-su-err" role="alert" hidden></p>
  </section>

  <footer><button type="button" class="lang" id="lg-lang"></button></footer>
</main>
<script>
(() => {
  const T = (k, p) => (window.I18N ? window.I18N.t("login." + k, p) : k);
  const $ = (id) => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const KNOWN = ["expired", "failed", "cancelled", "unverified", "disabled", "full", "rate_limited", "setup"];

  // the language switch (the shell's job on the other pages)
  const L = window.I18N;
  const other = L && L.locale === "en" ? "zh-TW" : "en";
  const lang = $("lg-lang");
  if (L) {
    lang.textContent = L.t("shell.lang." + other);
    lang.lang = other;
    lang.addEventListener("click", () => L.setLocale(other));
  } else lang.hidden = true;

  // ---- sign in ----
  const next = q.get("next");
  if (next) $("lg-google").href = "/api/v1/account/login?" + new URLSearchParams({ next });
  const msg = $("lg-msg");
  const err = q.get("error");
  if (err && KNOWN.includes(err)) {
    msg.textContent = T("error." + err);
    msg.className = "msg " + (err === "full" || err === "setup" ? "info" : "err");
    msg.hidden = false;
  } else if (q.has("signed_out")) {
    msg.textContent = T("signed_out");
    msg.className = "msg info";
    msg.hidden = false;
  }
  if (location.pathname !== "/signup") return;

  // ---- the terms (first sign-in, or new terms) ----
  $("lg-signin").hidden = true;
  $("lg-signup").hidden = false;
  const csrf = async () => {
    const r = await fetch("/api/v1/session", { cache: "no-store", credentials: "same-origin" });
    return ((await r.json()) || {}).csrf || "";
  };
  (async () => {
    let info = null;
    try {
      const r = await fetch("/api/v1/account/signup", { cache: "no-store", credentials: "same-origin" });
      if (r.ok) info = await r.json();
    } catch (_) { info = null; }
    if (!info || !info.terms) { location.replace("/login?error=expired"); return; }
    const again = info.kind === "reconsent";
    $("lg-su-h").textContent = T(again ? "reconsent.h" : "signup.h");
    const who = [info.name, info.email].filter(Boolean).join(" · ");
    $("lg-su-who").textContent = T(again ? "reconsent.lead" : "signup.lead", { who });
    const btn = $("lg-accept"), agree = $("lg-agree");
    btn.textContent = T(again ? "reconsent.accept" : "signup.accept");
    $("lg-draft").hidden = !info.terms.draft;
    const docs = $("lg-docs");
    docs.textContent = "";
    for (const d of info.terms.documents || []) {
      const det = document.createElement("details");
      const sum = document.createElement("summary");
      sum.textContent = d.title;
      const body = document.createElement("div");
      body.className = "doc";
      body.textContent = d.body;
      det.append(sum, body);
      docs.append(det);
    }
    agree.addEventListener("change", () => { btn.disabled = !agree.checked; });
    if (again) {
      // new terms: 取消 signs out (a signed-in user would otherwise be sent back here at once)
      $("lg-cancel").addEventListener("click", async (e) => {
        e.preventDefault();
        try {
          await fetch("/api/v1/account/logout", { method: "POST", credentials: "same-origin",
            headers: { "X-TRC-CSRF": await csrf() } });
        } catch (_) {}
        location.replace("/login?signed_out=1");
      });
    }
    const fail = (text) => { const e = $("lg-su-err"); e.textContent = text || T("signup.error"); e.hidden = false; };
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      $("lg-su-err").hidden = true;
      try {
        const r = await fetch("/api/v1/account/signup", {
          method: "POST", credentials: "same-origin",
          headers: { "Content-Type": "application/json", "X-TRC-CSRF": await csrf() },
          body: JSON.stringify({ accept: agree.checked, version: info.terms.version, digest: info.terms.digest,
            next: q.get("next") || null }),
        });
        const j = await r.json().catch(() => ({}));
        if (r.ok && j.next) { location.replace(j.next); return; }
        if (r.status === 404) { location.replace("/login?error=expired"); return; }
        if (r.status === 409) { location.reload(); return; }          // the terms changed meanwhile: show the new ones
        fail(j.detail && j.detail.message);
      } catch (_) { fail(); }
      btn.disabled = !agree.checked;
    });
  })();
})();
</script>
</body>
</html>
