<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="routes.title">路線</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.6.0/echarts.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/api/v1/static/basemaps.js"></script>
<style>
:root {
  --bg: #f4f5f7; --panel: #fff; --text: #1d232b; --muted: #6a7482; --line: #e1e5ea;
  --accent: #2563eb; --soft: #e8efff; --a: #2563eb; --b: #d9480f; --up: #b45309; --down: #0f766e; --flat: #64748b;
  --ok: #15803d; --warn: #b45309;
  /* temperature: diverging blue <-> gray <-> red (dataviz reference ramps) */
  --cold: #256abf; --mild: #9a9994; --hot: #e34948; --star: #e0a400;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --panel: #171b21; --text: #e6e9ee; --muted: #97a1ae; --line: #2a313a;
    --accent: #60a5fa; --soft: #1c2a40; --a: #60a5fa; --b: #fb923c; --up: #f59e0b; --down: #2dd4bf; --flat: #94a3b8;
    --ok: #4ade80; --warn: #fbbf24; --cold: #5598e7; --mild: #8a8984; --hot: #e66767; --star: #facc15;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --panel: #171b21; --text: #e6e9ee; --muted: #97a1ae; --line: #2a313a;
  --accent: #60a5fa; --soft: #1c2a40; --a: #60a5fa; --b: #fb923c; --up: #f59e0b; --down: #2dd4bf; --flat: #94a3b8;
  --ok: #4ade80; --warn: #fbbf24; --cold: #5598e7; --mild: #8a8984; --hot: #e66767; --star: #facc15;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif; }
header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px;
  display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
h1 { font-size: 17px; margin: 0; }
.meta { color: var(--muted); font-size: 12px; }
button, select, input { font: inherit; color: var(--text); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; }
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
a.btnlink { color: var(--accent); text-decoration: none; border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; }
a.btnlink:hover { border-color: var(--accent); }
.prog { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.prog[hidden] { display: none; }
.prog .bar { width: 120px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.prog .bar i { display: block; height: 100%; background: var(--accent); }
.wrap { display: grid; grid-template-columns: minmax(340px, 440px) 1fr; gap: 14px; padding: 14px 16px;
  max-width: 1500px; margin: 0 auto; align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.filters { display: flex; flex-wrap: wrap; gap: 6px 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 3px 9px; font-size: 13px; background: transparent; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--soft); color: var(--accent); font-weight: 600; }
.list { max-height: calc(100vh - var(--shell-top, 53px) - 150px); overflow-y: auto; }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 2px 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.row:hover { background: var(--soft); }
.row.on { background: var(--soft); box-shadow: inset 3px 0 0 var(--accent); }
.row.d1 { padding-left: 30px; }
.row.d2 { padding-left: 46px; }
.row .nm { grid-column: 2; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.row .sub { grid-column: 2; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.row .star { grid-row: 1 / span 2; grid-column: 4; align-self: center; }
.row .sp { grid-row: 1 / span 2; grid-column: 3; align-self: center; }
/* the path's shape: north up, true aspect (server-side projection, route_match.thumbnail) */
.row .th { grid-row: 1 / span 2; grid-column: 1; align-self: center; display: block;
  background: color-mix(in srgb, var(--accent) 6%, var(--panel)); border: 1px solid var(--line); border-radius: 5px; }
.row .th path { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
.row .th .s { fill: var(--ok); }
.rel { font-size: 12px; color: var(--muted); }
.rel a { color: var(--accent); text-decoration: none; cursor: pointer; }
.rel a:hover { text-decoration: underline; }
.dirtag { font-size: 11px; padding: 0 5px; border-radius: 8px; background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); margin-left: 4px; }
.kb { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 9px; margin-right: 5px; vertical-align: 1px; font-weight: 500; }
.kb.up { background: color-mix(in srgb, var(--up) 16%, transparent); color: var(--up); }
.kb.down { background: color-mix(in srgb, var(--down) 16%, transparent); color: var(--down); }
.kb.flat { background: color-mix(in srgb, var(--flat) 16%, transparent); color: var(--flat); }
.kb.route { background: var(--soft); color: var(--accent); }
.empty { padding: 30px 16px; text-align: center; color: var(--muted); }
.detail { display: grid; gap: 14px; min-width: 0; }
.dh { padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; }
.dh h2 { font-size: 18px; margin: 0; cursor: text; border-bottom: 1px dashed transparent; }
.dh h2:hover { border-bottom-color: var(--muted); }
.stats { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); }
.stats b { color: var(--text); font-variant-numeric: tabular-nums; }
.back { display: none; }
#map { height: 340px; border-radius: 8px; }
.card { padding: 10px 12px; }
.card h3 { font-size: 14px; margin: 0 0 6px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.card h3 .meta { font-weight: 400; }
.chart { height: 260px; width: 100%; }
.chart.tall { height: 360px; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
th { color: var(--muted); font-weight: 600; font-size: 12px; position: sticky; top: 0; background: var(--panel); }
th:first-child, td:first-child, th.l, td.l { text-align: left; }
tr.best td { color: var(--ok); }
td.pick { text-align: center; }
td.pick label { display: inline-flex; gap: 2px; margin: 0 2px; font-size: 11px; color: var(--muted); cursor: pointer; }
td.pick input { margin: 0; accent-color: var(--accent); }
.a-dot, .b-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; vertical-align: 0; margin-right: 4px; }
.a-dot { background: var(--a); } .b-dot { background: var(--b); }
a.act { color: var(--accent); text-decoration: none; }
a.act:hover { text-decoration: underline; }
.hint { font-size: 12px; color: var(--muted); }
.cmpbar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 13px; }
.cmpbar b { font-variant-numeric: tabular-nums; }
.note { font-size: 12px; color: var(--muted); margin-top: 6px; }
.hotdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--hot); margin-right: 4px; vertical-align: 0; }
td.sec { color: var(--muted); }
.tog { font-size: 12px; padding: 2px 8px; }
.tog.on { background: var(--soft); color: var(--accent); border-color: var(--accent); }
/* SP-626: stars (yellow when on), section headers, inline rename, a route's segments */
button.star { border: 0; background: none; padding: 2px 4px; font-size: 18px; line-height: 1; color: var(--muted); }
button.star[aria-pressed="true"] { color: var(--star); }
button.star:hover { color: var(--star); }
.sect { padding: 7px 12px 4px; font-size: 12px; font-weight: 600; color: var(--muted); background: color-mix(in srgb, var(--line) 35%, var(--panel));
  border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 1; }
.seg button.favf.on { color: var(--star); background: color-mix(in srgb, var(--star) 14%, transparent); }
.dh .ttl { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; min-width: 0; max-width: 100%; }
.dh h2 { overflow-wrap: anywhere; }
button.pen { border: 0; background: none; padding: 2px 5px; color: var(--muted); }
button.pen:hover { color: var(--accent); }
button.pen svg { width: 16px; height: 16px; vertical-align: -2px; }
.rn { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.rn input { min-width: 0; width: min(22em, 70vw); font-size: 16px; }
tr.go { cursor: pointer; }
tr.go:hover td { background: var(--soft); }
td.nmc { max-width: 22em; overflow: hidden; text-overflow: ellipsis; }
#segtab td:first-child { padding: 2px 0 2px 4px; }
@media (max-width: 900px) {
  .wrap { grid-template-columns: 1fr; padding: 10px; }
  .list { max-height: none; }
  body.has-detail .listpanel { display: none; }
  body:not(.has-detail) .detail { display: none; }
  .back { display: inline-block; }
  #map { height: 260px; }
  .chart { height: 220px; }
  .chart.tall { height: 300px; }
}
@media (max-width: 600px) {
  .row .sp { display: none; }
  .row { grid-template-columns: auto minmax(0, 1fr) auto; padding: 8px 10px; }
  .row .star { grid-column: 3; }
  .row .wide { display: none; }
  header #builtinfo { display: none; }
}
</style>
</head>
<body>
<script src="/api/v1/static/shell.js" data-page="routes"></script>
<header>
  <h1 data-i18n="routes.h1">路線進步</h1>
  <span class="meta" id="builtinfo"></span>
  <span class="prog" id="prog" hidden><span id="progtxt"></span><span class="bar"><i id="progbar" style="width:0"></i></span></span>
  <span style="flex:1"></span>
  <a class="btnlink" href="/api/v1/app/activity-compare/page" data-i18n-attr="title:routes.cmp_two_tip" title="任選兩次活動比較（不同賽道也可以）" data-i18n="routes.cmp_two">比較兩次活動</a>
  <button id="rebuild" data-i18n-attr="title:routes.rebuild_tip" title="讀取新活動，找新的重複路段（已有的名稱與編號保留）" data-i18n="routes.rebuild">更新</button>
</header>
<div class="wrap">
  <section class="panel listpanel">
    <div class="filters">
      <div class="seg" id="f-kind"><button data-v="" class="on" data-i18n="routes.f.all">全部</button><button data-v="route" data-i18n="routes.f.route">路線</button><button data-v="segment" data-i18n="routes.f.segment">路段</button></div>
      <div class="seg" id="f-dir"><button data-v="" class="on" data-i18n="routes.f.all">全部</button><button data-v="up" data-i18n="routes.dir.up">上坡</button><button data-v="down" data-i18n="routes.dir.down">下坡</button><button data-v="flat" data-i18n="routes.dir.flat">平路</button></div>
      <div class="seg"><button id="f-fav" class="favf" aria-pressed="false" data-i18n="routes.f.fav">★ 最愛</button></div>
      <select id="f-sport" data-i18n-attr="aria-label:routes.f.sport" aria-label="運動"><option value="" data-i18n="routes.f.all_sports">所有運動</option></select>
    </div>
    <div class="meta" id="count" style="padding:6px 12px 0"></div>
    <div class="list" id="list"><div class="empty" data-i18n="routes.loading">載入中…</div></div>
  </section>
  <section class="detail" id="detail">
    <div class="panel empty" id="pick" data-i18n="routes.pick">從左邊選一個路段或路線</div>
  </section>
</div>
<script>
const API = "/api/v1/routes";
const T = (k, p) => I18N.t("routes." + k, p);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const S = { kind: "", dir: "", sport: "", fav: false, colorTemp: true, rows: [], cur: null, detail: null, a: null, b: null, charts: [], map: null, polled: false, preset: null };
const PEN = `<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-4-4L4 16v4z"/><path d="m13.5 6.5 4 4"/></svg>`;

function hms(s) {
  if (s == null) return "—";
  s = Math.round(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(x).padStart(2, "0")}` : `${m}:${String(x).padStart(2, "0")}`;
}
function dhms(s) { return s == null ? "—" : s === 0 ? T("best") : `+${hms(s)}`; }
function pace(v) { if (v == null || !isFinite(v)) return "—"; const m = Math.floor(v), s = Math.round((v - m) * 60); return `${m}:${String(s === 60 ? 59 : s).padStart(2, "0")}`; }
function km(m) { return m == null ? "—" : (m / 1000).toFixed(m < 10000 ? 2 : 1) + " km"; }
function num(v, d = 0) { return v == null ? "—" : (+v).toFixed(d); }
function day(iso) { return iso ? iso.slice(0, 10) : "—"; }
function kindKey(r) { return r.kind === "route" ? "route" : r.direction === "up" ? "up" : r.direction === "down" ? "down" : "flat"; }
function dirLabel(r) { return r.kind === "route" ? T("kind.route") : T("dir." + kindKey(r)); }
function badge(r) { const c = r.kind === "route" ? "route" : r.direction; return `<span class="kb ${c}">${esc(dirLabel(r))}</span>`; }
function gainTxt(r) { if (r.kind === "route") return r.gain_m ? `↑${Math.round(r.gain_m)} m` : ""; return r.gain_m >= 0 ? `↑${Math.round(r.gain_m)} m` : `↓${Math.round(-r.gain_m)} m`; }
// an automatic name is written in Chinese on the server (engine/routes.py auto_name): its kind word is
// translated here; a peak name (the user's map data) and the user's own names stay as they are
const AUTO_WORDS = { "爬坡": "climb", "下坡": "descent", "路段": "stretch", "路線": "route" };
function nameOf(r) {
  if (r.renamed || I18N.locale === "zh-TW") return r.name;
  return String(r.name).replace(/(^|\s)(爬坡|下坡|路段|路線)(?=\s)/, (m, sp, w) => sp + T("kind." + AUTO_WORDS[w]));
}
function star(r, cls = "") {
  return `<button type="button" class="star ${cls}" data-star="${esc(r.id)}" aria-pressed="${!!r.fav}" title="${esc(T(r.fav ? "fav.off" : "fav.on"))}"` +
    ` aria-label="${esc(T(r.fav ? "fav.off_label" : "fav.on_label", { name: nameOf(r) }))}">${r.fav ? "★" : "☆"}</button>`;
}
async function j(url, opt) {
  const r = await fetch(url, opt);
  if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return r.json();
}
const errMsg = (e) => { try { const d = JSON.parse(e.message.replace(/^\d+ /, "")).detail; return typeof d === "string" ? d : d?.message || e.message; } catch { return e.message; } };

// ---- sparkline: last efforts' times, lower is better (drawn inverted so up = faster)
function spark(pts) {
  const v = pts.map((p) => p[1]).filter((x) => x != null);
  if (v.length < 2) return `<span class="sp"></span>`;
  const w = 84, h = 26, lo = Math.min(...v), hi = Math.max(...v), span = hi - lo || 1;
  const xs = v.map((_, i) => (i / (v.length - 1)) * (w - 4) + 2);
  const ys = v.map((x) => 2 + ((x - lo) / span) * (h - 4));    // faster = higher
  const d = xs.map((x, i) => `${i ? "L" : "M"}${x.toFixed(1)},${ys[i].toFixed(1)}`).join("");
  const best = v.indexOf(lo);
  return `<svg class="sp" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-label="${esc(T("spark_aria", { n: v.length }))}">
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.5"/>
    <circle cx="${xs[best]}" cy="${ys[best]}" r="2.4" fill="var(--ok)"/>
    <circle cx="${xs[xs.length - 1]}" cy="${ys[ys.length - 1]}" r="2.4" fill="var(--accent)"/></svg>`;
}

// ---- the path's shape, drawn from the server's projected path (north up, true aspect)
function thumb(t) {
  if (!t) return `<svg class="th" width="64" height="40" aria-hidden="true"></svg>`;
  return `<svg class="th" width="${t.w}" height="${t.h}" viewBox="0 0 ${t.w} ${t.h}" role="img" aria-label="${esc(T("thumb_aria"))}">
    <path d="${t.d}"/><circle class="s" cx="${t.start[0]}" cy="${t.start[1]}" r="2.2"/></svg>`;
}

// ---- status / list
function showStatus(st, built) {
  $("builtinfo").textContent = built ? T("built", { at: built.replace("T", " ").slice(0, 16) }) : "";
  const busy = st && st.state === "building";
  $("prog").hidden = !busy;
  $("rebuild").disabled = busy;
  if (busy) {
    $("progtxt").textContent = `${st.phase || T("working")} ${st.total ? `${st.done}/${st.total}` : ""}`;
    $("progbar").style.width = st.total ? `${(100 * st.done / st.total).toFixed(1)}%` : "5%";
  }
  if (st && st.state === "error") $("builtinfo").textContent = T("build_failed", { msg: st.error });
  if (busy && !S.polled) {
    S.polled = true;
    setTimeout(async () => { S.polled = false; await loadList(true); }, 2500);
  }
}

async function loadList(keepDetail) {
  const q = new URLSearchParams();
  if (S.kind) q.set("kind", S.kind);
  if (S.dir) q.set("direction", S.dir);
  if (S.sport) q.set("sport", S.sport);
  if (S.fav) q.set("fav", "1");
  let res;
  try { res = await j(`${API}?${q}`); } catch (e) { $("list").innerHTML = `<div class="empty">${esc(T("load_failed", { msg: e.message }))}</div>`; return; }
  const wasBusy = S.busy;
  S.busy = res.status?.state === "building";
  showStatus(res.status, res.built_at);
  const sel = $("f-sport");
  if (sel.options.length <= 1 && res.sports?.length) sel.insertAdjacentHTML("beforeend", res.sports.map((s) => `<option>${esc(s)}</option>`).join(""));
  S.rows = res.rows;
  const c = res.counts || {};
  $("count").textContent = res.built_at ? T("count", { n: res.total, climb: c.climb || 0, descent: c.descent || 0, stretch: c.stretch || 0, route: c.route || 0 }) +
    (c.sub_route ? T("count_sub", { n: c.sub_route }) : "") : "";
  if (!res.rows.length) {
    $("list").innerHTML = `<div class="empty">${esc(res.built_at ? T(S.fav ? "empty_fav" : "empty") : T("first_build"))}</div>`;
  } else {
    const nameById = Object.fromEntries(res.rows.map((r) => [r.id, nameOf(r)]));
    let sect = null;
    $("list").innerHTML = res.rows.map((r) => {
      const head = r.section && r.section !== sect ? `<div class="sect">${esc(T("sect." + r.section))}</div>` : "";
      sect = r.section;
      const rel = r.parent && !r.depth && nameById[r.parent] ? ` · ⊂ ${esc(nameById[r.parent])}` : "";
      return `${head}<div class="row ${r.id === S.cur ? "on" : ""} ${r.depth ? `d${Math.min(2, r.depth)}` : ""}" data-id="${esc(r.id)}">
      ${thumb(r.thumb)}
      <div class="nm">${r.depth ? "⊂ " : ""}${badge(r)}${esc(nameOf(r))}</div>
      ${spark(r.spark)}
      ${star(r)}
      <div class="sub">${km(r.length_m)} ${gainTxt(r)} · ${esc(T("n_times", { n: r.n_efforts }))} · ${esc(T("best_short"))} ${hms(r.best_s)}<span class="wide"> · ${esc(T("last_short"))} ${hms(r.last_s)}（${day(r.last_date)}）${r.n_reversed ? ` · ${esc(T("n_reversed", { n: r.n_reversed }))}` : ""}${rel}${r.n_partials ? ` · ${esc(T("n_partials", { n: r.n_partials }))}` : ""}${r.on_routes?.length && S.kind ? ` · ${esc(T("on_n_routes", { n: r.on_routes.length }))}` : ""}${r.n_segments ? ` · ${esc(T("n_segments", { n: r.n_segments }))}` : ""}</span></div>
    </div>`;
    }).join("");
    $("list").querySelectorAll(".row").forEach((el) => el.onclick = (ev) => { if (!ev.target.closest("button.star")) openDetail(el.dataset.id, true); });
  }
  if (wasBusy && !S.busy && S.cur && keepDetail) openDetail(S.cur, false);
}

// ★: stored on the server (favorites.json), so every device sees it
async function toggleFav(id, on) {
  try {
    await j(`${API}/${encodeURIComponent(id)}/favorite`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ on }) });
  } catch (e) { alert(T("fav.failed", { msg: errMsg(e) })); return; }
  if (S.detail) {
    if (S.detail.id === id) S.detail.fav = on;
    for (const x of S.detail.segments || []) if (x.id === id) x.fav = on;
    for (const b of document.querySelectorAll(`#detail button.star[data-star="${CSS.escape(id)}"]`)) {
      b.setAttribute("aria-pressed", String(on)); b.textContent = on ? "★" : "☆";
      b.title = T(on ? "fav.off" : "fav.on");
    }
  }
  loadList();
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("button.star[data-star]");

});

function loadPrefs() {

// ---- detail
function disposeCharts() { S.charts.splice(0).forEach((c) => c.dispose()); if (S.map) { S.map.remove(); S.map = null; } }

async function openDetail(id, push) {
  S.cur = id;
  document.querySelectorAll(".row").forEach((x) => x.classList.toggle("on", x.dataset.id === id));
  if (push) history.pushState({ id }, "", `#${id}`);
  document.body.classList.add("has-detail");
  let d;
  try { d = await j(`${API}/${encodeURIComponent(id)}`); } catch (e) { $("detail").innerHTML = `<div class="panel empty">${esc(T("not_found"))}</div>`; return; }
  S.detail = d;
  if (d.id !== id) {          // an old id, merged into this one
    S.cur = d.id;
    history.replaceState({ id: d.id }, "", `#${d.id}`);
    document.querySelectorAll(".row").forEach((x) => x.classList.toggle("on", x.dataset.id === d.id));
  }
  S.showAll = false;
  document.querySelector(`.row[data-id="${CSS.escape(d.id)}"]`)?.scrollIntoView({ block: "nearest" });
  // default comparison: the best effort vs the latest one, both the main direction
  const main = d.efforts.filter((e) => (e.dir || "same") === "same");
  const timed = main.filter((e) => e[d.time_key] != null);
  const byTime = [...timed].sort((x, y) => x[d.time_key] - y[d.time_key]);
  S.a = byTime[0]?.id || null;
  S.b = (main[main.length - 1]?.id !== S.a ? main[main.length - 1]?.id : byTime[1]?.id) || null;
  // opened from a route's segment table: that run's effort is B
  const pre = S.preset; S.preset = null;
  if (pre && d.efforts.some((e) => e.id === pre.b)) { S.b = pre.b; if (S.a === S.b) S.a = byTime.find((e) => e.id !== S.b)?.id || null; }
  renderDetail();
}

  ${d.kind === "route" ? `<div class="panel card" id="segcard"><h3>${esc(T("segs.h"))} <span class="meta" id="segsub"></span></h3><div class="tablewrap"><table id="segtab"></table></div></div>` : ""}
  <div class="panel card"><h3>${esc(T("trend.h"))} <span class="seg" id="tmode"><button data-v="time" class="on">${esc(timeName)}</button>${up ? '<button data-v="vam">VAM</button>' : ""}${d.kind === "route" ? "" : `<button data-v="pace">${esc(T("pace"))}</button>`}</span>

    <span class="meta">${esc(T(up ? "trend.sub_up" : "trend.sub"))}</span></h3>

  $("pen").onclick = startRename;

// SP-626: the segments on this route, in order along it — 這次 = run B's time on each, its rank there
// among all efforts on that segment, and the segment's best; a row opens the segment with B = that run
function drawSegs() {
  const d = S.detail;
  if (d.kind !== "route" || !$("segtab")) return;
  const segs = d.segments || [];
  if (!segs.length) { $("segcard").querySelector(".tablewrap").innerHTML = `<div class="note">${esc(T("segs.none"))}</div>`; return; }
  const b = d.efforts.find((e) => e.id === S.b);
  $("segsub").textContent = b ? T("segs.sub", { date: day(b.start) }) : "";
  $("segtab").innerHTML = `<thead><tr><th></th><th class="l">${esc(T("segs.name"))}</th><th>${esc(T("segs.len"))}</th><th>${esc(T("segs.this"))}</th><th>${esc(T("segs.rank"))}</th><th>${esc(T("segs.best"))}</th><th>${esc(T("segs.delta"))}</th></tr></thead><tbody>` +
    segs.map((s) => {
      const mine = b ? s.by_file[b.file] : null;
      const delta = mine && s.best_s != null ? mine.time_s - s.best_s : null;
      return `<tr class="go ${mine?.rank === 1 ? "best" : ""}" data-seg="${esc(s.id)}" data-eff="${esc(mine?.effort || "")}" title="${esc(T("segs.open"))}">
        <td>${star(s)}</td><td class="l nmc">${badge(s)}${esc(nameOf(s))}</td><td>${km(s.length_m)}</td>
        <td>${mine ? hms(mine.time_s) : "—"}</td><td>${mine?.rank ? `${mine.rank} / ${s.n_timed}` : "—"}</td>
        <td>${hms(s.best_s)}</td><td>${dhms(delta)}</td></tr>`;
    }).join("") + "</tbody>";
  $("segtab").querySelectorAll("tr.go").forEach((tr) => tr.onclick = (ev) => {
    if (ev.target.closest("button.star")) return;
    S.preset = tr.dataset.eff ? { b: tr.dataset.eff } : null;
    openDetail(tr.dataset.seg, true);
  });
}

// parent route, sub-routes, runs that covered only a part, merged pieces, the routes a segment lies on
function relations(d) {
  const link = (r) => `<a data-go="${esc(r.id)}">${esc(nameOf(r))}</a>（${km(r.length_m)}，${esc(T("n_times", { n: r.n_efforts }))}）`;
  const out = [];
  if (d.parent) out.push(T("rel.parent", { x: "\u0000" }).split("\u0000").map(esc).join(link(d.parent)));
  if (d.sub_routes?.length) out.push(esc(T("rel.subs")) + d.sub_routes.map(link).join("、"));
  if (d.on_routes?.length) out.push(esc(T("rel.on_routes")) + d.on_routes.map(link).join("、"));
  if (d.partials?.length) out.push(esc(T("rel.partials", { n: d.partials.length })) + d.partials.map((p) =>
    p.workout != null ? `<a data-w="${p.workout}">${day(p.start)}</a>` : day(p.start)).join("、"));
  if (d.n_reversed) out.push(esc(T("rel.reversed", { n: d.n_reversed })));
  if (d.derived && d.merged_from?.length) out.push(esc(T("rel.merged", { n: d.merged_from.length })));
  return out.length ? `<div class="rel" style="flex-basis:100%">${out.join(" · ")}</div>` : "";
}

async function drawMap() {
  const d = S.detail;
  const map = S.map = L.map("map", { zoomControl: true });
  MapLayers.attach(map, await MapLayers.defaults(), "routes.map");
  const ll = d.lat.map((a, i) => [a, d.lon[i]]);
  MapLayers.track(L.layerGroup().addTo(map), ll, { color: css("--accent") || "#2563eb" });
  S.hoverA = L.circleMarker(ll[0], { radius: 7, color: "#fff", weight: 2, fillColor: css("--a"), fillOpacity: 1 });
  S.hoverB = L.circleMarker(ll[0], { radius: 5, color: "#fff", weight: 2, fillColor: css("--b"), fillOpacity: 1 });
  map.fitBounds(L.latLngBounds(ll), { padding: [18, 18] });
}

function baseChart(el) {
  const c = echarts.init(el);
  S.charts.push(c);
  return c;
}
function axisStyle() {
  return { axisLine: { lineStyle: { color: css("--line") } }, axisLabel: { color: css("--muted") },
    splitLine: { lineStyle: { color: css("--line") } }, nameTextStyle: { color: css("--muted") } };
}

function drawTrend(mode) {
  const d = S.detail, up = d.direction === "up";
  const el = $("trend");
  echarts.getInstanceByDom(el)?.dispose();
  const c = baseChart(el);
  const byTemp = S.colorTemp && d.efforts.some((e) => e.wx);
  const pts = d.efforts.map((e) => {
    const y = mode === "vam" ? e.vam : mode === "pace" ? e.pace_min_km : e[d.time_key];
    const p = { value: [e.start.slice(0, 10), y, e.wx ? e.wx.temp_c : null], e };
    if (byTemp) {
      // no weather: hollow gray; hot (Hadley > 150): a ring in ink around the fill
      p.itemStyle = !e.wx ? { color: css("--panel"), borderColor: css("--mild"), borderWidth: 1.5 }
        : e.wx.hot ? { borderColor: css("--text"), borderWidth: 2 } : { borderColor: css("--panel"), borderWidth: 1 };
      if (e.wx?.hot) p.symbolSize = 11;
    }
    return p;
  }).filter((p) => p.value[1] != null);
  // diverging around 18 °C (comfortable running): blue colder, red warmer, symmetric arms
  const temps = pts.map((p) => p.value[2]).filter((v) => v != null);
  const arm = temps.length ? Math.max(6, ...temps.map((v) => Math.abs(v - 18))) : 10;
  const visualMap = byTemp ? [{ type: "continuous", seriesIndex: 0, dimension: 2, min: Math.floor(18 - arm), max: Math.ceil(18 + arm),
    inRange: { color: [css("--cold"), css("--mild"), css("--hot")] }, outOfRange: { color: css("--mild") },
    orient: "horizontal", right: 16, top: 0, itemWidth: 10, itemHeight: 120, calculable: false, precision: 0,
    text: ["°C", ""], textStyle: { color: css("--muted"), fontSize: 11 } }] : undefined;
  const eff = d.efforts.map((e) => ({ value: [e.start.slice(0, 10), up ? e.hr_vam : e.avg_hr], e })).filter((p) => p.value[1] != null);
  const fmtY = mode === "vam" ? (v) => Math.round(v) : mode === "pace" ? pace : hms;
  const ax = axisStyle();
  c.setOption({
    animation: false, textStyle: { color: css("--text") },
    grid: [{ left: 58, right: 16, top: byTemp ? 30 : 16, height: byTemp ? "42%" : "46%" }, { left: 58, right: 16, top: "66%", bottom: 28 }],
    visualMap,
    tooltip: { trigger: "item", formatter: (p) => {
      const e = p.data.e;
      return `${e.start.slice(0, 16).replace("T", " ")} ${esc(e.sport_type || "")}<br>${esc(T(d.time_key === "elapsed_s" ? "t.elapsed_short" : "t.moving_short"))} ${hms(e[d.time_key])}（${esc(T("rank_n", { n: e.rank ?? "—" }))}）` +
        (e.vam != null ? `<br>VAM ${Math.round(e.vam)} m/h` : "") + (e.avg_hr != null ? `<br>${esc(T("hr"))} ${num(e.avg_hr)} bpm` : "") +
        (e.max_hr != null ? `（${esc(T("max"))} ${num(e.max_hr)}）` : "") +
        (e.hr_vam != null ? ` · HR÷VAM ${num(e.hr_vam, 0)}` : "") +
        (e.wx ? `<br>${esc(T("wx_tip", { t: num(e.wx.temp_c, 1), dew: num(e.wx.dew_c, 1), rh: num(e.wx.rh_pct), h: num(e.wx.hadley) }))}${e.wx.hot ? esc(T("wx_hot", { p: num(e.wx.heat_pct, 1) })) : ""}` : "") +
        (e.phase ? `<br>${esc(e.phase)}` : ""); } },
    xAxis: [{ type: "time", gridIndex: 0, ...ax, axisLabel: { show: false }, splitLine: { show: false } },
      { type: "time", gridIndex: 1, ...ax, splitLine: { show: false } }],
    yAxis: [{ type: "value", gridIndex: 0, scale: true, inverse: mode !== "vam", ...ax, nameLocation: mode !== "vam" ? "start" : "end",
      name: mode === "vam" ? "VAM m/h" : mode === "pace" ? "min/km" : T("time"), axisLabel: { color: css("--muted"), formatter: fmtY } },
      { type: "value", gridIndex: 1, scale: true, ...ax, name: up ? "HR÷VAM" : "bpm" }],
    series: [
      { type: "line", xAxisIndex: 0, yAxisIndex: 0, data: pts, symbolSize: byTemp ? 9 : 7, symbol: byTemp ? "circle" : "emptyCircle",
        lineStyle: { width: 1, opacity: .45, color: byTemp ? css("--mild") : css("--accent") },
        itemStyle: { color: css("--accent") },
        markPoint: pts.length ? { symbol: "circle", symbolSize: 11, itemStyle: { color: css("--ok") }, label: { show: false },
          data: [{ coord: (mode === "vam" ? pts.reduce((a, b) => (b.value[1] > a.value[1] ? b : a)) : pts.reduce((a, b) => (b.value[1] < a.value[1] ? b : a))).value }] } : undefined },
      { type: "line", xAxisIndex: 1, yAxisIndex: 1, data: eff, symbolSize: 6, lineStyle: { width: 1, opacity: .45 }, itemStyle: { color: css("--b") } },
    ],
  });
  c.on("click", (p) => { if (p.data?.e) pickEffort(p.data.e.id); });
}

function lowMov(e) {
  // the moving mask (speed > 1 mph) drops slow, steep climbing: moving-time VAM overstates it
  return e.moving_share != null && e.moving_share < 0.5
    ? ` <span title="${esc(T("lowmov", { p: Math.round(e.moving_share * 100) }))}" style="color:var(--warn);cursor:help">⚠</span>` : "";
}

function pickEffort(id) {
  if (id === S.a || id === S.b) return;
  S.b = id; drawTable(); drawSegs(); loadCompare();
}

function drawTable() {
  const d = S.detail, up = d.direction === "up", down = d.direction === "down", tk = d.time_key;
  const f2i = (e) => e.workout;
  const hasPw = d.efforts.some((e) => e.avg_power != null);
  const hasT = d.efforts.some((e) => e.temp_c != null);
  const hasWx = d.efforts.some((e) => e.wx);
  const hasMax = d.efforts.some((e) => e.max_hr != null);
  const hasP30 = d.efforts.some((e) => e.max_p30 != null);
  const heat = (w) => !w ? "—" : `${w.hot ? `<i class="hotdot" aria-label="${esc(T("hot"))}"></i>` : ""}${num(w.hadley)}`;
  const all = [...d.efforts].reverse();
  // newest 20, plus A / B and the best when older; "顯示全部" lists every one
  const rows = S.showAll ? all : all.filter((e, i) => i < 20 || e.id === S.a || e.id === S.b || e.rank === 1);
  $("more").innerHTML = all.length > rows.length || S.showAll && all.length > 20
    ? `<button id="moreb" style="margin-top:8px">${esc(S.showAll ? T("show_recent") : T("show_all", { n: all.length }))}</button>` : "";
  if ($("moreb")) $("moreb").onclick = () => { S.showAll = !S.showAll; drawTable(); };
  const th = (k, tip) => `<th${tip ? ` title="${esc(T(tip))}"` : ""}>${esc(T(k))}</th>`;
  $("etab").innerHTML = `<thead><tr><th class="l">${esc(T("col.date"))}</th>${th("col.pick")}${th("col.rank")}${th(tk === "elapsed_s" ? "t.elapsed_short" : "t.moving_short")}${th("col.delta")}
    ${tk === "elapsed_s" ? th("t.moving_short") : ""}${th("pace")}${up ? "<th>VAM</th>" : down ? th("col.descent") : ""}${th("hr")}
    ${hasMax ? th("col.max_hr", "col.max_hr_tip") : ""}
    ${up ? `<th title='HR ÷ VAM × 1000'>HR÷VAM</th>${th("col.beats100", "col.beats100_tip")}` : ""}
    ${hasPw ? `${th("power")}${hasP30 ? th("col.p30", "col.p30_tip") : ""}${up ? "<th title='W ÷ VAM × 1000'>W÷VAM</th>" : ""}` : ""}${th("col.load_share", "col.load_share_tip")}
    ${hasWx ? `${th("col.temp", "col.temp_tip")}${th("col.dew")}${th("col.rh")}${th("col.heat", "col.heat_tip")}` : ""}
    ${hasT ? th("col.watch_t", "col.watch_t_tip") : ""}<th class="l">${esc(T("col.phase"))}</th><th class="l">${esc(T("col.sport"))}</th></tr></thead><tbody>` +
    rows.map((e) => `<tr class="${e.rank === 1 ? "best" : ""}">
      <td class="l">${f2i(e) != null ? `<a class="act" href="#" data-w="${f2i(e)}" title="${esc(T("open_act"))}">${e.start.slice(0, 10)}</a>` : e.start.slice(0, 10)}${e.dir && e.dir !== "same" ? `<span class="dirtag" title="${esc(T(e.dir === "reversed" ? "dir_rev_tip" : "dir_mix_tip"))}">${esc(T(e.dir === "reversed" ? "dir_rev" : "dir_mix"))}</span>` : ""}</td>
      <td class="pick"><label><input type="radio" name="pa" value="${e.id}" ${e.id === S.a ? "checked" : ""}>A</label><label><input type="radio" name="pb" value="${e.id}" ${e.id === S.b ? "checked" : ""}>B</label></td>
      <td>${e.rank ?? "—"}</td><td>${hms(e[tk])}</td><td>${dhms(e.delta_best_s)}</td>
      ${tk === "elapsed_s" ? `<td>${hms(e.moving_s)}</td>` : ""}<td>${pace(e.pace_min_km)}</td>
      ${up ? `<td>${num(e.vam)}${lowMov(e)}</td>` : down ? `<td>${num(e.descent_rate)}${lowMov(e)}</td>` : ""}<td>${num(e.avg_hr)}</td>
      ${hasMax ? `<td>${num(e.max_hr)}</td>` : ""}
      ${up ? `<td>${num(e.hr_vam)}</td><td>${num(e.hr_per_100m)}</td>` : ""}
      ${hasPw ? `<td>${num(e.avg_power)}</td>${hasP30 ? `<td>${num(e.max_p30)}</td>` : ""}${up ? `<td>${num(e.power_vam)}</td>` : ""}` : ""}
      <td>${e.hrtss_share != null ? (e.hrtss_share * 100).toFixed(0) + "%" : "—"}</td>
      ${hasWx ? `<td>${e.wx ? num(e.wx.temp_c, 1) + "°" : "—"}</td><td>${e.wx ? num(e.wx.dew_c, 1) + "°" : "—"}</td><td>${e.wx ? num(e.wx.rh_pct) + "%" : "—"}</td>
        <td title="${esc(e.wx ? T("heat_tip", { h: num(e.wx.hadley), p: num(e.wx.heat_pct, 1) }) : T("no_wx"))}">${heat(e.wx)}</td>` : ""}
      ${hasT ? `<td class="sec">${e.temp_c != null ? num(e.temp_c, 1) + "°" : "—"}</td>` : ""}
      <td class="l">${esc(e.phase || "—")}</td><td class="l">${esc(e.sport_type || e.sport || "")}${e.frechet_m != null && e.frechet_m > 60 ? ` <span class="meta" title="${esc(T("frechet_tip"))}">${esc(T("frechet", { m: Math.round(e.frechet_m) }))}</span>` : ""}</td></tr>`).join("") + "</tbody>";
  $("etab").querySelectorAll("input[name=pa]").forEach((i) => i.onchange = () => { S.a = i.value; loadCompare(); });
  $("etab").querySelectorAll("input[name=pb]").forEach((i) => i.onchange = () => { S.b = i.value; drawSegs(); loadCompare(); });
  $("etab").querySelectorAll("a.act").forEach((a) => a.onclick = (ev) => { ev.preventDefault(); openWorkout(+a.dataset.w); });
}

function openWorkout(idx) {
  // the viewer restores its last state from localStorage; point it at this activity
  try {
    const st = JSON.parse(localStorage.getItem("charts") || "{}");
    localStorage.setItem("charts", JSON.stringify({ ...st, mode: "workout", workout: idx, workoutLabel: null }));
  } catch {}
  location.href = "/api/v1/app/viewer";
}

async function loadCompare() {
  const d = S.detail;
  if (!S.a || !S.b || S.a === S.b) { $("cmpbar").innerHTML = `<span class="hint">${esc(T("cmp.pick"))}</span>`; return; }
  const token = S.cmpToken = Math.random();
  let c;
  try { c = await j(`${API}/${encodeURIComponent(d.id)}/compare?a=${S.a}&b=${S.b}`); }
  catch (e) {
    if (token !== S.cmpToken) return;
    S.cmp = null;
    for (const id of ["cmp", "gap"]) echarts.getInstanceByDom($(id))?.dispose();
    $("cmpbar").innerHTML = `<span class="hint">${esc(errMsg(e))}</span>`;
    return;
  }
  if (token !== S.cmpToken) return;
  S.cmp = c;
  const ea = c.a.effort, eb = c.b.effort, tk = d.time_key;
  const fin = c.gap_s.filter((g) => g != null);
  const endGap = fin.length ? fin[fin.length - 1] : null;
  const wxs = (e) => e.wx ? ` <span class="meta">${esc(T("cmp.wx", { t: num(e.wx.temp_c, 1), dew: num(e.wx.dew_c, 1) }))}${e.wx.hot ? " " + esc(T("hot")) : ""}</span>` : "";
  $("cmpbar").innerHTML = `<span><i class="a-dot"></i>A ${ea.start.slice(0, 10)} <b>${hms(ea[tk])}</b>${wxs(ea)}</span>
    <span><i class="b-dot"></i>B ${eb.start.slice(0, 10)} <b>${hms(eb[tk])}</b>${wxs(eb)}</span>
    <span>${esc(T("cmp.end"))} <b>${endGap == null ? "—" : esc(T(endGap > 0 ? "cmp.b_slower" : "cmp.b_faster", { t: hms(Math.abs(endGap)) }))}</b></span>`;
  drawCompare();
}

function drawCompare() {
  const c = S.cmp;
  if (!c) return;
  for (const id of ["cmp", "gap"]) echarts.getInstanceByDom($(id))?.dispose();
  S.charts = S.charts.filter((x) => !x.isDisposed());
  const m = S.cmode, key = { pace: "pace_min_km", hr: "hr", power: "power", elev: "elev" }[m];
  const x = c.x_m.map((v) => v / 1000);
  const ser = (side, color) => ({ type: "line", name: side.toUpperCase(), showSymbol: false, connectNulls: false,
    data: x.map((xv, i) => [xv, c[side][key][i]]), lineStyle: { width: 1.6, color }, itemStyle: { color } });
  const ax = axisStyle();
  const unit = { pace: "min/km", hr: "bpm", power: "W", elev: "m" }[m];
  const fmt = m === "pace" ? pace : (v) => Math.round(v);
  const ch = baseChart($("cmp"));
  ch.setOption({
    animation: false, legend: { top: 0, textStyle: { color: css("--muted") } },
    grid: { left: 52, right: 16, top: 28, bottom: 26 },
    tooltip: { trigger: "axis", valueFormatter: (v) => (v == null ? "—" : fmt(v)) },
    axisPointer: { link: [{ xAxisIndex: "all" }] },
    xAxis: { type: "value", min: 0, max: x[x.length - 1], ...ax, axisLabel: { color: css("--muted"), formatter: (v) => v.toFixed(1) }, name: "km" },
    yAxis: { type: "value", scale: true, inverse: m === "pace", nameLocation: m === "pace" ? "start" : "end", name: unit, ...ax, axisLabel: { color: css("--muted"), formatter: fmt } },
    series: [ser("a", css("--a")), ser("b", css("--b"))],
  });
  const g = baseChart($("gap"));
  g.setOption({
    animation: false, grid: { left: 52, right: 16, top: 22, bottom: 26 },
    title: { text: T("cmp.gap"), textStyle: { fontSize: 12, fontWeight: 400, color: css("--muted") }, left: 50, top: 0 },
    tooltip: { trigger: "axis", valueFormatter: (v) => (v == null ? "—" : `${v > 0 ? "+" : ""}${Math.round(v)} s`) },
    xAxis: { type: "value", min: 0, max: x[x.length - 1], ...ax, axisLabel: { color: css("--muted"), formatter: (v) => v.toFixed(1) } },
    yAxis: { type: "value", ...ax },
    series: [{ type: "line", showSymbol: false, data: x.map((xv, i) => [xv, c.gap_s[i]]), lineStyle: { color: css("--b"), width: 1.6 },
      areaStyle: { color: css("--b"), opacity: .12 }, markLine: { symbol: "none", silent: true, lineStyle: { color: css("--muted") }, data: [{ yAxis: 0 }] } }],
  });
  echarts.connect([ch, g]);
  const hover = (p) => {
    const xv = p?.axesInfo?.[0]?.value ?? p?.value;
    if (xv == null || !S.map) return;
    let k = 0, best = Infinity;
    for (let i = 0; i < x.length; i++) { const dd = Math.abs(x[i] - xv); if (dd < best) { best = dd; k = i; } }
    const pos = [c.lat[k], c.lon[k]];
    S.hoverA.setLatLng(pos).addTo(S.map);
    // where B is when A is here: B's position at A's elapsed time
    const ta = c.a.t_s[k];
    let kb = k;
    if (ta != null) { let bb = Infinity; c.b.t_s.forEach((t, i) => { if (t != null && Math.abs(t - ta) < bb) { bb = Math.abs(t - ta); kb = i; } }); }
    S.hoverB.setLatLng([c.lat[kb], c.lon[kb]]).addTo(S.map);
    S.hoverA.bindTooltip(T("cmp.where", { a: x[k].toFixed(2), b: x[kb].toFixed(2) }), { direction: "top", offset: [0, -6] }).openTooltip();
  };
  ch.on("updateAxisPointer", hover);
  g.on("updateAxisPointer", hover);
  const clear = () => { S.hoverA?.remove(); S.hoverB?.remove(); };
  $("cmp").onmouseleave = clear; $("gap").onmouseleave = clear;
}

// ---- init
bindSeg("f-kind", "kind");
bindSeg("f-dir", "dir");
$("f-fav").onclick = () => { S.fav = !S.fav; favBtn(); savePrefs(); loadList(); };
$("f-sport").onchange = (e) => { S.sport = e.target.value; savePrefs(); loadList(); };
$("rebuild").onclick = async () => { await j(`${API}/rebuild`, { method: "POST" }); loadList(); };
window.addEventListener("popstate", () => {
  const id = location.hash.slice(1);
  if (id) openDetail(id, false); else document.body.classList.remove("has-detail");
});
window.addEventListener("resize", () => S.charts.forEach((c) => c.resize()));
loadPrefs();
loadList().then(() => {
  if (S.sport) $("f-sport").value = S.sport;
  const id = location.hash.slice(1);
  if (id) openDetail(id, false);
  else if (window.matchMedia("(min-width: 901px)").matches && S.rows[0]) openDetail(S.rows[0].id, false);
});
</script>
