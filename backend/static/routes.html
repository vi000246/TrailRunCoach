<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>路線</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.6.0/echarts.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/api/v1/static/basemaps.js"></script>
<style>
:root {
  --bg: #f4f5f7; --panel: #fff; --text: #1d232b; --muted: #6a7482; --line: #e1e5ea;
  --accent: #2563eb; --soft: #e8efff; --a: #2563eb; --b: #d9480f; --up: #b45309; --down: #0f766e; --flat: #64748b;
  --ok: #15803d; --warn: #b45309;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --panel: #171b21; --text: #e6e9ee; --muted: #97a1ae; --line: #2a313a;
    --accent: #60a5fa; --soft: #1c2a40; --a: #60a5fa; --b: #fb923c; --up: #f59e0b; --down: #2dd4bf; --flat: #94a3b8;
    --ok: #4ade80; --warn: #fbbf24;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --panel: #171b21; --text: #e6e9ee; --muted: #97a1ae; --line: #2a313a;
  --accent: #60a5fa; --soft: #1c2a40; --a: #60a5fa; --b: #fb923c; --up: #f59e0b; --down: #2dd4bf; --flat: #94a3b8;
  --ok: #4ade80; --warn: #fbbf24;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif; }
header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px;
  display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
h1 { font-size: 17px; margin: 0; }
.meta { color: var(--muted); font-size: 12px; }
button, select, input { font: inherit; color: var(--text); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; }
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.prog { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.prog[hidden] { display: none; }
.prog .bar { width: 120px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.prog .bar i { display: block; height: 100%; background: var(--accent); }
.wrap { display: grid; grid-template-columns: minmax(340px, 440px) 1fr; gap: 14px; padding: 14px 16px;
  max-width: 1500px; margin: 0 auto; align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.filters { display: flex; flex-wrap: wrap; gap: 6px 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 3px 9px; font-size: 13px; background: transparent; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--soft); color: var(--accent); font-weight: 600; }
.list { max-height: calc(100vh - var(--shell-top, 53px) - 150px); overflow-y: auto; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.row:hover { background: var(--soft); }
.row.on { background: var(--soft); box-shadow: inset 3px 0 0 var(--accent); }
.row .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.row .sp { grid-row: 1 / span 2; grid-column: 2; align-self: center; }
.kb { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 9px; margin-right: 5px; vertical-align: 1px; font-weight: 500; }
.kb.up { background: color-mix(in srgb, var(--up) 16%, transparent); color: var(--up); }
.kb.down { background: color-mix(in srgb, var(--down) 16%, transparent); color: var(--down); }
.kb.flat { background: color-mix(in srgb, var(--flat) 16%, transparent); color: var(--flat); }
.kb.route { background: var(--soft); color: var(--accent); }
.empty { padding: 30px 16px; text-align: center; color: var(--muted); }
.detail { display: grid; gap: 14px; min-width: 0; }
.dh { padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; }
.dh h2 { font-size: 18px; margin: 0; cursor: text; border-bottom: 1px dashed transparent; }
.dh h2:hover { border-bottom-color: var(--muted); }
.stats { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); }
.stats b { color: var(--text); font-variant-numeric: tabular-nums; }
.back { display: none; }
#map { height: 340px; border-radius: 8px; }
.card { padding: 10px 12px; }
.card h3 { font-size: 14px; margin: 0 0 6px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.card h3 .meta { font-weight: 400; }
.chart { height: 260px; width: 100%; }
.chart.tall { height: 360px; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
th { color: var(--muted); font-weight: 600; font-size: 12px; position: sticky; top: 0; background: var(--panel); }
th:first-child, td:first-child, th.l, td.l { text-align: left; }
tr.best td { color: var(--ok); }
td.pick { text-align: center; }
td.pick label { display: inline-flex; gap: 2px; margin: 0 2px; font-size: 11px; color: var(--muted); cursor: pointer; }
td.pick input { margin: 0; accent-color: var(--accent); }
.a-dot, .b-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; vertical-align: 0; margin-right: 4px; }
.a-dot { background: var(--a); } .b-dot { background: var(--b); }
a.act { color: var(--accent); text-decoration: none; }
a.act:hover { text-decoration: underline; }
.hint { font-size: 12px; color: var(--muted); }
.cmpbar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 13px; }
.cmpbar b { font-variant-numeric: tabular-nums; }
.note { font-size: 12px; color: var(--muted); margin-top: 6px; }
@media (max-width: 900px) {
  .wrap { grid-template-columns: 1fr; padding: 10px; }
  .list { max-height: none; }
  body.has-detail .listpanel { display: none; }
  body:not(.has-detail) .detail { display: none; }
  .back { display: inline-block; }
  #map { height: 260px; }
  .chart { height: 220px; }
  .chart.tall { height: 300px; }
}
</style>
</head>
<body>
<script src="/api/v1/static/shell.js" data-page="routes"></script>
<header>
  <h1>路線進步</h1>
  <span class="meta" id="builtinfo"></span>
  <span class="prog" id="prog" hidden><span id="progtxt"></span><span class="bar"><i id="progbar" style="width:0"></i></span></span>
  <span style="flex:1"></span>
  <button id="rebuild" title="讀取新活動，找新的重複路段（已有的名稱與編號保留）">更新</button>
</header>
<div class="wrap">
  <section class="panel listpanel">
    <div class="filters">
      <div class="seg" id="f-kind"><button data-v="" class="on">全部</button><button data-v="segment">路段</button><button data-v="route">路線</button></div>
      <div class="seg" id="f-dir"><button data-v="" class="on">全部</button><button data-v="up">上坡</button><button data-v="down">下坡</button><button data-v="flat">平路</button></div>
      <select id="f-sport" aria-label="運動"><option value="">所有運動</option></select>
    </div>
    <div class="meta" id="count" style="padding:6px 12px 0"></div>
    <div class="list" id="list"><div class="empty">載入中…</div></div>
  </section>
  <section class="detail" id="detail">
    <div class="panel empty" id="pick">從左邊選一個路段或路線</div>
  </section>
</div>
<script>
const API = "/api/v1/routes";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const S = { kind: "", dir: "", sport: "", rows: [], cur: null, detail: null, a: null, b: null, charts: [], map: null, polled: false };

function hms(s) {
  if (s == null) return "—";
  s = Math.round(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(x).padStart(2, "0")}` : `${m}:${String(x).padStart(2, "0")}`;
}
function dhms(s) { return s == null ? "—" : s === 0 ? "最佳" : `+${hms(s)}`; }
function pace(v) { if (v == null || !isFinite(v)) return "—"; const m = Math.floor(v), s = Math.round((v - m) * 60); return `${m}:${String(s === 60 ? 59 : s).padStart(2, "0")}`; }
function km(m) { return m == null ? "—" : (m / 1000).toFixed(m < 10000 ? 2 : 1) + " km"; }
function num(v, d = 0) { return v == null ? "—" : (+v).toFixed(d); }
function day(iso) { return iso ? iso.slice(0, 10) : "—"; }
function dirLabel(r) { return r.kind === "route" ? "路線" : r.direction === "up" ? "上坡" : r.direction === "down" ? "下坡" : "平路"; }
function badge(r) { const c = r.kind === "route" ? "route" : r.direction; return `<span class="kb ${c}">${dirLabel(r)}</span>`; }
function gainTxt(r) { if (r.kind === "route") return r.gain_m ? `↑${Math.round(r.gain_m)} m` : ""; return r.gain_m >= 0 ? `↑${Math.round(r.gain_m)} m` : `↓${Math.round(-r.gain_m)} m`; }
async function j(url, opt) { const r = await fetch(url, opt); if (!r.ok) throw new Error(`${r.status} ${await r.text()}`); return r.json(); }

// ---- sparkline: last efforts' times, lower is better (drawn inverted so up = faster)
function spark(pts) {
  const v = pts.map((p) => p[1]).filter((x) => x != null);
  if (v.length < 2) return "";
  const w = 84, h = 26, lo = Math.min(...v), hi = Math.max(...v), span = hi - lo || 1;
  const xs = v.map((_, i) => (i / (v.length - 1)) * (w - 4) + 2);
  const ys = v.map((x) => 2 + ((x - lo) / span) * (h - 4));    // faster = higher
  const d = xs.map((x, i) => `${i ? "L" : "M"}${x.toFixed(1)},${ys[i].toFixed(1)}`).join("");
  const best = v.indexOf(lo);
  return `<svg class="sp" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-label="最近 ${v.length} 次時間，越高越快">
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.5"/>
    <circle cx="${xs[best]}" cy="${ys[best]}" r="2.4" fill="var(--ok)"/>
    <circle cx="${xs[xs.length - 1]}" cy="${ys[ys.length - 1]}" r="2.4" fill="var(--accent)"/></svg>`;
}

// ---- status / list
function showStatus(st, built) {
  $("builtinfo").textContent = built ? `更新於 ${built.replace("T", " ").slice(0, 16)}` : "";
  const busy = st && st.state === "building";
  $("prog").hidden = !busy;
  $("rebuild").disabled = busy;
  if (busy) {
    $("progtxt").textContent = `${st.phase || "處理中"} ${st.total ? `${st.done}/${st.total}` : ""}`;
    $("progbar").style.width = st.total ? `${(100 * st.done / st.total).toFixed(1)}%` : "5%";
  }
  if (st && st.state === "error") $("builtinfo").textContent = `更新失敗：${st.error}`;
  if (busy && !S.polled) {
    S.polled = true;
    setTimeout(async () => { S.polled = false; await loadList(true); }, 2500);
  }
}

async function loadList(keepDetail) {
  const q = new URLSearchParams();
  if (S.kind) q.set("kind", S.kind);
  if (S.dir) q.set("direction", S.dir);
  if (S.sport) q.set("sport", S.sport);
  let res;
  try { res = await j(`${API}?${q}`); } catch (e) { $("list").innerHTML = `<div class="empty">讀取失敗：${esc(e.message)}</div>`; return; }
  const wasBusy = S.busy;
  S.busy = res.status?.state === "building";
  showStatus(res.status, res.built_at);
  const sel = $("f-sport");
  if (sel.options.length <= 1 && res.sports?.length) sel.insertAdjacentHTML("beforeend", res.sports.map((s) => `<option>${esc(s)}</option>`).join(""));
  S.rows = res.rows;
  const c = res.counts || {};
  $("count").textContent = res.built_at ? `${res.total} 筆 · 爬坡 ${c.climb || 0}、下坡 ${c.descent || 0}、路段 ${c.stretch || 0}、路線 ${c.route || 0}` : "";
  if (!res.rows.length) {
    $("list").innerHTML = `<div class="empty">${res.built_at ? "沒有符合的路段" : "第一次整理 GPS 紀錄中，找到的路段會陸續出現"}</div>`;
  } else {
    $("list").innerHTML = res.rows.map((r) => `<div class="row ${r.id === S.cur ? "on" : ""}" data-id="${r.id}">
      <div class="nm">${badge(r)}${esc(r.name)}</div>
      ${spark(r.spark)}
      <div class="sub">${km(r.length_m)} ${gainTxt(r)} · ${r.n_efforts} 次 · 最佳 ${hms(r.best_s)} · 最近 ${hms(r.last_s)}（${day(r.last_date)}）</div>
    </div>`).join("");
    $("list").querySelectorAll(".row").forEach((el) => el.onclick = () => openDetail(el.dataset.id, true));
  }
  if (wasBusy && !S.busy && S.cur && keepDetail) openDetail(S.cur, false);
}

function bindSeg(id, key) {
  $(id).querySelectorAll("button").forEach((b) => b.onclick = () => {
    $(id).querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
    S[key] = b.dataset.v;
    savePrefs(); loadList();
  });
}
function savePrefs() { try { localStorage.setItem("routes.page", JSON.stringify({ kind: S.kind, dir: S.dir, sport: S.sport })); } catch {} }
function loadPrefs() {
  try { Object.assign(S, JSON.parse(localStorage.getItem("routes.page") || "{}")); } catch {}
  for (const [id, key] of [["f-kind", "kind"], ["f-dir", "dir"]])
    $(id).querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.v === (S[key] || "")));
}

// ---- detail
function disposeCharts() { S.charts.splice(0).forEach((c) => c.dispose()); if (S.map) { S.map.remove(); S.map = null; } }

async function openDetail(id, push) {
  S.cur = id;
  document.querySelectorAll(".row").forEach((x) => x.classList.toggle("on", x.dataset.id === id));
  if (push) history.pushState({ id }, "", `#${id}`);
  document.body.classList.add("has-detail");
  let d;
  try { d = await j(`${API}/${id}`); } catch (e) { $("detail").innerHTML = `<div class="panel empty">找不到這個路段（可能已在更新後合併）</div>`; return; }
  S.detail = d;
  S.showAll = false;
  document.querySelector(`.row[data-id="${id}"]`)?.scrollIntoView({ block: "nearest" });
  const timed = d.efforts.filter((e) => e[d.time_key] != null);
  const byTime = [...timed].sort((x, y) => x[d.time_key] - y[d.time_key]);
  // default comparison: the best effort vs the latest one
  S.a = byTime[0]?.id || null;
  S.b = (d.efforts[d.efforts.length - 1]?.id !== S.a ? d.efforts[d.efforts.length - 1]?.id : byTime[1]?.id) || null;
  renderDetail();
}

function renderDetail() {
  disposeCharts();
  const d = S.detail, tk = d.time_key, up = d.direction === "up", down = d.direction === "down";
  const best = d.efforts.find((e) => e.rank === 1);
  const last = d.efforts[d.efforts.length - 1];
  const hasPw = d.efforts.some((e) => e.avg_power != null);
  const timeName = tk === "elapsed_s" ? "經過時間" : "移動時間";
  $("detail").innerHTML = `
  <div class="panel dh">
    <button class="back" id="back">← 清單</button>
    <h2 id="dname" title="點一下改名">${esc(d.name)}</h2>
    <div class="stats">${badge(d)}<span><b>${km(d.length_m)}</b></span><span><b>${gainTxt(d)}</b></span>
      <span><b>${d.n_efforts}</b> 次 · ${d.n_activities} 個活動</span>
      <span>最佳 <b>${hms(best?.[tk])}</b>（${day(best?.start)}）</span><span>最近 <b>${hms(last?.[tk])}</b>（${day(last?.start)}）</span>
      ${d.renamed ? `<span class="meta">自動名稱：${esc(d.auto_name)}</span>` : ""}</div>
  </div>
  <div class="panel card"><div id="map"></div>
    <div class="note">藍線：這個${d.kind === "route" ? "路線（第一次跑的軌跡）" : "路段（第一次經過的軌跡）"}，<span style="color:var(--ok)">●</span> 起點、<span style="color:var(--err,#b91c1c)">●</span> 終點。比較圖上移動游標，地圖上的點跟著走。</div></div>
  <div class="panel card"><h3>趨勢 <span class="seg" id="tmode"><button data-v="time" class="on">${timeName}</button>${up ? '<button data-v="vam">VAM</button>' : ""}${d.kind === "route" ? "" : '<button data-v="pace">配速</button>'}</span>
    <span class="meta">${up ? "下圖：同樣爬升速度下的心率（HR ÷ VAM，越低越省力）" : "下圖：平均心率"}</span></h3>
    <div class="chart tall" id="trend"></div></div>
  <div class="panel card" id="cmpcard"><h3>兩次比較 <span class="seg" id="cmode"><button data-v="pace" class="on">配速</button><button data-v="hr">心率</button>${hasPw ? '<button data-v="power">功率</button>' : ""}<button data-v="elev">海拔</button></span>
    <span class="meta">在下表勾 A / B，或點趨勢圖上的點換 B</span></h3>
    <div class="cmpbar" id="cmpbar"></div>
    <div class="chart" id="cmp"></div><div class="chart" id="gap" style="height:170px"></div></div>
  <div class="panel card"><h3>每次成績 <span class="meta">勾 A / B 兩次來比較；排名依${timeName}</span></h3>
    <div class="tablewrap"><table id="etab"></table></div>
    <div id="more"></div>
    <div class="note">${up ? "VAM = 淨爬升 ÷ 移動時間；" : down ? "下降率 = 淨下降 ÷ 移動時間；" : ""}⚠ = 移動時間不到經過時間一半，VAM 可能偏高；心率、功率為移動中的時間加權平均；hrTSS 占比 = 這段的 hrTSS ÷ 整個活動的 hrTSS（WKO5 hrTSS 算法）；溫度為手錶感測器。</div></div>`;
  $("back").onclick = () => { document.body.classList.remove("has-detail"); history.pushState({}, "", location.pathname); };
  $("dname").onclick = rename;
  drawMap();
  drawTrend("time");
  $("tmode").querySelectorAll("button").forEach((b) => b.onclick = () => {
    $("tmode").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); drawTrend(b.dataset.v); });
  drawTable();
  S.cmode = "pace";
  $("cmode").querySelectorAll("button").forEach((b) => b.onclick = () => {
    $("cmode").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); S.cmode = b.dataset.v; drawCompare(); });
  loadCompare();
}

async function rename() {
  const d = S.detail;
  const name = prompt("路段名稱（留空 = 用自動名稱）", d.renamed ? d.name : "");
  if (name === null) return;
  const r = await j(`${API}/${d.id}`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name }) });
  d.name = r.name; d.renamed = r.renamed;
  $("dname").textContent = r.name;
  loadList();
}

async function drawMap() {
  const d = S.detail;
  const map = S.map = L.map("map", { zoomControl: true });
  MapLayers.attach(map, await MapLayers.defaults(), "routes.map");
  const ll = d.lat.map((a, i) => [a, d.lon[i]]);
  L.polyline(ll, { color: "#fff", weight: 8, opacity: .7, interactive: false }).addTo(map);
  L.polyline(ll, { color: css("--accent") || "#2563eb", weight: 5, interactive: false }).addTo(map);
  L.circleMarker(ll[0], { radius: 6, color: "#fff", weight: 2, fillColor: "#16a34a", fillOpacity: 1 }).addTo(map).bindTooltip("起點");
  L.circleMarker(ll[ll.length - 1], { radius: 6, color: "#fff", weight: 2, fillColor: "#dc2626", fillOpacity: 1 }).addTo(map).bindTooltip("終點");
  S.hoverA = L.circleMarker(ll[0], { radius: 7, color: "#fff", weight: 2, fillColor: css("--a"), fillOpacity: 1 });
  S.hoverB = L.circleMarker(ll[0], { radius: 5, color: "#fff", weight: 2, fillColor: css("--b"), fillOpacity: 1 });
  map.fitBounds(L.latLngBounds(ll), { padding: [18, 18] });
}

function baseChart(el) {
  const c = echarts.init(el);
  S.charts.push(c);
  return c;
}
function axisStyle() {
  return { axisLine: { lineStyle: { color: css("--line") } }, axisLabel: { color: css("--muted") },
    splitLine: { lineStyle: { color: css("--line") } }, nameTextStyle: { color: css("--muted") } };
}

function drawTrend(mode) {
  const d = S.detail, up = d.direction === "up";
  const el = $("trend");
  echarts.getInstanceByDom(el)?.dispose();
  const c = baseChart(el);
  const pts = d.efforts.map((e) => {
    const y = mode === "vam" ? e.vam : mode === "pace" ? e.pace_min_km : e[d.time_key];
    return { value: [e.start.slice(0, 10), y], e };
  }).filter((p) => p.value[1] != null);
  const eff = d.efforts.map((e) => ({ value: [e.start.slice(0, 10), up ? e.hr_vam : e.avg_hr], e })).filter((p) => p.value[1] != null);
  const fmtY = mode === "vam" ? (v) => Math.round(v) : mode === "pace" ? pace : hms;
  const ax = axisStyle();
  c.setOption({
    animation: false, textStyle: { color: css("--text") },
    grid: [{ left: 58, right: 16, top: 16, height: "46%" }, { left: 58, right: 16, top: "66%", bottom: 28 }],
    tooltip: { trigger: "item", formatter: (p) => {
      const e = p.data.e;
      return `${e.start.slice(0, 16).replace("T", " ")} ${esc(e.sport_type || "")}<br>${d.time_key === "elapsed_s" ? "經過" : "移動"} ${hms(e[d.time_key])}（第 ${e.rank ?? "—"}）` +
        (e.vam != null ? `<br>VAM ${Math.round(e.vam)} m/h` : "") + (e.avg_hr != null ? `<br>心率 ${num(e.avg_hr)} bpm` : "") +
        (e.hr_vam != null ? ` · HR÷VAM ${num(e.hr_vam, 0)}` : "") + (e.phase ? `<br>${esc(e.phase)}` : ""); } },
    xAxis: [{ type: "time", gridIndex: 0, ...ax, axisLabel: { show: false }, splitLine: { show: false } },
      { type: "time", gridIndex: 1, ...ax, splitLine: { show: false } }],
    yAxis: [{ type: "value", gridIndex: 0, scale: true, inverse: mode !== "vam", ...ax, nameLocation: mode !== "vam" ? "start" : "end",
      name: mode === "vam" ? "VAM m/h" : mode === "pace" ? "min/km" : "時間", axisLabel: { color: css("--muted"), formatter: fmtY } },
      { type: "value", gridIndex: 1, scale: true, ...ax, name: up ? "HR÷VAM" : "bpm" }],
    series: [
      { type: "line", xAxisIndex: 0, yAxisIndex: 0, data: pts, symbolSize: 7, lineStyle: { width: 1, opacity: .45 },
        itemStyle: { color: css("--accent") },
        markPoint: pts.length ? { symbol: "circle", symbolSize: 11, itemStyle: { color: css("--ok") }, label: { show: false },
          data: [{ coord: (mode === "vam" ? pts.reduce((a, b) => (b.value[1] > a.value[1] ? b : a)) : pts.reduce((a, b) => (b.value[1] < a.value[1] ? b : a))).value }] } : undefined },
      { type: "line", xAxisIndex: 1, yAxisIndex: 1, data: eff, symbolSize: 6, lineStyle: { width: 1, opacity: .45 }, itemStyle: { color: css("--b") } },
    ],
  });
  c.on("click", (p) => { if (p.data?.e) pickEffort(p.data.e.id); });
}

function lowMov(e) {
  // the moving mask (speed > 1 mph) drops slow, steep climbing: moving-time VAM overstates it
  return e.moving_share != null && e.moving_share < 0.5
    ? ` <span title="移動時間只占經過時間的 ${Math.round(e.moving_share * 100)}%（速度低於 1.6 km/h 不算移動），VAM 可能偏高" style="color:var(--warn);cursor:help">⚠</span>` : "";
}

function pickEffort(id) {
  if (id === S.a || id === S.b) return;
  S.b = id; drawTable(); loadCompare();
}

function drawTable() {
  const d = S.detail, up = d.direction === "up", down = d.direction === "down", tk = d.time_key;
  const f2i = (e) => e.workout;
  const hasPw = d.efforts.some((e) => e.avg_power != null);
  const hasT = d.efforts.some((e) => e.temp_c != null);
  const all = [...d.efforts].reverse();
  // newest 20, plus A / B and the best when older; "顯示全部" lists every one
  const rows = S.showAll ? all : all.filter((e, i) => i < 20 || e.id === S.a || e.id === S.b || e.rank === 1);
  $("more").innerHTML = all.length > rows.length || S.showAll && all.length > 20
    ? `<button id="moreb" style="margin-top:8px">${S.showAll ? "只看最近 20 次" : `顯示全部 ${all.length} 次`}</button>` : "";
  if ($("moreb")) $("moreb").onclick = () => { S.showAll = !S.showAll; drawTable(); };
  $("etab").innerHTML = `<thead><tr><th class="l">日期</th><th>比較</th><th>名次</th><th>${tk === "elapsed_s" ? "經過" : "移動"}</th><th>與最佳差</th>
    ${tk === "elapsed_s" ? "<th>移動</th>" : ""}<th>配速</th>${up ? "<th>VAM</th>" : down ? "<th>下降率</th>" : ""}<th>心率</th>
    ${up ? "<th title='HR ÷ VAM × 1000'>HR÷VAM</th><th title='心跳次數 / 每爬 100 m'>心跳/100m</th>" : ""}
    ${hasPw ? `<th>功率</th>${up ? "<th title='W ÷ VAM × 1000'>W÷VAM</th>" : ""}` : ""}<th title="這段占整個活動 hrTSS 的比例">hrTSS 占比</th>
    ${hasT ? "<th>溫度</th>" : ""}<th class="l">周期</th><th class="l">運動</th></tr></thead><tbody>` +
    rows.map((e) => `<tr class="${e.rank === 1 ? "best" : ""}">
      <td class="l">${f2i(e) != null ? `<a class="act" href="#" data-w="${f2i(e)}" title="在圖表分析打開這個活動">${e.start.slice(0, 10)}</a>` : e.start.slice(0, 10)}</td>
      <td class="pick"><label><input type="radio" name="pa" value="${e.id}" ${e.id === S.a ? "checked" : ""}>A</label><label><input type="radio" name="pb" value="${e.id}" ${e.id === S.b ? "checked" : ""}>B</label></td>
      <td>${e.rank ?? "—"}</td><td>${hms(e[tk])}</td><td>${dhms(e.delta_best_s)}</td>
      ${tk === "elapsed_s" ? `<td>${hms(e.moving_s)}</td>` : ""}<td>${pace(e.pace_min_km)}</td>
      ${up ? `<td>${num(e.vam)}${lowMov(e)}</td>` : down ? `<td>${num(e.descent_rate)}${lowMov(e)}</td>` : ""}<td>${num(e.avg_hr)}</td>
      ${up ? `<td>${num(e.hr_vam)}</td><td>${num(e.hr_per_100m)}</td>` : ""}
      ${hasPw ? `<td>${num(e.avg_power)}</td>${up ? `<td>${num(e.power_vam)}</td>` : ""}` : ""}
      <td>${e.hrtss_share != null ? (e.hrtss_share * 100).toFixed(0) + "%" : "—"}</td>
      ${hasT ? `<td>${e.temp_c != null ? num(e.temp_c, 1) + "°" : "—"}</td>` : ""}
      <td class="l">${esc(e.phase || "—")}</td><td class="l">${esc(e.sport_type || e.sport || "")}${e.frechet_m != null && e.frechet_m > 60 ? ` <span class="meta" title="和參考軌跡的最大偏差（離散 Fréchet 距離）">偏 ${Math.round(e.frechet_m)} m</span>` : ""}</td></tr>`).join("") + "</tbody>";
  $("etab").querySelectorAll("input[name=pa]").forEach((i) => i.onchange = () => { S.a = i.value; loadCompare(); });
  $("etab").querySelectorAll("input[name=pb]").forEach((i) => i.onchange = () => { S.b = i.value; loadCompare(); });
  $("etab").querySelectorAll("a.act").forEach((a) => a.onclick = (ev) => { ev.preventDefault(); openWorkout(+a.dataset.w); });
}

function openWorkout(idx) {
  // the viewer restores its last state from localStorage; point it at this activity
  try {
    const st = JSON.parse(localStorage.getItem("wko5viewer") || "{}");
    localStorage.setItem("wko5viewer", JSON.stringify({ ...st, mode: "workout", workout: idx, workoutLabel: null }));
  } catch {}
  location.href = "/api/v1/wko5/viewer";
}

async function loadCompare() {
  const d = S.detail;
  if (!S.a || !S.b || S.a === S.b) { $("cmpbar").innerHTML = `<span class="hint">選兩次不同的成績來比較</span>`; return; }
  const token = S.cmpToken = Math.random();
  const c = await j(`${API}/${d.id}/compare?a=${S.a}&b=${S.b}`);
  if (token !== S.cmpToken) return;
  S.cmp = c;
  const ea = c.a.effort, eb = c.b.effort, tk = d.time_key;
  const fin = c.gap_s.filter((g) => g != null);
  const endGap = fin.length ? fin[fin.length - 1] : null;
  $("cmpbar").innerHTML = `<span><i class="a-dot"></i>A ${ea.start.slice(0, 10)} <b>${hms(ea[tk])}</b></span>
    <span><i class="b-dot"></i>B ${eb.start.slice(0, 10)} <b>${hms(eb[tk])}</b></span>
    <span>終點差 <b>${endGap == null ? "—" : (endGap > 0 ? "B 慢 " : "B 快 ") + hms(Math.abs(endGap))}</b></span>`;
  drawCompare();
}

function drawCompare() {
  const c = S.cmp, d = S.detail;
  if (!c) return;
  for (const id of ["cmp", "gap"]) echarts.getInstanceByDom($(id))?.dispose();
  S.charts = S.charts.filter((x) => !x.isDisposed());
  const m = S.cmode, key = { pace: "pace_min_km", hr: "hr", power: "power", elev: "elev" }[m];
  const x = c.x_m.map((v) => v / 1000);
  const ser = (side, color) => ({ type: "line", name: side.toUpperCase(), showSymbol: false, connectNulls: false,
    data: x.map((xv, i) => [xv, c[side][key][i]]), lineStyle: { width: 1.6, color }, itemStyle: { color } });
  const ax = axisStyle();
  const unit = { pace: "min/km", hr: "bpm", power: "W", elev: "m" }[m];
  const fmt = m === "pace" ? pace : (v) => Math.round(v);
  const ch = baseChart($("cmp"));
  ch.setOption({
    animation: false, legend: { top: 0, textStyle: { color: css("--muted") } },
    grid: { left: 52, right: 16, top: 28, bottom: 26 },
    tooltip: { trigger: "axis", valueFormatter: (v) => (v == null ? "—" : fmt(v)) },
    axisPointer: { link: [{ xAxisIndex: "all" }] },
    xAxis: { type: "value", min: 0, max: x[x.length - 1], ...ax, axisLabel: { color: css("--muted"), formatter: (v) => v.toFixed(1) }, name: "km" },
    yAxis: { type: "value", scale: true, inverse: m === "pace", name: unit, ...ax, axisLabel: { color: css("--muted"), formatter: fmt } },
    series: [ser("a", css("--a")), ser("b", css("--b"))],
  });
  const g = baseChart($("gap"));
  g.setOption({
    animation: false, grid: { left: 52, right: 16, top: 22, bottom: 26 },
    title: { text: "B 相對 A 的時間差（秒，正 = B 落後）", textStyle: { fontSize: 12, fontWeight: 400, color: css("--muted") }, left: 50, top: 0 },
    tooltip: { trigger: "axis", valueFormatter: (v) => (v == null ? "—" : `${v > 0 ? "+" : ""}${Math.round(v)} s`) },
    xAxis: { type: "value", min: 0, max: x[x.length - 1], ...ax, axisLabel: { color: css("--muted"), formatter: (v) => v.toFixed(1) } },
    yAxis: { type: "value", ...ax },
    series: [{ type: "line", showSymbol: false, data: x.map((xv, i) => [xv, c.gap_s[i]]), lineStyle: { color: css("--b"), width: 1.6 },
      areaStyle: { color: css("--b"), opacity: .12 }, markLine: { symbol: "none", silent: true, lineStyle: { color: css("--muted") }, data: [{ yAxis: 0 }] } }],
  });
  echarts.connect([ch, g]);
  const hover = (p) => {
    const xv = p?.axesInfo?.[0]?.value ?? p?.value;
    if (xv == null || !S.map) return;
    let k = 0, best = Infinity;
    for (let i = 0; i < x.length; i++) { const dd = Math.abs(x[i] - xv); if (dd < best) { best = dd; k = i; } }
    const pos = [c.lat[k], c.lon[k]];
    S.hoverA.setLatLng(pos).addTo(S.map);
    // where B is when A is here: B's position at A's elapsed time
    const ta = c.a.t_s[k];
    let kb = k;
    if (ta != null) { let bb = Infinity; c.b.t_s.forEach((t, i) => { if (t != null && Math.abs(t - ta) < bb) { bb = Math.abs(t - ta); kb = i; } }); }
    S.hoverB.setLatLng([c.lat[kb], c.lon[kb]]).addTo(S.map);
    S.hoverA.bindTooltip(`A ${x[k].toFixed(2)} km · B 在 ${x[kb].toFixed(2)} km`, { direction: "top", offset: [0, -6] }).openTooltip();
  };
  ch.on("updateAxisPointer", hover);
  g.on("updateAxisPointer", hover);
  const clear = () => { S.hoverA?.remove(); S.hoverB?.remove(); };
  $("cmp").onmouseleave = clear; $("gap").onmouseleave = clear;
}

// ---- init
bindSeg("f-kind", "kind");
bindSeg("f-dir", "dir");
$("f-sport").onchange = (e) => { S.sport = e.target.value; savePrefs(); loadList(); };
$("rebuild").onclick = async () => { await j(`${API}/rebuild`, { method: "POST" }); loadList(); };
window.addEventListener("popstate", () => {
  const id = location.hash.slice(1);
  if (id) openDetail(id, false); else document.body.classList.remove("has-detail");
});
window.addEventListener("resize", () => S.charts.forEach((c) => c.resize()));
loadPrefs();
loadList().then(() => {
  if (S.sport) $("f-sport").value = S.sport;
  const id = location.hash.slice(1);
  if (id) openDetail(id, false);
  else if (window.matchMedia("(min-width: 901px)").matches && S.rows[0]) openDetail(S.rows[0].id, false);
});
</script>
</body>
</html>
