<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>設定</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #fff; --text: #1d232b; --muted: #6a7482; --line: #e1e5ea;
  --accent: #2563eb; --soft: #e8efff; --ok: #15803d; --warn: #b45309; --err: #b91c1c;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --panel: #171b21; --text: #e6e9ee; --muted: #97a1ae; --line: #2a313a;
    --accent: #60a5fa; --soft: #1c2a40; --ok: #4ade80; --warn: #fbbf24; --err: #f87171;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --panel: #171b21; --text: #e6e9ee; --muted: #97a1ae; --line: #2a313a;
  --accent: #60a5fa; --soft: #1c2a40; --ok: #4ade80; --warn: #fbbf24; --err: #f87171;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.55 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif; }
header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px;
  display: flex; gap: 14px; align-items: center; }
header a { color: var(--accent); text-decoration: none; font-size: 13px; }
h1 { font-size: 16px; margin: 0; }
h2 { font-size: 15px; margin: 0 0 4px; }
main { max-width: 820px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
.meta { color: var(--muted); font-size: 12.5px; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
@media (max-width: 600px) { .modes { grid-template-columns: 1fr; } }
.mode { border: 2px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; text-align: left;
  background: var(--panel); color: var(--text); font: inherit; }
.mode b { display: block; margin-bottom: 2px; }
.mode.on { border-color: var(--accent); background: var(--soft); }
.mode ul { margin: 4px 0 0; padding-left: 18px; font-size: 12.5px; color: var(--muted); }
button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
input, select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 3px 6px; }
label { font-size: 13px; }
table.wt { border-collapse: collapse; margin-top: 10px; min-width: 280px; }
table.wt th, table.wt td { padding: 4px 8px; border-bottom: 1px solid var(--line); text-align: left; font-size: 13px; }
table.wt th { color: var(--muted); font-weight: 600; font-size: 12px; }
.list label { display: block; padding: 6px 0; border-top: 1px solid var(--line); }
.list .x { float: right; }
.toast { position: fixed; right: 16px; bottom: 16px; background: var(--text); color: var(--bg);
  padding: 8px 14px; border-radius: 6px; opacity: 0; transition: opacity .2s; }
.toast.on { opacity: .92; }
</style>
</head>
<body>
<script src="/api/v1/static/shell.js" data-page="settings"></script>
<header>
  <h1>設定</h1>
</header>
<main>
  <section id="mode">
    <h2>計算模式</h2>
    <p class="meta">首頁、圖表分析和狀態判斷都會用這裡選的模式。</p>
    <div class="modes">
      <button class="mode" data-parity="false">
        <b>我的算式（平常用）</b>
        <ul>
          <li>hrTSS 只算實際移動的時間</li>
          <li>爬升加成 TSS</li>
          <li>套用你核准的資料校正</li>
          <li>用「賽事周期」頁的心率 / CP 測試值</li>
        </ul>
      </button>
      <button class="mode" data-parity="true">
        <b>WKO5 對照模式</b>
        <ul>
          <li>完全比照 WKO5 的公式和設定</li>
          <li>用來驗證資料有沒有算對</li>
          <li>不套用資料校正與你的測試值</li>
        </ul>
      </button>
    </div>
  </section>

  <section>
    <h2>個人資料</h2>
    <p class="meta">體重用在 W/kg、跑步效能 RE 和功率計算機。每次量體重記一筆，圖表會依日期套用當時的體重；沒填的就用 WKO5 裡的值。只在「我的算式」模式生效。</p>
    <div class="row">
      <label>性別 <select id="p-sex"><option value="">（沿用 WKO5）</option><option value="male">男</option><option value="female">女</option></select></label>
      <label>身高 <input type="number" id="p-height" min="100" max="250" step="1" style="width:80px"> cm</label>
      <label>功率計 <select id="p-meter"><option value="">（未設定）</option><option value="stryd">Stryd</option>
        <option value="coros">COROS</option><option value="garmin">Garmin</option><option value="other">其他</option></select></label>
    </div>
    <table class="wt"><thead><tr><th>日期</th><th>體重 kg</th><th></th></tr></thead><tbody id="weights"></tbody></table>
    <div class="row">
      <button id="addw">＋ 新增一筆體重</button>
      <button class="primary" id="saveprof">儲存個人資料</button>
      <span class="meta" id="profnow"></span>
    </div>
    <p class="meta" id="profwko5"></p>
  </section>

  <section>
    <h2>資料校正</h2>
    <p class="meta">找出功率異常尖峰（例如 1800 W）。只會列出建議，<b>按下套用才會生效</b>；不會改到 .wko4 原始檔，隨時可以撤銷。只在「我的算式」模式生效。</p>
    <div class="row">
      <button id="scanbtn">掃描壞點</button>
      <button id="fixbtn" class="primary" disabled>套用勾選的修正</button>
      <span class="meta" id="scanmsg"></span>
    </div>
    <div class="list" id="fixlist"></div>
    <h2 style="margin-top:14px">已套用的修正</h2>
    <div class="list" id="applied"><span class="meta">載入中…</span></div>
  </section>
</main>
<div class="toast" id="toast"></div>
<script>
const API = "/api/v1/wko5";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = (v) => v == null ? "–" : Math.round(v).toLocaleString();
let proposals = [];

function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 1800); }
async function j(url, opt) { const r = await fetch(url, opt); if (!r.ok) throw new Error(`${r.status} ${await r.text()}`); return r.json(); }

async function loadMode() {
  const { config } = await j(`${API}/config`);
  document.querySelectorAll(".mode").forEach((b) => b.classList.toggle("on", String(!!config.parity) === b.dataset.parity));
}
document.querySelectorAll(".mode").forEach((b) => b.onclick = async () => {
  const parity = b.dataset.parity === "true";
  // switching to "mine" also (re)applies the researched preset — the knobs stay hidden on purpose
  const body = parity ? { parity: true } : { ...(await j(`${API}/config`)).mountain_preset, parity: false };
  await j(`${API}/config`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  await loadMode();
  toast(parity ? "已切到 WKO5 對照模式" : "已切到我的算式");
});

async function loadApplied() {
  const { applied } = await j(`${API}/corrections`);
  $("applied").innerHTML = applied.length ? applied.map((c) => `<label>
      <button class="x" data-id="${esc(c.id)}">撤銷</button>
      ${esc(c.file)} · ${esc(c.channel)} · ${num(c.t_start)}–${num(c.t_end)} 秒</label>`).join("")
    : `<span class="meta">沒有。</span>`;
}
$("applied").onclick = async (e) => {
  const id = e.target.dataset.id; if (!id) return;
  if (!confirm("撤銷這筆修正？")) return;
  await j(`${API}/corrections/${encodeURIComponent(id)}`, { method: "DELETE" });
  toast("已撤銷"); loadApplied();
};

$("scanbtn").onclick = async () => {
  $("scanmsg").textContent = "掃描中…（第一次會比較久）"; $("scanbtn").disabled = true;
  try {
    ({ proposals } = await j(`${API}/corrections/proposals`));
    $("scanmsg").textContent = proposals.length ? `找到 ${proposals.length} 筆` : "沒有偵測到壞點";
    $("fixlist").innerHTML = proposals.map((p, i) => `<label><input type="checkbox" data-i="${i}" checked>
      ${esc(p.start.slice(0, 10))} ${esc(p.sport)} · ${p.samples} 筆 · 峰值 ${num(p.peak)} W → ${num(p.peak_after)} W
      <div class="meta" style="margin-left:22px">${esc(p.reason || "")}</div></label>`).join("");
    $("fixbtn").disabled = !proposals.length;
  } catch (e) { $("scanmsg").textContent = "錯誤：" + e.message; }
  $("scanbtn").disabled = false;
};
$("fixbtn").onclick = async () => {
  const picked = [...$("fixlist").querySelectorAll("input:checked")].map((el) => proposals[+el.dataset.i]);
  if (!picked.length) return;
  if (!confirm(`要套用 ${picked.length} 筆修正嗎？（不會改到 .wko4 原始檔，隨時可以撤銷）`)) return;
  const res = await j(`${API}/corrections/approve`, { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ proposals: picked }) });
  toast(`已套用 ${res.added.length} 筆`); $("fixlist").innerHTML = ""; $("fixbtn").disabled = true;
  $("scanmsg").textContent = ""; loadApplied();
};

// ---- profile -------------------------------------------------------------
let PROF = null;
async function loadProfile() {
  PROF = await j("/api/v1/plan/profile");
  const p = PROF.profile, e = PROF.effective, wk = PROF.wko5;
  $("p-sex").value = p.sex || ""; $("p-height").value = p.height_cm || ""; $("p-meter").value = p.power_meter || "";
  $("p-height").placeholder = wk.height_cm || "";
  renderWeights();
  $("profnow").textContent = `目前使用：${e.weight ?? "–"} kg（${e.weight_source}）`;
  $("profwko5").textContent = `WKO5 裡的資料：身高 ${wk.height_cm ?? "–"} cm、性別 ${({ male: "男", female: "女" })[wk.sex] || "–"}、體重紀錄 `
    + (wk.weights.length ? wk.weights.map((w) => `${w.date} ${w.kg} kg`).join("、") : "無");
}
function renderWeights() {
  $("weights").innerHTML = PROF.weights.map((w, i) => `<tr>
    <td><input type="date" data-i="${i}" data-f="date" value="${esc(w.date)}"></td>
    <td><input type="number" data-i="${i}" data-f="kg" step="0.1" min="25" max="250" value="${w.kg}" style="width:90px"></td>
    <td><button class="x" data-rm="${i}">移除</button></td></tr>`).join("")
    || `<tr><td colspan="3" class="meta">還沒有紀錄（目前沿用 WKO5 的體重）</td></tr>`;
}
$("weights").addEventListener("change", (e) => {
  const i = e.target.dataset.i; if (i == null) return;
  PROF.weights[i][e.target.dataset.f] = e.target.dataset.f === "kg" ? Number(e.target.value) : e.target.value;
});
$("weights").addEventListener("click", (e) => { const i = e.target.dataset.rm; if (i == null) return; PROF.weights.splice(+i, 1); renderWeights(); });
$("addw").onclick = () => {
  const last = PROF.weights.at(-1) || PROF.wko5.weights.at(-1);
  PROF.weights.push({ date: new Date().toISOString().slice(0, 10), kg: last ? last.kg : 65 }); renderWeights();
};
$("saveprof").onclick = async () => {
  const body = { weights: PROF.weights.filter((w) => w.date && w.kg),
    sex: $("p-sex").value || null, height_cm: $("p-height").value ? Number($("p-height").value) : null,
    power_meter: $("p-meter").value || null };
  try {
    await j("/api/v1/plan/profile", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    toast("已儲存，圖表會用新的體重重算"); loadProfile();
  } catch (e) { toast("失敗：" + e.message.slice(0, 80)); }
};

loadMode(); loadApplied(); loadProfile();
</script>
</body>
</html>
