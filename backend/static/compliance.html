<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="compliance.page_title">課表達成率</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<style>
/* 課表達成率 (engine/compliance.dashboard, GET /api/v1/overview/plan/compliance): a tab of
   課表. KPI tiles, charts (planned vs actual per week, weekly completion, per kind),
   then a compact session list. Tokens as overview.html (light / dark / data-theme). */
:root {
  color-scheme: light;
  --bg: #f4f5f7; --panel: #fcfcfb; --text: #0b0b0b; --muted: #52514e; --faint: #8a8984; --line: #e3e3df;
  --accent: #2a78d6; --soft: #e8efff;
  --good: #1a7f37; --watch: #b45309; --bad: #c62828;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s7: #4a3aa7; --bar: #b9b8b1;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111110; --panel: #1a1a19; --text: #ffffff; --muted: #c3c2b7; --faint: #8f8e86; --line: #2e2e2b;
    --accent: #3987e5; --soft: #1c2a40;
    --good: #4ade80; --watch: #fbbf24; --bad: #f87171;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s7: #9085e9; --bar: #5a5954;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111110; --panel: #1a1a19; --text: #ffffff; --muted: #c3c2b7; --faint: #8f8e86; --line: #2e2e2b;
  --accent: #3987e5; --soft: #1c2a40;
  --good: #4ade80; --watch: #fbbf24; --bad: #f87171;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s7: #9085e9; --bar: #5a5954;
  --shadow: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif; }
button, input { font: inherit; color: inherit; }
main { max-width: 1280px; margin: 0 auto; padding: 12px 16px 40px; display: grid; gap: 12px; }
.meta { color: var(--muted); font-size: 12.5px; }
.faint { color: var(--faint); }
.num { font-variant-numeric: tabular-nums; }
.err { color: var(--bad); }
.loading { color: var(--muted); padding: 18px 0; text-align: center; }
section, .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; box-shadow: var(--shadow); }
h2 { font-size: 14.5px; margin: 0 0 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
h2 .meta { font-weight: 400; }

.ptabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); }
.ptabs a { padding: 6px 14px; font-size: 13.5px; font-weight: 600; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.ptabs a:hover { color: var(--text); }
.ptabs a[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); }

.top { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.top h1 { font-size: 19px; margin: 0 4px 0 0; }
.seg { display: inline-flex; }
.seg button { border: 1px solid var(--line); background: var(--panel); padding: 4px 12px; cursor: pointer; margin-left: -1px; font-size: 13px; }
.seg button:first-child { border-radius: 7px 0 0 7px; margin-left: 0; }
.seg button:last-child { border-radius: 0 7px 7px 0; }
.seg button[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--bg); }
.seg button:focus-visible, .btn:focus-visible, .q:focus-visible, .fchip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.custom { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
.custom[hidden] { display: none; }
.custom input { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 3px 6px; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 7px; padding: 4px 11px; cursor: pointer; font-size: 13px; }
#range { margin-left: auto; }

/* ? help: hover shows, click / tap pins */
.q { display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; border: 1px solid var(--line);
  background: transparent; color: var(--muted); font: 600 11px/1 system-ui, sans-serif; cursor: help; padding: 0; flex: none; }
.q:hover { border-color: var(--accent); color: var(--accent); }
.qpop { position: fixed; z-index: 100; max-width: min(340px, calc(100vw - 24px)); white-space: pre-line; background: var(--panel);
  color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px; font-size: 12.5px; line-height: 1.55;
  box-shadow: 0 8px 24px rgba(0,0,0,.2); pointer-events: none; }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 699px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px 10px; box-shadow: var(--shadow);
  display: grid; grid-template-rows: auto 1fr auto; gap: 2px; min-width: 0; }
.kpi .k { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.kpi .k .q { margin-left: auto; }
.kpi .v { font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kpi .v small { font-size: 14px; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 3px; }
.kpi .sub { font-size: 12px; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 420px) { .kpi .v { font-size: 25px; } .kpi { padding: 9px 10px; } }
.split { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; margin-top: 6px; background: var(--line); }
.split i { display: block; height: 100%; }
.track { height: 8px; background: color-mix(in srgb, var(--line) 85%, transparent); border-radius: 4px; overflow: hidden; position: relative; margin-top: 6px; }
.track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--accent); }
.track b { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--text); border-radius: 1px; }

/* phase */
.phase { display: grid; grid-template-columns: minmax(0, 1.2fr) repeat(3, minmax(0, 1fr)); gap: 10px 18px; align-items: center; }
@media (max-width: 860px) { .phase { grid-template-columns: 1fr 1fr; } }
.phase .pl { font-size: 15px; font-weight: 700; }
.ph-base { --ph: var(--s1); } .ph-specific { --ph: var(--s2); } .ph-taper { --ph: var(--s4); } .ph-event { --ph: var(--bad); }
.ph-recovery { --ph: var(--s3); } .ph-transition { --ph: var(--s7); }
.phase .dotp { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--ph, var(--accent)); margin-right: 6px; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 12px; color: var(--muted); font-weight: 600; }

/* charts */
.charts { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 960px) { .charts { grid-template-columns: 1fr; } }
.plot { width: 100%; height: 250px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.legend i.ol { border: 1.5px solid var(--muted); background: transparent; }
.kinds { display: grid; gap: 9px; }
.kr { display: grid; grid-template-columns: 82px minmax(0, 1fr) 92px; gap: 10px; align-items: center; font-size: 13px; }
.kr .kl { display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kr .kl i { width: 9px; height: 9px; border-radius: 2px; background: var(--k); flex: none; }
.kr .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.kr .n b { color: var(--text); }
.k-easy { --k: var(--s3); } .k-long { --k: var(--s1); } .k-quality { --k: var(--s2); } .k-test { --k: var(--s7); }
.k-strength { --k: var(--s5); } .k-hike { --k: var(--s4); } .k-heat_passive, .k-notice { --k: var(--bar); }
.kbar { display: flex; height: 12px; border-radius: 4px; overflow: hidden; gap: 2px; background: color-mix(in srgb, var(--line) 80%, transparent); }
.kbar i { display: block; height: 100%; }

/* status: icon + word + colour, never colour alone */
.st { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 650; white-space: nowrap; }
.st-done { color: var(--good); } .st-partial { color: var(--watch); } .st-off_plan { color: var(--watch); } .st-missed { color: var(--bad); } .st-open { color: var(--muted); }
.bg-done { background: var(--good); } .bg-partial { background: color-mix(in srgb, var(--watch) 70%, var(--panel)); }
.bg-off_plan { background: repeating-linear-gradient(45deg, var(--watch) 0 3px, color-mix(in srgb, var(--watch) 45%, var(--panel)) 3px 6px); }
.bg-missed { background: var(--bad); }

/* list */
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.fchip { border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 2px 10px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
.fchip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--soft); font-weight: 600; }
.list { display: grid; }
.row { display: grid; grid-template-columns: 74px 10px minmax(0, 1fr) 104px 64px 118px; gap: 4px 10px; align-items: center;
  padding: 6px 4px; border-top: 1px solid var(--line); font-size: 13px; text-decoration: none; color: inherit; }
.row:hover { background: color-mix(in srgb, var(--accent) 5%, transparent); }
.row:first-child { border-top: 0; }
.row .d { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .kd { width: 9px; height: 9px; border-radius: 2px; background: var(--k); }
.row .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .t .meta { margin-left: 6px; }
.row .p { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.row .x { text-align: right; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.more { margin-top: 8px; }
@media (max-width: 699px) {
  main { padding: 10px 10px 84px; gap: 10px; }
  section, .panel { padding: 12px; }
  .top h1 { display: none; }
  #range { margin-left: 0; flex-basis: 100%; }
  .row { grid-template-columns: 46px 8px minmax(0, 1fr) auto auto; }
  .row .x { grid-column: 3 / -1; text-align: left; }
  .row .st .lb { display: none; }
  .kr { grid-template-columns: 78px minmax(0, 1fr) 70px; gap: 8px; }
  .plot { height: 220px; }
}
</style>
</head>
<body>
<script src="/api/v1/static/shell.js" data-page="schedule"></script>
<main>
  <nav class="ptabs" data-i18n-attr="aria-label:compliance.tabs.label" aria-label="課表檢視">
    <a href="/api/v1/overview/plan/schedule/page" data-i18n="compliance.tabs.calendar">日曆</a>
    <a href="/api/v1/overview/plan/compliance/page" aria-current="page" data-i18n="compliance.tabs.compliance">課表達成率</a>
  </nav>

  <div class="top">
    <h1 data-i18n="compliance.title">課表達成率</h1>
    <div class="seg" id="period" role="group" data-i18n-attr="aria-label:compliance.period.label" aria-label="期間">
      <button type="button" data-p="4w" data-i18n="compliance.period.4w">4 週</button><button type="button" data-p="12w" data-i18n="compliance.period.12w">12 週</button><button type="button" data-p="phase" data-i18n="compliance.period.phase">本周期</button><button type="button" data-p="custom" data-i18n="compliance.period.custom">自訂</button>
    </div>
    <span class="custom" id="custom" hidden>
      <input type="date" id="c-a" data-i18n-attr="aria-label:compliance.period.from" aria-label="開始">
      <span>–</span>
      <input type="date" id="c-b" data-i18n-attr="aria-label:compliance.period.to" aria-label="結束">
      <button class="btn" type="button" id="c-go" data-i18n="compliance.period.apply">套用</button>
    </span>
    <span class="meta num" id="range"></span>
  </div>

  <div class="kpis" id="kpis"><div class="kpi"><div class="loading" data-i18n="compliance.loading">載入中…</div></div></div>

  <div class="charts">
    <section id="phase-card" aria-labelledby="ph-h" hidden>
    <h2 id="ph-h"><span data-i18n="compliance.phase.title">目前周期</span> <span class="meta" id="ph-sub"></span><span id="ph-q"></span></h2>
    <div class="phase" id="phase"></div>
  </section>
    <section aria-labelledby="kd-h">
      <h2 id="kd-h"><span data-i18n="compliance.kinds.title">依課表類型</span><span id="kd-q"></span></h2>
      <div class="kinds" id="kinds"></div>
      <div class="legend" id="st-legend" style="margin-top:10px"></div>
    </section>
  </div>

  <div class="charts">
    <section aria-labelledby="wk-h">
      <h2 id="wk-h"><span data-i18n="compliance.weeks.title">每週計畫 vs 實際</span>
        <span class="seg" id="metric" role="group" data-i18n-attr="aria-label:compliance.weeks.metric" aria-label="指標" style="margin-left:auto">
          <button type="button" data-m="tss" aria-pressed="true">TSS</button><button type="button" data-m="hours" data-i18n="compliance.weeks.hours">時數</button>
        </span><span id="wk-q"></span></h2>
      <div class="plot" id="wk-plot" role="img"></div>
      <div class="legend" id="wk-legend"></div>
    </section>
    <section aria-labelledby="tr-h">
      <h2 id="tr-h"><span data-i18n="compliance.trend.title">每週完成率</span> <span class="meta" id="tr-sub"></span><span id="tr-q"></span></h2>
      <div class="plot" id="tr-plot" role="img"></div>
    </section>
  </div>

  <section aria-labelledby="ls-h">
      <h2 id="ls-h"><span data-i18n="compliance.list.title">每堂課</span> <span class="meta" id="ls-sub"></span><span id="ls-q"></span></h2>
      <div class="filters" id="filters"></div>
      <div class="list" id="list"></div>
      <div class="more" id="more"></div>
    </section>
</main>
<script>
const T = (k, p) => (window.I18N ? I18N.t("compliance." + k, p) : k);
const F = window.I18N ? I18N.fmt : null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const API = "/api/v1/overview/plan/compliance";
const SCHED = "/api/v1/overview/plan/schedule/page";
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const isoOf = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const dOf = (iso) => new Date(iso + "T00:00:00");
const addDays = (iso, n) => { const d = dOf(iso); d.setDate(d.getDate() + n); return isoOf(d); };
const mondayOf = (iso) => addDays(iso, -((dOf(iso).getDay() + 6) % 7));
const md = (iso) => (F ? F.date(iso, "md") : iso.slice(5));
const mdw = (iso) => (F ? F.date(iso, "mdw") : iso.slice(5));
const n0 = (x) => (x == null ? "–" : F ? F.num(x, 0) : Math.round(x));
const h1 = (x) => (x == null ? "–" : F ? F.num(x, 1) : (+x).toFixed(1));
const pc = (r) => (r == null ? "–" : Math.round(r * 100));
const hm = (s) => (s == null ? "" : F ? F.dur(s, "hm") : `${Math.round(s / 60)}′`);
const store = { get(k, d) { try { const v = localStorage.getItem("compliance." + k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem("compliance." + k, JSON.stringify(v)); } catch (_) { /* blocked */ } } };
const STATUS = ["done", "partial", "off_plan", "missed", "open"];
const ICON = { done: "✓", partial: "◐", off_plan: "≠", missed: "✗", open: "…" };
const sw = (s) => `<span class="st st-${s}"><span aria-hidden="true">${ICON[s]}</span><span class="lb">${esc(T("status." + s))}</span></span>`;
const q = (tip, label) => `<button type="button" class="q" data-tip="${esc(tip)}" aria-label="${esc(label || T("help"))}">?</button>`;

const S = { period: store.get("period", "4w"), a: store.get("a", null), b: store.get("b", null), metric: store.get("metric", "tss"),
  filter: "all", limit: 40, data: null, today: null };
const charts = {};
function chart(id) {
  if (!charts[id]) { charts[id] = echarts.init($(id)); new ResizeObserver(() => charts[id].resize()).observe($(id)); }
  return charts[id];
}

function range(today, phase) {
  const ws = mondayOf(today);
  if (S.period === "12w") return [addDays(ws, -77), today];
  if (S.period === "phase" && phase) return [phase.start, today < phase.end ? today : phase.end];
  if (S.period === "custom" && S.a && S.b && S.a <= S.b) return [S.a, S.b];
  return [addDays(ws, -21), today];
}

async function load() {
  document.querySelectorAll("#period button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.p === S.period)));
  $("custom").hidden = S.period !== "custom";
  const today = S.today || isoOf(new Date());
  const [a, b] = range(today, S.data && S.data.current_phase);
  $("range").textContent = `${mdw(a)} – ${mdw(b)}`;
  try {
    const r = await fetch(`${API}?start=${a}&end=${b}`);
    const j = await r.json();
    if (!r.ok) throw new Error(typeof j.detail === "string" ? j.detail : r.statusText);
    const first = !S.data;
    S.data = j; S.today = j.today;
    // the server's today and the phase decide the range: reload once when it differs
    const [a2, b2] = range(j.today, j.current_phase);
    if (first && (a2 !== a || b2 !== b)) return load();
    if (!$("c-a").value) { $("c-a").value = a; $("c-b").value = b; }
    render();
  } catch (e) {
    $("kpis").innerHTML = `<div class="kpi"><div class="err">${esc(T("load_failed", { error: e.message }))}</div></div>`;
  }
}

function kpi(k, tip, v, sub, extra = "") {
  return `<div class="kpi"><div class="k"><span>${esc(k)}</span>${q(tip, k)}</div><div class="v">${v}</div>${extra}<div class="sub">${sub}</div></div>`;
}
function render() {
  const d = S.data, t = d.totals;
  const split = STATUS.filter((s) => s !== "open" && t[s]).map((s) => `<i class="bg-${s}" style="flex:${t[s]}" title="${esc(T("status." + s))} ${t[s]}"></i>`).join("");
  const st = d.streak;
  $("kpis").innerHTML = [
    kpi(T("kpi.rate"), T("kpi.rate_tip"), t.due ? `${pc(t.rate)}<small>%</small>` : "–",
      t.due ? esc(T("kpi.rate_sub", { done: t.completed, due: t.due })) + (t.open ? ` · ${esc(T("kpi.open", { n: t.open }))}` : "") : esc(T("empty_short")),
      t.due ? `<div class="split" role="img" aria-label="${esc(STATUS.filter((s) => s !== "open").map((s) => `${T("status." + s)} ${t[s]}`).join("，"))}">${split}</div>` : ""),
    kpi(T("kpi.ok"), T("kpi.ok_tip"), t.due ? `${pc(t.ok_rate)}<small>%</small>` : "–",
      esc(T("kpi.ok_sub", { n: t.done, partial: t.partial, off: t.off_plan }))),
    kpi(T("kpi.tss"), T("kpi.tss_tip"), t.tss_pct != null ? `${t.tss_pct}<small>%</small>` : "–",
      esc(T("kpi.tss_sub", { a: n0(t.actual_tss), p: n0(t.planned_tss) })),
      `<div class="track" role="img" aria-label="${esc(T("kpi.tss_sub", { a: n0(t.actual_tss), p: n0(t.planned_tss) }))}"><i style="width:${Math.min(100, (t.tss_pct || 0) / 1.5)}%"></i><b style="left:${100 / 1.5}%"></b></div>`),
    kpi(T("kpi.hours"), T("kpi.hours_tip"), `${h1(t.actual_hours)}<small>/ ${h1(t.planned_hours)} h</small>`,
      esc(t.planned_hours ? T("kpi.hours_sub", { pct: Math.round(t.actual_hours / t.planned_hours * 100) }) : T("empty_short"))),
    kpi(T("kpi.streak"), T("kpi.streak_tip", { pct: Math.round(st.threshold * 100) }), `${st.weeks}<small>${esc(T("kpi.weeks_unit"))}</small>`,
      esc(T("kpi.streak_sub", { best: st.best }))),
  ].join("");
  renderPhase(d.phase);
  renderWeeks(d.weeks);
  renderTrend(d.weeks, st);
  renderKinds(d.by_kind);
  renderList();
}

function renderPhase(p) {
  $("phase-card").hidden = !p;
  if (!p) return;
  $("ph-sub").textContent = `${md(p.start)} – ${md(p.end)}`;
  $("ph-q").innerHTML = q(T("phase.tip"));
  $("phase").innerHTML = `<div class="ph-${esc(p.kind)}"><div class="pl"><span class="dotp"></span>${esc(p.label || "")}</div>
      <div class="meta">${esc(T("phase.days", { done: p.days_done, total: p.days_total }))}</div>
      <div class="track" role="img" aria-label="${esc(T("phase.time_aria", { pct: p.time_pct }))}"><i style="width:${p.time_pct || 0}%;background:var(--ph)"></i></div></div>
    <div class="stat"><div class="k">${esc(T("phase.rate"))}</div><div class="v">${p.due ? pc(p.rate) + "<small>%</small>" : "–"}</div><div class="meta">${esc(T("kpi.rate_sub", { done: p.completed, due: p.due }))}</div></div>
    <div class="stat"><div class="k">${esc(T("phase.left"))}</div><div class="v">${p.sessions_left}<small>/ ${p.sessions_total}</small></div><div class="meta">${esc(T("phase.left_sub"))}</div></div>
    <div class="stat"><div class="k">${esc(T("phase.tss"))}</div><div class="v">${n0(p.actual_tss)}<small>/ ${n0(p.planned_tss)}</small></div><div class="meta">${esc(T("phase.tss_sub"))}</div></div>`;
}

function axisBase() {
  return { textStyle: { fontFamily: "system-ui, sans-serif" }, animation: false,
    grid: { left: 40, right: 12, top: 14, bottom: 26 },
    tooltip: { trigger: "axis", backgroundColor: css("--panel"), borderColor: css("--line"), textStyle: { color: css("--text"), fontSize: 12 },
      axisPointer: { type: "shadow", shadowStyle: { color: "rgba(127,127,127,.08)" } } } };
}
const xAxis = (labels) => ({ type: "category", data: labels, axisTick: { show: false }, axisLine: { lineStyle: { color: css("--line") } },
  axisLabel: { color: css("--muted"), fontSize: 11, hideOverlap: true } });
const yAxis = (extra = {}) => ({ type: "value", splitLine: { lineStyle: { color: css("--line"), type: [3, 3] } },
  axisLabel: { color: css("--muted"), fontSize: 11 }, ...extra });

function renderWeeks(ws) {
  const m = S.metric;
  document.querySelectorAll("#metric button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.m === m)));
  $("wk-q").innerHTML = q(T("weeks.tip"));
  const P = ws.map((w) => (m === "tss" ? w.planned_tss : w.planned_hours));
  const A = ws.map((w) => (w.start > S.today ? null : m === "tss" ? w.done_tss : w.done_hours));
  const unit = m === "tss" ? "" : " h";
  const lab = ws.map((w) => md(w.start));
  $("wk-plot").setAttribute("aria-label", T("weeks.aria"));
  chart("wk-plot").setOption({ ...axisBase(), xAxis: xAxis(lab), yAxis: yAxis(),
    tooltip: { ...axisBase().tooltip, formatter: (ps) => {
      const w = ws[ps[0].dataIndex];
      const f = (x) => (x == null ? "–" : m === "tss" ? n0(x) : h1(x) + " h");
      return `<b>${esc(md(w.start))} – ${esc(md(w.end))}</b>${w.phase_label ? ` · ${esc(w.phase_label)}` : ""}<br>${esc(T("weeks.planned"))} ${f(P[ps[0].dataIndex])}<br>${esc(T("weeks.actual"))} ${f(A[ps[0].dataIndex])}` +
        (w.due ? `<br>${esc(T("kpi.rate_sub", { done: w.completed, due: w.due }))}` : "");
    } },
    series: [
      { name: T("weeks.planned"), type: "bar", data: P, barMaxWidth: 26, barGap: "-100%", z: 1,
        itemStyle: { color: "transparent", borderColor: css("--muted"), borderWidth: 1.5, borderType: "dashed", borderRadius: [4, 4, 0, 0] } },
      { name: T("weeks.actual"), type: "bar", data: A, barMaxWidth: 26, z: 2,
        itemStyle: { color: css("--s1"), borderRadius: [4, 4, 0, 0] } },
    ] }, true);
  $("wk-legend").innerHTML = `<span><i class="ol"></i>${esc(T("weeks.planned"))}</span><span><i style="background:${css("--s1")}"></i>${esc(T("weeks.actual"))}${unit}</span>`;
}

function renderTrend(ws, st) {
  const rows = ws.filter((w) => w.due);
  $("tr-q").innerHTML = q(T("trend.tip", { pct: Math.round(st.threshold * 100) }));
  $("tr-sub").textContent = rows.length ? T("trend.sub", { pct: Math.round(st.threshold * 100) }) : "";
  $("tr-plot").setAttribute("aria-label", T("trend.aria"));
  const th = Math.round(st.threshold * 100);
  chart("tr-plot").setOption({ ...axisBase(), grid: { left: 40, right: 38, top: 14, bottom: 26 },
    tooltip: { ...axisBase().tooltip, axisPointer: { type: "line", lineStyle: { color: css("--faint") } }, formatter: (ps) => {
      const w = rows[ps[0].dataIndex];
      return `<b>${esc(md(w.start))} – ${esc(md(w.end))}</b><br>${esc(T("trend.rate"))} ${pc(w.rate)}%<br>${esc(T("kpi.rate_sub", { done: w.completed, due: w.due }))}` +
        (w.current ? `<br>${esc(T("trend.current"))}` : "");
    } },
    xAxis: xAxis(rows.map((w) => md(w.start))), yAxis: yAxis({ min: 0, max: 100, axisLabel: { color: css("--muted"), fontSize: 11, formatter: "{value}%" } }),
    series: [{ type: "line", data: rows.map((w) => ({ value: Math.round((w.rate || 0) * 100),
        itemStyle: { color: (w.rate || 0) >= st.threshold ? css("--good") : css("--watch"), borderColor: css("--panel"), borderWidth: 2 } })),
      symbol: "circle", symbolSize: 9, lineStyle: { width: 2, color: css("--s1") },
      markLine: { silent: true, symbol: "none", label: { color: css("--muted"), fontSize: 11, formatter: `${th}%` },
        lineStyle: { color: css("--faint"), type: [4, 4] }, data: [{ yAxis: th }] } }] }, true);
}

function renderKinds(ks) {
  $("kd-q").innerHTML = q(T("kinds.tip"));
  if (!ks.length) { $("kinds").innerHTML = `<p class="meta">${esc(T("empty"))}</p>`; $("st-legend").innerHTML = ""; return; }
  $("kinds").innerHTML = ks.map((k) => {
    const segs = ["done", "partial", "off_plan", "missed"].filter((s) => k[s]).map((s) =>
      `<i class="bg-${s}" style="flex:${k[s]}" title="${esc(T("status." + s))} ${k[s]}"></i>`).join("");
    return `<div class="kr k-${esc(k.kind)}"><span class="kl"><i></i>${esc(T("kind." + k.kind))}</span>
      <div class="kbar" role="img" aria-label="${esc(T("kinds.aria", { kind: T("kind." + k.kind), done: k.completed, due: k.due }))}">${segs}</div>
      <span class="n"><b>${k.due ? pc(k.rate) + "%" : "–"}</b> · ${k.completed}/${k.due}</span></div>`;
  }).join("");
  $("st-legend").innerHTML = ["done", "partial", "off_plan", "missed"].map((s) => `<span><i class="bg-${s}"></i>${sw(s)}</span>`).join("");
}

function renderList() {
  const d = S.data;
  const counts = Object.fromEntries(STATUS.map((s) => [s, d.sessions.filter((r) => r.status === s).length]));
  $("ls-q").innerHTML = q(T("list.tip"));
  $("ls-sub").textContent = T("list.sub", { n: d.sessions.length });
  $("filters").innerHTML = [["all", T("list.all"), d.sessions.length], ...STATUS.filter((s) => counts[s]).map((s) => [s, T("status." + s), counts[s]])]
    .map(([k, l, n]) => `<button type="button" class="fchip" data-f="${k}" aria-pressed="${S.filter === k}">${esc(l)} ${n}</button>`).join("");
  const rows = d.sessions.filter((r) => S.filter === "all" || r.status === S.filter);
  if (!rows.length) { $("list").innerHTML = `<p class="meta">${esc(T("empty"))}</p>`; $("more").innerHTML = ""; return; }
  $("list").innerHTML = rows.slice(0, S.limit).map((r) => {
    const act = r.actual_tss != null || r.actual_s ? `${r.actual_s ? hm(r.actual_s) : ""}${r.actual_tss != null ? ` · TSS ${n0(r.planned_tss)}→${n0(r.actual_tss)}` : ""}`
      : `${r.minutes ? r.minutes + "′" : ""} · TSS ${n0(r.planned_tss)}`;
    const tip = [r.title, r.off_text, r.duration_pct != null ? T("list.dur_pct", { pct: r.duration_pct }) : "", r.tss_pct != null ? T("list.tss_pct", { pct: r.tss_pct }) : ""].filter(Boolean).join("\n");
    return `<a class="row k-${esc(r.kind)}" href="${SCHED}?day=${r.day}&uid=${encodeURIComponent(r.uid)}" title="${esc(tip)}">
      <span class="d">${esc(md(r.day))}</span><span class="kd" aria-hidden="true"></span>
      <span class="t">${esc(r.title)}<span class="meta">${esc(T("kind." + r.kind))}</span></span>
      ${sw(r.status)}<span class="p">${r.pct != null ? r.pct + "%" : "–"}</span><span class="x">${esc(act)}</span></a>`;
  }).join("");
  $("more").innerHTML = rows.length > S.limit ? `<button class="btn" type="button" id="more-btn">${esc(T("list.more", { n: rows.length - S.limit }))}</button>` : "";
}

// ---- wiring ----
$("period").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-p]"); if (!b) return;
  S.period = b.dataset.p; store.set("period", S.period);
  if (S.period === "custom") { $("custom").hidden = false; document.querySelectorAll("#period button").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); $("c-a").focus(); return; }
  load();
});
$("c-go").onclick = () => {
  const a = $("c-a").value, b = $("c-b").value;
  if (!a || !b || a > b) { $("range").textContent = T("period.bad"); return; }
  S.a = a; S.b = b; store.set("a", a); store.set("b", b); load();
};
$("metric").addEventListener("click", (e) => { const b = e.target.closest("button[data-m]"); if (!b) return; S.metric = b.dataset.m; store.set("metric", S.metric); renderWeeks(S.data.weeks); });
$("filters").addEventListener("click", (e) => { const b = e.target.closest("[data-f]"); if (!b) return; S.filter = b.dataset.f; S.limit = 40; renderList(); });
$("more").addEventListener("click", (e) => { if (e.target.id === "more-btn") { S.limit += 80; renderList(); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (S.data) render(); });

// ? help: hover shows a popup, click / tap pins it; Esc or a click elsewhere closes it
const QT = { el: null, pinned: null };
function qShow(t) {
  qHide();
  const d = document.createElement("div");
  d.className = "qpop"; d.setAttribute("role", "tooltip"); d.textContent = t.dataset.tip;
  document.body.appendChild(d);
  const r = t.getBoundingClientRect(), w = d.offsetWidth, h = d.offsetHeight;
  d.style.left = `${Math.max(12, Math.min(r.left - 8, innerWidth - w - 12))}px`;
  d.style.top = `${r.bottom + 6 + h > innerHeight - 8 ? Math.max(8, r.top - h - 6) : r.bottom + 6}px`;
  QT.el = d;
}
function qHide() { QT.el?.remove(); QT.el = null; }
document.addEventListener("mouseover", (e) => { const t = e.target.closest?.(".q"); if (t && !QT.pinned) qShow(t); });
document.addEventListener("mouseout", (e) => { if (e.target.closest?.(".q") && !QT.pinned) qHide(); });
document.addEventListener("focusin", (e) => { const t = e.target.closest?.(".q"); if (t && !QT.pinned) qShow(t); });
document.addEventListener("focusout", () => { if (!QT.pinned) qHide(); });
document.addEventListener("click", (e) => {
  const t = e.target.closest(".q");
  if (t && QT.pinned !== t) { QT.pinned = t; qShow(t); return; }
  QT.pinned = null; qHide();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { QT.pinned = null; qHide(); } });
addEventListener("scroll", () => { if (QT.pinned) qShow(QT.pinned); else qHide(); }, { passive: true, capture: true });

load();
</script>
</body>
