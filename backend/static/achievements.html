<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登山越野成就</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #fff; --text: #1d232b; --muted: #6a7482; --line: #e1e5ea;
  --accent: #2563eb; --soft: #e8efff; --baiyue: #b45309; --mid: #0f766e; --low: #64748b; --trail: #16a34a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --panel: #171b21; --text: #e6e9ee; --muted: #97a1ae; --line: #2a313a;
    --accent: #60a5fa; --soft: #1c2a40; --baiyue: #f59e0b; --mid: #2dd4bf; --low: #94a3b8; --trail: #4ade80;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --panel: #171b21; --text: #e6e9ee; --muted: #97a1ae; --line: #2a313a;
  --accent: #60a5fa; --soft: #1c2a40; --baiyue: #f59e0b; --mid: #2dd4bf; --low: #94a3b8; --trail: #4ade80;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif; }
header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 16px;
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
h1 { font-size: 17px; margin: 0; }
header a { color: var(--accent); text-decoration: none; font-size: 13px; }
main { max-width: 1280px; margin: 0 auto; padding: 16px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.card .k { color: var(--muted); font-size: 12px; }
.card .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.peaks { margin: 12px 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.peaks .badge { display: inline-block; margin: 3px 4px 3px 0; padding: 2px 8px; border-radius: 12px;
  background: color-mix(in srgb, var(--baiyue) 15%, transparent); color: var(--baiyue); font-size: 13px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 12px 0;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.filters label { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
input, select, button { font: inherit; color: var(--text); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
input[type=number] { width: 72px; }
input[type=search] { width: 180px; }
button { cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip { cursor: pointer; user-select: none; padding: 2px 10px; border-radius: 12px; border: 1px solid var(--line); font-size: 13px; }
.chip.on { background: var(--soft); border-color: var(--accent); color: var(--accent); }
.tablewrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { font-size: 12px; color: var(--muted); font-weight: 600; cursor: pointer; }
th.sorted { color: var(--accent); }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.hidden-row { opacity: .4; }
.cls { font-size: 12px; padding: 1px 7px; border-radius: 10px; }
.cls-百岳 { background: color-mix(in srgb, var(--baiyue) 18%, transparent); color: var(--baiyue); }
.cls-中級山 { background: color-mix(in srgb, var(--mid) 18%, transparent); color: var(--mid); }
.cls-郊山 { background: color-mix(in srgb, var(--low) 18%, transparent); color: var(--low); }
.kind { font-size: 12px; color: var(--muted); }
.name { cursor: text; border-bottom: 1px dashed transparent; }
.name:hover { border-bottom-color: var(--muted); }
.peak-inline { color: var(--baiyue); font-size: 12px; }
.rep { font-size: 11px; color: var(--accent); cursor: pointer; }
.days td { background: var(--bg); font-size: 12.5px; color: var(--muted); }
.x { cursor: pointer; color: var(--muted); }
.meta { color: var(--muted); font-size: 12px; }
dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--text);
  width: min(720px, 92vw); }
dialog textarea { width: 100%; height: 320px; font: 13px/1.5 ui-monospace, Consolas, monospace;
  background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
.empty { padding: 40px; text-align: center; color: var(--muted); }
@media (max-width: 640px) { input[type=search] { width: 100%; } }
</style>
</head>
<body>
<script src="/api/v1/static/shell.js" data-page="achievements"></script>
<header>
  <h1>登山 / 越野成就</h1>
  <span class="meta" id="peakinfo"></span>
</header>
<main>
  <section class="cards" id="cards"></section>
  <section class="peaks" id="peaks" hidden></section>

  <section class="filters">
    <label>類型 <select id="kind">
      <option value="">全部</option><option>越野跑</option><option>登山健行</option></select></label>
    <label>等級
      <span class="chip on" data-c="百岳" data-tw-only>百岳</span>
      <span class="chip on" data-c="中級山">中級山</span>
      <span class="chip on" data-c="郊山">郊山</span></label>
    <label><input type="search" id="q" placeholder="搜尋名稱、山名、備註"></label>
    <label>距離 <input type="number" id="min_km" placeholder="最少" step="1"> –
      <input type="number" id="max_km" placeholder="最多" step="1"> km</label>
    <label>爬升 ≥ <input type="number" id="min_climb" placeholder="0" step="100"> m</label>
    <label>最高點 ≥ <input type="number" id="min_top" placeholder="0" step="500"> m</label>
    <label>日期 <input type="date" id="date_from"> – <input type="date" id="date_to"></label>
    <label>排序 <select id="sort">
      <option value="date">日期</option><option value="climbing">爬升</option>
      <option value="distance">距離</option><option value="top">最高點</option>
      <option value="moving">移動時間</option><option value="vam">爬坡速度</option>
      <option value="efd">等效距離</option></select></label>
    <label>顯示 <select id="limit">
      <option value="10">Top 10</option><option value="20">Top 20</option>
      <option value="50">Top 50</option><option value="">全部</option></select></label>
    <label><input type="checkbox" id="showhidden"> 含隱藏</label>
    <button class="primary" id="copy">複製給登山團</button>
  </section>

  <div class="tablewrap"><table>
    <thead><tr>
      <th></th><th data-s="date">日期</th><th>名稱</th><th>等級</th>
      <th data-s="distance" class="num">距離</th><th data-s="climbing" class="num">爬升</th>
      <th data-s="moving" class="num">移動時間</th><th data-s="top" class="num">最高點</th>
      <th data-s="vam" class="num" title="最大一段爬坡的爬升速度（只計移動時間）">爬坡 m/h</th>
      <th class="num" title="移動時間 ÷ 上河地圖標準時間。1.0 = 剛好上河時間；越小越快">上河比</th>
      <th></th>
    </tr></thead>
    <tbody id="rows"><tr><td colspan="11" class="empty">載入中…</td></tr></tbody>
  </table></div>
  <p class="meta">名稱可直接點擊修改；上河比請填上河地圖標準時間（分鐘）。所有編輯存在本機，不會改到原始紀錄。</p>
</main>

<dialog id="dlg">
  <p><b>複製內容</b> <span class="meta">已複製到剪貼簿，也可以在這裡調整後再複製</span></p>
  <textarea id="exporttext"></textarea>
  <p style="text-align:right"><button id="recopy">再複製一次</button> <button id="close">關閉</button></p>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const API = "/api/v1/achievements";
const S = { desc: true, open: new Set() };
let TW = true;                            // 地區 (engine/region.py): outside Taiwan the 百岳 cards go
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hm = (s) => { if (!s) return "—"; s = Math.round(s); return `${Math.floor(s / 3600)}:${String(Math.floor(s % 3600 / 60)).padStart(2, "0")}`; };
const num = (v, d = 0) => v == null ? "—" : (+v).toLocaleString(undefined, { maximumFractionDigits: d, minimumFractionDigits: d });

function params(forExport) {
  const p = new URLSearchParams();
  const classes = [...document.querySelectorAll(".chip.on")].map((c) => c.dataset.c);
  if (classes.length < 3) p.set("mclass", classes.join(","));
  for (const k of ["kind", "q", "min_km", "max_km", "min_climb", "min_top", "date_from", "date_to", "sort"]) {
    const v = $(k).value.trim();
    if (v) p.set(k, v);
  }
  if (!forExport) {
    if ($("limit").value) p.set("limit", $("limit").value);
    p.set("desc", S.desc);
    if ($("showhidden").checked) p.set("include_hidden", "true");
  } else if ($("limit").value) p.set("limit", $("limit").value);
  return p.toString();
}

function save() { try { localStorage.setItem("ach", params(false)); } catch {} }
function restore() {
  try {
    const p = new URLSearchParams(localStorage.getItem("ach") || "");
    for (const [k, v] of p) if ($(k)) $(k).value = v;
    if (p.has("mclass")) { const on = p.get("mclass").split(",");
      document.querySelectorAll(".chip").forEach((c) => c.classList.toggle("on", on.includes(c.dataset.c))); }
    if (p.has("desc")) S.desc = p.get("desc") === "true";
    if (p.has("include_hidden")) $("showhidden").checked = true;
  } catch {}
}

async function load() {
  TW = await fetch("/api/v1/region").then((r) => r.json()).then((r) => r.region === "tw").catch(() => true);
  save();
  const r = await fetch(`${API}?${params(false)}`);
  if (!r.ok) { $("rows").innerHTML = `<tr><td colspan="11" class="empty">錯誤：${esc(await r.text())}</td></tr>`; return; }
  const data = await r.json();
  renderSummary(data);
  renderRows(data);
}

function renderSummary({ summary: s, total, peaks_loaded }) {
  const c = s.by_class || {};
  $("cards").innerHTML = [
    ["百岳座數", s.baiyue_peaks.length || (peaks_loaded ? 0 : "—")],
    ["百岳 / 中級山 / 郊山", `${c["百岳"] || 0} / ${c["中級山"] || 0} / ${c["郊山"] || 0}`],
    ["符合條件", `${total} 次`],
    ["總爬升", `${num(s.total_climb_m)} m`],
    ["最高到達", s.highest ? `${num(s.highest)} m` : "—"],
    ["單次最大爬升", s.biggest_climb_m ? `${num(s.biggest_climb_m)} m` : "—"],
  ].filter(([k]) => TW || !k.includes("百岳"))
   .map(([k, v]) => `<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
  $("peakinfo").textContent = !TW ? "" : peaks_loaded ? `百岳資料 ${peaks_loaded} 座` : "尚未載入百岳座標，山名比對暫停";
  const pk = TW ? s.baiyue_peaks : [];
  $("peaks").hidden = !pk.length;
  $("peaks").innerHTML = `<div class="meta" style="margin-bottom:4px">已登百岳（依海拔）</div>` +
    pk.map((p) => `<span class="badge" title="第一次：${p.first}${p.times > 1 ? `，共 ${p.times} 次` : ""}">${esc(p.name)} ${p.elevation_m}${p.times > 1 ? ` ×${p.times}` : ""}</span>`).join("");
}

function renderRows({ rows }) {
  document.querySelectorAll("th[data-s]").forEach((th) => th.classList.toggle("sorted", th.dataset.s === $("sort").value));
  if (!rows.length) { $("rows").innerHTML = `<tr><td colspan="11" class="empty">沒有符合條件的紀錄</td></tr>`; return; }
  $("rows").innerHTML = rows.map((r) => {
    const open = S.open.has(r.id);
    const peaks = r.peaks.length ? `<div class="peak-inline">▲ ${r.peaks.map((p) => esc(p.name)).join("、")}</div>` : "";
    const rep = r.route_count > 1 ? ` <span class="rep" data-route="${esc(r.route_key)}" title="同一路線走過 ${r.route_count} 次">×${r.route_count}</span>` : "";
    const bc = r.best_climb || {};
    const days = open && r.days.length ? r.days.map((d, i) =>
      `<tr class="days"><td></td><td>第 ${i + 1} 天 ${d.date.slice(5)}</td><td colspan="2"></td>
       <td class="num">${num(d.distance_km, 1)} km</td><td class="num">↑${num(d.climbing_m)} m</td>
       <td class="num">${hm(d.moving_s)}</td><td class="num">${d.top_m ? num(d.top_m) + " m" : "—"}</td><td colspan="3"></td></tr>`).join("") : "";
    return `<tr class="${r.hidden ? "hidden-row" : ""}" data-id="${esc(r.id)}">
      <td class="x toggle">${r.days.length ? (open ? "▾" : "▸") : ""}</td>
      <td>${r.start.slice(0, 10)}</td>
      <td><span class="name" contenteditable="plaintext-only" spellcheck="false">${esc(r.name)}</span>${rep}${peaks}
          <div class="kind">${esc(r.kind)}${r.days.length ? ` · ${r.days.length} 天` : ""}</div></td>
      <td><span class="cls cls-${r.mclass}">${r.mclass}</span></td>
      <td class="num">${num(r.distance_km, 1)} km</td>
      <td class="num">${num(r.climbing_m)} m</td>
      <td class="num">${hm(r.moving_s)}</td>
      <td class="num">${r.top_m ? num(r.top_m) + " m" : "—"}</td>
      <td class="num" title="${bc.gain_m ? `${bc.gain_m} m 爬升 · 坡度 ${(bc.grade * 100).toFixed(0)}%` : ""}">${bc.vam_m_per_h ? num(bc.vam_m_per_h) : "—"}</td>
      <td class="num"><input type="number" class="sh" min="0" step="10" style="width:64px" title="上河標準時間（分鐘）"
          value="${r.shang_he_min ?? ""}" placeholder="分鐘">${r.shang_he_ratio ? ` <b>${r.shang_he_ratio.toFixed(2)}</b>` : ""}</td>
      <td class="x hide" title="${r.hidden ? "取消隱藏" : "隱藏（不列入給登山團的清單）"}">${r.hidden ? "↺" : "✕"}</td>
    </tr>${days}`;
  }).join("");
}

async function annotate(id, body) {
  await fetch(`${API}/records/${encodeURIComponent(id)}`, { method: "PUT",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
}

$("rows").addEventListener("click", async (e) => {
  const tr = e.target.closest("tr[data-id]");
  if (!tr) return;
  const id = tr.dataset.id;
  if (e.target.classList.contains("toggle")) { S.open.has(id) ? S.open.delete(id) : S.open.add(id); load(); }
  if (e.target.classList.contains("hide")) {
    await annotate(id, { hidden: !tr.classList.contains("hidden-row") }); load();
  }
  if (e.target.classList.contains("rep")) {
    const name = prompt("幫這條路線取名（之後每次走這條路線都會套用）：");
    if (name != null) {
      await fetch(`${API}/routes/${encodeURIComponent(e.target.dataset.route)}`, { method: "PUT",
        headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name }) });
      load();
    }
  }
});
$("rows").addEventListener("keydown", (e) => {
  if (e.target.classList.contains("name") && e.key === "Enter") { e.preventDefault(); e.target.blur(); }
});
$("rows").addEventListener("focusout", async (e) => {
  const tr = e.target.closest("tr[data-id]");
  if (!tr) return;
  if (e.target.classList.contains("name")) await annotate(tr.dataset.id, { name: e.target.textContent.trim() });
});
$("rows").addEventListener("change", async (e) => {
  const tr = e.target.closest("tr[data-id]");
  if (tr && e.target.classList.contains("sh")) {
    await annotate(tr.dataset.id, { shang_he_min: e.target.value ? +e.target.value : null });
    load();
  }
});

document.querySelectorAll(".chip").forEach((c) => c.onclick = () => { c.classList.toggle("on"); load(); });
document.querySelectorAll("th[data-s]").forEach((th) => th.onclick = () => {
  if ($("sort").value === th.dataset.s) S.desc = !S.desc; else { $("sort").value = th.dataset.s; S.desc = true; }
  load();
});
for (const id of ["kind", "sort", "limit", "showhidden", "date_from", "date_to"]) $(id).onchange = load;
let t;
for (const id of ["q", "min_km", "max_km", "min_climb", "min_top"]) $(id).oninput = () => { clearTimeout(t); t = setTimeout(load, 300); };

async function copyExport() {
  const text = await (await fetch(`${API}/export?${params(true)}`)).text();
  $("exporttext").value = text;
  try { await navigator.clipboard.writeText(text); } catch {}
  $("dlg").showModal();
}
$("copy").onclick = copyExport;
$("recopy").onclick = async () => { try { await navigator.clipboard.writeText($("exporttext").value); } catch {} };
$("close").onclick = () => $("dlg").close();

restore();
load();
</script>
</body>
</html>
