    `<button data-c="${k}" class="${k === color ? "on" : ""}" aria-pressed="${k === color}" ${has(k) ? "" : "disabled"}>${t}</button>`).join("")}</div>`;
  tb.appendChild(legend);
  tb.onclick = (e) => {
    const b = e.target.closest("button[data-c]"); if (!b || b.disabled || b.dataset.c === color) return;
    color = b.dataset.c; saveMapPrefs({ color });
    tb.querySelectorAll("button[data-c]").forEach((x) => { x.classList.toggle("on", x === b); x.setAttribute("aria-pressed", String(x === b)); });
    drawRoute(color);
  };
  drawRoute(color);

  // hover: a marker at the shared sample; hovering the route drives the charts
  const marker = L.circleMarker([0, 0], { radius: 7, color: "#fff", weight: 2.5, fillColor: "#111827", fillOpacity: 0.9, interactive: false });
  marker.bindTooltip("", { permanent: true, direction: "top", offset: [0, -8], className: "hovtip" });
  const readout = (i) => [s.t[i] != null ? fmtDur(s.t[i]) : null, s.d?.[i] != null ? s.d[i].toFixed(2) + " km" : null,
    s.hr?.[i] != null ? s.hr[i] + " bpm" : null, s.power?.[i] != null ? s.power[i] + " W" : null,
    s.elev?.[i] != null ? Math.round(s.elev[i]) + " m" : null, s.grade?.[i] != null ? s.grade[i].toFixed(1) + "%" : null]
    .filter(Boolean).join(" · ");
  const m = {
    workout: s.workout, selfShow: true, dead: () => !el.isConnected || !el._lmap,
    show(i) {
      const g = nearestGps(s, i); if (g < 0) return this.hide();
      marker.setLatLng(ll(g));
      if (!map.hasLayer(marker)) marker.addTo(map);
      marker.setTooltipContent(readout(i));
    },
    hide() { if (map.hasLayer(marker)) map.removeLayer(marker); },
  };
  let pts = null;   // route points in layer pixels, recomputed after zoom
  map.on("zoomend viewreset", () => { pts = null; });
  map.on("mousemove", (e) => {
    const p = e.layerPoint;
    hoverEmit(m, () => {
      if (!el._lmap) return null;
      pts ||= s.gps.map((i) => map.latLngToLayerPoint(ll(i)));
      let best = -1, bd = 24 * 24;           // within 24 px of the route
      for (let k = 0; k < pts.length; k++) {
        const dx = pts[k].x - p.x, dy = pts[k].y - p.y, d2 = dx * dx + dy * dy;
        if (d2 < bd) { bd = d2; best = k; }
      }
      return best < 0 ? null : s.gps[best];
    });
  });
  map.on("mouseout", () => hoverEmit(m, null));
  el.addEventListener("mouseleave", () => hoverEmit(m, null));
  HOVER.members.add(m);
  const n = s.gps.length;
  addTip(card, `GPS 軌跡 ${n} 點 · 右上角切換底圖和疊圖 · 滑鼠移到路線上，其他圖表會同步標出同一時間`);
  new ResizeObserver(() => { if (el._lmap) map.invalidateSize(); }).observe(el);
}

// Day calendar for a daily count series ([iso date, n] points): a filled cell = done that day,
// plus the counts that matter (this week, the last 4 weeks, the whole range).
function drawCalendar(card, s) {
  const pts = s.data.points.filter((p) => p[1] != null && p[1] > 0);
  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const end = new Date(($("end").value || iso(new Date())) + "T00:00:00");
  const begin = new Date(($("begin").value || iso(new Date(end.getTime() - 364 * 864e5))) + "T00:00:00");
  const mon = new Date(end); mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7));
  const d28 = new Date(end); d28.setDate(d28.getDate() - 27);
  const n = (from) => pts.filter((p) => p[0] >= iso(from) && p[0] <= iso(end)).length;
  const weeks = Math.max(1, (end - begin) / (7 * 864e5));
  card.insertAdjacentHTML("beforeend", `<p class="meta cal-sum">本週 <b>${n(mon)}</b> 次 · 近 4 週 <b>${n(d28)}</b> 次
    · 這段期間 <b>${pts.length}</b> 次（平均每週 ${(pts.length / weeks).toFixed(1)} 次）</p>`);
  const months = (end.getFullYear() - begin.getFullYear()) * 12 + end.getMonth() - begin.getMonth() + 1;
  const box = document.createElement("div");
  box.className = "plot";
  box.style.height = `${months > 7 ? 190 : 170}px`;
  card.appendChild(box);
  const css = (v) => getComputedStyle(document.body).getPropertyValue(v).trim();
  const ch = echarts.init(box);
  ch.setOption({
    tooltip: { formatter: (p) => `${p.value[0]}：${p.value[1] > 0 ? "有練" : "沒練"}` },
    visualMap: { show: false, min: 0, max: 1, inRange: { color: [css("--line") || "#e5e5e5", s.color || "#e87ba4"] } },
    calendar: { range: [iso(begin), iso(end)], top: 24, left: 34, right: 12, cellSize: ["auto", 14],
      splitLine: { show: false },
      itemStyle: { color: css("--line") || "#e5e5e5", borderColor: css("--panel") || "#fff", borderWidth: 2 },
      dayLabel: { firstDay: 1, nameMap: ["日", "一", "二", "三", "四", "五", "六"], color: css("--muted"), fontSize: 10 },
      monthLabel: { nameMap: "cn", color: css("--muted"), fontSize: 10 }, yearLabel: { show: false } },
    series: [{ type: "heatmap", coordinateSystem: "calendar",
      data: s.data.points.filter((p) => p[1] != null).map((p) => [p[0], p[1] > 0 ? 1 : 0]) }],
  });
  new ResizeObserver(() => ch.resize()).observe(box);
}

function drawValuesTable(card, cols) {
  const n = Math.max(...cols.map((s) => s.data.values.length));
  // a column is numeric when it holds numbers; string columns (e.g. "125 to 162") ignore the axis unit
  const numeric = cols.map((s) => s.data.values.some((x) => typeof x === "number"));
  const head = cols.map((s, i) => {
    const ut = numeric[i] ? unitText(s.unit) || (s.unit?.kind === "percent" ? "%" : "") : "";
    return `<th${numeric[i] ? ' class="num"' : ""}>${esc(s.name || s.id)}${ut ? ` <span class="meta">${esc(ut)}</span>` : ""}</th>`;
  }).join("");
  const body = Array.from({ length: n }, (_, r) => `<tr>${cols.map((s, i) => {
    const x = s.data.values[r];
    const t = x === undefined ? "" : typeof x === "number" ? fmtU(x, s.unit, { label: false }) : x == null ? "" : String(x);
    return `<td${numeric[i] ? ' class="num"' : ""}>${esc(t)}</td>`;
  }).join("")}</tr>`).join("");
  if (cols.length > 4) card.classList.add("wide");
  card.insertAdjacentHTML("beforeend", `<div class="vt"><table class="zt"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`);
}

function drawGauges(card, gauges) {
  const box = document.createElement("div");
  box.className = "gauge";
  for (const s of gauges) {
    const vals = s.data.kind === "values" ? s.data.values : s.data.kind === "hline" ? [s.data.y]
      : s.data.kind === "value" ? [s.data.value] : [null];
    const [cur, target] = vals;
    const pct = target ? Math.max(0, Math.min(1, (cur || 0) / target)) : null;
    const u = s.unit || UNONE;
    const f = (x) => esc(fmtU(x, u, { label: false }));
    const lab = unitText(u);
    box.insertAdjacentHTML("beforeend", `<div class="g"><div class="desc">${esc(s.name)}</div>
      <div class="big">${f(cur)}${lab && !["duration", "percent"].includes(u.kind) ? ` <span class="desc">${esc(lab)}</span>` : ""}${target != null ? ` <span class="desc">/ ${f(target)}</span>` : ""}</div>
      ${pct != null ? `<div class="bar"><i style="width:${(pct * 100).toFixed(1)}%;background:${s.color || css("--accent")}"></i></div>` : ""}
      ${cur == null ? `<div class="meta">${/startofweek\s*\(\s*today/i.test(s.expression || "") ? "本週還沒有活動" : "這段期間沒有資料"}</div>` : ""}</div>`);
  }
  card.appendChild(box);
}

// ---- banded charts (views "zoned": {"line": name} — 負荷比, Form%): the {lo:hi} band series become
// labelled shaded bands with solid edges, reference lines turn solid, and the named line is coloured
// by the band it is in (a surface halo keeps it readable on its own band's tint), with the latest
// value labelled「1.12 正常」. Text stays in text tokens; the band colour is only on marks.
function zHex(h) { const m = /^#?([0-9a-f]{6})$/i.exec(String(h || "").trim()); return m ? [0, 2, 4].map((i) => parseInt(m[1].slice(i, i + 2), 16)) : null; }
function zMix(a, b, t) {
  const A = zHex(a), B = zHex(b);
  if (!A || !B) return a;
  return "#" + A.map((x, i) => Math.round(x + (B[i] - x) * t).toString(16).padStart(2, "0")).join("");
}
function zonedSetup(out, srcOf, zoned) {
  const text = css("--text"), muted = css("--muted"), panel = css("--panel") || css("--bg");
  const dark = pzDark();
  const bands = out.map((o, i) => ({ o, s: srcOf[i] })).filter((x) => x.s?.data.kind === "band")
    .map((x) => ({ ...x, lo: Math.min(...x.s.data.range), hi: Math.max(...x.s.data.range), name: x.s.name, color: x.s.color }))
    .sort((a, b) => a.lo - b.lo);
  // the line on its band: the band hue pulled 20 % toward the text ink (darker on light, lighter on dark)
  const lineColor = (b) => zMix(b.color, text, 0.2);
  for (const b of bands) {
    b.o.markArea = { silent: true, itemStyle: { color: b.color, opacity: dark ? 0.22 : 0.15 },
      // the band's short name in the right margin, beside its band (never under the line); the
      // full range is in the hover and the ? text
      label: { show: true, position: "right", color: muted, fontSize: 10.5, distance: 4,
        formatter: (p) => String(p.name || "").split(" ")[0] },
      data: [[{ yAxis: b.lo, name: b.name }, { yAxis: b.hi }]] };
    b.o.markLine = { silent: true, symbol: "none", label: { show: false },
      lineStyle: { color: b.color, type: "solid", width: 1, opacity: 0.8 }, data: [{ yAxis: b.lo }, { yAxis: b.hi }] };
  }
  out.forEach((o, i) => {
    if (srcOf[i]?.data.kind === "hline" && o.markLine) o.markLine.lineStyle = { ...o.markLine.lineStyle, type: "solid", color: muted, width: 1 };
  });
  const zoneOf = (y) => bands.find((b, k) => (k === 0 || y >= b.lo) && (k === bands.length - 1 || y < b.hi)) || null;
  const li = out.findIndex((o, i) => o.name === zoned.line && srcOf[i]?.data.kind === "points");
  if (li < 0 || !bands.length) return { visualMap: [], zoneOf };
  const L = out[li];
  L.lineStyle = { ...(L.lineStyle || {}), width: 2.5, shadowColor: panel, shadowBlur: 5 };
  L.z = 5;
  // latest value, labelled with its band
  const pts = (L.data || []).filter((p) => Array.isArray(p) && p[1] != null);
  const last = pts[pts.length - 1];
  if (last) {
    const b = zoneOf(last[1]), u = srcOf[li].unit;
    L.markPoint = { silent: true, symbol: "circle", symbolSize: 9, data: [{ coord: last, value: last[1],
      itemStyle: { color: b ? lineColor(b) : text, borderColor: panel, borderWidth: 2 },
      label: { show: true, position: "left", distance: 8, color: text, fontSize: 11, fontWeight: 600,
        backgroundColor: panel, borderColor: b ? b.color : muted, borderWidth: 1, borderRadius: 4, padding: [2, 5],
        formatter: () => `${fmtU(last[1], u, { label: false })} ${b ? b.name.split(" ")[0] : ""}` } }] };
  }
  const pieces = bands.map((b, k) => ({ ...(k > 0 ? { gte: b.lo } : {}), ...(k < bands.length - 1 ? { lt: b.hi } : {}),
    color: lineColor(b) }));
  return { visualMap: [{ type: "piecewise", show: false, seriesIndex: li, dimension: 1, pieces }], zoneOf };
}

function drawPlot(card, res, series) {
  const el = document.createElement("div");
  el.className = "plot";
  card.appendChild(el);
  const chart = echarts.init(el);
  charts.push(chart);
  const text = css("--text"), muted = css("--muted"), line = css("--line");
  // x kind comes from the data: date / datetime (season), seconds (elapsed time
  // in a workout), duration (mean-max / PD curves), value (x-y pairs)
  const firstPts = series.find((s) => s.data.kind === "points");
  // period totals (sum(x, startofmonth(date))…): one category per bucket instead of a day axis
  const cat = res.x_period && res.buckets?.length ? res.x_period : null;
  const cats = cat ? res.buckets : [];
  const catIdx = new Map(cats.map((b, i) => [b, i]));
  const xKind = cat ? "category" : firstPts?.data.x || (res.workout != null ? "seconds" : "date");
  const xUnit = firstPts?.x_unit || UNONE;
  series = series.filter((s) => s.data.kind !== "points"
    || (cat ? ["date", "datetime"].includes(s.data.x) : (s.data.x || xKind) === xKind));
  // a vertical line (WKO5's (x,) pair) lives on the x axis; it doesn't get a y axis of its own
  const axisIds = [...new Set(series.filter((s) => s.data.kind !== "vline").map((s) => s.y_axis || "NONE"))];
  if (!axisIds.length) axisIds.push("NONE");
  const axisCfg = Object.fromEntries((res.axes || []).map((a) => [a.id, a]));
  const unitOf = (id) => series.find((s) => (s.y_axis || "NONE") === id)?.unit || axisCfg[id]?.unit || UNONE;
  const yExtent = (id) => {
    let lo = Infinity, hi = -Infinity;
    for (const s of series) if ((s.y_axis || "NONE") === id) {
      const ys = s.data.kind === "points" ? s.data.points.map((p) => p[1]) : s.data.kind === "hline" ? [s.data.y] : s.data.kind === "band" ? s.data.range : [];
      for (const y of ys) if (y != null) { lo = Math.min(lo, y); hi = Math.max(hi, y); }
    }
    return isFinite(lo) ? [lo, hi] : [0, 0];
  };
  // time axes step in round units (1 min … 1 day), never "1:23:20"
  const DUR_STEPS = [1, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200, 10800, 21600, 43200, 86400, 172800, 604800];
  const durInterval = (span) => DUR_STEPS.find((st) => span / st <= 6) || 604800;
  const yAxis = axisIds.map((id, i) => {
    const u = unitOf(id), cfg = axisCfg[id] || {};
    const [lo, hi] = yExtent(id);
    const span = Math.max(Math.abs(lo), Math.abs(hi), Math.abs((cfg.max ?? 0) - (cfg.min ?? 0)));
    const iv = u.kind === "duration" && span > 0 ? durInterval(span * 1.1) : undefined;
    return {
      type: "value", name: axisName(u), scale: true,
      position: i === 0 ? "left" : "right", offset: i > 1 ? (i - 1) * 46 : 0,
      // duration axes end on a round step so the top tick isn't "27:46"
      min: cfg.min ?? (iv ? (e) => Math.floor(e.min / iv) * iv : null),
      max: cfg.max ?? (iv ? (e) => Math.ceil(e.max / iv) * iv : null),
      interval: iv,
      axisLabel: { color: muted, fontSize: 10, hideOverlap: true, formatter: (v) => fmtU(v, u, { tick: true, label: false, span }) },
      nameTextStyle: { color: muted, fontSize: 10 },
      splitLine: { show: i === 0, lineStyle: { color: line } },
    };
  });
  // workout charts over time (or distance) join the synced hover with the map and each other;
  // x-y scatters (HR vs power, LSS vs grade) and tables don't
  const hx = res.workout == null || cat ? null
    : xKind === "seconds" ? "t" : xKind === "value" && DIST_X[xUnit.id] ? "d" : null;
  // out[i] (the ECharts series, what p.seriesIndex indexes) came from srcOf[i]: not
  // series[i] once a vline is skipped (category axes) or a series adds nothing
  const out = [], srcOf = [];
  const put = (o, s) => { out.push(o); srcOf.push(s); };
  for (const s of series) {
    const yi = Math.max(0, axisIds.indexOf(s.y_axis || "NONE"));
    const color = s.color || undefined;
    const lineType = s.line_style === "dot" ? "dotted" : s.line_style === "dash" ? "dashed" : "solid";
    const width = s.line_width === "thin" ? 1 : s.line_width === "thick" ? 3 : 1.5;
    if (s.data.kind === "vline") {
      if (cat || s.data.x == null || (xKind === "duration" && !(s.data.x > 0))) continue;
      put({ name: s.name, type: "line", yAxisIndex: 0, data: [], color,
        markLine: { silent: true, symbol: "none", label: { show: false }, lineStyle: { color, type: lineType, width: 1 }, data: [{ xAxis: s.data.x }] } }, s);
      continue;
    }
    if (s.data.kind === "hline") {
      put({ name: s.name, type: "line", yAxisIndex: yi, data: [], color,
        markLine: { silent: true, symbol: "none", label: { show: false }, lineStyle: { color, type: lineType, width: 1 }, data: [{ yAxis: s.data.y }] } }, s);
      continue;
    }
    if (s.data.kind === "band") {
      const [lo, hi] = s.data.range;
      put({ name: s.name, type: "line", yAxisIndex: yi, data: [], color,
        markArea: { silent: true, itemStyle: { color, opacity: 0.12 }, data: [[{ yAxis: lo }, { yAxis: hi }]] } }, s);
      continue;
    }
    const perWorkout = s.data.x === "datetime";
    if (cat) {
      if (perWorkout) {
        // per-workout values: each workout's dot in its bucket
        const d = s.data.points.filter((p) => p[1] != null).map((p) => [catIdx.get(bucketOf(p[0], cat)), p[1]])
          .filter((p) => p[0] != null);
        put({ name: s.name, yAxisIndex: yi, data: d, color, type: "scatter", symbolSize: 5 }, s);
        continue;
      }
      // a bucket total sits on the bucket's first day; a daily series is read at that day
      const arr = new Array(cats.length).fill(null);
      for (const [x, y] of s.data.points) {
        const k = String(x).slice(0, 10), i = catIdx.get(k);
        if (i != null && y != null) arr[i] = y;
      }
      if (s.type === "bar" || s.type === "stackedbar") {
        put({ name: s.name, yAxisIndex: yi, data: arr, color, type: "bar",
          stack: s.type === "stackedbar" ? "st" + yi : undefined, barCategoryGap: "25%" }, s);
      } else {
        put({ name: s.name, yAxisIndex: yi, data: arr, color, type: "line", connectNulls: false,
          step: s.type === "squareline" ? "middle" : false, showSymbol: cats.length <= 60, symbolSize: 4,
          lineStyle: { type: lineType, width }, areaStyle: s.type === "area" ? { opacity: 0.25 } : undefined }, s);
      }
      continue;
    }
    const pts = xKind === "duration" ? s.data.points.filter((p) => p[0] > 0) : s.data.points;
    // hover-synced workout charts (time or distance x) keep every point, so each chart's tooltip
    // lands on the same sample (lttb would snap them to different kept points); they are already
    // downsampled to ≤3000
    const base = { name: s.name, yAxisIndex: yi, data: pts, color, connectNulls: false,
      sampling: hx ? undefined : "lttb" };
    // per-point text labels (a review series' `labels`, e.g. 「✓ 達標」 on each rep bar)
    const lab = s.labels ? { show: true, position: "top", color: text, fontSize: 10,
      formatter: (p) => s.labels[p.dataIndex] ?? "" } : undefined;
    if (s.type === "bar" || s.type === "stackedbar") {
      put({ ...base, type: "bar", stack: s.type === "stackedbar" ? "st" + yi : undefined, barMaxWidth: s.bar_width || 6,
        barGap: "-100%", label: lab, itemStyle: s.bar_width ? { borderRadius: [4, 4, 0, 0] } : undefined }, s);
    } else if (s.labels) {
      // a few labelled markers (the battery's minimum)
      put({ name: s.name, yAxisIndex: yi, data: pts, color, type: "scatter", symbolSize: 9, label: lab,
        itemStyle: { borderColor: css("--bg") || "#fff", borderWidth: 2 } }, s);
    } else if (s.line_style === "none" && s.type !== "area") {
      // WKO5 "no line" = markers only: an x-y scatter (HR vs power, LSS vs grade) or event markers
      put({ name: s.name, yAxisIndex: yi, data: pts.filter((p) => p[1] != null && p[0] != null), color,
        type: "scatter", symbolSize: perWorkout || pts.length < 400 ? 5 : 3, large: pts.length > 2000,
        itemStyle: { opacity: pts.length > 400 ? 0.55 : 0.9 } }, s);
    } else {
      put({ ...base, type: "line", step: s.type === "squareline" ? "end" : false,
        showSymbol: perWorkout, symbolSize: 4, lineStyle: { type: lineType, width: perWorkout ? 0 : width },
        areaStyle: s.type === "area" ? { opacity: 0.25 } : undefined }, s);
    }
  }
  // the optional mFTP plateau (render.mftp_plateau): a dashed line at the PD model's FTP,
  // shown / hidden through the legend so the 「mFTP 線」 toggle needs no redraw
  const PL = xKind === "duration" && res.plateau ? res.plateau : null;
  if (PL) {
    put({ name: PLATEAU_NAME, type: "line", yAxisIndex: Math.max(0, axisIds.indexOf(PL.y_axis || "NONE")), data: [], color: muted,
      markLine: { silent: true, symbol: "none", lineStyle: { color: muted, type: "dashed", width: 1.2 },
        label: { show: true, position: "insideEndTop", color: muted, fontSize: 10, formatter: PL.label },
        data: [{ yAxis: PL.y }] } }, null);
  }
  const lbl = { color: muted, fontSize: 10, hideOverlap: true };
  const axLine = { lineStyle: { color: line } };
  let xAxis;
  if (cat) {
    xAxis = { type: "category", data: cats.map((b) => bucketLabel(b, cat)), axisLine: axLine,
      axisTick: { alignWithLabel: true }, axisLabel: { ...lbl } };
  } else if (xKind === "duration") {
    const xs = out.flatMap((o) => (o.data || []).map((p) => p[0])).filter((x) => x > 0);
    const xmin = xs.length ? Math.min(...xs) : 1, xmax = xs.length ? Math.max(...xs) : 3600;
    let ticks = DUR_TICKS.filter((t) => t >= xmin * 0.999 && t <= xmax * 1.001);
    if (ticks.length > 9) ticks = DUR_TICKS_SPARSE.filter((t) => t >= xmin * 0.999 && t <= xmax * 1.001);
    xAxis = { type: "log", logBase: 10, min: xmin, max: xmax, axisLine: axLine,
      axisLabel: { ...lbl, customValues: ticks, formatter: (v) => durTick(Math.round(v)) },
      axisTick: { customValues: ticks }, splitLine: { show: true, lineStyle: { color: line, opacity: 0.5 } } };
  } else if (xKind === "seconds") {
    const xs = out.flatMap((o) => (o.data || []).map((p) => p[0])).filter((x) => x != null);
    const xmax = xs.length ? Math.max(...xs) : 3600;
    xAxis = { type: "value", min: 0, max: xmax, interval: durInterval(xmax), axisLine: axLine,
      splitLine: { lineStyle: { color: line } },
      axisLabel: { ...lbl, formatter: (v) => fmtDur(v, xmax >= 3 * 3600 ? "hm" : undefined) } };

      : [`↓ −${cpN(b.c.drop_m)} m`, `${cpN(b.c.distance_km, 1)} km · ${g}%`];
    b.short = b.up ? b.c.no : "↓";
  }
  const idxAt = (x) => {
    let lo = 0, hi = n - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (X[m] < x) lo = m; else hi = m; }
    return Math.abs(X[lo] - x) <= Math.abs(X[hi] - x) ? lo : hi;
  };
  const bandAt = (x) => bands.find((b) => b.up && x >= b.x0 && x <= b.x1) || bands.find((b) => !b.up && x >= b.x0 && x <= b.x1);
  const F1 = "600 11px system-ui, sans-serif", F2 = "11px system-ui, sans-serif";
  // label strip above the profile, two rows. Pass 1: every band gets its mark (① / ↓) on the first
  // free row, nudged right only when both rows are taken. Pass 2, biggest first: a band's full label
  // (mark + gain, km · grade, two lines) replaces its mark when it overlaps no other label.
  function layout(api) {
    const gx0 = api.coord([x0, y0min])[0], gx1 = api.coord([x1, y0min])[0];
    const hit = (a, b) => a[0] < b[1] + 3 && b[0] < a[1] + 3;
    const rows = [[], []];
    for (const b of bands) {
      const a = api.coord([b.x0, y0min])[0], z = api.coord([b.x1, y0min])[0];
      b.cx = (a + z) / 2;
      b.fw = Math.max(cpTextW(b.full[0], F1), cpTextW(b.full[1], F2)) + 8;
      const sw = cpTextW(b.short, "600 12px system-ui, sans-serif") + 6;
      let L = Math.min(Math.max(b.cx - sw / 2, gx0 - 30), gx1 + 10 - sw);
      let row = [0, 1].find((r) => !rows[r].some((iv) => hit([L, L + sw], iv)));
      if (row == null) { row = 1; L = Math.max(L, ...rows[1].map((iv) => iv[1] + 4)); }
      b.iv = [L, L + sw];
      rows[row].push(b.iv);
      b.lay = { full: false, x: L + sw / 2, row };
    }
    const size = (b) => b.up ? b.c.gain_m : b.c.drop_m;
    const fulls = [];
    for (const b of [...bands].sort((p, q) => size(q) - size(p))) {
      const L = Math.min(Math.max(b.cx - b.fw / 2, gx0 - 30), gx1 + 10 - b.fw), iv = [L, L + b.fw];
      const others = bands.filter((o) => o !== b && !o.lay.full).map((o) => o.iv);
      if ([...others, ...fulls].some((o) => hit(iv, o))) continue;
      b.lay = { full: true, x: L + b.fw / 2 };
      fulls.push(iv);
    }
  }
  const chart = echarts.init(el);
  charts.push(chart);
  const hatchTop = cpHatch(css("--cp-down"), 0.3);    // light: the metric line must stay on top visually

  function paint() {
    const m = M[metric];
    const H = el.clientHeight || 390;
    const top0 = bands.length ? 44 : 12, bottom = 28, h0 = H - top0 - bottom;
    const ys = m.ys || [];
    const yN1 = cpNice(...cpRange([...ys, ...(m.ys2 || [])], !!m.zero), 4, !!m.pace), y1min = yN1.min, y1max = yN1.max;
    const ink = css("--text"), muted = css("--muted"), line = css("--line"), up = css("--cp-up"), down = css("--cp-down");
    const elev = css("--cp-elev"), metricC = css("--cp-metric"), ink2 = css("--cp-ink2");
    const lbl = { color: muted, fontSize: 10.5 };
    // low = the metric layer (left axis): only the per-climb average rules; else the elevation layer
    // (right axis): the band rects, the climb / descent stroke on the profile and the ①② labels
    const bandItem = (low) => (params, api) => {
      const b = bands[params.dataIndex];
      if (!low && (params.dataIndex === 0 || !b.lay)) layout(api);
      const a = api.coord([b.x0, y0min]), z = api.coord([b.x1, y0max]);
      const yTop = Math.min(a[1], z[1]), hgt = Math.abs(a[1] - z[1]);
      const kids = low ? [] : [{ type: "rect", silent: true, shape: { x: a[0], y: yTop, width: Math.max(1, z[0] - a[0]), height: hgt },
        style: { fill: b.up ? cpRgba(up, 0.13) : hatchTop } }];
      if (!low) {
        if (b.pts.length > 1) kids.push({ type: "polyline", silent: true, shape: { points: b.pts.map((p) => api.coord(p)) },
          style: { stroke: b.up ? up : down, lineWidth: 1.5, fill: null, lineJoin: "round", lineCap: "round" } });
        const L = b.lay || { full: false, x: (a[0] + z[0]) / 2, row: 0 };
        const gy = api.coord([x0, y0max])[1];
        if (L.full) {
          kids.push({ type: "text", silent: true, style: { text: b.full[0], x: L.x, y: gy - 27, fill: ink, font: F1, align: "center", verticalAlign: "middle" } },
            { type: "text", silent: true, style: { text: b.full[1], x: L.x, y: gy - 12, fill: muted, font: F2, align: "center", verticalAlign: "middle" } });
        } else {
          kids.push({ type: "text", silent: true, style: { text: b.short, x: L.x, y: gy - (L.row ? 12 : 27), fill: ink,
            font: "600 12px system-ui, sans-serif", align: "center", verticalAlign: "middle" } });
        }
      } else if (b.up) {
        // the climb's own average on the metric panel: a short ink rule, its value above when it fits
        const v = m.seg(b.c);
        if (v != null && isFinite(v) && v >= Math.min(y1min, y1max) && v <= Math.max(y1min, y1max)) {
          const p0 = api.coord([b.x0, v]), p1 = api.coord([b.x1, v]);
          kids.push({ type: "line", silent: true, shape: { x1: p0[0], y1: p0[1], x2: p1[0], y2: p1[1] }, style: { stroke: ink, lineWidth: 2 } });
          const t = m.segF(v), tw = cpTextW(t, F2);
          if (p1[0] - p0[0] >= tw + 4) kids.push({ type: "text", silent: true, style: { text: t, x: (p0[0] + p1[0]) / 2, y: p0[1] - 8,
            fill: ink, font: F2, align: "center", verticalAlign: "middle", stroke: css("--panel"), lineWidth: 3 } });
        }
      }
      return { type: "group", children: kids };
    };
    const pts = (a) => X.map((x, k) => [x, a ? a[k] : null]);
    const tipRow = (k) => {
      const t = [], g = P.grade?.[k];
      t.push(`<b>${cpN(X[k], 2)} km</b> <span style="opacity:.75">· ${cpDur(P.t?.[k])}</span>`);
      t.push(`海拔 <b>${cpN(A[k])}</b> m · 坡度 <b>${g == null ? "–" : cpN(g, 1) + "%"}</b>`);
      if (P.pace?.[k] != null || P.gap?.[k] != null) t.push(`配速 <b>${cpPace(P.pace?.[k])}</b> /km · GAP <b>${cpPace(P.gap?.[k])}</b>`);
      else t.push(`配速 – （停下來或沒有速度）`);
      const hp = [];
      if (P.hr?.[k] != null) hp.push(`心率 <b>${cpN(P.hr[k])}</b>`);
      if (P.power?.[k] != null) hp.push(`功率 <b>${cpN(P.power[k])}</b> W${cp ? `（${cpN(P.power[k] / cp * 100)}% CP）` : ""}`);
      if (hp.length) t.push(hp.join(" · "));
      if (P.vam?.[k] != null) t.push(`VAM <b>${cpN(P.vam[k])}</b> m/h`);
      return t.join("<br>");
    };
    const tipBand = (b) => {
      const c = b.c;
      if (!b.up) return `<b>↓ 下坡</b> −${cpN(c.drop_m)} m · ${cpN(c.distance_km, 2)} km · ${cpN(c.grade * 100)}% · ${cpN(c.start_elev)} → ${cpN(c.end_elev)} m<br>`
        + `時間 ${cpDur(c.duration_s)} · 配速 ${cpPace(c.pace_s_per_km)} /km${c.avg_hr != null ? ` · 心率 ${cpN(c.avg_hr)}` : ""}`;
      const B = c.base || {};
      const t = [`<b>${esc(c.no)} 爬坡</b> +${cpN(c.gain_m)} m · ${cpN(c.distance_km, 2)} km · ${cpN(c.grade * 100)}% · ${cpN(c.start_elev)} → ${cpN(c.top_elev)} m`,
        `時間 ${cpDur(c.duration_s)} · VAM <b>${cpN(c.vam)}</b> m/h${cpRel(c.vam, B.vam, cpN)}`];
      if (c.avg_hr != null) t.push(`心率 <b>${cpN(c.avg_hr)}</b> · 每 100 m 爬升 <b>${cpN(c.hr_per_100m)}</b> 下${cpRel(c.hr_per_100m, B.hr_per_100m, cpN)}`);
      if (c.avg_power != null) t.push(`功率 <b>${cpN(c.avg_power)}</b> W${c.pct_cp != null ? ` · <b>${cpPct(c.pct_cp)}</b> CP${cpRel(c.pct_cp, B.pct_cp, (v) => cpPct(v))}` : ""}`);
      t.push(`配速 <b>${cpPace(c.pace_s_per_km)}</b> · GAP <b>${cpPace(c.gap_s_per_km)}</b> /km${cpRel(c.gap_s_per_km, B.gap_s_per_km, cpPace, true)}`);
      const vb = B.vam || {};
      t.push(`<span style="opacity:.75">${vb.ok ? `平常 = 近 ${vb.weeks} 週坡度 ±${Math.round(D.grade_match * 100)} pp 內的爬坡中位數（${vb.n} 段，推估）`
        : `相近坡度（±${Math.round(D.grade_match * 100)} pp）的過去爬坡只有 ${vb.n || 0} 段（< 5），不比較`}</span>`);
      return t.join("<br>");
    };
    chart.setOption({
      animation: false,
      axisPointer: { link: [{ xAxisIndex: "all" }], lineStyle: { color: muted, width: 1 } },
      tooltip: { ...cpTipOpts(), trigger: "axis", axisPointer: { type: "line" },
        formatter: (ps) => {
          const p = Array.isArray(ps) ? ps[0] : ps;
          const x = p?.axisValue ?? p?.value?.[0];
          if (x == null) return "";
          const b = bandAt(+x);
          return cpTipBox(tipRow(idxAt(+x)) + (b ? `<hr style="border:0;border-top:1px solid ${line};margin:5px 0">${tipBand(b)}` : ""));
        } },
      // one plot: the metric on the LEFT axis (yAxis 0), the elevation on the RIGHT axis (yAxis 1). The
      // grid lines follow the left axis only; each axis is named with its unit next to its own swatch
      grid: { left: 62, right: 60, top: top0, height: h0 },
      xAxis: { type: "value", min: x0, max: x1, axisLine: { lineStyle: { color: line } }, splitLine: { show: false },
        axisLabel: { ...lbl, showMinLabel: x0 === 0, showMaxLabel: false, formatter: (v) => `${cpN(v, v % 1 ? 1 : 0)} km` } },
      yAxis: [
        { type: "value", position: "left", min: y1min, max: y1max, inverse: !!m.pace, interval: yN1.interval,
          name: `{sw|━} ${mName(m)}（${m.unit}）`, nameLocation: "middle", nameGap: 44, nameRotate: 90,
          nameTextStyle: { color: ink, fontSize: 11, fontWeight: 600, rich: { sw: { color: metricC, fontSize: 13, fontWeight: 700 } } },
          axisLine: { show: true, lineStyle: { color: line } }, axisTick: { show: true, lineStyle: { color: line } },
          axisLabel: { ...lbl, color: ink, formatter: (v) => m.axisF(v) }, splitLine: { lineStyle: { color: line } } },
        { type: "value", position: "right", min: y0min, max: y0max, interval: yN0.interval,
          name: `{sw|▇} 海拔（m）`, nameLocation: "middle", nameGap: 44, nameRotate: -90,
          nameTextStyle: { color: muted, fontSize: 11, fontWeight: 600, rich: { sw: { color: cpRgba(elev, 0.45), fontSize: 11 } } },
          axisLine: { show: true, lineStyle: { color: line } }, axisTick: { show: true, lineStyle: { color: line } },
          axisLabel: { ...lbl, formatter: (v) => `${v}` }, splitLine: { show: false } },
      ],
      graphic: [],
      series: [
        { id: "alt", name: "海拔", type: "line", yAxisIndex: 1, data: pts(A), showSymbol: false, z: 1, silent: true,
          lineStyle: { color: cpRgba(elev, 0.6), width: 1 }, itemStyle: { color: elev }, areaStyle: { color: cpRgba(elev, 0.16) } },
        { id: "bands", type: "custom", yAxisIndex: 1, clip: false, z: 2, silent: true,
          data: bands.map((b) => [b.x0, b.x1]), encode: { x: [0, 1] }, renderItem: bandItem(false) },
        { id: "bandsLow", type: "custom", yAxisIndex: 0, z: 4, silent: true,
          data: bands.map((b) => [b.x0, b.x1]), encode: { x: [0, 1] }, renderItem: bandItem(true) },
        { id: "m2", name: "實際配速", type: "line", yAxisIndex: 0, data: m.ys2 ? pts(m.ys2) : [], showSymbol: false,
          connectNulls: false, lineStyle: { color: ink2, width: 1, type: "dashed", opacity: 0.8 }, itemStyle: { color: ink2 }, z: 3 },
        { id: "m", name: mName(m), type: "line", yAxisIndex: 0, data: pts(ys), showSymbol: false, connectNulls: false,
          lineStyle: { color: metricC, width: 2.75, cap: "round", join: "round" }, itemStyle: { color: metricC }, z: 5 },
      ],
    }, { replaceMerge: ["series", "graphic", "xAxis", "yAxis", "grid"] });
    paintCmp();
  }

  // one row per climb: this climb (dot) against the usual on similar-grade climbs (bar = middle 50 %, rule = median)
  const cmpChart = echarts.init(cmpEl);
  charts.push(cmpChart);
  function paintCmp() {
    const cm = CMP[metric], rows = climbs.filter((c) => c[cm.key] != null);
    if (!rows.length) {
      cmpEl.style.display = "none";
      cmpCap.innerHTML = climbs.length ? `每段和平常比：這次沒有 ${esc(cm.name)} 的資料` : "";
      return;
    }
    cmpEl.style.display = "";
    const nb = rows.filter((c) => c.base?.[cm.key]?.ok).length;
    // a short heading only; how to read it is behind the card's 「?」 (tipText)
    cmpCap.innerHTML = `<b>每段 ${esc(cm.name)} 和平常比</b>` + (nb < rows.length ? `（${rows.length - nb} 段樣本不足，不比較）` : "");
    const narrow = (cmpEl.clientWidth || card.clientWidth || 800) < 520;
    const h = rows.length * 30 + 34;
    cmpEl.style.height = cmpEl.style.minHeight = `${h}px`;
    const val = (c) => c[cm.key] * cm.scale;
    const B = (c) => { const b = c.base?.[cm.key]; return b?.ok ? { ...b, q1: b.q1 * cm.scale, q3: b.q3 * cm.scale, median: b.median * cm.scale } : null; };
    const all = rows.flatMap((c) => { const b = B(c); return [val(c), ...(b ? [b.q1, b.q3] : [])]; });
    let lo = Math.min(...all), hi = Math.max(...all);
    const pad = (hi - lo || Math.abs(hi) || 1) * 0.12;
    const xn = cpNice(lo - pad, hi + pad, narrow ? 3 : 4, !!cm.pace);
    lo = xn.min; hi = xn.max;
    const ink = css("--text"), muted = css("--muted"), line = css("--line"), panel = css("--panel");
    cmpChart.resize();
    cmpChart.setOption({
      animation: false,
      tooltip: { ...cpTipOpts(), trigger: "item", formatter: (p) => {
        const c = rows[p.dataIndex], b = c.base?.[cm.key];
        if (!c) return "";
        return cpTipBox(`<b>${esc(c.no)}</b> 從 ${cpN(c.start_km, 1)} km · +${cpN(c.gain_m)} m · ${cpN(c.grade * 100)}%<br>`
          + `這段 <b>${cm.f(val(c))}</b>${b?.ok ? `<br>平常 中位 ${cm.f(b.median * cm.scale)}（中間 50%：${cm.f(b.q1 * cm.scale)}～${cm.f(b.q3 * cm.scale)}；${b.n} 段／${b.weeks} 週）`
            + `<br>${cpOutside(c[cm.key], b, cm.pace) || "在平常範圍內"}` : `<br>相近坡度的過去爬坡 ${b?.n || 0} 段（< 5），不比較`}`);
      } },
      grid: { left: 92, right: narrow ? 14 : 124, top: 4, bottom: 26 },
      xAxis: { type: "value", min: lo, max: hi, inverse: !!cm.pace, interval: xn.interval, axisLine: { show: false },
        axisLabel: { color: muted, fontSize: 10.5, formatter: (v) => cm.axisF(v) }, splitLine: { lineStyle: { color: line } } },
      yAxis: { type: "category", inverse: true, data: rows.map((c) => `${c.no}  ${cpN(c.start_km, 1)} km`),
        axisTick: { show: false }, axisLine: { lineStyle: { color: line } }, axisLabel: { color: ink, fontSize: 11 } },
      series: [
        { id: "base", type: "custom", data: rows.map((c, i) => [lo, i]), encode: { x: 0, y: 1 }, z: 1,
          renderItem: (params, api) => {
            const c = rows[params.dataIndex], b = B(c), yc = api.coord([lo, params.dataIndex])[1];
            const gx0 = api.coord([lo, 0])[0], gx1 = api.coord([hi, 0])[0];
            const kids = [{ type: "rect", shape: { x: Math.min(gx0, gx1), y: yc - 14, width: Math.abs(gx1 - gx0), height: 28 },
              style: { fill: "rgba(0,0,0,0.001)" } }];                         // the row is the hover target
            if (b) {
              const a = api.coord([b.q1, 0])[0], z = api.coord([b.q3, 0])[0], md = api.coord([b.median, 0])[0];
              kids.push({ type: "rect", silent: true, shape: { x: Math.min(a, z), y: yc - 5, width: Math.max(2, Math.abs(z - a)), height: 10, r: 4 },
                style: { fill: css("--cp-base") } },
                { type: "line", silent: true, shape: { x1: md, y1: yc - 8, x2: md, y2: yc + 8 }, style: { stroke: css("--cp-ink2"), lineWidth: 2 } });
            }
            // outside the usual's middle 50 %: said in a column right of the plot (never on top of the marks)
            const t = narrow ? null : cpOutside(c[cm.key], c.base?.[cm.key], cm.pace);
            if (t) kids.push({ type: "text", silent: true, style: { text: t, x: Math.max(gx0, gx1) + 12, y: yc, fill: ink,
              font: "11px system-ui, sans-serif", verticalAlign: "middle" } });
            return { type: "group", children: kids };
          } },
        { id: "me", type: "scatter", silent: true, z: 3, symbolSize: 11,
          itemStyle: { color: css("--cp-line"), borderColor: panel, borderWidth: 2 },
          data: rows.map((c, i) => [val(c), i]) },
      ],
    }, { replaceMerge: ["series"] });
  }
  paint();
  new ResizeObserver(() => { chart.resize(); paint(); }).observe(el);
}

function drawGradeProfile(card, res) {
  cpStyle();
  const D = res.grade_profile, bins = (D.bins || []).filter((b) => b.time_s > 0);
  const wrap = cpFrame(card, res, `詳細數字（${bins.length} 個坡度區間）`);
  if (!bins.length) return;
  const G = {
    pace: { key: "pace_s_per_km", label: "配速", f: cpPace, unit: "/km", pace: true, hint: "越右越快" },
    vam: { key: "vam", label: "VAM", f: (v) => cpN(v), unit: "m/h", hint: "越右爬升越快；下坡為負" },
    power: { key: "power", label: "功率", f: (v) => cpN(v), unit: "W", hint: "越右功率越高" },
    hr: { key: "hr", label: "心率", f: (v) => cpN(v), unit: "bpm", hint: "越右心率越高" },
    eff_speed: { key: "eff_speed", label: "速度／心率", f: (v) => cpN(v, 2), unit: "m/min/bpm", hint: "越右越有效率" },
    eff_power: { key: "eff_power", label: "功率／心率", f: (v) => cpN(v, 2), unit: "W/bpm", hint: "越右越有效率" },
  };
  const avail = Object.entries(G).filter(([, g]) => bins.some((b) => b.metrics?.[g.key] != null)).map(([k, g]) => [k, g.label]);
  if (!avail.length) avail.push(["pace", "配速"]);
  const okKey = (k) => avail.some(([a]) => a === k);
  let metric = okKey(cpPref(CP_KEYS.grade, "pace")) ? cpPref(CP_KEYS.grade, "pace") : avail[0][0];
  const bar = document.createElement("div");
  bar.className = "cpbar";
  bar.appendChild(cpSeg(avail, metric, "坡度分組的指標", (k) => { metric = k; cpSave(CP_KEYS.grade, k); paint(); }));
  const leg = document.createElement("div");
  leg.className = "cpleg";
  leg.innerHTML = `<span><i style="background:var(--cp-bar)"></i>這次在該坡度的時間佔比</span>`
    + `<span><i class="dot" style="background:var(--cp-line)"></i>這次</span>`
    + `<span><i class="hol"></i>這次（不到 ${Math.round(D.min_s)} 秒，只供參考）</span>`
    + `<span><i class="iqr"></i>平常的中間 50% 與中位數</span>`;
  bar.appendChild(leg);
  const cap = document.createElement("p");
  cap.className = "cpcap";
  const el = document.createElement("div");
  el.className = "plot cpgrade";
  el.style.flex = "none";
  el.setAttribute("role", "img");
  el.setAttribute("aria-label", "坡度分組：每個坡度的時間與表現，數字在「詳細數字」表格");
  wrap.append(bar, cap, el);
  const chart = echarts.init(el);
  charts.push(chart);
  function paint() {
    const g = G[metric];
    const val = (b) => b.metrics?.[g.key];
    // the explanation lives behind the card's 「?」 (views/workout.json description); only a short axis hint here
    cap.innerHTML = `<b>${esc(g.label)}</b>（${esc(g.unit)}）· ${esc(g.hint)}`;
    const W = el.clientWidth || card.clientWidth || 800, narrow = W < 520;
    const h = bins.length * 28 + 34;
    el.style.height = el.style.minHeight = `${h}px`;
    const left = 78, w0 = narrow ? 64 : Math.max(90, Math.min(190, W * 0.2)), gap = narrow ? 14 : 26;
    const vals = bins.flatMap((b) => { const v = val(b), bb = b.base?.[g.key]; return [v, ...(bb?.ok ? [bb.q1, bb.q3] : [])]; })
      .filter((v) => v != null && isFinite(v));
    let lo = vals.length ? Math.min(...vals) : 0, hi = vals.length ? Math.max(...vals) : 1;
    const pad = (hi - lo || Math.abs(hi) || 1) * 0.12;
    const xn = cpNice(lo - pad, hi + pad, narrow ? 3 : 5, !!g.pace);
    lo = xn.min; hi = xn.max;
    const maxShare = Math.max(...bins.map((b) => b.time_pct || 0), 1);
    const ink = css("--text"), muted = css("--muted"), line = css("--line"), panel = css("--panel");
    const cats = bins.map((b) => b.label);
    chart.resize();
    chart.setOption({
      animation: false,
      tooltip: { ...cpTipOpts(), trigger: "item", formatter: (p) => {
        const b = bins[p.dataIndex];
        if (!b) return "";
        const bb = b.base?.[g.key], v = val(b);
        return cpTipBox(`<b>坡度 ${esc(b.label)}</b><br>時間 <b>${cpDur(b.time_s)}</b>（${cpN(b.time_pct)}%）· ${cpN(b.distance_km, 2)} km`
          + `<br>${esc(g.label)} <b>${v == null ? "–" : g.f(v)}</b> ${esc(g.unit)}${b.time_s < D.min_s ? "（不到 " + Math.round(D.min_s) + " 秒，只供參考）" : ""}`
          + (bb?.ok ? `<br>平常 中位 ${g.f(bb.median)}（中間 50%：${g.f(bb.q1)}～${g.f(bb.q3)}；${bb.n} 次／${bb.weeks} 週）<br>${cpOutside(v, bb, g.pace) || "在平常範圍內"}`
            : `<br>平常：這個坡度只有 ${bb?.n || 0} 次 ≥ ${Math.round(D.min_s)} 秒（< 5），不比較`));
      } },
      grid: [{ left, width: w0, top: 4, bottom: 26 }, { left: left + w0 + gap, right: narrow ? 14 : 118, top: 4, bottom: 26 }],
      xAxis: [
        { type: "value", gridIndex: 0, min: 0, max: maxShare * (narrow ? 1.6 : 1.45), axisLabel: { show: false }, axisTick: { show: false },
          axisLine: { show: false }, splitLine: { show: false } },
        { type: "value", gridIndex: 1, min: lo, max: hi, inverse: !!g.pace, interval: xn.interval, axisLine: { show: false },
          axisLabel: { color: muted, fontSize: 10.5, formatter: (v) => g.pace ? cpPaceTick(v) : g.f(v) }, splitLine: { lineStyle: { color: line } } },
      ],
      yAxis: [
        { type: "category", gridIndex: 0, data: cats, axisTick: { show: false }, axisLine: { lineStyle: { color: line } },
          axisLabel: { color: ink, fontSize: 11 } },
        { type: "category", gridIndex: 1, data: cats, axisTick: { show: false }, axisLine: { show: false }, axisLabel: { show: false } },
      ],
      series: [
        { id: "time", type: "bar", xAxisIndex: 0, yAxisIndex: 0, barWidth: 12, z: 2,
          data: bins.map((b) => b.time_pct || 0),
          itemStyle: { color: css("--cp-bar"), borderRadius: [0, 4, 4, 0] },
          label: { show: true, position: "right", color: muted, fontSize: 10.5, formatter: (p) => `${Math.round(p.value)}%` } },
        { id: "base", type: "custom", xAxisIndex: 1, yAxisIndex: 1, data: bins.map((b, i) => [lo, i]), encode: { x: 0, y: 1 }, z: 1,
          renderItem: (params, api) => {
            const b = bins[params.dataIndex], bb = b.base?.[g.key], yc = api.coord([lo, params.dataIndex])[1];
            const gx0 = api.coord([lo, 0])[0], gx1 = api.coord([hi, 0])[0];
            const kids = [{ type: "rect", shape: { x: Math.min(gx0, gx1), y: yc - 13, width: Math.abs(gx1 - gx0), height: 26 },
              style: { fill: "rgba(0,0,0,0.001)" } }];
            if (bb?.ok) {
              const a = api.coord([bb.q1, 0])[0], z = api.coord([bb.q3, 0])[0], md = api.coord([bb.median, 0])[0];
              kids.push({ type: "rect", silent: true, shape: { x: Math.min(a, z), y: yc - 5, width: Math.max(2, Math.abs(z - a)), height: 10, r: 4 },
                style: { fill: css("--cp-base") } },
                { type: "line", silent: true, shape: { x1: md, y1: yc - 8, x2: md, y2: yc + 8 }, style: { stroke: css("--cp-ink2"), lineWidth: 2 } });
            }
            const t = narrow || b.time_s < D.min_s ? null : cpOutside(val(b), bb, g.pace);
            if (t) kids.push({ type: "text", silent: true, style: { text: t, x: Math.max(gx0, gx1) + 12, y: yc, fill: ink,
              font: "11px system-ui, sans-serif", verticalAlign: "middle" } });
            return { type: "group", children: kids };
          } },
        { id: "me", type: "scatter", xAxisIndex: 1, yAxisIndex: 1, silent: true, z: 3, symbolSize: 11,
          data: bins.map((b, i) => {
            const v = val(b), short = b.time_s < D.min_s;
            return v == null ? { value: [null, i] } : { value: [v, i],
              itemStyle: short ? { color: panel, borderColor: css("--cp-line"), borderWidth: 1.5 }
                : { color: css("--cp-line"), borderColor: panel, borderWidth: 2 } };
          }) },
      ],
    }, { replaceMerge: ["series"] });
  }
  paint();
  new ResizeObserver(() => paint()).observe(el);
}

// ---- 跑姿與膝蓋負荷 (workout_review form_grades / form_work; res.form_profile). Self-contained; reuses the
// cp* helpers above. mode "grade": one row per grade bin, like 坡度分組 (time share + this run's dot against the
// usual's middle 50 % and median). mode "work": the metric across the ten 10 % slices of the work done, this run
// as a line over the usual as a band (q1–q3) with the median dashed — a line reads change over the run (fatigue)
// better than ten rows of dots. A band toggle keeps one grade band only. Explanations sit behind the card's 「?」.
const FP_KEYS = { grade: "wko5viewer.formgrademetric", work: "wko5viewer.formworkmetric", band: "wko5viewer.formworkband" };
const FP_METRICS = {
  ilr: { label: "ILR", unit: "BW/s", d: 1 },
  impact_g: { label: "衝擊 G", unit: "G", d: 2 },
  impact_km: { label: "每公里衝擊量", unit: "G·步/km，推估", d: 0 },
  lss: { label: "LSS", unit: "kN/m", d: 1 },
  kleg: { label: "kleg", unit: "kN/m", d: 1 },
  gct: { label: "觸地時間", unit: "ms", d: 0 },
  cadence: { label: "步頻", unit: "spm", d: 0 },
  vo: { label: "垂直振幅", unit: "cm", d: 1 },
};
const FP_IMPACT = new Set(["ilr", "impact_g", "impact_km"]);      // these show the same bin's cadence beside them
// "158↓": the bin's cadence, ↑ / ↓ when above / below the usual's middle 50 %
function fpCad(r) {
  const v = r.m?.cadence, b = r.base?.cadence;
  if (v == null) return "–";
  return `${Math.round(v)}${b?.ok ? (v > b.q3 ? "↑" : v < b.q1 ? "↓" : "") : ""}`;
}
function drawFormProfile(card, res) {
  cpStyle();
  const D = res.form_profile, work = D.mode === "work";
  const rowsOf = (band) => work ? (D.bands?.[band] || []) : (D.bins || []).filter((b) => b.time_s > 0);
  const keys = (D.keys || []).filter((k) => FP_METRICS[k]);
  const wrap = cpFrame(card, res, work ? "詳細數字（每 10% 作功）" : `詳細數字（${rowsOf().length} 個坡度區間）`);
  if (!keys.length) return;
  const avail = keys.map((k) => [k, FP_METRICS[k].label]);
  const mkey = work ? FP_KEYS.work : FP_KEYS.grade;
  let metric = keys.includes(cpPref(mkey, keys[0])) ? cpPref(mkey, keys[0]) : keys[0];
  const bands = work ? Object.keys(D.bands || {}) : [];
  let band = bands.includes(cpPref(FP_KEYS.band, "all")) ? cpPref(FP_KEYS.band, "all") : (bands[0] || "all");
  const bar = document.createElement("div");
  bar.className = "cpbar";
  bar.appendChild(cpSeg(avail, metric, "跑姿指標", (k) => { metric = k; cpSave(mkey, k); paint(); }));
  if (bands.length > 1)
    bar.appendChild(cpSeg(bands.map((b) => [b, D.band_labels?.[b] || b]), band, "只看一種坡度", (b) => { band = b; cpSave(FP_KEYS.band, b); paint(); }));
  const leg = document.createElement("div");
  leg.className = "cpleg";
  const min = Math.round(D.min_s);
  leg.innerHTML = work
    ? `<span><i class="ln" style="border-color:var(--cp-line)"></i>這次</span>`
      + `<span><i class="hol"></i>這次（不到 ${min} 秒）</span>`
      + `<span><i style="background:var(--cp-base)"></i>平常的中間 50%</span>`
      + `<span><i class="ln" style="border-top-style:dashed;border-color:var(--cp-ink2)"></i>平常中位數（推估）</span>`
    : `<span><i style="background:var(--cp-bar)"></i>跑步時間佔比</span>`
      + `<span><i class="dot" style="background:var(--cp-line)"></i>這次</span>`
      + `<span><i class="hol"></i>這次（不到 ${min} 秒）</span>`
      + `<span><i class="iqr"></i>平常的中間 50% 與中位數（推估）</span>`;
  const cadLeg = document.createElement("span");
  cadLeg.textContent = work ? "橫軸下方數字 = 該段步頻 spm（↑↓ = 高／低於平常）" : "右欄數字 = 該坡度步頻 spm（↑↓ = 高／低於平常）";
  leg.appendChild(cadLeg);
  bar.appendChild(leg);
  const cap = document.createElement("p");
  cap.className = "cpcap";
  const el = document.createElement("div");
  el.className = "plot cpform";
  el.style.flex = "none";
  el.setAttribute("role", "img");
  el.setAttribute("aria-label", work ? "跑姿隨作功進度的變化，數字在「詳細數字」表格" : "跑姿依坡度，數字在「詳細數字」表格");
  wrap.append(bar, cap, el);
  const chart = echarts.init(el);
  charts.push(chart);
  const ink = () => css("--text"), muted = () => css("--muted"), line = () => css("--line"), panel = () => css("--panel");
  function usualTip(v, bb, g) {
    const f = (x) => cpN(x, g.d);
    return bb?.ok ? `<br>平常 中位 ${f(bb.median)}（中間 50%：${f(bb.q1)}～${f(bb.q3)}；${bb.n} 次／${bb.weeks} 週，推估）<br>${cpOutside(v, bb, false) || "在平常範圍內"}`
      : `<br>平常：只有 ${bb?.n || 0} 次 ≥ ${min} 秒（< 5），不比較`;
  }
  function paintGrade(g) {
    const bins = rowsOf(), val = (b) => b.m?.[metric];
    cap.innerHTML = `<b>${esc(g.label)}</b>（${esc(g.unit)}）· 越右越高`;
    const W = el.clientWidth || card.clientWidth || 800, narrow = W < 520;
    const h = bins.length * 28 + 34;
    el.style.height = el.style.minHeight = `${h}px`;
    const left = 78, w0 = narrow ? 64 : Math.max(90, Math.min(190, W * 0.2)), gap = narrow ? 14 : 26;
    const vals = bins.flatMap((b) => { const v = val(b), bb = b.base?.[metric]; return [v, ...(bb?.ok ? [bb.q1, bb.q3] : [])]; })
      .filter((v) => v != null && isFinite(v));
    let lo = vals.length ? Math.min(...vals) : 0, hi = vals.length ? Math.max(...vals) : 1;
    const pad = (hi - lo || Math.abs(hi) || 1) * 0.12;
    const xn = cpNice(lo - pad, hi + pad, narrow ? 3 : 5);
    lo = xn.min; hi = xn.max;
    const maxShare = Math.max(...bins.map((b) => b.time_pct || 0), 1);
    const cats = bins.map((b) => b.label);
    chart.resize();
    chart.setOption({
      animation: false,
      tooltip: { ...cpTipOpts(), trigger: "item", formatter: (p) => {
        const b = bins[p.dataIndex];
        if (!b) return "";
        const v = val(b);
        return cpTipBox(`<b>坡度 ${esc(b.label)}</b><br>跑步時間 <b>${cpDur(b.time_s)}</b>（${cpN(b.time_pct)}%）`
          + `<br>${esc(g.label)} <b>${cpN(v, g.d)}</b> ${esc(g.unit)}${b.time_s < D.min_s ? `（不到 ${min} 秒，只供參考）` : ""}`
          + usualTip(v, b.base?.[metric], g) + cadTip(b));
      } },
      grid: [{ left, width: w0, top: 4, bottom: 26 },
        { left: left + w0 + gap, right: (narrow ? 14 : 118) + (showCad ? 48 : 0), top: 4, bottom: 26 }],
      xAxis: [
        { type: "value", gridIndex: 0, min: 0, max: maxShare * (narrow ? 1.6 : 1.45), axisLabel: { show: false }, axisTick: { show: false },
          axisLine: { show: false }, splitLine: { show: false } },
        { type: "value", gridIndex: 1, min: lo, max: hi, interval: xn.interval, axisLine: { show: false },
          axisLabel: { color: muted(), fontSize: 10.5, formatter: (v) => cpN(v, xn.interval >= 1 ? 0 : g.d) }, splitLine: { lineStyle: { color: line() } } },
      ],
      yAxis: [
        { type: "category", gridIndex: 0, data: cats, axisTick: { show: false }, axisLine: { lineStyle: { color: line() } },
          axisLabel: { color: ink(), fontSize: 11 } },
        { type: "category", gridIndex: 1, data: cats, axisTick: { show: false }, axisLine: { show: false }, axisLabel: { show: false } },
      ],
      series: [
        { id: "time", type: "bar", xAxisIndex: 0, yAxisIndex: 0, barWidth: 12, z: 2, data: bins.map((b) => b.time_pct || 0),
          itemStyle: { color: css("--cp-bar"), borderRadius: [0, 4, 4, 0] },
          label: { show: true, position: "right", color: muted(), fontSize: 10.5, formatter: (p) => `${Math.round(p.value)}%` } },
        { id: "base", type: "custom", xAxisIndex: 1, yAxisIndex: 1, data: bins.map((b, i) => [lo, i]), encode: { x: 0, y: 1 }, z: 1,
          renderItem: (params, api) => {
            const b = bins[params.dataIndex], bb = b.base?.[metric], yc = api.coord([lo, params.dataIndex])[1];
            const gx0 = api.coord([lo, 0])[0], gx1 = api.coord([hi, 0])[0];
            const kids = [{ type: "rect", shape: { x: Math.min(gx0, gx1), y: yc - 13, width: Math.abs(gx1 - gx0), height: 26 },
              style: { fill: "rgba(0,0,0,0.001)" } }];
            if (bb?.ok) {
              const a = api.coord([bb.q1, 0])[0], z = api.coord([bb.q3, 0])[0], md = api.coord([bb.median, 0])[0];
              kids.push({ type: "rect", silent: true, shape: { x: Math.min(a, z), y: yc - 5, width: Math.max(2, Math.abs(z - a)), height: 10, r: 4 },
                style: { fill: css("--cp-base") } },
                { type: "line", silent: true, shape: { x1: md, y1: yc - 8, x2: md, y2: yc + 8 }, style: { stroke: css("--cp-ink2"), lineWidth: 2 } });
            }
            const xr = Math.max(gx0, gx1);
            // the same bin's cadence, a quiet column right of the plot (impact metrics only)
            if (showCad) kids.push({ type: "text", silent: true, style: { text: fpCad(b), x: xr + 10, y: yc, fill: muted(),
              font: "10.5px system-ui, sans-serif", verticalAlign: "middle" } });
            const t = narrow || b.time_s < D.min_s ? null : cpOutside(val(b), bb, false);
            if (t) kids.push({ type: "text", silent: true, style: { text: t, x: xr + (showCad ? 58 : 12), y: yc, fill: ink(),
              font: "11px system-ui, sans-serif", verticalAlign: "middle" } });
            return { type: "group", children: kids };
          } },
        { id: "me", type: "scatter", xAxisIndex: 1, yAxisIndex: 1, silent: true, z: 3, symbolSize: 11,
          data: bins.map((b, i) => {
            const v = val(b), short = b.time_s < D.min_s;
            return v == null ? { value: [null, i] } : { value: [v, i],
              itemStyle: short ? { color: panel(), borderColor: css("--cp-line"), borderWidth: 1.5 }
                : { color: css("--cp-line"), borderColor: panel(), borderWidth: 2 } };
          }) },
      ],
    }, { replaceMerge: ["series", "xAxis", "yAxis", "grid"] });
  }
  function paintWork(g) {
    const rows = rowsOf(band), val = (r) => r.m?.[metric], B = (r) => r.base?.[metric];
    const xname = D.split === "work" ? "累積作功" : "累積移動時間";
    cap.innerHTML = `<b>${esc(g.label)}</b>（${esc(g.unit)}）· 越上越高；橫軸 = ${xname}`;
    const W = el.clientWidth || card.clientWidth || 800, narrow = W < 520;
    el.style.height = el.style.minHeight = `${narrow ? 230 : 260}px`;
    const vals = rows.flatMap((r) => { const v = val(r), bb = B(r); return [v, ...(bb?.ok ? [bb.q1, bb.q3] : [])]; })
      .filter((v) => v != null && isFinite(v));
    let lo = vals.length ? Math.min(...vals) : 0, hi = vals.length ? Math.max(...vals) : 1;
    const pad = (hi - lo || Math.abs(hi) || 1) * 0.15;
    const yn = cpNice(lo - pad, hi + pad, 4);
    const cats = rows.map((r) => r.label);
    const ok = (r) => B(r)?.ok;
    chart.resize();
    chart.setOption({
      animation: false,
      tooltip: { ...cpTipOpts(), trigger: "axis", axisPointer: { type: "line", lineStyle: { color: muted() } }, formatter: (ps) => {
        const r = rows[ps?.[0]?.dataIndex];
        if (!r) return "";
        const v = val(r);
        return cpTipBox(`<b>${esc(xname)} ${esc(r.label)}</b>${band !== "all" ? `（${esc(D.band_labels?.[band] || band)}）` : ""}`
          + `<br>跑步時間 <b>${cpDur(r.time_s)}</b>`
          + `<br>${esc(g.label)} <b>${cpN(v, g.d)}</b> ${esc(g.unit)}${r.time_s < D.min_s ? `（不到 ${min} 秒，只供參考）` : ""}`
          + usualTip(v, B(r), g) + cadTip(r));
      } },
      grid: [{ left: 52, right: narrow ? 22 : 30, top: 12, bottom: showCad ? 48 : 34 }],
      xAxis: [{ type: "category", data: cats, boundaryGap: false, axisTick: { show: false },
        axisLine: { lineStyle: { color: line() } },
        // with an impact metric: the slice's cadence on a second, quieter line under each label
        axisLabel: { color: muted(), fontSize: 10.5, interval: narrow ? 1 : 0, lineHeight: 15,
          formatter: (c, i) => showCad && rows[i] ? `${c}\n{c|${fpCad(rows[i])}}` : c,
          rich: { c: { color: muted(), fontSize: 10, fontWeight: 600 } } } }],
      yAxis: [{ type: "value", min: yn.min, max: yn.max, interval: yn.interval, axisLine: { show: false },
        axisLabel: { color: muted(), fontSize: 10.5, formatter: (v) => cpN(v, yn.interval >= 1 ? 0 : g.d) }, splitLine: { lineStyle: { color: line() } } }],
      series: [
        { id: "q1", type: "line", stack: "iqr", silent: true, symbol: "none", lineStyle: { opacity: 0 },
          data: rows.map((r) => ok(r) ? B(r).q1 : null) },
        { id: "iqr", type: "line", stack: "iqr", silent: true, symbol: "none", lineStyle: { opacity: 0 },
          areaStyle: { color: css("--cp-base"), opacity: 1 }, data: rows.map((r) => ok(r) ? B(r).q3 - B(r).q1 : null) },
        { id: "med", type: "line", silent: true, symbol: "none", z: 4,
          lineStyle: { color: css("--cp-ink2"), width: 1.5, type: [5, 4], opacity: 1 }, data: rows.map((r) => ok(r) ? B(r).median : null) },
        { id: "me", type: "line", z: 5, symbol: "circle", symbolSize: 8, connectNulls: false,
          lineStyle: { color: css("--cp-line"), width: 2 },
          data: rows.map((r) => {
            const v = val(r), short = r.time_s < D.min_s;
            return { value: v == null ? null : v,
              itemStyle: short ? { color: panel(), borderColor: css("--cp-line"), borderWidth: 1.5 }
                : { color: css("--cp-line"), borderColor: panel(), borderWidth: 2 } };
          }) },
      ],
    }, { replaceMerge: ["series", "xAxis", "yAxis", "grid"] });
  }
  let showCad = false;
  const cadTip = (r) => showCad && r.m?.cadence != null
    ? `<br>步頻 <b>${cpN(r.m.cadence)}</b> spm${r.base?.cadence?.ok ? `（平常 ${cpN(r.base.cadence.median)}）` : ""}` : "";
  function paint() {
    const g = FP_METRICS[metric];
    showCad = FP_IMPACT.has(metric) && keys.includes("cadence");
    cadLeg.style.display = showCad ? "" : "none";
    if (work) paintWork(g); else paintGrade(g);
  }
  paint();
  new ResizeObserver(() => paint()).observe(el);
}

// ---- 步頻與衝擊 (workout_review form_cadence; res.cadence_profile): this run's steady 30-s windows, ILR
// adjusted to the run's median speed and grade with the athlete's own within-run coefficients, against
// cadence; the personal trend line (solid over the cadences seen, dashed out to +10 %) and the +5–10 %
// range (Heiderscheit 2011) as a band. One y-scale. Explanations behind the card's 「?」.
function drawCadenceProfile(card, res) {
  cpStyle();
  const D = res.cadence_profile, F = D.fit, pts = D.points || [];
  const wrap = cpFrame(card, res, "");
  if (D.weak || !pts.length) return;           // weak / no personal trend: the rows say so, no chart
  const bar = document.createElement("div");
  bar.className = "cpbar";
  const leg = document.createElement("div");
  leg.className = "cpleg";
  leg.innerHTML = `<span><i class="dot" style="background:var(--cp-line);opacity:.6"></i>這次每 30 秒（換算到同速度、同坡度）</span>`
    + `<span><i class="ln" style="border-color:var(--cp-ink2)"></i>你的趨勢（推估）</span>`
    + `<span><i style="background:var(--cp-base)"></i>建議 +5–10%（Heiderscheit 2011）</span>`;
  bar.appendChild(leg);
  const cap = document.createElement("p");
  cap.className = "cpcap";
  cap.innerHTML = `<b>ILR</b>（BW/s，同速度 ${cpN(D.speed_ref, 1)} km/h）· 橫軸 = 步頻 spm`;
  const el = document.createElement("div");
  el.className = "plot cpcad";
  el.style.flex = "none";
  el.setAttribute("role", "img");
  el.setAttribute("aria-label", "步頻與衝擊：這次每 30 秒的 ILR 對步頻，和你自己的趨勢線");
  wrap.append(bar, cap, el);
  const chart = echarts.init(el);
  charts.push(chart);
  function paint() {
    const W = el.clientWidth || card.clientWidth || 800, narrow = W < 520;
    el.style.height = el.style.minHeight = `${narrow ? 240 : 280}px`;
    const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
    const cmin = Math.min(...xs), cmax = Math.max(...xs);
    const [cx, cy] = D.center, line = (x) => cy + F.b_cad * (x - cx);
    const xEnd = Math.max(cmax, D.suggest[1]);
    const xn = cpNice(Math.min(cmin, D.median_cad) - 2, xEnd + 2, narrow ? 4 : 6);
    const yv = [...ys, line(xEnd), line(cmin)];
    const yl = pctl(yv, 0.01), yh = pctl(yv, 0.99), pad = (yh - yl || 1) * 0.12;
    const yn = cpNice(yl - pad, yh + pad, 4);
    const muted = css("--muted"), lineC = css("--line"), ink2 = css("--cp-ink2");
    chart.resize();
    chart.setOption({
      animation: false,
      tooltip: { ...cpTipOpts(), trigger: "item", formatter: (p) => {
        if (p.seriesId !== "me") return "";
        const q = pts[p.dataIndex];
        return cpTipBox(`步頻 <b>${cpN(q[0])}</b> spm<br>ILR <b>${cpN(q[2], 1)}</b> BW/s（${cpN(q[3], 1)} km/h、坡度 ${cpN(q[4], 1)}%）`
          + `<br>換算到 ${cpN(D.speed_ref, 1)} km/h、坡度 ${cpN(D.grade_ref, 1)}%：<b>${cpN(q[1], 1)}</b>（推估）`);
      } },
      grid: [{ left: 48, right: narrow ? 14 : 24, top: 14, bottom: 30 }],
      xAxis: [{ type: "value", min: xn.min, max: xn.max, interval: xn.interval, axisLine: { lineStyle: { color: lineC } },
        axisLabel: { color: muted, fontSize: 10.5, formatter: (v) => cpN(v) }, splitLine: { show: false } }],
      yAxis: [{ type: "value", min: yn.min, max: yn.max, interval: yn.interval, axisLine: { show: false },
        axisLabel: { color: muted, fontSize: 10.5, formatter: (v) => cpN(v, yn.interval >= 1 ? 0 : 1) }, splitLine: { lineStyle: { color: lineC } } }],
      series: [
        { id: "sug", type: "line", silent: true, data: [], markArea: { silent: true, itemStyle: { color: css("--cp-base"), opacity: 0.7 },
            label: { show: true, position: "insideTop", color: muted, fontSize: 10.5, formatter: "+5–10%" },
            data: [[{ xAxis: D.suggest[0] }, { xAxis: D.suggest[1] }]] },
          markLine: { silent: true, symbol: "none", lineStyle: { color: muted, type: [2, 3], width: 1 },
            label: { color: muted, fontSize: 10, formatter: `這次中位 ${cpN(D.median_cad)}`, position: "insideEndTop" },
            data: [{ xAxis: D.median_cad }] } },
        { id: "me", type: "scatter", z: 3, symbolSize: 7, data: pts.map((p) => [p[0], p[1]]),
          itemStyle: { color: css("--cp-line"), opacity: 0.6, borderColor: css("--panel"), borderWidth: 1 } },
        { id: "trend", type: "line", silent: true, z: 4, symbol: "none", lineStyle: { color: ink2, width: 2 },
          data: [[cmin, line(cmin)], [cmax, line(cmax)]] },
        { id: "extra", type: "line", silent: true, z: 4, symbol: "none", lineStyle: { color: ink2, width: 2, type: [5, 4] },
          data: cmax < xEnd ? [[cmax, line(cmax)], [xEnd, line(xEnd)]] : [] },
      ],
    }, { replaceMerge: ["series"] });
  }
  paint();
  new ResizeObserver(() => paint()).observe(el);
}

if (typeof echarts === "undefined") document.body.insertAdjacentHTML("afterbegin",
  `<div style="padding:8px 16px;background:var(--err);color:#fff">ECharts 載入失敗，圖表無法繪製</div>`);
init().catch((e) => { $("grid").innerHTML = `<div class="empty">初始化失敗: ${esc(e.message)}</div>`; });
</script>
</body>
