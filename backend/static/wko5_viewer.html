<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WKO5 View Check</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.6.0/echarts.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --text: #1d232b; --muted: #6a7482; --line: #e1e5ea;
  --accent: #2563eb; --accent-soft: #e8efff; --ok: #15803d; --warn: #b45309; --err: #b91c1c; --code: #f1f3f6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --panel: #171b21; --text: #e6e9ee; --muted: #97a1ae; --line: #2a313a;
    --accent: #60a5fa; --accent-soft: #1c2a40; --ok: #4ade80; --warn: #fbbf24; --err: #f87171; --code: #1f252d;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --panel: #171b21; --text: #e6e9ee; --muted: #97a1ae; --line: #2a313a;
  --accent: #60a5fa; --accent-soft: #1c2a40; --ok: #4ade80; --warn: #fbbf24; --err: #f87171; --code: #1f252d;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column;
  font: 13px/1.45 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
select, input { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 3px 6px; }
.meta { color: var(--muted); font-size: 12px; }
.spacer { flex: 1; }
svg.i { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.iconbtn { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--panel);
  color: var(--text); border-radius: 6px; padding: 4px 9px; cursor: pointer; font: inherit; }
.iconbtn:hover { background: var(--accent-soft); }

/* ---- toolbar: where am I (mode › group › view › dashboard) + active filters as chips ---- */
.tb { flex: none; background: var(--panel); border-bottom: 1px solid var(--line); padding: 8px 16px 9px;
  display: grid; gap: 8px; }
.tb1 { display: flex; align-items: center; gap: 12px; min-width: 0; }
.tb2 { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.seg { display: inline-flex; flex: none; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--bg); }
.seg button { border: 0; background: none; color: var(--muted); padding: 4px 12px; border-radius: 6px; cursor: pointer;
  font: inherit; font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.seg button .sub { font-weight: 400; font-size: 11.5px; }
.seg button.on { background: var(--panel); color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.crumb { display: flex; align-items: baseline; gap: 6px; min-width: 0; color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; }
.crumb b { color: var(--text); font-size: 15px; overflow: hidden; text-overflow: ellipsis; }
.crumb .sep { opacity: .45; }
.crumb .n { font-size: 11.5px; flex: none; }
.crumb .c1, .crumb .c2 { flex: none; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel);
  color: var(--text); border-radius: 16px; padding: 3px 11px; font: inherit; cursor: pointer; white-space: nowrap; max-width: 100%; }
.chip:hover { border-color: var(--accent); }
.chip .k { color: var(--muted); font-size: 11.5px; }
.chip .v { overflow: hidden; text-overflow: ellipsis; }
.chip .caret { color: var(--muted); font-size: 10px; }
.chip.go { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 600; }
.chip.go:hover { border-color: var(--accent); }
.chip[aria-expanded="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.pill { display: inline-flex; align-items: center; gap: 5px; flex: none; font-size: 11.5px; padding: 2px 10px; border-radius: 12px;
  text-decoration: none; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill:hover { background: var(--accent-soft); }
.pill.parity { border-color: var(--warn); color: var(--warn); }
.pill.mine { border-color: var(--ok); color: var(--ok); }
body[data-mode="season"] .w-only, body[data-mode="workout"] .s-only { display: none !important; }
.only-narrow { display: none !important; }

/* ---- layout: chart directory | charts | filters & activities ---- */
.wrap { flex: 1; display: flex; min-height: 0; }
main { flex: 1; min-width: 0; overflow: auto; padding: 12px 16px 24px;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(480px, 1fr)); gap: 12px; align-content: start; }
.side { width: 260px; flex: none; background: var(--panel); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; min-height: 0; }
.side .sh { padding: 10px 12px 8px; border-bottom: 1px solid var(--line); display: flex; gap: 6px; align-items: center; }
.side .search { position: relative; flex: 1; }
.side .search svg { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.side input[type="search"] { width: 100%; padding: 5px 8px 5px 28px; }
.tree { flex: 1; overflow-y: auto; padding: 4px 0 16px; }
.grp-h { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .06em;
  color: var(--muted); padding: 12px 14px 4px; }
.grp-h .tag { font-weight: 500; letter-spacing: 0; border: 1px solid var(--line); border-radius: 8px; padding: 0 6px; cursor: help; }
.tree button { display: flex; align-items: center; gap: 6px; width: 100%; border: 0; background: none; color: var(--text);
  font: inherit; text-align: left; cursor: pointer; padding: 5px 12px; }
.tree button:hover { background: var(--accent-soft); }
.tree button .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree button .n { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; font-weight: 400; flex: none; }
.vw-h { font-weight: 600; }
.vw-h::before { content: "▸"; font-size: 10px; color: var(--muted); width: 10px; transition: transform .12s; }
.vw.open > .vw-h::before { transform: rotate(90deg); }
.vw.has-cur:not(.open) > .vw-h { color: var(--accent); }
.vw ul { list-style: none; margin: 0 0 4px; padding: 0; }
.vw:not(.open) ul { display: none; }
.tree .db { padding-left: 30px; }
.grp.flat { padding-top: 6px; }
.grp.flat ul { list-style: none; margin: 0; padding: 0; }
.grp.flat .db { padding-left: 14px; }
.grp.flat ul + ul { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 4px; }
.tree .db.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
.tree .hit { display: block; padding: 6px 14px; }
.tree .hit .w { display: block; color: var(--muted); font-size: 11px; }
.tree .hit .tag { font-size: 10.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 0 5px; margin-right: 4px; }
.tree mark { background: color-mix(in srgb, var(--accent) 28%, transparent); color: inherit; border-radius: 2px; }
.tree .none { padding: 16px 14px; color: var(--muted); }
.side .foot { border-top: 1px solid var(--line); padding: 7px 14px; font-size: 11px; color: var(--muted); }
.ddesc { grid-column: 1 / -1; margin: 0; color: var(--muted); font-size: 12px; cursor: pointer;
  /* overflow: clip, not hidden — a scroll container's grid row would collapse to 0 in this scrolling grid */
  white-space: nowrap; overflow: clip; text-overflow: ellipsis; min-width: 0; }
.ddesc.full { white-space: normal; }
.card.flash { box-shadow: 0 0 0 2px var(--accent); }

aside { width: 320px; flex: none; background: var(--panel); border-left: 1px solid var(--line);
  display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }
body.aside-closed aside { display: none; }
aside .ah { display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 46px; flex: none; border-bottom: 1px solid var(--line);
  position: sticky; top: 0; background: var(--panel); z-index: 2; font-weight: 600; }
aside details { padding: 8px 12px; border-bottom: 1px solid var(--line); margin: 0; scroll-margin-top: 46px; }
aside summary { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .03em;
  padding: 2px 0 6px; list-style: none; display: flex; gap: 6px; align-items: baseline; }
aside summary::before { content: "▾"; font-size: 10px; }
aside details:not([open]) > summary::before { content: "▸"; }
aside details:not([open]) > summary { padding-bottom: 2px; }
aside summary .meta { font-weight: 400; margin-left: auto; font-size: 11px; }
aside details.actsbox { padding-bottom: 0; border-bottom: 0; }
aside details.actsbox .acts { margin: 0 -12px; }
aside details.actsbox > summary { position: sticky; top: 46px; padding-top: 8px; margin-top: -8px; background: var(--panel); z-index: 1; }
aside .hint { font-size: 11.5px; color: var(--muted); margin: -2px 0 6px; }
.presets button { font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--panel);
  color: var(--text); border-radius: 4px; padding: 2px 7px; cursor: pointer; }
.presets button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.sports label { display: inline-flex; gap: 4px; align-items: center; margin: 2px 8px 2px 0; }
.act { padding: 6px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.act:hover { background: var(--accent-soft); }
.act.on { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.act .t { display: flex; justify-content: space-between; gap: 8px; }
.act .s { color: var(--muted); font-size: 11px; }
.empty .iconbtn { margin-top: 10px; }
.scrim { display: none; }
@media (max-width: 1100px) { .crumb .c1, .crumb .c1 + .sep { display: none; } }
@media (max-width: 900px) {
  /* narrow: directory and filter panel become drawers over the charts */
  .only-narrow { display: inline-flex !important; }
  .side { position: fixed; left: 0; top: 0; bottom: 0; z-index: 50; width: min(300px, 86vw);
    box-shadow: 8px 0 24px rgba(0,0,0,.3); transform: translateX(-105%); transition: transform .16s ease-out; }
  body.side-open .side { transform: none; }
  aside { position: fixed; right: 0; top: 0; bottom: 0; z-index: 50; width: min(330px, 90vw);
    box-shadow: -8px 0 24px rgba(0,0,0,.3); }
  body.side-open .scrim, body:not(.aside-closed) .scrim { display: block; position: fixed; inset: 0; z-index: 45; background: rgba(0,0,0,.35); }
  main { grid-template-columns: 1fr; padding: 10px 10px 20px; }
  .tb { padding: 8px 10px; }
  .tb1 { flex-wrap: wrap; row-gap: 6px; gap: 8px; }
  .crumb { order: 5; flex: 1 1 100%; }
  .crumb .c2, .crumb .c2 + .sep { display: none; }
}
@media (max-width: 520px) { .seg button .sub { display: none; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.card.wide { grid-column: 1 / -1; }
.card h2 { font-size: 13px; margin: 0 0 4px; }
.desc { color: var(--muted); font-size: 11px; margin: 0 0 6px; max-height: 3em; overflow: hidden; }
.plot { width: 100%; height: 300px; }
.gauge { display: flex; gap: 14px; flex-wrap: wrap; padding: 6px 0; }
.gauge .g { flex: 1; min-width: 140px; }
.big { font-size: 24px; font-weight: 600; }
.bar { height: 7px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 5px; }
.bar > i { display: block; height: 100%; background: var(--accent); }
details { margin-top: 6px; }
summary { cursor: pointer; color: var(--muted); font-size: 11px; }
table { width: 100%; border-collapse: collapse; font-size: 11.5px; margin-top: 4px; }
th, td { text-align: left; border-top: 1px solid var(--line); padding: 3px 6px; vertical-align: top; }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td code { background: var(--code); padding: 1px 4px; border-radius: 4px; word-break: break-all;
  font-family: ui-monospace, Consolas, monospace; font-size: 10.5px; }
.st-ok { color: var(--ok); } .st-err { color: var(--err); } .st-none { color: var(--muted); }
.badge { display: inline-block; font-size: 10.5px; padding: 0 6px; border-radius: 10px; border: 1px solid var(--warn); color: var(--warn); }
.badge.fix { border-color: var(--accent); color: var(--accent); font-weight: 400; margin-left: 6px; cursor: help; vertical-align: 1px; }
table.zt td, table.zt th { padding: 4px 6px; white-space: nowrap; }
table.zt th.num { text-align: right; }
.vt { overflow-x: auto; }
.zbar { position: relative; height: 16px; background: var(--code); border-radius: 3px; overflow: hidden; }
.zbar i { position: absolute; left: 0; top: 0; bottom: 0; opacity: .75; }
.zbar span { position: relative; font-size: 10.5px; padding-left: 5px; line-height: 16px; }
.loading { color: var(--muted); padding: 30px 0; text-align: center; }
.nodata { color: var(--muted); background: var(--code); border-radius: 6px; padding: 14px 12px; margin: 6px 0; text-align: center; }
.nodata.small { padding: 6px 10px; font-size: 11.5px; text-align: left; }
.card h2 { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.qtip { position: relative; display: inline-grid; place-items: center; width: 17px; height: 17px; padding: 0; margin: 0 2px 0 6px;
  border-radius: 50%; border: 1px solid var(--line); background: none; color: var(--muted); font: 600 11px/1 system-ui, sans-serif;
  cursor: help; vertical-align: 2px; }
.qtip-pop { position: fixed; z-index: 1000; max-width: min(360px, calc(100vw - 24px)); white-space: pre-line; text-align: left;
  background: var(--panel, #fff); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  font: 400 12px/1.55 system-ui, sans-serif; box-shadow: 0 6px 18px rgba(0,0,0,.18); pointer-events: none; }
.seg.period { margin-left: auto; padding: 1px; font-size: 11.5px; }
.seg.period button { padding: 1px 8px; font-weight: 500; }
.range-note { margin: -2px 0 4px; font-size: 11px; }
.recent-note { margin: 2px 0 4px; font-size: 12px; }
.recent-note b { color: #e8431c; font-weight: 600; }
.zbtn { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 4px; border-radius: 4px;
  font: inherit; font-size: 13px; line-height: 1.4; }
.zbtn:hover { color: var(--accent); background: var(--accent-soft); }
/* enlarged chart: near-full viewport; full screen on phones */
dialog#zoom { width: min(1400px, 96vw); height: 92vh; max-width: none; max-height: none; padding: 0; border: 1px solid var(--line);
  border-radius: 10px; background: var(--panel); color: var(--text); box-shadow: 0 12px 48px rgba(0,0,0,.35); }
dialog#zoom[open] { display: flex; flex-direction: column; }
dialog#zoom::backdrop { background: rgba(0,0,0,.45); }
#zoom .zh { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex: none; }
#zoom .zh h2 { font-size: 15px; margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-width: 0; }
#zoom .zb { flex: 1; overflow: auto; border: 0; border-radius: 0; display: flex; flex-direction: column; min-height: 0; }
#zoom .zb > h2 { display: none; }
#zoom .zb .desc { max-height: none; }
#zoom .zb .plot { flex: 1; min-height: 360px; height: auto; }
@media (max-width: 700px) { dialog#zoom { width: 100vw; height: 100vh; max-height: 100vh; border-radius: 0; margin: 0; } }
.empty { grid-column: 1 / -1; color: var(--muted); padding: 40px; text-align: center; }
/* workout route map (Leaflet) */
.plot.lmap { height: 380px; border-radius: 6px; overflow: hidden; background: var(--code); z-index: 0; }
.maptb { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 0 0 6px; font-size: 11.5px; }
.maptb .seg { padding: 1px; }
.maptb .seg button { padding: 1px 8px; font-weight: 500; }
.maptb .seg button:disabled { opacity: .4; cursor: default; }
.maplegend { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }
.maplegend i { display: inline-block; width: 90px; height: 8px; border-radius: 4px; }
.maphint { margin: 6px 0 0; padding: 6px 10px; border-radius: 6px; font-size: 11.5px; color: var(--warn);
  border: 1px solid var(--warn); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.maphint[hidden] { display: none; }
.maphint button { font: inherit; font-size: 11.5px; border: 1px solid var(--line); background: var(--panel); color: var(--text);
  border-radius: 4px; padding: 1px 8px; cursor: pointer; }
.lmap .leaflet-tooltip.hovtip { font-size: 11px; line-height: 1.35; padding: 3px 6px; }
</style>
</head>
<body class="aside-closed" data-mode="season">
<script src="/api/v1/static/shell.js" data-page="charts"></script>
<script src="/api/v1/static/segments_card.js" defer></script>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
  <symbol id="i-sport" viewBox="0 0 24 24"><circle cx="14" cy="4.5" r="2"/><path d="m6 21 3.5-6 3 2.5V22M9.5 15 11 9l3.5 2 3 .5M11 9 7 10.5 5.5 14"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></symbol>
  <symbol id="i-tree" viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.3-4.3"/></symbol>
  <symbol id="i-calc" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8.5 7h7M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01M8.5 15.5h.01M12 15.5h.01M15.5 15.5h.01"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
</svg>
<div class="tb">
  <div class="tb1">
    <button class="iconbtn only-narrow" id="treebtn" aria-controls="side" aria-expanded="false"><svg class="i"><use href="#i-tree"/></svg>目錄</button>
    <div class="seg mode" role="group" aria-label="圖表類型">
      <button id="m-season" class="on" title="一段期間內多次活動的趨勢">趨勢<span class="sub">（多次活動）</span></button>
      <button id="m-workout" title="一筆活動的逐秒圖表">單次活動</button>
    </div>
    <div class="crumb" id="crumb"></div>
    <span class="spacer"></span>
    <!-- charts.data_source: WKO5 folder / COROS / TP; changing it saves the setting and reloads -->
    <span id="source-chip"></span><script src="/api/v1/static/sourcechip.js" defer></script>
    <a class="pill" id="modepill" href="/api/v1/wko5/settings#mode"></a>
  </div>
  <div class="tb2">
    <button class="chip s-only" id="chip-range" aria-controls="aside"><svg class="i"><use href="#i-cal"/></svg><span class="v" id="range-txt"></span><span class="caret">▾</span></button>
    <button class="chip s-only" id="chip-sports" aria-controls="aside"><svg class="i"><use href="#i-sport"/></svg><span class="v" id="sports-txt"></span><span class="caret">▾</span></button>
    <button class="chip go s-only" id="chip-acts" aria-controls="aside" title="選一筆活動，看它的單次活動圖表"><svg class="i"><use href="#i-list"/></svg>看單次活動<span class="k" id="acts-n"></span></button>
    <button class="chip go w-only" id="back"><svg class="i"><use href="#i-back"/></svg>回到趨勢</button>
    <button class="chip w-only" id="chip-act" aria-controls="aside" title="換一筆活動"><svg class="i"><use href="#i-list"/></svg><span class="k">活動</span><span class="v" id="act-txt"></span><span class="caret">▾</span></button>
  </div>
</div>
<div class="wrap">
  <nav class="side" id="side" aria-label="圖表目錄">
    <div class="sh">
      <label class="search"><svg class="i"><use href="#i-search"/></svg><input type="search" id="q" placeholder="搜尋圖表名稱…" aria-label="搜尋圖表"></label>
      <button class="iconbtn only-narrow" id="sideclose" aria-label="關閉目錄"><svg class="i"><use href="#i-x"/></svg></button>
    </div>
    <div class="tree" id="tree"></div>
    <div class="foot" id="athinfo"></div>
  </nav>
  <main id="grid"><div class="empty">載入中…</div></main>
  <aside id="aside" aria-label="篩選與活動">
    <div class="ah">篩選與活動<span class="spacer"></span><button class="iconbtn" id="asideclose" aria-label="關閉"><svg class="i"><use href="#i-x"/></svg></button></div>
    <details open data-k="range">
      <summary>日期範圍 <span class="meta" id="sum-range"></span></summary>
      <div class="row"><input type="date" id="begin"> → <input type="date" id="end"></div>
      <div class="row presets" style="margin-top:6px">
        <button data-d="7">7天</button><button data-d="42">42天</button><button data-d="90">90天</button>
        <button data-d="365">1年</button><button data-d="ytd">今年</button><button data-d="all">全部</button>
      </div>
    </details>
    <details open data-k="sports">
      <summary>運動類型 <span class="meta" id="sum-sports"></span></summary>
      <div class="sports" id="sports"></div>
    </details>
    <details open data-k="acts" class="actsbox">
      <summary id="acts-h">活動</summary>
      <p class="hint">點一筆 → 看它的單次活動圖表</p>
      <div class="acts" id="acts"></div>

  </aside>
</div>
<div class="scrim" id="scrim"></div>
<dialog id="zoom" aria-labelledby="zoom-title">
  <div class="zh"><h2 id="zoom-title"></h2><span class="spacer"></span>
    <button class="iconbtn" id="zoomclose" aria-label="關閉放大"><svg class="i"><use href="#i-x"/></svg></button></div>
  <div class="zb card" id="zoombody"></div>
</dialog>
<script>
const $ = (id) => document.getElementById(id);
const API = "/api/v1/wko5";
const S = { mode: "season", views: [], sports: [], athlete: null, workout: null, dash: { season: 0, workout: 0 }, view: {} };
const charts = [];
let loadToken = 0;

const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const iso = (d) => d.toISOString().slice(0, 10);
const fmtNum = (v, d = 2) => v == null ? "na" : (Math.abs(v) >= 1000 ? Math.round(v).toLocaleString() : (+v).toFixed(d));
const hms = (s) => { if (s == null) return "na"; s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); };

// ---- units: every series / axis carries {id,label,kind,dec,scale,base} (backend units.py)
const AUTO_DEC = [[100, 0], [10, 1], [0, 2]];
const UNONE = { id: "NONE", label: "", kind: "number", dec: AUTO_DEC };
function decFor(u, dv) { const r = u.dec || AUTO_DEC; for (const [t, d] of r) if (Math.abs(dv) >= t) return d; return r[r.length - 1][1]; }
const trimZeros = (s) => s.includes(".") ? s.replace(/\.?0+$/, "") : s;
// seconds -> h:mm:ss / m:ss ("hm" = h:mm)
function fmtDur(s, style) {
  if (s == null || !isFinite(s)) return "—";
  const neg = s < 0; s = Math.round(Math.abs(s));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60, p2 = (n) => String(n).padStart(2, "0");
  const t = style === "hm" ? `${h}:${p2(m)}` : h ? `${h}:${p2(m)}:${p2(x)}` : `${m}:${p2(x)}`;
  return (neg ? "-" : "") + t;
}
// pace series may hold min/km (default), s/km ("s") or a speed in km/h ("kph")
function paceMin(v, base) { if (v == null) return null; return base === "s" ? v / 60 : base === "kph" ? (v > 0 ? 60 / v : null) : v; }
const WKO_EPOCH = Date.UTC(1901, 0, 1);
const dayIso = (n) => new Date(WKO_EPOCH + Math.floor(n) * 864e5).toISOString().slice(0, 10);
// one value in unit u. opts: {label: add unit text, tick: axis tick (trim zeros), span: axis range in seconds}
function fmtU(v, u, opts = {}) {
  u = u || UNONE;
  if (v == null || typeof v !== "number" || !isFinite(v)) return typeof v === "string" ? v : "—";
  const lab = opts.label !== false;
  if (u.kind === "duration") {
    if (opts.tick) return fmtDur(v, (opts.span ?? Math.abs(v)) >= 3 * 3600 ? "hm" : undefined);
    return fmtDur(v, u.id === "HHMM" ? "hm" : undefined);
  }
  if (u.kind === "pace") {
    const p = paceMin(v, u.base);
    if (p == null || p <= 0 || p > 600) return "—";
    return fmtDur(p * 60) + (lab && !opts.tick ? (u.id === "PACEMI" ? " /mi" : " /km") : "");
  }
  if (u.kind === "date") return dayIso(v);
  const dv = v * (u.scale || 1);
  let d = decFor(u, dv);
  // a tick needs enough decimals to be distinct (0.2 on a W axis, not "0")
  if (opts.tick) while (d < 4 && Math.abs(+dv.toFixed(d) - dv) > 1e-9 * Math.max(1, Math.abs(dv))) d++;
  let t = dv.toFixed(d);
  if (opts.tick) t = trimZeros(t);
  if (t === "-0") t = "0";
  if (u.kind === "percent") return t + "%";
  return lab && u.label ? `${t} ${u.label}` : t;
}
// unit text printed after a number that fmtU(..., {label:false}) formatted
const unitText = (u) => !u || ["duration", "percent", "date"].includes(u.kind) ? ""
  : u.kind === "pace" ? (u.id === "PACEMI" ? "/mi" : "/km") : (u.label || "");
function axisName(u) {
  if (!u) return "";
  if (u.kind === "duration") return "時間";
  if (u.kind === "pace") return u.id === "PACEMI" ? "配速 /mi" : "配速 /km";
  if (u.kind === "percent") return "%";
  if (u.id === "TSSPERDAY" || u.label === "TSS/天") return "TSS/天";
  return u.label || "";
}
// duration-x (mean-max / PD curves): log axis with round-number ticks
const DUR_TICKS = [1, 5, 15, 30, 60, 120, 300, 600, 1200, 1800, 3600, 7200, 10800, 21600, 43200, 86400, 172800];
const DUR_TICKS_SPARSE = [1, 5, 30, 60, 300, 1200, 3600, 10800, 36000, 86400, 172800];
const durTick = (s) => s < 60 ? `${s}s` : s < 3600 ? `${Math.round(s / 60)}m` : `${+(s / 3600).toFixed(1)}h`;
// GET JSON; a dropped connection or a 5xx (server busy / reloading) is retried once
async function j(url, retry = 1) {
  let r;
  try { r = await fetch(url); }
  catch (e) {
    if (retry > 0) { await new Promise((ok) => setTimeout(ok, 1200)); return j(url, retry - 1); }
    throw new Error(`連不上伺服器（${e.message}）`);
  }
  if (!r.ok) {
    if (r.status >= 500 && retry > 0) { await new Promise((ok) => setTimeout(ok, 1200)); return j(url, retry - 1); }
    throw new Error(`${r.status} ${(await r.text()).slice(0, 300)}`);
  }
  return r.json();
}
function save() { try { localStorage.setItem("wko5viewer", JSON.stringify({ mode: S.mode, dash: S.dash, view: S.view,
  begin: $("begin").value, end: $("end").value, sports: selectedSports(), workout: S.workout, workoutLabel: S.workoutLabel })); } catch {} }
function restore() { try { return JSON.parse(localStorage.getItem("wko5viewer") || "{}"); } catch { return {}; } }

function viewKind(v) {
  const kinds = v.dashboards.flatMap((d) => d.charts.map((c) => c.kind));
  return kinds.filter((k) => k === "workout").length > kinds.filter((k) => k === "athlete").length ? "workout" : "season";
}
const viewsOf = (mode) => S.views.filter((v) => viewKind(v) === mode && !v.error);
const SOURCE_LABEL = { custom: "我的圖表", wko5: "WKO5 對照" };
const CUSTOM_ORDER = ["我的訓練", "周期化訓練"];  // flat tab list order (views/*.json names)
const MODE_LABEL = { season: "趨勢", workout: "單次活動" };
const curView = () => viewsOf(S.mode).find((v) => v.name === S.view[S.mode]) || viewsOf(S.mode)[0];
function selectedSports() { return [...document.querySelectorAll("#sports input:checked")].map((i) => i.value); }
function sportsParam() { const s = selectedSports(); return s.length === S.sports.length ? "" : s.join(","); }
function tpParam() { return `parity=${S.parity}`; }
const narrowMq = matchMedia("(max-width: 900px)");

async function init0() {
  const ath = await j(`${API}/athlete?${tpParam()}`);
  S.athlete = ath;
  const snap = ath.wko5_pmc_snapshot || {};
  const info = $("athinfo");
  info.textContent = `${ath.name} · ${ath.workouts} 筆活動`;
  info.title = `WKO5 快照 CTL ${fmtNum(snap.ctl)} ATL ${fmtNum(snap.atl)} TSB ${fmtNum(snap.tsb)}`;
}

async function init() {
  const [views, sports, cfg, us] = await Promise.all([j(`${API}/views`), j(`${API}/sports`), j(`${API}/config`),
    j("/api/v1/sync/settings").catch(() => ({}))]);
  S.views = views; S.sports = sports;
  // workout map defaults (settings page); the map's own switch overrides them per browser
  S.mapDefault = { base: BASE_BY_ID[us.map_basemap] ? us.map_basemap : "rudy",
    overlays: (us.map_overlays || []).filter((id) => OVL_BY_ID[id]) };
  S.parity = !!cfg.config.parity;   // switched on the settings page
  const pill = $("modepill");
  pill.innerHTML = `<svg class="i"><use href="#i-calc"/></svg><span>算式：${S.parity ? "比照 WKO5" : "我的"}</span>`;
  pill.title = (S.parity ? "WKO5 對照模式：完全比照 WKO5 的公式，不套用資料校正與你的測試值"
    : "我的算式：移動時間 hrTSS、爬升加成、套用資料校正與你的測試值") + "（點這裡到設定切換）";
  pill.className = "pill " + (S.parity ? "parity" : "mine");
  const broken = S.views.filter((v) => v.error);
  if (broken.length) console.warn("view files with errors:", broken.map((v) => `${v.path}: ${v.error}`));
  await init0();
  const r = restore();
  const today = new Date();
  $("end").value = r.end || iso(today);
  $("begin").value = r.begin || iso(new Date(today - 365 * 864e5));
  $("sports").innerHTML = sports.map((s) => `<label><input type="checkbox" value="${esc(s.sport)}" ${!r.sports || r.sports.includes(s.sport) ? "checked" : ""}>${esc(s.sport)} <span class="meta">${s.count}</span></label>`).join("");
  S.dash = { ...S.dash, ...(r.dash || {}) }; S.view = r.view || {}; S.workout = r.workout ?? null; S.workoutLabel = r.workoutLabel || null;
  // deep link from other pages: ?view=<name>&dash=<index or title>
  const qp = new URLSearchParams(location.search), qv = S.views.find((x) => x.name === qp.get("view") && !x.error);
  if (qv) {
    const m = viewKind(qv), dq = qp.get("dash") || "0";
    S.view[m] = qv.name;
    S.dash[m] = Math.max(0, /^\d+$/.test(dq) ? Math.min(+dq, qv.dashboards.length - 1) : qv.dashboards.findIndex((d) => d.title === dq));
    r.mode = m;
    // &chart=<index>: open that chart enlarged once it has loaded (and load it first)
    const qc = qp.get("chart");
    if (/^\d+$/.test(qc ?? "")) { S.zoomAfter = +qc; S.focusChart = +qc; }
    history.replaceState(null, "", location.pathname);
  }
  $("m-season").onclick = () => setMode("season");
  $("m-workout").onclick = () => setMode("workout");
  $("begin").onchange = $("end").onchange = onFilter;
  $("sports").onchange = onFilter;
  initChrome();
  filterSummary();
  document.querySelectorAll(".presets button").forEach((b) => b.onclick = () => preset(b.dataset.d));
  setMode(r.mode === "workout" && S.workout != null ? "workout" : "season");
  loadActs();
}

function onFilter() { filterSummary(); loadActs(); if (S.mode === "season") load(); }

function preset(d) {
  const end = new Date($("end").value || iso(new Date()));
  let begin;
  if (d === "ytd") begin = new Date(end.getFullYear(), 0, 1);
  else if (d === "all") begin = new Date((S.athlete.first || "2000-01-01").slice(0, 10));
  else begin = new Date(end - (+d - 1) * 864e5);
  $("begin").value = iso(begin);
  onFilter();
}

function setMode(mode) {
  S.mode = mode;
  document.body.dataset.mode = mode;
  $("m-season").classList.toggle("on", mode === "season");
  $("m-workout").classList.toggle("on", mode === "workout");
  $("m-season").setAttribute("aria-pressed", String(mode === "season"));
  $("m-workout").setAttribute("aria-pressed", String(mode === "workout"));
  if ($("begin").value) filterSummary();
  renderTree(); renderActChip();
  if (mode === "workout" && S.workout == null) openAside("acts");
  load();
}

// jump to a dashboard (from the directory tree or a search hit)
function pick(mode, viewName, di, ci) {
  S.view[mode] = viewName; S.dash[mode] = di; S.focusChart = ci ?? null;
  if (narrowMq.matches) setSide(false);
  if (mode !== S.mode) setMode(mode); else { renderTree(); load(); }
}

// ---- chart directory: group (我的圖表 / WKO5 對照) → view → dashboards ----
function treeOpen(view, cur) {
  const t = uiState().tree || {};
  if (view.name in t) return t[view.name];
  return view === cur || view.source === "custom";
}
function renderTree() {
  const q = $("q").value.trim();
  const v = curView();
  if (v && S.dash[S.mode] >= v.dashboards.length) S.dash[S.mode] = 0;
  renderCrumb();
  if (q) return renderSearch(q);
  const vs = viewsOf(S.mode);
  $("tree").innerHTML = ["custom", "wko5"].map((src) => {
    const group = vs.filter((x) => (x.source || "wko5") === src);
    if (!group.length) return "";
    if (src === "custom") {
      // the athlete's own views: one flat list of tabs, no view level (我的訓練 first:
      // load / volume / intensity / ability, then the periodization phases)
      const rank = (x) => (CUSTOM_ORDER.indexOf(x.name) + 1 || 99);
      return `<div class="grp flat">` + [...group].sort((a, b) => rank(a) - rank(b)).map((view) =>
        `<ul class="vw open" data-v="${esc(view.name)}">${view.dashboards.map((d, i) => {
          const on = view === v && i === S.dash[S.mode];
          return `<li><button class="db ${on ? "on" : ""}" data-i="${i}" title="${esc(d.title)}" ${on ? 'aria-current="page"' : ""}>
            <span class="nm">${esc(d.title)}</span><span class="n" title="${d.charts.length} 張圖">${d.charts.length}</span></button></li>`;
        }).join("")}</ul>`).join("") + `</div>`;
    }
    return `<div class="grp"><div class="grp-h">${SOURCE_LABEL[src]}${src === "wko5"
      ? `<span class="tag" title="從 WKO5 匯入的原始 view，用來對照數字">匯入</span>` : ""}</div>` +
      group.map((view) => {
        const open = treeOpen(view, v);
        return `<div class="vw ${open ? "open" : ""} ${view === v ? "has-cur" : ""}" data-v="${esc(view.name)}">
          <button class="vw-h" aria-expanded="${open}"><span class="nm">${esc(view.name)}</span><span class="n" title="${view.dashboards.length} 個頁面">${view.dashboards.length}</span></button>
          <ul>${view.dashboards.map((d, i) => `<li><button class="db ${view === v && i === S.dash[S.mode] ? "on" : ""}" data-i="${i}" title="${esc(d.title)}"
            ${view === v && i === S.dash[S.mode] ? 'aria-current="page"' : ""}><span class="nm">${esc(d.title)}</span><span class="n" title="${d.charts.length} 張圖">${d.charts.length}</span></button></li>`).join("")}</ul></div>`;
      }).join("") + `</div>`;
  }).join("") || `<div class="none">沒有${MODE_LABEL[S.mode]}的 view</div>`;
  $("tree").querySelectorAll(".vw").forEach((el) => {
    const name = el.dataset.v;
    el.querySelectorAll(".db").forEach((b) => b.onclick = () => pick(S.mode, name, +b.dataset.i));
    if (!el.querySelector(".vw-h")) return;  // flat custom list has no view header
    el.querySelector(".vw-h").onclick = () => {
      const open = !el.classList.contains("open");
      el.classList.toggle("open", open);
      el.querySelector(".vw-h").setAttribute("aria-expanded", String(open));
      saveUi({ tree: { ...(uiState().tree || {}), [name]: open } });
    };
  });
}
function markHit(s, q) {
  const i = s.toLowerCase().indexOf(q.toLowerCase());
  return i < 0 ? esc(s) : esc(s.slice(0, i)) + `<mark>${esc(s.slice(i, i + q.length))}</mark>` + esc(s.slice(i + q.length));
}
function renderSearch(q) {
  const ql = q.toLowerCase(), hits = [];
  for (const mode of [S.mode, S.mode === "season" ? "workout" : "season"])
    for (const v of viewsOf(mode)) v.dashboards.forEach((d, di) => {
      if (d.title.toLowerCase().includes(ql)) hits.push({ mode, v, di, ci: null, label: d.title, where: `${v.name} · 頁面` });
      for (const c of d.charts) if ((c.title || "").toLowerCase().includes(ql))
        hits.push({ mode, v, di, ci: c.index, label: c.title, where: `${v.name} › ${d.title}` });
    });
  const shown = hits.slice(0, 80);
  $("tree").innerHTML = shown.length ? `<div class="grp-h">${hits.length} 筆符合</div>` + shown.map((h, k) =>
    `<button class="hit" data-k="${k}"><span class="tag">${MODE_LABEL[h.mode]}</span>${markHit(h.label, q)}<span class="w">${esc(h.where)}</span></button>`).join("")
    : `<div class="none">找不到「${esc(q)}」</div>`;
  $("tree").querySelectorAll(".hit").forEach((b) => b.onclick = () => { const h = shown[+b.dataset.k]; pick(h.mode, h.v.name, h.di, h.ci); });
}
function renderCrumb() {
  const v = curView(), d = v?.dashboards[S.dash[S.mode]];
  $("crumb").innerHTML = !v ? "" : `<span class="c1">${SOURCE_LABEL[v.source || "wko5"]}</span><span class="sep">›</span>
    <span class="c2" title="${esc(v.name)}">${esc(v.name)}</span><span class="sep">›</span><b title="${esc(d?.title || "")}">${esc(d?.title || "")}</b>
    <span class="n">${d ? d.charts.length + " 張圖" : ""}</span>`;
}

// ---- page chrome: directory drawer, filter / activity panel --------------
const UI_KEY = "wko5viewer.ui";
function uiState() { try { return JSON.parse(localStorage.getItem(UI_KEY) || "{}"); } catch { return {}; } }
function saveUi(patch) { try { localStorage.setItem(UI_KEY, JSON.stringify({ ...uiState(), ...patch })); } catch {} }

function initChrome() {
  const ui = uiState();
  // the panel opens from the filter chips; on wide screens it stays docked if you left it open
  setAside(!narrowMq.matches && ui.aside === true, false);
  $("asideclose").onclick = () => setAside(false, true);
  $("chip-range").onclick = () => toggleAside("range");
  $("chip-sports").onclick = () => toggleAside("sports");
  $("chip-acts").onclick = () => toggleAside("acts");
  $("chip-act").onclick = () => toggleAside("acts");
  $("back").onclick = () => setMode("season");
  $("treebtn").onclick = () => setSide(!document.body.classList.contains("side-open"));
  $("sideclose").onclick = () => setSide(false);
  $("scrim").onclick = () => { setSide(false); if (narrowMq.matches) setAside(false, false); };
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (document.activeElement === $("q") && $("q").value) { $("q").value = ""; renderTree(); return; }
    setSide(false); if (narrowMq.matches) setAside(false, false);
  });
  $("q").oninput = () => renderTree();

  document.querySelectorAll("aside details[data-k]").forEach((d) => {
    const k = "sec_" + d.dataset.k;
    if (ui[k] === false) d.open = false;
    d.addEventListener("toggle", () => saveUi({ [k]: d.open }));
  });
}

function setSide(open) {
  document.body.classList.toggle("side-open", open);
  $("treebtn").setAttribute("aria-expanded", String(open));
}
function asideOpen() { return !document.body.classList.contains("aside-closed"); }
function setAside(open, persist) {
  document.body.classList.toggle("aside-closed", !open);
  // only the chip whose section the panel was opened for reads as "active"
  for (const [id, sec] of [["chip-range", "range"], ["chip-sports", "sports"], ["chip-acts", "acts"], ["chip-act", "acts"]])
    $(id).setAttribute("aria-expanded", String(open && S.lastSec === sec));
  if (persist && !narrowMq.matches) saveUi({ aside: open });
  // charts need to re-measure after the grid width changes
  setTimeout(() => charts.forEach((c) => c.resize()), 50);
}
function openAside(sec) {
  S.lastSec = sec;
  setAside(true, true);
  const d = document.querySelector(`aside details[data-k="${sec}"]`);
  if (!d) return;
  d.open = true;
  if (sec === "acts") { const on = d.querySelector(".act.on"); on ? on.scrollIntoView({ block: "center" }) : d.scrollIntoView({ block: "start" }); }
  else d.scrollIntoView({ block: "nearest" });
}
function toggleAside(sec) {
  const d = document.querySelector(`aside details[data-k="${sec}"]`);
  if (asideOpen() && d?.open && S.lastSec === sec) { S.lastSec = null; setAside(false, true); return; }
  openAside(sec);
}

function filterSummary() {
  const b = $("begin").value, e = $("end").value;
  const days = b && e ? Math.round((new Date(e) - new Date(b)) / 864e5) + 1 : null;
  const sel = selectedSports();
  const sp = sel.length === S.sports.length ? "全部運動" : sel.length === 1 ? sel[0] : `${sel.length}/${S.sports.length} 類運動`;
  $("sum-range").textContent = days ? `${days} 天` : "";
  $("sum-sports").textContent = sp;
  // the active filter lives in the toolbar chips, so it's visible when the panel is closed
  const endTxt = b.slice(0, 4) === e.slice(0, 4) ? e.slice(5).replace("-", "/") : e.replaceAll("-", "/");
  $("range-txt").textContent = b && e ? `${b.replaceAll("-", "/")} – ${endTxt}${days ? ` · ${days} 天` : ""}` : "選日期";
  $("sports-txt").textContent = sp;
  const isToday = e === iso(new Date());
  document.querySelectorAll(".presets button").forEach((x) => x.classList.toggle("on",
    isToday && ((+x.dataset.d && +x.dataset.d === days) || (x.dataset.d === "ytd" && b === `${e.slice(0, 4)}-01-01`))));
}

function renderActChip() {
  const a = (S.acts || []).find((x) => x.index === S.workout);
  // the picked activity may fall outside the current date filter; keep its last known label
  if (a) S.workoutLabel = `${a.start.slice(0, 16).replace("T", " ")} · ${a.sport_type || a.sport} · ${hms(a.duration)}`;
  $("act-txt").textContent = S.workout == null ? "還沒選" : S.workoutLabel || `#${S.workout}`;
}

async function loadActs() {
  const q = `begin=${$("begin").value}&end=${$("end").value}&sports=${encodeURIComponent(sportsParam())}&${tpParam()}`;
  const acts = S.acts = await j(`${API}/workouts?${q}`);

  $("acts-n").textContent = acts.length;

  $("acts").innerHTML = acts.map((a) => `<div class="act ${a.index === S.workout ? "on" : ""}" data-i="${a.index}">
    <div class="t"><b>${esc(a.start.slice(0, 16).replace("T", " "))}</b><span>${esc(a.sport_type || a.sport)}</span></div>
    <div class="s">${hms(a.duration)} · ${a.distance != null ? (+a.distance).toFixed(2) + " km" : "—"} · ↑${a.climbing != null ? Math.round(a.climbing) + " m" : "—"} · TSS ${a.tss != null ? (+a.tss).toFixed(0) : "—"}<span class="src" title="TSS 來源">${a.tss_source ? " " + ({power: "⚡", rtss: "🏃", hrtss: "❤", trainingpeaks: "TP"}[a.tss_source] || "") : ""}</span></div></div>`).join("");

}

async function load() {
  save();
  if (ZOOM.card) closeZoom(false);
  const token = ++loadToken;
  charts.splice(0).forEach((c) => c.dispose());
  $("grid").querySelectorAll(".lmap").forEach((el) => el._lmap?.remove());
  const grid = $("grid"), v = curView();
  grid.innerHTML = "";
  if (!v) { grid.innerHTML = `<div class="empty">沒有${MODE_LABEL[S.mode]}的 view</div>`; return; }
  if (S.mode === "workout" && S.workout == null) {
    grid.innerHTML = `<div class="empty">先選一筆活動<br><button class="iconbtn" id="pickact"><svg class="i"><use href="#i-list"/></svg>打開活動清單</button></div>`;
    $("pickact").onclick = () => openAside("acts");
    return;
  }
  const di = S.dash[S.mode], d = v.dashboards[di];
  const q = (S.mode === "workout" ? `workout=${S.workout}`
    : `begin=${$("begin").value}&end=${$("end").value}&sports=${encodeURIComponent(sportsParam())}`)
    + "&" + tpParam();
  if (d.description) {
    grid.insertAdjacentHTML("beforeend", `<p class="ddesc" title="點一下展開">${esc(d.description)}</p>`);
    grid.lastElementChild.onclick = (e) => e.currentTarget.classList.toggle("full");
  }
  // render sequentially-ish (4 at a time) so heavy charts don't block the rest
  const focus = S.focusChart; S.focusChart = null;
  const queue = d.charts.map((c) => {
    const card = document.createElement("section");
    card.className = "card";
    card.dataset.ci = c.index;
    card.innerHTML = `<h2>${esc(c.title || (c.kind === "map" ? "地圖" : c.kind))}</h2><div class="loading">計算中…</div>`;
    grid.appendChild(card);
    return { c, card };
  });
  const focusCard = focus == null ? null : queue.find((x) => x.c.index === focus)?.card;
  if (focusCard) {
    // search hit: load that chart first, scroll to it, flash it
    queue.unshift(...queue.splice(queue.findIndex((x) => x.card === focusCard), 1));
    focusCard.classList.add("flash");
    focusCard.scrollIntoView({ block: "start" });
    setTimeout(() => focusCard.classList.remove("flash"), 2500);
  }
  const worker = async () => {
    while (queue.length) {
      const { c, card } = queue.shift();
      if (token !== loadToken) return;
      if (!["athlete", "workout", "zones", "targets", "map"].includes(c.kind)) { card.querySelector(".loading").textContent = "這種 WKO5 面板尚未支援"; continue; }
      if (c.kind === "map" && S.mode !== "workout") { card.querySelector(".loading").textContent = "地圖要選一筆活動才看得到"; continue; }
      await renderCard(card, v, di, c, q, token);
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);
  // cards above the search hit grew while loading; put it back in view
  if (focusCard && token === loadToken) focusCard.scrollIntoView({ block: "start" });
}

// ---- one chart card: fetch (with the remembered period) and draw; re-run by the period toggle
// chart-description ? icons: hover shows the text; tap/click pins it (touch has no hover).
// The popup is a fixed element on <body> so a card's overflow never clips it.
const QTIP = { el: null, pinned: null };
function qtipShow(btn) {
  qtipHide();
  const d = document.createElement("div");
  d.className = "qtip-pop";
  d.textContent = btn.dataset.tip;
  document.body.appendChild(d);
  const r = btn.getBoundingClientRect(), w = d.offsetWidth, h = d.offsetHeight;
  const left = Math.max(12, Math.min(r.left - 8, innerWidth - w - 12));
  const top = r.bottom + 6 + h > innerHeight - 8 ? Math.max(8, r.top - h - 6) : r.bottom + 6;
  d.style.left = `${left}px`; d.style.top = `${top}px`;
  QTIP.el = d;
}
function qtipHide() { QTIP.el?.remove(); QTIP.el = null; }
document.addEventListener("mouseover", (e) => { const t = e.target.closest?.(".qtip"); if (t && !QTIP.pinned) qtipShow(t); });
document.addEventListener("mouseout", (e) => { if (e.target.closest?.(".qtip") && !QTIP.pinned) qtipHide(); });
document.addEventListener("click", (e) => {
  const t = e.target.closest(".qtip");
  if (t && QTIP.pinned !== t) { QTIP.pinned = t; qtipShow(t); e.stopPropagation(); return; }
  QTIP.pinned = null; qtipHide();
});
addEventListener("scroll", () => { if (!QTIP.pinned) qtipHide(); else qtipShow(QTIP.pinned); }, { passive: true, capture: true });
const PERIOD_KEY = "wko5viewer.period";
const PERIOD_LABELS = [["day", "日"], ["week", "週"], ["month", "月"], ["quarter", "季"], ["year", "年"]];
function periodPrefs() { try { return JSON.parse(localStorage.getItem(PERIOD_KEY) || "{}"); } catch { return {}; } }
function savePeriod(k, p) { try { localStorage.setItem(PERIOD_KEY, JSON.stringify({ ...periodPrefs(), [k]: p })); } catch {} }
// 近 7／14／28 天新高 charts (views "window"): the window, remembered per chart like the period
const WINDOW_KEY = "wko5viewer.window";
function windowPrefs() { try { return JSON.parse(localStorage.getItem(WINDOW_KEY) || "{}"); } catch { return {}; } }
function saveWindow(k, w) { try { localStorage.setItem(WINDOW_KEY, JSON.stringify({ ...windowPrefs(), [k]: w })); } catch {} }
function disposeCardCharts(card) {
  for (const el of card.querySelectorAll(".plot")) {
    if (el._lmap) { el._lmap.remove(); el._lmap = null; continue; }
    const inst = echarts.getInstanceByDom(el);
    if (!inst) continue;
    const i = charts.indexOf(inst);
    if (i >= 0) charts.splice(i, 1);
    inst.dispose();
  }
}
async function renderCard(card, v, di, c, q, token) {
  const pkey = `${v.name}|${di}|${c.index}`;
  const period = periodPrefs()[pkey];
  const win = windowPrefs()[pkey];
  try {
    const res = await j(`${API}/views/${encodeURIComponent(v.name)}/dashboards/${di}/charts/${c.index}?${q}`
      + (period && c.kind === "athlete" ? `&period=${period}` : "")
      + (win && c.kind === "athlete" ? `&window=${win}` : ""));
    if (token !== loadToken) return;
    card._res = res;
    card._ctx = { v, di, c, q };
    disposeCardCharts(card);
    card.innerHTML = `<h2>${esc(res.title || c.title || (c.kind === "map" ? "地圖" : c.kind))}</h2>`;
    const zb = document.createElement("button");
    zb.className = "zbtn";
    zb.title = zb.ariaLabel = "放大這張圖";
    zb.textContent = "⤢ 放大";
    zb.onclick = () => openZoom(card, zb);
    card.querySelector("h2").appendChild(zb);
    // a day calendar is always per day: no re-bucketing toggle
    if (res.period_toggle && !(res.series || []).some((s) => s.type === "calendar")) {
      // 日／週／月／季／年: re-bucket this chart (remembered per chart)
      const seg = document.createElement("div");
      seg.className = "seg period";
      seg.dataset.kind = "period";
      seg.setAttribute("role", "group");
      seg.setAttribute("aria-label", "統計週期");
      seg.innerHTML = PERIOD_LABELS.map(([p, t]) => `<button data-p="${p}" class="${p === res.x_period ? "on" : ""}"
        aria-pressed="${p === res.x_period}">${t}</button>`).join("");
      seg.onclick = async (e) => {
        const b = e.target.closest("button[data-p]");
        if (!b || b.dataset.p === card._res?.x_period) return;
        savePeriod(pkey, b.dataset.p);
        card.insertAdjacentHTML("beforeend", `<div class="loading">計算中…</div>`);
        await renderCard(card, v, di, c, q, loadToken);
        if (ZOOM.card === card) fillZoom();
      };
      card.querySelector("h2").appendChild(seg);
    }
    if (res.window_toggle && res.window_choices?.length) {
      // 近 N 天新高: 7／14／28 天 window (remembered per chart)
      const seg = document.createElement("div");
      seg.className = "seg period";
      seg.dataset.kind = "window";
      seg.setAttribute("role", "group");
      seg.setAttribute("aria-label", "近幾天");
      seg.innerHTML = res.window_choices.map((w) => `<button data-p="${w}" class="${w === res.window ? "on" : ""}"
        aria-pressed="${w === res.window}">${w} 天</button>`).join("");
      seg.onclick = async (e) => {
        const b = e.target.closest("button[data-p]");
        if (!b || +b.dataset.p === card._res?.window) return;
        saveWindow(pkey, b.dataset.p);
        card.insertAdjacentHTML("beforeend", `<div class="loading">計算中…</div>`);
        await renderCard(card, v, di, c, q, loadToken);
        if (ZOOM.card === card) fillZoom();
      };
      card.querySelector("h2").appendChild(seg);
    }
    drawInto(card, res);
    if (S.zoomAfter === c.index && token === loadToken) { S.zoomAfter = null; openZoom(card, zb); }
  } catch (e) {
    console.error(c.title, e);
    card.querySelector(".loading")?.remove();
    card.insertAdjacentHTML("beforeend", `<div class="loading st-err">錯誤: ${esc(e.message)}</div>`);
  }
}

function drawInto(box, res) {
  if (res.range_note) box.insertAdjacentHTML("beforeend", `<p class="meta range-note">${esc(res.range_note)}</p>`);
  const rb = res.recent_bests;
  if (rb?.note) {
    // 「近 7 天新高：12 分鐘 +18 W、…」 or why there is none
    const body = rb.items?.length
      ? `近 ${rb.window} 天新高：` + rb.items.map((i) => `<b>${esc(i.label)} +${esc(String(i.gain))} W</b>`).join("、")
      : esc(rb.note);
    box.insertAdjacentHTML("beforeend", `<p class="meta recent-note">${body}</p>`);
  }
  if (res.kind === "zones") drawZones(box, res);
  else if (res.kind === "targets") drawTargets(box, res);
  else if (res.kind === "map") drawMap(box, res);
  else draw(box, res);
}

// ---- enlarge one chart: <dialog>, drawn again from the card's JSON (no refetch).
// Deep link: &chart=<index>; the back button closes it.
const ZOOM = { card: null, btn: null, pushed: false };
function openZoom(card, btn) {
  if (!card._res) return;
  ZOOM.card = card; ZOOM.btn = btn;
  const dlg = $("zoom");
  if (!dlg.open) dlg.showModal();
  fillZoom();
  const { v, di, c } = card._ctx;
  const url = `${location.pathname}?${new URLSearchParams({ view: v.name, dash: di, chart: c.index })}`;
  if (!ZOOM.pushed) { history.pushState({ zoom: true }, "", url); ZOOM.pushed = true; }
}
function fillZoom() {
  const card = ZOOM.card, res = card?._res;
  if (!res) return;
  const body = $("zoombody");
  disposeCardCharts(body);
  body.innerHTML = `<h2></h2>`;
  // title row: the card's title, fix badge and period toggle (the toggle re-renders card + overlay)
  const h = card.querySelector("h2").cloneNode(true);
  h.querySelector(".zbtn")?.remove();
  h.querySelector(".badge.fix")?.remove();
  $("zoom-title").replaceChildren(...h.childNodes);
  for (const seg of $("zoom-title").querySelectorAll(".seg.period")) {
    const kind = seg.dataset.kind || "period";
    seg.onclick = (e) => card.querySelector(`h2 .seg.period[data-kind="${kind}"] button[data-p="${e.target.closest("button")?.dataset.p}"]`)?.click();
  }
  if (res.fixes?.length) body.insertAdjacentHTML("beforeend", `<p class="desc">已修正單位：${res.fixes.map(esc).join("；")}</p>`);
  drawInto(body, { ...res, _zoom: true });
  body.querySelectorAll(".plot").forEach((el) => echarts.getInstanceByDom(el)?.resize());
}
function closeZoom(fromHistory) {
  const dlg = $("zoom");
  if (!ZOOM.card) return;
  disposeCardCharts($("zoombody"));
  $("zoombody").innerHTML = "";
  if (dlg.open) dlg.close();
  // the card may have been re-rendered (period toggle) since: focus its current button
  const btn = ZOOM.card.querySelector(".zbtn") || ZOOM.btn;
  ZOOM.card = null; ZOOM.btn = null;
  if (ZOOM.pushed) { ZOOM.pushed = false; if (!fromHistory) history.back(); }
  btn?.focus();
  charts.forEach((c) => c.resize());
}
$("zoomclose").onclick = () => closeZoom(false);
$("zoom").addEventListener("cancel", (e) => { e.preventDefault(); closeZoom(false); });   // Esc
$("zoom").addEventListener("click", (e) => { if (e.target === $("zoom")) closeZoom(false); });   // backdrop
window.addEventListener("popstate", () => { if (ZOOM.card) { ZOOM.pushed = false; closeZoom(true); } });
window.addEventListener("resize", () => $("zoombody").querySelectorAll(".plot").forEach((el) => echarts.getInstanceByDom(el)?.resize()));

// ---- period-total charts: one category per bucket (day / week / month / quarter / year)
function bucketOf(isoDate, period) {
  const d = new Date(String(isoDate).slice(0, 10) + "T00:00:00Z");
  if (period === "week") d.setUTCDate(d.getUTCDate() - (d.getUTCDay() + 6) % 7);
  else if (period === "month") d.setUTCDate(1);
  else if (period === "quarter") { d.setUTCMonth(Math.floor(d.getUTCMonth() / 3) * 3); d.setUTCDate(1); }
  else if (period === "year") { d.setUTCMonth(0); d.setUTCDate(1); }
  return d.toISOString().slice(0, 10);
}
function bucketLabel(isoDate, period, long) {
  const [y, m, d] = isoDate.split("-").map(Number);
  if (period === "year") return `${y}`;
  if (period === "quarter") return `${y} Q${Math.floor((m - 1) / 3) + 1}`;
  if (period === "month") return `${y}/${m}`;
  if (long) return `${y}/${m}/${d}${period === "week" ? " 起的一週" : ""}`;
  return `${m}/${d}`;
}

// x of a points series as text: date / datetime / elapsed seconds / duration / value
function fmtX(x, kind, xu) {
  if (x == null) return "";
  if (kind === "date") return String(x).slice(0, 10);
  if (kind === "datetime") return String(x).slice(0, 16).replace("T", " ");
  if (kind === "seconds") return fmtDur(x);
  if (kind === "duration") return fmtDur(x);
  return typeof x === "number" ? fmtU(x, xu) : String(x);
}
function lastVal(s) {
  const data = s.data, u = s.unit;
  if (data.kind === "points") {
    for (let i = data.points.length - 1; i >= 0; i--) if (data.points[i][1] != null)
      return [fmtX(data.points[i][0], data.x, s.x_unit), fmtU(data.points[i][1], u)];
    return null;
  }
  if (data.kind === "hline") return ["", fmtU(data.y, u)];
  if (data.kind === "vline") return ["x", fmtU(data.x, s.x_unit)];
  if (data.kind === "value") return ["", fmtU(data.value, u)];
  if (data.kind === "values") return ["", data.values.map((x) => fmtU(x, u, { label: false })).join(" / ") + (u?.label && !["duration", "pace", "percent"].includes(u.kind) ? " " + u.label : "")];
  if (data.kind === "band") return ["", data.range.map((x) => fmtU(x, u, { label: false })).join(" ~ ")];
  return null;
}

function draw(card, res) {
  card.querySelector(".loading")?.remove();
  if (res.fixes && res.fixes.length) {
    const badge = ` <span class="badge fix" title="${esc(res.fixes.join("\n"))}">已修正單位</span>`;
    const seg = card.querySelector("h2 > .seg");
    if (seg) seg.insertAdjacentHTML("beforebegin", badge);
    else card.querySelector("h2")?.insertAdjacentHTML("beforeend", badge);
  }
  // the description sits behind a ? icon (hover / tap) to keep cards clean; the enlarge
  // overlay has room, so it shows the text in full
  if (res.description) {
    if (res._zoom) card.insertAdjacentHTML("beforeend", `<p class="desc">${esc(res.description)}</p>`);
    else {
      const h2 = card.querySelector("h2");
      const q = `<button type="button" class="qtip" aria-label="說明" data-tip="${esc(res.description)}">?</button>`;
      const zb = h2?.querySelector(".zbtn");
      if (zb) zb.insertAdjacentHTML("beforebegin", q); else h2?.insertAdjacentHTML("beforeend", q);
    }
  }
  // nothing to draw: say why (no power in this workout, no activity this week, PD fit failed…)
  if (res.empty) card.insertAdjacentHTML("beforeend", `<p class="nodata">${esc(res.empty)}</p>`);
  // drew something, but some series are blank for a known reason (PD model not fitted)
  else if (res.notice) card.insertAdjacentHTML("beforeend", `<p class="nodata small">${esc(res.notice)}</p>`);
  const S_ = res.series;
  // a gauge of one number comes back as an hline (athlete charts) or a value (workout charts)
  const gauges = S_.filter((s) => s.type === "gauge" && ["values", "value", "hline", "none"].includes(s.data.kind)
    && (s.expression || "").trim());
  if (gauges.length && !res.empty) drawGauges(card, gauges);
  // "calendar" series: one cell per day (e.g. strength sessions: done / not done)
  const cal = S_.filter((s) => s.type === "calendar" && s.data.kind === "points");
  if (cal.length && !res.empty) drawCalendar(card, cal[0]);
  const plotted = S_.filter((s) => ["points", "hline", "vline", "band"].includes(s.data.kind) && s.type !== "gauge"
    && s.type !== "calendar");
  const hasPoints = plotted.some((s) => s.data.kind === "points");
  if (hasPoints && !res.empty) drawPlot(card, res, plotted);
  // WKO5 table charts: every series evaluates to a list -> one column per series, one row per index
  const cols = S_.filter((s) => s.data.kind === "values" && s.type !== "gauge");
  if (cols.length && !res.empty) drawValuesTable(card, cols);
  // single numbers; a chart of only constant-per-range lines (MMP Peaks and Clusters Report)
  // has nothing to plot them against, so they are listed here too
  const values = res.empty ? [] : S_.filter((s) => s.type !== "gauge" && (s.data.kind === "value"
    || (!hasPoints && s.data.kind === "hline" && s.data.y != null)));
  if (values.length) {
    if (values.length > 8) card.classList.add("wide");
    const v1 = (s) => s.data.kind === "hline" ? s.data.y : s.data.value;
    card.insertAdjacentHTML("beforeend", `<table>${values.map((s) =>
      `<tr><td>${esc(s.name)}</td><td class="num">${esc(fmtU(v1(s), s.unit, { label: false }))}</td><td class="meta">${esc(unitText(s.unit))}</td></tr>`).join("")}</table>`);
  }
  // The per-series table (status, point count, last value, unit, expression) is not shown:
  // it is for debugging and AI use. The same data is in the chart JSON from
  // GET /api/v1/wko5/views/{view}/dashboards/{d}/charts/{c} (series[].expression / data / unit,
  // unsupported, fixes).
}

// WKO5-style zone table: boundaries + time in zone over the last N days
function drawZones(card, res) {
  card.querySelector(".loading")?.remove();
  const Z = res.zones, pace = Z.unit === "min/km";
  const f = (v) => v == null ? "" : pace ? `${Math.floor(v)}:${String(Math.round(v % 1 * 60)).padStart(2, "0")}` : Math.round(v);
  const range = (r) => pace
    ? (r.from == null ? `快於 ${f(r.to)}` : r.to == null ? `慢於 ${f(r.from)}` : `${f(r.to)}–${f(r.from)}`)
    : (r.to == null ? `${f(r.from)}+` : `${f(r.from) || 0}–${f(r.to)}`);
  const pct = (r) => `${r.lo == null ? "" : Math.round(r.lo * 100)}${r.hi == null ? "+" : (r.lo == null ? "<" : "–") + Math.round(r.hi * 100)}%`;
  const maxShare = Math.max(0.0001, ...Z.rows.map((r) => r.share || 0));
  const basis = { lthr: "LTHR", cp: "CP", tpace: "閾值配速" }[Z.basis];
  card.insertAdjacentHTML("beforeend", `<p class="desc">${esc(res.description || "")}
    ${basis} ${pace ? f(Z.threshold) + " /km" : f(Z.threshold) + " " + Z.unit} · 最近 ${Z.days} 天 ${Z.runs} 次跑步</p>
    ${Z.threshold_is_default ? `<p class="badge" style="margin:0 0 6px">⚠ ${basis} 是 WKO5 出廠預設值，這張表的區間不準${Z.basis === "lthr" ? "——到「賽事周期」頁套用自動估算的 LTHR" : "——山路配速本來就不準，建議看功率區間"}</p>` : ""}
    <table class="zt"><thead><tr><th>區間</th><th>名稱</th><th class="num">${esc(Z.unit)}</th><th class="num">% ${basis}</th>
      <th style="width:34%">時間</th></tr></thead><tbody>${Z.rows.map((r, i) => `<tr>
      <td>${esc(r.id)}</td><td>${esc(r.name)}</td><td class="num">${range(r)}</td><td class="num meta">${pct(r)}</td>
      <td><div class="zbar"><i style="width:${((r.share || 0) / maxShare * 100).toFixed(1)}%;background:${ZCOL(i, Z.rows.length)}"></i>
        <span>${r.share == null ? "" : Math.round(r.share * 100) + "% · " + hms(r.seconds)}</span></div></td></tr>`).join("")}</tbody></table>
    <p class="desc" style="margin-top:6px">${esc(Z.source)}</p>`);
}
const ZCOL = (i, n) => `hsl(${140 - 140 * i / Math.max(1, n - 1)} 65% 45%)`;   // green → red

function drawTargets(card, res) {
  card.querySelector(".loading")?.remove();
  const T = res.targets;
  const w = (a) => a[0] == null && a[1] == null ? "–" : a[0] == null ? `< ${Math.round(a[1])}` : a[1] == null ? `${Math.round(a[0])}+` : `${Math.round(a[0])}–${Math.round(a[1])}`;
  card.insertAdjacentHTML("beforeend", `<p class="desc">${esc(res.description || "")}</p>

async function drawMap(card, res) {
  card.querySelector(".loading")?.remove();
  const nodata = (t) => card.insertAdjacentHTML("beforeend", `<p class="nodata">${esc(t)}</p>`);
  if (res.empty) return nodata(res.empty);
  if (typeof L === "undefined") return nodata("地圖元件（Leaflet）載入失敗，無法顯示路線。");
  const tb = document.createElement("div");
  tb.className = "maptb";
  const el = document.createElement("div");
  el.className = "plot lmap";
  card.append(tb, el);
  let s;
  try { s = await samplesFor(res.workout); }
  catch (e) { el.remove(); tb.remove(); return nodata(`讀不到這筆活動的 GPS 樣本：${e.message}`); }
  if (!el.isConnected) return;            // the card was redrawn meanwhile
  if (!s.gps.length) { el.remove(); tb.remove(); return nodata("這筆活動沒有 GPS 資料（室內或裝置沒有記錄位置）。"); }

  const pref = mapPrefs();

  hint.className = "maphint"; hint.hidden = true;

    const layer = L.tileLayer(b.url, { maxZoom: b.maxZoom, attribution: b.attr });
    layer._def = b; layer._err = 0; layer._ok = 0;
    layer.on("tileload", () => { layer._ok++; if (layer === active) hint.hidden = true; });
    layer.on("tileerror", () => {
      layer._err++;
      if (layer !== active || layer._ok > 0 || layer._err < 3 || !hint.hidden) return;
      // the host isn't answering (魯地圖's own host often doesn't): offer another basemap
      const alt = BASEMAPS.filter((x) => x.id !== b.id && x.id !== "google-terrain").slice(0, 3);
      hint.innerHTML = `「${esc(b.name)}」的圖磚載入失敗（主機可能沒有回應），換個底圖：`
        + alt.map((x) => `<button data-b="${x.id}">${esc(x.name)}</button>`).join("");
      hint.hidden = false;
    });
    bases[b.name] = layer;
  }

    next.addTo(map);          // fires baselayerchange through the layer control
  };
  for (const o of OVERLAYS) ovls[o.name] = L.tileLayer(o.url, { maxZoom: o.maxZoom, opacity: o.opacity, attribution: o.attr, zIndex: 5 });
  const setBase = (layer) => { active = layer; map.setMaxZoom(layer._def.maxZoom); hint.hidden = true; layer._err = layer._ok = 0; };
  const first = bases[BASE_BY_ID[pref.base].name];
  first.addTo(map); setBase(first);

  const saveOvl = () => saveMapPrefs({ overlays: OVERLAYS.filter((o) => map.hasLayer(ovls[o.name])).map((o) => o.id) });
  map.on("overlayadd overlayremove", saveOvl);

  const legend = document.createElement("span");
  legend.className = "maplegend";

    const vals = color === "none" ? null : s[color];
    const good = vals ? s.gps.map((i) => vals[i]).filter((v) => v != null) : [];
    if (good.length < 2) {
      L.polyline(latlngs, { color: css("--accent") || "#2563eb", weight: 4, interactive: false }).addTo(route);
      legend.innerHTML = "";

  tb.innerHTML = `<span class="meta">路線顏色</span><div class="seg" role="group" aria-label="路線顏色">${ROUTE_COLOR.map(([k, t]) =>
    `<button data-c="${k}" class="${k === color ? "on" : ""}" aria-pressed="${k === color}" ${has(k) ? "" : "disabled"}>${t}</button>`).join("")}</div>`;
  tb.appendChild(legend);
  tb.onclick = (e) => {
    const b = e.target.closest("button[data-c]"); if (!b || b.disabled || b.dataset.c === color) return;
    color = b.dataset.c; saveMapPrefs({ color });
    tb.querySelectorAll("button[data-c]").forEach((x) => { x.classList.toggle("on", x === b); x.setAttribute("aria-pressed", String(x === b)); });

  // hover: a marker at the shared sample; hovering the route drives the charts

  marker.bindTooltip("", { permanent: true, direction: "top", offset: [0, -8], className: "hovtip" });
  const readout = (i) => [s.t[i] != null ? fmtDur(s.t[i]) : null, s.d?.[i] != null ? s.d[i].toFixed(2) + " km" : null,
    s.hr?.[i] != null ? s.hr[i] + " bpm" : null, s.power?.[i] != null ? s.power[i] + " W" : null,
    s.elev?.[i] != null ? Math.round(s.elev[i]) + " m" : null, s.grade?.[i] != null ? s.grade[i].toFixed(1) + "%" : null]

// Day calendar for a daily count series ([iso date, n] points): a filled cell = done that day,
// plus the counts that matter (this week, the last 4 weeks, the whole range).
function drawCalendar(card, s) {
  const pts = s.data.points.filter((p) => p[1] != null && p[1] > 0);
  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const end = new Date(($("end").value || iso(new Date())) + "T00:00:00");
  const begin = new Date(($("begin").value || iso(new Date(end.getTime() - 364 * 864e5))) + "T00:00:00");
  const mon = new Date(end); mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7));
  const d28 = new Date(end); d28.setDate(d28.getDate() - 27);
  const n = (from) => pts.filter((p) => p[0] >= iso(from) && p[0] <= iso(end)).length;
  const weeks = Math.max(1, (end - begin) / (7 * 864e5));
  card.insertAdjacentHTML("beforeend", `<p class="meta cal-sum">本週 <b>${n(mon)}</b> 次 · 近 4 週 <b>${n(d28)}</b> 次
    · 這段期間 <b>${pts.length}</b> 次（平均每週 ${(pts.length / weeks).toFixed(1)} 次）</p>`);
  const months = (end.getFullYear() - begin.getFullYear()) * 12 + end.getMonth() - begin.getMonth() + 1;
  const box = document.createElement("div");
  box.className = "plot";
  box.style.height = `${months > 7 ? 190 : 170}px`;
  card.appendChild(box);
  const css = (v) => getComputedStyle(document.body).getPropertyValue(v).trim();
  const ch = echarts.init(box);
  ch.setOption({
    tooltip: { formatter: (p) => `${p.value[0]}：${p.value[1] > 0 ? "有練" : "沒練"}` },
    visualMap: { show: false, min: 0, max: 1, inRange: { color: [css("--line") || "#e5e5e5", s.color || "#e87ba4"] } },
    calendar: { range: [iso(begin), iso(end)], top: 24, left: 34, right: 12, cellSize: ["auto", 14],
      splitLine: { show: false },
      itemStyle: { color: css("--line") || "#e5e5e5", borderColor: css("--panel") || "#fff", borderWidth: 2 },
      dayLabel: { firstDay: 1, nameMap: ["日", "一", "二", "三", "四", "五", "六"], color: css("--muted"), fontSize: 10 },
      monthLabel: { nameMap: "cn", color: css("--muted"), fontSize: 10 }, yearLabel: { show: false } },

  });
  new ResizeObserver(() => ch.resize()).observe(box);
}
