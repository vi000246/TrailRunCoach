<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title data-i18n="share.page_title">賽事計畫（分享）</title>
<!--fill:og-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: #f4f5f7; --panel: #fcfcfb; --text: #0b0b0b; --muted: #52514e; --faint: #8a8984; --line: #e3e3df;
  --accent: #2a78d6; --soft: #e8efff; --watch: #b45309; --bad: #c62828; --bar: #b9b8b1; --s3: #1baf7a;
  --c-sd: #3f6fb5; --c-d: #86a9dc; --c-f: #b9b8b1; --c-u: #e8a15a; --c-su: #c9542c;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111110; --panel: #1a1a19; --text: #ffffff; --muted: #c3c2b7; --faint: #8f8e86; --line: #2e2e2b;
    --accent: #3987e5; --soft: #1c2a40; --watch: #fbbf24; --bad: #f87171; --bar: #5a5954; --s3: #199e70;
    --c-sd: #5b8ad0; --c-d: #37557f; --c-f: #5a5954; --c-u: #a8692c; --c-su: #d06a3f;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111110; --panel: #1a1a19; --text: #ffffff; --muted: #c3c2b7; --faint: #8f8e86; --line: #2e2e2b;
  --accent: #3987e5; --soft: #1c2a40; --watch: #fbbf24; --bad: #f87171; --bar: #5a5954; --s3: #199e70;
  --c-sd: #5b8ad0; --c-d: #37557f; --c-f: #5a5954; --c-u: #a8692c; --c-su: #d06a3f;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif; }
header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 16px; }
header h1 { font-size: 18px; margin: 0; }
.meta { color: var(--muted); font-size: 12.5px; }
main { max-width: 1100px; margin: 0 auto; padding: 14px 16px 40px; display: grid; gap: 14px; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
h2 { font-size: 15px; margin: 0 0 10px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
h2 .meta { font-weight: 400; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
.tile .k { font-size: 12px; color: var(--muted); }
.tile .v { font-size: 21px; font-weight: 650; font-variant-numeric: tabular-nums; }
.tile .v .u { font-size: 13px; font-weight: 500; color: var(--muted); }
.tile .s { font-size: 11.5px; color: var(--muted); }
.tile.main { border-color: var(--accent); }
.profile { width: 100%; height: 300px; }
/* 分段目標 (the chart head, the legend, the segment table): static/seg_profile.js, the calculator's (SP-784) */
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
td.act { white-space: normal; min-width: 220px; }
tr.k-aid td { background: var(--soft); }
.warn { margin: 8px 0 0; padding-left: 18px; font-size: 12.5px; color: var(--watch); }
.badge { display: inline-block; font-size: 11.5px; border: 1px solid var(--watch); color: var(--watch); border-radius: 10px; padding: 0 8px; }
.err { color: var(--bad); padding: 30px 0; text-align: center; }
footer { text-align: center; }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.join-btn { display: inline-block; padding: 7px 14px; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600;
  text-decoration: none; white-space: nowrap; }
.join-btn:hover { filter: brightness(1.08); }
.join-btn[hidden] { display: none; }
.join { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; border-color: var(--accent); background: var(--soft); }
.join h2 { margin: 0 0 2px; }
.join p { margin: 0; color: var(--muted); font-size: 13px; }
@media (max-width: 700px) { .tiles { grid-template-columns: 1fr 1fr; } .tile .v { font-size: 18px; } main { padding: 10px 10px 30px; } }
</style>
</head>
<body>
<header><div><h1 id="title" data-i18n="share.heading">賽事計畫</h1><div class="meta" id="sub" data-i18n="share.readonly_share">唯讀分享</div></div><a class="join-btn" id="join-top" hidden></a></header>
<main id="main"><section><div class="meta" data-i18n="share.loading">讀取中…</div></section></main>
<!--fill:join-->
<!--inline:seg_profile.js-->
<script>
const $ = (id) => document.getElementById(id);
// 「用自己的資料算」 (SP-124): {kind: signup | waitlist | demo | about, url} from the server, the same for every visitor
const JT = (k, p) => (window.I18N ? window.I18N.t("share." + k, p) : k);
const JOIN = (() => {
  const j = window.TRC_JOIN;
  if (!j || !["signup", "waitlist", "demo", "about"].includes(j.kind) || typeof j.url !== "string") return null;
  return /^\/(?!\/)/.test(j.url) || /^https:\/\//.test(j.url) ? j : null;
})();
function joinLink(el) {
  el.href = JOIN.url;
  el.textContent = JT("join.button");
  el.dataset.kind = JOIN.kind;
  if (/^https:/.test(JOIN.url)) el.rel = "noopener";
  el.hidden = false;
  return el;
}
function joinCard() {
  if (!JOIN) return "";
  return `<section class="join" id="join"><div><h2>${esc(JT("join.title"))}</h2><p>${esc(JT("join." + JOIN.kind))}</p></div><a class="join-btn" id="join-bottom"></a></section>`;
}
function showJoin() {
  if (!JOIN) return;
  joinLink($("join-top"));
  if ($("join-bottom")) joinLink($("join-bottom"));
}
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const ok = (v) => v != null && isFinite(v);
const n0 = (v) => ok(v) ? Math.round(v).toLocaleString() : "–";
const f1 = (v) => ok(v) ? Number(v).toFixed(1) : "–";
const pct = (v) => ok(v) ? Math.round(v * 100) + "%" : "–";
function hms(s) { if (!ok(s)) return "–"; s = Math.round(s); return `${Math.floor(s / 3600)}:${String(Math.floor(s % 3600 / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; }
function dur(s) { if (!ok(s)) return "–"; s = Math.round(s); return s < 3600 ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}` : hms(s); }
function pace(s) { if (!ok(s)) return "–"; s = Math.round(s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")} /km`; }
const rng = (v, fmt = n0, unit = "") => !v ? "–" : (fmt(v[0]) === fmt(v[1]) ? fmt(v[0]) : `${fmt(v[0])}–${fmt(v[1])}`) + (unit ? ` <span class="u">${unit}</span>` : "");
const tile = (k, v, s, main) => `<div class="tile ${main ? "main" : ""}"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s || ""}</div></div>`;
const CLS = { steep_down: "--c-sd", down: "--c-d", flat: "--c-f", up: "--c-u", steep_up: "--c-su" };
// [name, icon]; the page's text (SP-460: share.stop.* / share.type.*)
const STOP = Object.fromEntries([["water", "💧"], ["aid", "🍌"], ["big", "🍲"], ["medical", "⛑️"], ["self", "🎒"]].map(([k, i]) => [k, [JT("stop." + k), i]]));
const TYPE = { road: JT("type.road"), trail: JT("type.trail"), baiyue: JT("type.baiyue") };   // SP-738: 百岳 → 登山

async function init() {
  let S;
  try {
    const r = await fetch(location.pathname.replace(/\/+$/, "") + "/data", { cache: "no-store" });
    if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(d.detail || `${r.status}`); }
    S = await r.json();
  } catch (e) { $("main").innerHTML = `<section><div class="err">${esc(e.message)}</div></section>` + joinCard(); showJoin(); return; }
  document.title = JT("doc_title", { title: S.title });
  $("title").textContent = S.title;
  const I = S.inputs || {}, s = S.summary || {}, hike = S.type === "baiyue";
  // the built-in examples (SP-637): no calendar date (it would read as a race already run once it passed) —
  // how long before the race it was computed, if anything
  const when = S.example ? (ok(I.weeks_before) && I.weeks_before > 0 ? JT("weeks_before", { n: I.weeks_before }) : null) : I.date;
  $("sub").textContent = [TYPE[S.type], when, I.start_time && JT("start_at", { t: I.start_time }), `${f1(s.km)} km ↑${n0(s.gain_m)} m`,
    S.created && JT("created", { d: S.created.slice(0, 10) }), S.expires && JT("expires", { d: S.expires.slice(0, 10) }), JT("readonly")].filter(Boolean).join(" · ");
  let h = `<section><h2>${esc(JT("result"))}${s.badge ? ` <span class="badge">${esc(s.badge)}</span>` : ""}</h2><div class="tiles">`;
  if (hike) {
    h += tile(esc(JT("moving")), dur(s.capacity_time_s ?? s.time_s), esc(JT("days", { n: (S.days || []).length || s.days || 1 })), true);
    if (ok(s.clock_s)) h += tile(esc(JT("clock")), dur(s.clock_s), esc(JT("with_rests")));
    if (ok(s.hr_cap)) h += tile(esc(JT("hr_cap")), n0(s.hr_cap) + " bpm", "AeT");
  } else {
    h += tile(esc(JT("finish")), hms(s.time_s), s.finish_eta ? esc(JT("arrive", { t: s.finish_eta })) : "", true);
    h += tile(esc(JT("avg_power")), ok(s.power) ? n0(s.power) + " W" : "–", `${pct(s.pct_cp)} CP${ok(s.w_per_kg) ? ` · ${s.w_per_kg.toFixed(2)} W/kg` : ""}`);
    h += tile(esc(JT("avg_pace")), pace(s.pace_s_per_km), "");
  }
  if (S.effort?.label) h += tile(esc(JT("effort")), esc(S.effort.label), ok(S.effort.f) ? pct(S.effort.f) : ok(S.effort.r) ? pct(S.effort.r) : "");
  if (ok(I.temp_c)) h += tile(esc(JT("race_day")), `${f1(I.temp_c)} °C`, ok(I.rh_pct) ? esc(JT("humidity", { rh: n0(I.rh_pct) })) : "");
  if (ok(S.weight)) h += tile(esc(JT("weight")), `${f1(S.weight)} kg`, esc(JT("weight_shared")));
  h += `</div></section>`;
  const rows = (S.chart_rows || []).length > 0;
  // SP-784: the calculator's 分段目標 (static/seg_profile.js, written into this page by the server): the target
  // line over the elevation profile and the segment table; a share with no segments: the elevation only
  if (rows) h += targetsSection(S);
  else if (S.profile) h += `<section><h2>${esc(JT("profile"))}</h2><div class="profile" id="profile"></div></section>`;
  h += fuelHtml(S);
  if (!rows) h += splitsHtml(S);
  $("main").innerHTML = h + joinCard() + `<footer class="meta">${esc(JT("footer"))}</footer>`;
  showJoin();
  if (rows) drawTargets(S);
  else if ($("profile")) drawProfile(S);
}

// ---- 分段目標: the calculator's component (SegProfile), its state kept here ----
const TOUCH = matchMedia("(pointer: coarse)").matches;
const RT = (k, p) => (window.I18N ? window.I18N.t("racepower." + k, p) : k);
const TG = { P: null, m: "pace", sel: new Set(), hover: null, chart: null, stops: [] };
function targetsSection(S) {
  const help = ` <span class="help" tabindex="0">?<span class="tip">${esc(RT("chart.tip"))}</span></span>`;
  return `<section class="segp" id="profile-sec"><h2>${esc(JT("targets"))} <span class="meta">${(S.chart_rows || []).length} ${esc(RT("segs"))}</span>${help}</h2>` +
    `<div class="chead"><div class="seg" id="measure">${SegProfile.buttons(S, TG.m)}</div><div class="legend" id="chart-legend"></div></div>` +
    `<div class="profile" id="profile"></div><div class="cmp tablewrap" id="segcmp"></div></section>`;
}
function drawTargets(S) {
  const R = S.chart_rows;
  // the plan as the component reads it: the night column only when the rows know day and night (a start time)
  TG.P = { type: S.type, summary: S.summary || {}, profile: S.profile, chart_rows: R, night: R.some((r) => r.night != null),
    climb: S.climb || null };                                          // SP-728: the 攀爬段
  const km = TG.P.summary.km;
  TG.stops = (S.inputs?.stops || []).filter((x) => x.km > 0 && (!km || x.km < km)).map((x) => {
    const [name, icon] = STOP[x.type] || STOP.aid;
    return { km: x.km, icon, name: `${icon} ${name}${x.name ? " " + x.name : ""} · ${f1(x.km)} km` };
  });
  TG.chart = echarts.init($("profile"));
  new ResizeObserver(() => TG.chart.resize()).observe($("profile"));
  $("measure").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
    TG.m = b.dataset.m;
    $("measure").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
    drawChart(); drawTable();
  }));
  // a click on the chart selects that segment (shift: adds / removes), as on the calculator
  TG.chart.getZr().on("click", (ev) => {
    const c = TG.chart;
    if (!c.containPixel({ gridIndex: 0 }, [ev.offsetX, ev.offsetY])) return;
    const p = c.convertFromPixel({ gridIndex: 0 }, [ev.offsetX, ev.offsetY]); if (!p) return;
    const r = SegProfile.rowAt(TG.P, p[0]); if (!r) return;
    pick(r.i, !!ev.event?.shiftKey);
    const row = document.querySelector(`#segcmp [data-row="${r.i}"]`); if (row) row.scrollIntoView({ block: "nearest" });
  });
  $("segcmp").onmouseleave = () => hover(null);
  drawChart(); drawTable();
}
function drawChart() {
  const o = { measure: TG.m, sel: TG.sel, hover: TG.hover, touch: TOUCH, narrow: window.innerWidth < 700, stops: TG.stops };
  TG.chart.setOption(SegProfile.option(TG.P, o), true);
  $("chart-legend").innerHTML = SegProfile.legend(TG.P, o);
}
function drawTable() {
  $("segcmp").innerHTML = SegProfile.table(TG.P, { measure: TG.m, sel: TG.sel });
  $("segcmp").querySelectorAll("tr[data-row]").forEach((e) => {
    e.addEventListener("click", (ev) => pick(+e.dataset.row, ev.shiftKey));
    e.addEventListener("mouseenter", () => hover(+e.dataset.row));
  });
}
function pick(i, shift) {
  if (shift) { if (TG.sel.has(i)) TG.sel.delete(i); else TG.sel.add(i); }
  else TG.sel = TG.sel.size === 1 && TG.sel.has(i) ? new Set() : new Set([i]);
  drawChart(); drawTable();
}
function hover(i) { if (TG.hover === i) return; TG.hover = i; drawChart(); }

function fuelHtml(S) {
  const F = S.fuel; if (!F || !F.kcal_band) return "";
  const hike = F.category === "hike", c = F.cho || {}, w = F.water || {}, na = F.sodium || {}, ld = F.loading || {};
  let h = `<section><h2>${esc(JT("fuel.title"))} <span class="meta">${esc(F.label || "")} · ${esc(JT("fuel.suggested"))}</span></h2><div class="tiles">`;
  h += tile(`🔥 ${esc(JT(hike ? "fuel.kcal_hike" : "fuel.kcal"))}`, rng(F.kcal_band, n0, "kcal"), `±${Math.round((F.band_rel || 0) * 100)}%`, true);
  h += tile(esc(JT("fuel.carbs")), rng(c.per_h, n0, "g/h"), JT("fuel.total", { x: rng(c.total, n0, "g") }));
  h += tile(esc(JT("fuel.water")), hike ? rng((w.total_ml || []).map((x) => x / 1000), (x) => x.toFixed(1), "L") : w.thirst ? esc(JT("fuel.thirst")) : rng(w.per_h, n0, "ml/h"),
    esc(JT("fuel.no_gain")));
  h += tile(esc(JT("fuel.sodium")), na.per_h && na.per_h[1] > 0 ? rng(na.per_h, n0, "mg/h") : esc(JT("fuel.no_sodium")), na.total_mg && na.total_mg[1] > 0 ? JT("fuel.total", { x: rng(na.total_mg, n0, "mg") }) : "");
  // when / amount / note: SP-287 (older shares have only the label)
  if (!hike && ld.label) h += tile(esc(JT("fuel.pre")), ld.g_day ? rng(ld.g_day, n0, "g") : esc(ld.amount || ld.label.replace(/^前一天\s*/, "")),
    (ld.g_day ? esc(ld.label) : ld.when ? esc(ld.when) : esc(JT("fuel.day_before"))) + (ld.note ? `<br>${esc(ld.note)}` : ""));
  if (hike && ok(F.food_kg_mean)) h += tile(esc(JT("fuel.food")), `${F.food_kg_mean.toFixed(2)} <span class="u">${esc(JT("fuel.kg_day"))}</span>`, esc(JT("fuel.estimate")));
  h += `</div>`;
  const ev = F.schedule || [];
  if (ev.length) {
    const icon = (e) => e.kind === "start" ? "🏁" : e.kind === "aid" ? (STOP[e.stop_type] || STOP.aid)[1] : hike ? "🍙" : "🍬";
    h += `<h2 style="margin-top:12px">${esc(JT("fuel.schedule"))} <span class="badge">${esc(JT("fuel.estimate"))}</span></h2><div class="tablewrap"><table><thead><tr>${hike ? `<th>${esc(JT("th.day"))}</th>` : ""}<th>${esc(JT("th.time"))}</th><th class="n">${esc(JT("th.moving"))}</th><th class="n">km</th><th></th><th>${esc(JT("th.action"))}</th></tr></thead><tbody>` +
      ev.map((e) => `<tr class="k-${e.kind}">${hike ? `<td>${e.day}</td>` : ""}<td>${esc(e.eta || "–")}</td><td class="n">${dur(e.t_s)}</td><td class="n">${f1(e.km)}</td><td>${icon(e)}</td><td class="act">${esc(e.action)}</td></tr>`).join("") +
      `</tbody></table></div>`;
  }
  // a hint object (SP-482, engine/hints.py) or a string (a share made before it)
  if ((F.warnings || []).length) h += `<ul class="warn">${F.warnings.map((x) => `<li>${esc(x && typeof x === "object" ? x.text : x)}</li>`).join("")}</ul>`;
  return h + `</section>`;
}

function splitsHtml(S) {
  const segs = S.segments || []; if (!segs.length) return "";
  return `<section><h2>${esc(JT("splits"))}</h2><div class="tablewrap"><table><thead><tr><th>#</th><th class="n">km</th><th class="n">${esc(JT("th.power"))}</th><th class="n">${esc(JT("th.pace"))}</th><th class="n">${esc(JT("th.split"))}</th><th class="n">${esc(JT("th.cum"))}</th><th class="n">ETA</th><th>${esc(JT("th.fuel"))}</th></tr></thead><tbody>` +
    segs.map((x) => `<tr><td>${x.i}</td><td class="n">${f1(x.start_km)}–${f1(x.end_km)}</td><td class="n">${ok(x.power) ? n0(x.power) + " W" : "–"}</td><td class="n">${pace(x.pace_s_per_km)}</td>
      <td class="n">${dur(x.t)}</td><td class="n">${dur(x.cum_s)}</td><td class="n">${esc(x.eta || "")}</td><td class="act">${esc(x.fuel_action || "")}</td></tr>`).join("") + `</tbody></table></div></section>`;
}

function drawProfile(S) {
  const pr = S.profile, segs = S.segments || [], km = S.summary.km;
  const ax = () => ({ axisLabel: { color: css("--muted"), fontSize: 11 }, axisLine: { lineStyle: { color: css("--line") } }, splitLine: { lineStyle: { color: css("--line") } } });
  const minW = km * 0.025;
  const areas = segs.map((s) => [{ xAxis: s.start_km, itemStyle: { color: css(CLS[s.cls] || "--c-f"), opacity: 0.18 },
    ...(s.target && s.end_km - s.start_km >= minW ? { name: s.target.mark, label: { show: true, position: "insideTop", color: css("--text"), fontWeight: 600 } } : {}) }, { xAxis: s.end_km }]);
  const series = [];
  const zAt = (k) => { if (!pr) return 0; const i = pr.km.findIndex((x) => x >= k); return i <= 0 ? pr.z[Math.max(0, i)] : pr.z[i - 1] + (pr.z[i] - pr.z[i - 1]) * (k - pr.km[i - 1]) / ((pr.km[i] - pr.km[i - 1]) || 1); };
  if (pr) series.push({ type: "line", data: pr.km.map((x, i) => [x, pr.z[i]]), symbol: "none", lineStyle: { color: css("--muted"), width: 1.2 },
    areaStyle: { color: css("--bar"), opacity: 0.35 }, markArea: { silent: true, data: areas } });
  const st = (S.inputs?.stops || []).filter((x) => x.km > 0 && x.km < km);
  if (pr && st.length) series.push({ type: "scatter", data: st.map((x) => [x.km, zAt(x.km)]), symbol: "pin", symbolSize: 24, itemStyle: { color: css("--s3") },
    label: { show: true, formatter: (p) => (STOP[st[p.dataIndex].type] || STOP.aid)[1], fontSize: 11 } });
  if (!pr) series.push({ type: "line", data: segs.flatMap((s) => [[s.start_km, s.power], [s.end_km, s.power]]), symbol: "none", lineStyle: { color: css("--accent") } });
  const c = echarts.init($("profile"));
  c.setOption({ animation: false, grid: { left: 46, right: 16, top: 20, bottom: 28 },
    tooltip: { trigger: "axis", confine: true, formatter: (ps) => { const k = ps[0].value[0]; const s = segs.find((x) => k >= x.start_km && k <= x.end_km);
      return s ? `<b>${s.target ? s.target.mark + " " : ""}${esc(s.cls_label || "")}</b> ${f1(s.start_km)}–${f1(s.end_km)} km<br>${esc(s.target ? s.target.text : (ok(s.power) ? n0(s.power) + " W" : ""))}<br>⏱ ${dur(s.t)}${s.eta ? " · " + esc(s.eta) : ""}` : ""; } },
    xAxis: { type: "value", min: 0, max: km, name: "km", ...ax(), axisLabel: { color: css("--muted"), fontSize: 11, formatter: (v) => +v.toFixed(1), showMaxLabel: false } }, yAxis: { type: "value", scale: true, name: pr ? "m" : "W", ...ax() }, series });
  new ResizeObserver(() => c.resize()).observe($("profile"));
}
init();
</script>
