[pytest]
testpaths = backend/tests
markers =
    golden: compares against the user's real WKO5 data. These live in backend/tests/realdata/ and run only with TRC_REALDATA=1 (see its README); the default run never touches ~/WKO5 or the data folder
    needs_core: needs the calculation core; skipped in the public mirror, which leaves it out (SP-500, backend/engine/core_stub.py)
    e2e: browser smoke tests (Playwright + Chromium, backend/tests/e2e/). Skipped unless selected with -m e2e (./e2e.sh); they need `python -m playwright install chromium` and the internet (the pages' CDN scripts)
filterwarnings =
    ignore::UserWarning:fitdecode
