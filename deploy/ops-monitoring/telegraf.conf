# 營運監控 (SP-388): the trailruncoach container's CPU / memory and the app's member signal into the
# shared InfluxDB, for the Grafana panels and alerts next to this file. See README.md.
#
# The values from the environment (docker-compose.yml's env_file, never in this file):
#   INFLUX_URL     the shared InfluxDB 2.x, e.g. http://<NAS LAN IP>:8086 (not the container name)
#   INFLUX_TOKEN   a write-only token for the bucket below
#   INFLUX_ORG     the org
#   INFLUX_BUCKET  the bucket

[agent]
  interval = "60s"                 # one sample a minute; the alerts look at 5-minute means
  round_interval = true
  metric_batch_size = 500
  metric_buffer_limit = 5000       # ~3 days of these few series if InfluxDB is down for a while
  collection_jitter = "0s"
  flush_interval = "60s"
  flush_jitter = "5s"
  hostname = "nas"
  omit_hostname = false

[global_tags]
  project = "trailruncoach"

[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
  timeout = "10s"
  namedrop = ["api_call"]          # the AI cost lines go to the shared API-usage bucket below

# The AI 問答's cost (SP-882) for the shared「💸 API 使用量」dashboard: measurement api_call in
# bucket feeder (the grafana-api-usage schema, fixed). INFLUX_TOKEN must be able to write feeder too
# (README step 2). No host tag: the dashboard's series are provider / model / project / purpose / status.
[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "feeder"
  timeout = "10s"
  namepass = ["api_call"]
  tagexclude = ["host"]

# --------------------------------------------------------------------------- the container
# docker_container_cpu  usage_percent (100 = one core; the alert's 2 cores = 200), cpu="cpu-total"
# docker_container_mem  usage_percent (without the reclaimable page cache, as `docker stats`), limit (bytes)
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  container_name_include = ["trailruncoach"]
  # cpu totals only (not per core); no per-device network / blkio series
  perdevice_include = []
  total_include = ["cpu"]
  timeout = "5s"
  gather_services = false
  docker_label_include = []
  # the image tag changes on every deploy: keep it as a tag, the queries group it away
  tag_env = []

# --------------------------------------------------------------------------- the member signal
# The app rewrites <data folder>/logs/ops/metrics.json hourly (backend/ops_daily.py):
#   {"members": 82, "cap": 100, "share": 0.82, "near": 1, "full": 0, "at": 1792900000}
# mounted read-only at /trc-ops (docker-compose.yml). Every number becomes a field of trc_members.
[[inputs.file]]
  files = ["/trc-ops/metrics.json"]
  data_format = "json"
  name_override = "trc_members"
  interval = "5m"

# --------------------------------------------------------------------------- the AI 問答's cost
# The app appends one line-protocol line per model call to <data folder>/logs/ops/api_calls.lp
# (backend/ai/spend.py, SP-882), with its own timestamp; cut over to api_calls.lp.1 past 2 MB.
# Only new lines are read (from_beginning = false), so a Telegraf restart does not send them twice.
[[inputs.tail]]
  files = ["/trc-ops/api_calls.lp"]
  from_beginning = false
  watch_method = "poll"
  data_format = "influx"
