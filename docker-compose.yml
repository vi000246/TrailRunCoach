# Local machine only (./deploy.sh). The NAS runs its own compose file with
# `image: trailruncoach` and no `build:`; see docs/deploy/wko5coach.deploy.md.
services:
  trailruncoach:
    build: .
    container_name: trailruncoach
    ports:
      - "8000:8000"
    environment:
      # Keep HOME matching the host so Path.home() resolves the same paths that are stored in SQLite
      - HOME=${HOME}
    volumes:
      # the data folder: ~/.trailruncoach. An install from before SP-498 keeps ~/.wko5coach (its DB
      # holds absolute paths under it, so it is never renamed): TRC_DATA_FOLDER=.wko5coach in .env,
      # which deploy.sh sets by itself when only ~/.wko5coach exists
      - ${HOME}/${TRC_DATA_FOLDER:-.trailruncoach}:${HOME}/${TRC_DATA_FOLDER:-.trailruncoach}
      # the comparison folder (owner only; optional)
      - ${HOME}/WKO5:${HOME}/WKO5
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: unless-stopped

volumes:
  portainer_data:
